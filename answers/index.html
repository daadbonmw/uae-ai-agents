isas are cancelled with GDRFA in Dubai and with ICP in most other emirates.","تُلغى الإقامات لدى الإدارة العامة للإقامة وشؤون الأجانب في دبي، ولدى الهيئة الاتحادية للهوية والجنسية في معظم الإمارات الأخرى."]],"c":["Do not just let the licence lapse: open tax registrations stay on record, and late tax deregistration is fined. Each authority has its own closure checklist.","لا تترك الرخصة تنتهي فحسب، فالتسجيلات الضريبية المفتوحة تبقى مسجلة، والتأخر في إلغاء التسجيل الضريبي تُفرض عليه غرامة. ولكل جهة قائمة إجراءات خاصة بالإغلاق."],"au":"fta","l":[257,258,259],"so":[[260,164,259],[261,164,262],[263,164,264]],"v":1,"h":"wage-guard"},{"id":"business-freelance-licence","q":["I want to work as a freelancer. Which licence or permit do I need?","أريد العمل لحسابي الخاص. ما الرخصة أو التصريح الذي أحتاجه؟"],"k":["freelance license uae","freelance permit mohre","freelance visa dubai cost","abu dhabi freelancer licence tamm","can i freelance on family visa","رخصة عمل حر الامارات","تصريح عمل حر وزارة الموارد البشرية","رخصة فريلانسر ابوظبي"],"a":["There are two layers. To freelance in your own name you need a licence for the activity: in Abu Dhabi, a Freelancer Licence through TAMM; elsewhere, ask your emirate's economic department or a free zone. To work without an employer sponsor, you also need MOHRE's freelance work permit. With it, a degree and enough income, you may get a 5-year green visa.","هناك مستويان. للعمل الحر باسمك تحتاج رخصة للنشاط: في أبوظبي رخصة العمل الحر عبر منصة «تم»، وفي غيرها اسأل الدائرة الاقتصادية في إمارتك أو منطقة حرة. وللعمل دون كفالة صاحب عمل تحتاج أيضاً تصريح العمل الحر من وزارة الموارد البشرية والتوطين. ومع هذا التصريح وشهادة جامعية ودخل كافٍ، قد تحصل على الإقامة الخضراء لمدة 5 سنوات."],"w":["resident","emirati"],"s":["private"],"st":[["Check that your activity is on the freelance list of your emirate or free zone.","تأكد أن نشاطك ضمن قائمة أنشطة العمل الحر في إمارتك أو منطقتك الحرة.",265],["In Abu Dhabi, apply for the Freelancer Licence with UAE PASS and proof of your experience or qualification.","في أبوظبي، قدّم على رخصة العمل الحر بالهوية الرقمية مع ما يثبت خبرتك أو مؤهلك.",266],["Get a MOHRE freelance work permit if you will work without an employer sponsor.","استخرج تصريح العمل الحر من الوزارة إذا كنت ستعمل دون كفالة صاحب عمل.",58],["If you qualify, apply for a green visa to sponsor yourself.","إذا كنت مؤهلاً، فقدّم على الإقامة الخضراء لتكفل نفسك.",267]],"d":[["Emirates ID and UAE PASS account","الهوية الإماراتية وحساب الهوية الرقمية"],["Proof of experience, or an academic or professional qualification in your field","ما يثبت خبرتك، أو مؤهل أكاديمي أو مهني في مجالك"]],"f":[["MOHRE's freelance permit lets you work without an employer sponsor or job contract; it covers foreigners on self-sponsored residence visas.","يتيح تصريح العمل الحر من الوزارة العمل دون كفيل أو عقد عمل، ويشمل الأجانب أصحاب الإقامات ذاتية الكفالة.",0],["Abu Dhabi's Freelancer Licence covered 100 activities as of August 2024. It is open to UAE nationals and residents with experience or a qualification in the field.","كانت رخصة العمل الحر في أبوظبي تغطي 100 نشاط حتى أغسطس 2024، وهي متاحة للمواطنين والمقيمين من أصحاب الخبرة أو المؤهل في المجال.",1],["Green visa for freelancers: a MOHRE freelance permit and at least a bachelor's degree or specialised diploma. It lasts 5 years.","الإقامة الخضراء للعاملين لحسابهم: تصريح عمل حر من الوزارة، وشهادة بكالوريوس أو دبلوم متخصص على الأقل. ومدتها 5 سنوات.",2],["Green visa income test: at least AED 360,000 a year from self-employment in each of the past two years, or proof of solvency for the whole stay.","شرط الدخل للإقامة الخضراء: 360,000 درهم سنوياً على الأقل من العمل الحر في كل من السنتين الماضيتين، أو إثبات الملاءة المالية طوال مدة الإقامة.",2]],"dp":[["emirate","Abu Dhabi has a Freelancer Licence on TAMM; other emirates and free zones set their own. Visas go through GDRFA in Dubai and ICP elsewhere.","لدى أبوظبي رخصة العمل الحر على منصة «تم»، وللإمارات الأخرى والمناطق الحرة خياراتها. وتصدر الإقامة عبر إقامة دبي في دبي، وعبر الهيئة الاتحادية للهوية والجنسية في غيرها."],["visa","Family-sponsored residents should check their options with MOHRE before they start work.","على المقيمين بكفالة الأسرة التحقق من خياراتهم لدى الوزارة قبل بدء العمل."],["status","Emiratis need no residence visa, but still need a licence for the activity.","لا يحتاج المواطنون إلى إقامة، لكنهم يحتاجون رخصة للنشاط."]],"c":["Fees and activity lists change; confirm them with your licensing authority before you pay. VAT and corporate tax rules still apply to freelancers.","تتغير الرسوم وقوائم الأنشطة، فتأكد منها لدى جهة الترخيص قبل الدفع. وتنطبق قواعد ضريبة القيمة المضافة وضريبة الشركات على العاملين لحسابهم أيضاً."],"au":"mohre","so":[[146,245,147],[268,269,270],[271,272,273]],"v":1,"ch":["2024-08","Abu Dhabi added 30 activities to the Freelancer Licence, making 100.","أضافت أبوظبي 30 نشاطاً إلى رخصة العمل الحر ليصبح المجموع 100 نشاط.",1]},{"id":"business-corporate-tax-return","q":["When is my corporate tax return due, and what happens if I file or pay late?","متى يجب تقديم إقرار ضريبة الشركات؟ وماذا يحدث إذا تأخرت في تقديمه أو في الدفع؟"],"k":["corporate tax return deadline uae","ct return due date 30 september","corprate tax return late filing fine","corporate tax late payment penalty 14%","do i file corporate tax return with small business relief","متى آخر موعد لتقديم إقرار ضريبة الشركات","غرامة التأخير في تقديم الاقرار الضريبي","لازم اقدم اقرار ضريبه لو ما عندي ارباح"],"a":["File your corporate tax return and pay any tax due within 9 months after your tax period ends. For a period ending 31 December 2025, that was 30 September 2026. You must file even if you owe nothing or use Small Business Relief. A late return costs AED 500 a month for the first 12 months, then AED 1,000 a month. Unpaid tax adds a penalty of 14% a year, charged monthly.","قدّم إقرار ضريبة الشركات وادفع الضريبة المستحقة خلال 9 أشهر من نهاية فترتك الضريبية. فللفترة المنتهية في 31 ديسمبر 2025 كان الموعد 30 سبتمبر 2026. ويجب تقديم الإقرار حتى لو لم تكن عليك ضريبة أو كنت تستفيد من إعفاء الأعمال الصغيرة. وغرامة تأخر الإقرار 500 درهم شهرياً في أول 12 شهراً، ثم 1,000 درهم شهرياً. وتُفرض على الضريبة غير المدفوعة غرامة بنسبة 14% سنوياً تُحسب شهرياً."],"w":["business","emirati","resident"],"st":[["Work out your deadline: 9 months after your tax period ends, so 30 September for a 31 December year-end.","احسب موعدك: 9 أشهر بعد نهاية فترتك الضريبية، أي 30 سبتمبر إذا كانت سنتك المالية تنتهي في 31 ديسمبر.",274],["Prepare your financial statements and keep the records behind your figures.","جهّز قوائمك المالية، واحتفظ بالسجلات التي تثبت أرقامك.",170],["Log in with UAE PASS, then file and pay, yourself or through a registered tax agent. If late, act now: penalties grow monthly.","ادخل بالهوية الرقمية، ثم قدّم الإقرار وادفع بنفسك أو عبر وكيل ضريبي مسجّل. وإن تأخرت فبادر الآن، فالغرامات تزيد شهرياً.",158]],"d":[["Financial statements and the records behind your figures","القوائم المالية والسجلات التي تثبت أرقامك"]],"f":[["Returns are filed and corporate tax is paid within 9 months of the end of each tax period.","يُقدَّم الإقرار وتُدفع ضريبة الشركات خلال 9 أشهر من نهاية كل فترة ضريبية.",0],["For tax periods ending 31 December 2025, the deadline to file and pay was 30 September 2026.","للفترات الضريبية المنتهية في 31 ديسمبر 2025، كان آخر موعد لتقديم الإقرار والدفع 30 سبتمبر 2026.",0],["Businesses using Small Business Relief must still file a return within the same 9 months.","يجب على المستفيدين من إعفاء الأعمال الصغيرة تقديم الإقرار خلال المهلة نفسها البالغة 9 أشهر.",0],["Late return: AED 500 for each month or part of a month in the first 12 months, then AED 1,000 a month from the 13th month.","تأخر الإقرار: 500 درهم عن كل شهر أو جزء منه في أول 12 شهراً، ثم 1,000 درهم شهرياً من الشهر الثالث عشر.",1],["Late payment: a monthly penalty at 14% a year on the unpaid tax, from the day after the due date.","تأخر الدفع: غرامة شهرية بنسبة 14% سنوياً على الضريبة غير المدفوعة، تبدأ من اليوم التالي لموعد الاستحقاق.",1]],"dp":[["other","Your deadline follows your own financial year-end, which may not be 31 December.","يتبع موعدك نهاية سنتك المالية، وقد لا تكون في 31 ديسمبر."],["status","Exempt persons that had to register file a yearly declaration instead of a tax return, also within 9 months.","يقدّم الأشخاص المعفيون الملزمون بالتسجيل إقراراً سنوياً بدلاً من الإقرار الضريبي، خلال 9 أشهر أيضاً."]],"c":["File on time even if you cannot pay in full; the two penalties are separate. The April 2026 penalty changes were to VAT and excise rules; corporate tax fines have their own decision.","قدّم الإقرار في موعده حتى لو لم تستطع الدفع كاملاً، فالغرامتان منفصلتان. وتعديلات الغرامات في أبريل 2026 خاصة بضريبة القيمة المضافة والضريبة الانتقائية، ولغرامات ضريبة الشركات قرار مستقل."],"au":"fta","l":[275,276,277],"so":[[278,164,279],[280,179,277]],"v":1},{"id":"business-online-home-licence","q":["Do I need a licence to sell online or run a small business from home?","هل أحتاج رخصة للبيع عبر الإنترنت أو لإدارة مشروع صغير من المنزل؟"],"k":["do i need a license to sell on instagram uae","e trader lisence dubai","home business licence dubai","tajer abu dhabi license","sell online from home uae legal","رخصة تاجر الكتروني دبي","ابي رخصة للبيع اونلاين من البيت","هل احتاج رخصه للبيع في الانستقرام"],"a":["Yes. Selling goods or services online, including on social media such as Instagram, needs a licence under the federal e-commerce law, even if you work from home. Your emirate's economic department issues it: an eTrader licence in Dubai or a Tajer Abu Dhabi licence in Abu Dhabi. Elsewhere, ask your economic department or a free zone. Mainland e-commerce licences also need TDRA approval.","نعم. البيع عبر الإنترنت، ومنه البيع على وسائل التواصل الاجتماعي مثل إنستغرام، يحتاج رخصة بموجب قانون التجارة الإلكترونية الاتحادي، حتى لو كنت تعمل من المنزل. وتصدرها الدائرة الاقتصادية في إمارتك: رخصة «تاجر إلكتروني» في دبي، أو رخصة «تاجر أبوظبي» في أبوظبي. وفي غيرهما اسأل الدائرة الاقتصادية أو منطقة حرة. وتحتاج رخص التجارة الإلكترونية في البر الرئيسي أيضاً موافقة هيئة تنظيم الاتصالات والحكومة الرقمية."],"w":["emirati","resident","business"],"s":["private"],"st":[["Dubai: apply for an eTrader licence (sole establishment only).","في دبي: قدّم على رخصة «تاجر إلكتروني» (مؤسسة فردية فقط).",281],["Abu Dhabi: apply for a Tajer Abu Dhabi licence.","في أبوظبي: قدّم على رخصة «تاجر أبوظبي».",282],["Elsewhere: ask your economic department, or pick a free zone that licenses e-commerce.","في غيرهما: اسأل الدائرة الاقتصادية، أو اختر منطقة حرة ترخّص التجارة الإلكترونية.",283],["On the mainland, get TDRA's approval or no-objection certificate. Give a digital invoice for every sale.","في البر الرئيسي، احصل على موافقة الهيئة أو شهادة عدم ممانعة منها. وأعطِ فاتورة رقمية لكل عملية بيع.",284]],"f":[["Federal Decree-Law No. 14 of 2023 covers selling goods and services online, including on social media; sellers need the required licences.","يشمل المرسوم بقانون اتحادي رقم 14 لسنة 2023 بيع السلع والخدمات عبر الإنترنت، ومنها وسائل التواصل الاجتماعي، ويجب على البائعين الحصول على التراخيص اللازمة.",0],["All mainland e-commerce licences need TDRA approval, and sellers must give a clear digital invoice for every transaction.","تحتاج كل رخص التجارة الإلكترونية في البر الرئيسي موافقة هيئة تنظيم الاتصالات والحكومة الرقمية، ويجب على البائع تقديم فاتورة رقمية واضحة لكل معاملة.",0],["Dubai's eTrader is a home-based licence for individuals selling through social media and online platforms, issued only as a sole establishment.","رخصة «تاجر إلكتروني» في دبي رخصة منزلية للأفراد الذين يبيعون عبر وسائل التواصل والمنصات الإلكترونية، وتصدر بشكل مؤسسة فردية فقط.",1],["Tajer Abu Dhabi holders can work without physical premises for a set period; the licence covers over 1,200 activities, up from 30 at launch.","يمكن لحاملي رخصة «تاجر أبوظبي» العمل دون مقر فعلي لفترة محددة، وتغطي الرخصة أكثر من 1,200 نشاط بعد أن كانت 30 عند إطلاقها.",2]],"dp":[["emirate","Licence names, fees and allowed activities differ by emirate and free zone.","تختلف أسماء الرخص ورسومها والأنشطة المسموحة بين الإمارات والمناطق الحرة."],["status","Emiratis and other GCC nationals may have extra home-business licence options; ask your economic department.","قد تتوفر للمواطنين ومواطني دول مجلس التعاون خيارات إضافية لرخص المشاريع المنزلية، فاسأل الدائرة الاقتصادية."],["other","Food, medicines and other regulated goods need the regulator's approval before you sell.","تحتاج الأغذية والأدوية وغيرها من السلع الخاضعة للتنظيم موافقة الجهة الرقابية قبل البيع."]],"c":["Promoting products on social media may also need an advertiser permit from the National Media Authority. Check fees before you pay.","قد يحتاج الترويج للمنتجات على وسائل التواصل أيضاً تصريح معلن من الهيئة الوطنية للإعلام. وتحقق من الرسوم قبل الدفع."],"au":"u-ae","l":[285,161,286],"so":[[287,245,288],[287,289,290],[291,269,292]],"v":1,"ch":["2026-09","Abu Dhabi gave Tajer licence holders whose office-free period ends in 2026 one more year without premises.","منحت أبوظبي حاملي رخصة «تاجر أبوظبي» الذين تنتهي فترة عملهم دون مقر في 2026 سنة إضافية دون مقر.",2]}]},{"topic":"housing","title":{"en":"Renting, buying and property","ar":"الإيجار وشراء العقارات والملكية"},"checked":"2026-11-08","entries":[{"id":"housing-dubai-rent-increase","q":["Can my landlord in Dubai raise the rent when I renew, and by how much?","هل يحق للمالك في دبي رفع الإيجار عند التجديد، وبأي نسبة؟"],"k":["dubai rent increase allowed","rera rent calculator","landlord increase rent renewal dubai","rent incrase rera dubai","زيادة الإيجار دبي","حاسبة زيادة الايجار ريرا","المالك يبي يزيد الايجار"],"a":["Only at renewal, and only within the cap in Decree 43 of 2013. The cap depends on how far your rent is below the average for similar homes in DLD's Rental Index: no rise if it is up to 10% below, rising in steps to at most 20% if it is more than 40% below. The landlord must tell you at least 90 days before the contract ends.","لا يرفع المالك الإيجار إلا عند التجديد، وضمن السقف الذي حدده المرسوم رقم 43 لسنة 2013. ويعتمد السقف على مدى انخفاض إيجارك عن متوسط الوحدات المماثلة في مؤشر الإيجارات لدى دائرة الأراضي والأملاك: لا زيادة إذا كان أقل بنسبة تصل إلى 10%، ثم تتدرج الزيادة حتى 20% كحد أقصى إذا كان أقل بأكثر من 40%. ويجب أن يُبلغك المالك قبل انتهاء العقد بـ90 يوماً على الأقل."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["Check the cap with the Rental Index calculator, using your Ejari details and current rent.","تحقق من السقف عبر حاسبة مؤشر الإيجارات، باستخدام بيانات عقد إيجاري وإيجارك الحالي.",293],["If you disagree, or the notice came less than 90 days before expiry, object in writing, then file a case if needed.","إذا لم توافق، أو وصلك الإشعار قبل انتهاء العقد بأقل من 90 يوماً، فاعترض كتابياً، ثم ارفع دعوى عند الحاجة.",294]],"d":[["Ejari contract, the landlord's notice and your Rental Index result","عقد إيجاري وإشعار المالك ونتيجة مؤشر الإيجارات"]],"f":[["Decree 43 of 2013, by how far rent is below the index average: up to 10%, no rise; 11-20%, 5%; 21-30%, 10%; 31-40%, 15%; over 40%, 20%.","المرسوم 43 لسنة 2013 بحسب انخفاض الإيجار عن متوسط المؤشر: حتى 10% لا زيادة، و11-20% زيادة 5%، و21-30% زيادة 10%، و31-40% زيادة 15%، وأكثر من 40% زيادة 20%.",0],["A party wanting to change the rent or terms must tell the other at least 90 days before the lease ends, unless agreed otherwise.","على من يريد تعديل الإيجار أو الشروط إبلاغ الطرف الآخر قبل انتهاء العقد بـ90 يوماً على الأقل، ما لم يُتفق على غير ذلك.",1],["DLD launched the Smart Rental Index on 2 January 2025. It rates each building and covers residential areas, including free zones.","أطلقت دائرة الأراضي والأملاك مؤشر الإيجارات الذكي في 2 يناير 2025، وهو يصنّف كل مبنى ويشمل المناطق السكنية، ومنها المناطق الحرة.",2]],"dp":[["emirate","This is Dubai's rule. Abu Dhabi, Sharjah and the other emirates have their own rent rules.","هذه قاعدة دبي، ولأبوظبي والشارقة وبقية الإمارات قواعد إيجار خاصة بها."]],"c":["If you cannot agree, the Rental Disputes Center decides. A rise takes effect only at renewal, never mid-contract.","عند الخلاف يفصل مركز فض المنازعات الإيجارية. ولا تسري الزيادة إلا عند التجديد، لا أثناء سريان العقد."],"au":"dld","l":[295,296,297],"so":[[298,299,297],[300,299,301],[302,303,304]],"v":1,"ch":["2025-01","DLD launched the Smart Rental Index, which rates each building.","أطلقت الدائرة مؤشر الإيجارات الذكي الذي يصنّف كل مبنى.",2],"h":"rentright","cl":{"kind":"deadline","fact":1,"days":-90,"label":{"en":"Last day to give notice of a rent change","ar":"آخر يوم للإشعار بتغيير الإيجار"},"start":{"en":"Lease end date","ar":"تاريخ انتهاء العقد"}}},{"id":"housing-dubai-eviction","q":["Can my landlord in Dubai make me leave, and how much notice must I get?","هل يحق للمالك في دبي إخراجي من السكن، وما مدة الإشعار المطلوبة؟"],"k":["eviction notice dubai 12 months","landlord selling evict tenant dubai","landlord wants to move in dubai","evicition notice notarized dubai","إخلاء المستأجر دبي 12 شهر","انذار اخلاء كاتب عدل","المالك بيبيع الشقة ويبيني اطلع"],"a":["During the lease, only for set reasons, such as rent unpaid 30 days after a notice, subletting without consent, or illegal use. At the end, only to sell, demolish, do major repairs, or for the owner's or a first-degree relative's own use, with 12 months' notice by notary or registered mail. After an own-use eviction, the home cannot be let to others for 2 years.","أثناء سريان العقد لا يجوز الإخلاء إلا لأسباب محددة، مثل عدم دفع الإيجار بعد 30 يوماً من الإنذار، أو التأجير من الباطن دون موافقة، أو الاستعمال غير المشروع. وعند انتهاء العقد لا يجوز إلا للبيع أو الهدم أو الصيانة الكبيرة أو لسكن المالك أو قريبه من الدرجة الأولى، مع إشعار قبل 12 شهراً عن طريق الكاتب العدل أو البريد المسجل. وبعد الإخلاء للسكن الشخصي لا يجوز تأجير المسكن للغير مدة سنتين."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["If you get a notice to pay rent, pay or settle within 30 days.","إذا وصلك إنذار بدفع الإيجار، فادفع أو تفاهم مع المالك خلال 30 يوماً.",305],["If the notice or reason looks wrong, or the owner re-lets after an own-use eviction, file a case.","إذا بدا الإشعار أو السبب مخالفاً، أو أعاد المالك التأجير بعد الإخلاء للسكن الشخصي، فارفع دعوى.",294]],"d":[["Ejari contract and proof of rent paid","عقد إيجاري وإثبات دفع الإيجار"],["The notice, with notary or registered-mail proof","الإشعار مع إثبات الكاتب العدل أو البريد المسجل"]],"f":[["At contract end: only for sale, demolition, major repairs or own use, with 12 months' notice by notary or registered mail.","عند انتهاء العقد: للبيع أو الهدم أو الصيانة الكبيرة أو السكن الشخصي فقط، مع إشعار قبل 12 شهراً عبر الكاتب العدل أو البريد المسجل.",0],["During the contract, unpaid rent is a ground for eviction if it stays unpaid 30 days after a notice to pay.","أثناء العقد يُعد عدم دفع الإيجار سبباً للإخلاء إذا استمر بعد 30 يوماً من الإنذار بالدفع.",0],["After an own-use eviction, the landlord may not let the property to others for 2 years (homes) or 3 years (other property).","بعد الإخلاء للسكن الشخصي لا يجوز للمالك تأجير العقار للغير قبل مرور سنتين للمساكن أو 3 سنوات لغيرها.",0],["If you stay after expiry and the landlord does not object, the lease renews for the same term or 1 year, whichever is shorter.","إذا بقيت بعد انتهاء العقد دون اعتراض المالك، يتجدد العقد للمدة نفسها أو لسنة واحدة، أيهما أقصر.",1]],"dp":[["other","For own use, the owner must prove they have no other suitable property.","في حالة السكن الشخصي، على المالك إثبات أنه لا يملك عقاراً آخر مناسباً."],["emirate","This is Dubai's law; other emirates set their own eviction rules.","هذا قانون دبي، ولكل إمارة أخرى قواعدها الخاصة بالإخلاء."]],"c":["A sale does not end your lease; the new owner must respect it. An email or WhatsApp alone is not the notice the law asks for.","بيع العقار لا ينهي عقدك، وعلى المالك الجديد احترامه. ولا تكفي رسالة بريد إلكتروني أو واتساب وحدها عن الإشعار الذي يشترطه القانون."],"au":"dld","l":[306,307,301],"so":[[300,299,301],[308,299,309]],"v":1,"h":"rentright"},{"id":"housing-dubai-rental-dispute","q":["How do I file a rent case against my landlord or tenant in Dubai, and what does it cost?","كيف أرفع دعوى إيجارية ضد المالك أو المستأجر في دبي، وكم تكلف؟"],"k":["rental dispute center dubai fees","how to file rdc case","file case against landlord dubai","rdc case fee 3.5","مركز فض المنازعات الايجارية دبي رسوم","رفع قضية على المالك دبي","شكوى ايجار دبي كم الرسوم"],"a":["File with Dubai's Rental Disputes Center online or at a Trustees centre. Eviction, renewal and rent cases cost 3.5% of the annual rent (AED 500 to 20,000); money claims cost 3.5% of the amount (AED 500 to 15,000). You need your Ejari contract, and papers must be in Arabic or legally translated.","قدّم الدعوى لدى مركز فض المنازعات الإيجارية في دبي إلكترونياً أو في أحد مراكز الأمناء. ورسوم دعاوى الإخلاء والتجديد والإيجار 3.5% من الإيجار السنوي (من 500 إلى 20,000 درهم)، ورسوم المطالبات المالية 3.5% من المبلغ (من 500 إلى 15,000 درهم). وتحتاج إلى عقد إيجاري، ويجب أن تكون المستندات بالعربية أو مترجمة ترجمة قانونية."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["Gather papers and evidence; have non-Arabic papers legally translated.","اجمع المستندات والأدلة، واطلب ترجمة قانونية لغير العربية منها.",310],["Register online, or at a Trustees centre for an extra AED 130 plus VAT. Hard copies are not accepted.","سجّل الدعوى إلكترونياً، أو في مركز أمناء مقابل 130 درهماً إضافية مع الضريبة. ولا تُقبل النسخ الورقية.",311],["Pay by card or Noqodi. Registration takes 1 working day, and hearings are held remotely.","ادفع بالبطاقة أو عبر نقودي. ويستغرق التسجيل يوم عمل واحداً، وتُعقد الجلسات عن بُعد.",312]],"d":[["Latest Ejari contract","أحدث عقد إيجاري"],["Emirates ID (or trade licence and manager's ID) and an IBAN letter","الهوية الإماراتية (أو الرخصة التجارية وهوية المدير) وخطاب الآيبان"],["For eviction: notarised notice or registered-mail receipt","في الإخلاء: الإشعار الموثق أو إيصال البريد المسجل"]],"f":[["Eviction, renewal, rent and termination cases: 3.5% of annual rent, minimum AED 500, maximum AED 20,000.","دعاوى الإخلاء والتجديد والإيجار والفسخ: 3.5% من الإيجار السنوي، بحد أدنى 500 درهم وأقصى 20,000 درهم.",0],["Money claims: 3.5% of the amount claimed, minimum AED 500, maximum AED 15,000.","المطالبات المالية: 3.5% من المبلغ المطالب به، بحد أدنى 500 درهم وأقصى 15,000 درهم.",0],["Plus AED 100 process service and AED 10 + AED 10 other fees; a Trustees centre adds AED 130 + VAT. Registration: 1 working day.","يُضاف 100 درهم للتبليغ و10 + 10 دراهم رسوماً أخرى، ويضيف مركز الأمناء 130 درهماً مع الضريبة. والتسجيل: يوم عمل واحد.",0],["Half the registration fee is refunded if the parties settle amicably in mediation.","يُرد نصف رسم القيد إذا توصل الطرفان إلى تسوية ودية في مرحلة الوساطة.",1],["An eviction case does not stop rent falling due until the judgment is carried out.","رفع دعوى الإخلاء لا يوقف استحقاق الإيجار حتى تنفيذ الحكم.",2]],"dp":[["emirate","This is for Dubai; other emirates have their own rent committees or courts and fees.","هذا خاص بدبي، ولبقية الإمارات لجانها أو محاكمها الإيجارية ورسومها."]],"c":["Fees change, so check the RDC page first. Keep paying rent while the case runs.","قد تتغير الرسوم، فراجع صفحة المركز أولاً. واستمر في دفع الإيجار أثناء نظر الدعوى."],"au":"dld","l":[313,314,315],"so":[[316,317,318],[319,299,315],[308,299,309]],"v":1,"h":"rentright"},{"id":"housing-dubai-ejari","q":["How do I register my tenancy contract in Ejari, and what does it cost?","كيف أسجّل عقد الإيجار في نظام إيجاري، وكم يكلّف؟"],"k":["how to register ejari","ejari fees 2026","ejari renewal dubai","ejari on dubainow","ejary registration cost","تسجيل عقد ايجاري","رسوم ايجاري","كيف اسوي ايجاري"],"a":["Every Dubai lease must be registered with DLD in Ejari; without it, a rent case cannot be heard. Use Dubai REST, DubaiNow, the DLD website or a Trustees centre. It costs AED 177.75 in Dubai REST or online, or AED 220 at a centre. Tenants also pay a 5% housing fee on yearly rent through monthly DEWA bills.","يجب تسجيل كل عقد إيجار في دبي لدى دائرة الأراضي والأملاك في نظام إيجاري، ولا تُنظر أي دعوى إيجارية دونه. سجّل عبر دبي ريست أو دبي الآن أو موقع الدائرة أو مركز أمناء. والرسوم 177.75 درهماً عبر دبي ريست أو الموقع، و220 درهماً في المركز. ويدفع المستأجر أيضاً رسوم سكن 5% من الإيجار السنوي ضمن فواتير ديوا الشهرية."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["Sign the Unified Tenancy Contract, then register it and pay online.","وقّع عقد الإيجار الموحد، ثم سجّله وادفع الرسوم إلكترونياً.",320],["Or take the original contract and Emirates ID to a Trustees centre; it takes about 25 minutes plus waiting.","أو توجّه إلى مركز أمناء بالعقد الأصلي والهوية الإماراتية، وتستغرق المعاملة نحو 25 دقيقة إضافة إلى الانتظار.",321]],"d":[["Unified Tenancy Contract (copy online, original at a centre)","عقد الإيجار الموحد (نسخة إلكترونياً، والأصل في المركز)"],["Emirates ID, and a power of attorney if you act for someone","الهوية الإماراتية، ووكالة قانونية إذا كنت تنوب عن غيرك"]],"f":[["Dubai REST or website: AED 100 registration + AED 10 knowledge + AED 10 innovation + AED 55 partner fee + AED 2.75 VAT = AED 177.75.","عبر دبي ريست أو الموقع: 100 درهم للتسجيل + 10 للمعرفة + 10 للابتكار + 55 رسوم الشريك + 2.75 ضريبة = 177.75 درهماً.",0],["At a Trustees centre: AED 220 in total, with a AED 95 partner fee plus VAT; about 25 minutes.","في مركز الأمناء: 220 درهماً إجمالاً، منها 95 درهماً رسوم الشريك مع الضريبة، ونحو 25 دقيقة.",0],["Dubai tenants pay a housing fee of 5% of yearly rent, added to their monthly electricity and water bills.","يدفع المستأجر في دبي رسوم سكن بنسبة 5% من الإيجار السنوي، تُضاف إلى فواتير الكهرباء والماء الشهرية.",1],["On 2 November 2026, DLD added Ejari to DubaiNow: register, renew or cancel, get the certificate at once, and pay the DEWA deposit.","في 2 نوفمبر 2026 أضافت الدائرة خدمة إيجاري إلى تطبيق دبي الآن: التسجيل والتجديد والإلغاء، وإصدار الشهادة فوراً، ودفع تأمين ديوا.",2]],"dp":[["status","The apps need tenant and landlord to be individuals; a licensed management company registers its own leases.","تشترط التطبيقات أن يكون المستأجر والمالك أفراداً، وتسجّل شركة الإدارة المرخصة عقودها بنفسها."]],"c":["Fees can change. Keep the certificate for any rent case. Emiratis: check with Dubai Municipality whether the housing fee applies.","قد تتغير الرسوم. واحتفظ بالشهادة لأي دعوى إيجارية. وعلى المواطن التحقق لدى بلدية دبي من انطباق رسوم السكن عليه."],"au":"dld","l":[322,323,301],"so":[[324,303,325],[326,10,327],[328,303,329]],"v":1,"ch":["2026-11","DubaiNow now registers, renews and cancels Ejari and takes the DEWA deposit.","أصبح تطبيق دبي الآن يسجّل عقود إيجاري ويجددها ويلغيها، ويحصّل تأمين ديوا.",2]},{"id":"housing-dubai-deposit","q":["My lease has ended. How do I get my security deposit back?","انتهى عقد الإيجار، كيف أسترد مبلغ التأمين؟"],"k":["landlord not returning deposit dubai","security deposit refund dubai","deposite return after moving out","deductions from deposit dubai","استرجاع مبلغ التأمين ايجار","المالك ما رجع التأمين","خصم من التأمين بعد الخروج من الشقة"],"a":["In Dubai, the landlord may hold a deposit to secure upkeep, and must refund it, or what is left, when the lease ends. Return the home as you got it, apart from normal wear and tear. If the landlord refuses, file a money claim at the Rental Disputes Center.","في دبي يجوز للمالك الاحتفاظ بتأمين لضمان صيانة العقار، وعليه رده أو رد ما تبقى منه عند انتهاء العقد. وأعد المسكن بالحالة التي استلمته بها، باستثناء الاستهلاك العادي. وإذا رفض المالك الرد، فارفع مطالبة مالية لدى مركز فض المنازعات الإيجارية."],"w":["emirati","resident","business"],"m":["dubai","sharjah"],"st":[["Before you leave, fix damage you caused and take dated photos of every room.","قبل المغادرة، أصلح ما سببته من أضرار، والتقط صوراً مؤرخة لكل غرفة.",330],["Settle final bills, return the keys with a signed handover note, and ask in writing for the deposit or a list of deductions.","سدّد الفواتير الأخيرة، وسلّم المفاتيح بمحضر تسليم موقّع، واطلب كتابياً رد التأمين أو قائمة بالخصومات.",331],["If it is not paid, file a money claim; the fee is 3.5% of the amount, at least AED 500.","إذا لم يُرد المبلغ، فارفع مطالبة مالية، ورسومها 3.5% من المبلغ، بحد أدنى 500 درهم.",294]],"d":[["Ejari contract and the deposit receipt or cheque copy","عقد إيجاري وإيصال التأمين أو نسخة الشيك"],["Move-in and move-out photos and the handover note","صور الاستلام والتسليم ومحضر التسليم"]],"f":[["Dubai: the landlord may take a deposit to secure upkeep, and must refund it, or the rest, when the lease ends.","دبي: يجوز للمالك أخذ تأمين لضمان صيانة العقار، وعليه رده أو رد ما تبقى منه عند انتهاء العقد.",0],["The tenant must return the property as received, except for ordinary wear and tear or damage beyond the tenant's control.","على المستأجر إعادة العقار بالحالة التي استلمه بها، باستثناء الاستهلاك العادي أو الضرر الخارج عن إرادته.",0],["A money claim at Dubai's RDC costs 3.5% of the amount: minimum AED 500, maximum AED 15,000.","رسوم المطالبة المالية لدى مركز فض المنازعات الإيجارية في دبي 3.5% من المبلغ، بحد أدنى 500 درهم وأقصى 15,000 درهم.",1],["Sharjah Law 5 of 2024: the landlord must return the deposit at the end, deducting only for damage beyond normal use.","قانون الشارقة رقم 5 لسنة 2024: على المالك رد التأمين عند انتهاء العقد، ولا يخصم منه إلا الأضرار التي تتجاوز الاستعمال العادي.",2]],"dp":[["emirate","In Sharjah, claims go to Sharjah's Rental Disputes Center. Other emirates have their own rules.","في الشارقة تُرفع المطالبات إلى مركز فض المنازعات الإيجارية في الشارقة، ولبقية الإمارات قواعدها."]],"c":["Your contract sets the amount and may set when it is returned. For a small deposit, the AED 500 minimum fee may eat most of it, so send a written demand first.","يحدد عقدك المبلغ وقد يحدد موعد رده. وإذا كان التأمين صغيراً فقد تستهلك الرسوم الدنيا البالغة 500 درهم معظمه، فابدأ بمطالبة كتابية."],"au":"dld","l":[332,333,309],"so":[[308,299,309],[316,317,318],[334,335,336]],"v":1},{"id":"housing-dubai-repairs-services","q":["Who must fix things in my rented home in Dubai, and what if the landlord cuts power, water or AC?","من يصلح الأعطال في المسكن المستأجر في دبي، وماذا لو قطع المالك الكهرباء أو الماء أو التكييف؟"],"k":["landlord not fixing ac dubai","who pays maintenance landlord or tenant","landlord cut electricity dubai","mainteinance responsibility tenant dubai","المالك ما يصلح المكيف","المالك قطع الكهرباء عن الشقة","مين يتحمل الصيانة المالك ولا المستأجر"],"a":["Unless your contract says otherwise, the landlord must do maintenance and repair defects that affect your use of the home. You must take normal care and ask before making changes. The landlord may not cut services or disturb you; if that happens, the police restore services and record it, with no court order needed first.","ما لم ينص عقدك على غير ذلك، يتولى المالك الصيانة وإصلاح العيوب التي تؤثر في انتفاعك بالمسكن. وعليك العناية المعتادة به والاستئذان قبل أي تعديل. ولا يجوز للمالك قطع الخدمات أو التعرض لك، وإذا حدث ذلك تعيد الشرطة الخدمات وتوثّق الواقعة دون حاجة إلى أمر قضائي مسبق."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["Report the fault to the landlord or agent in writing and keep proof.","أبلغ المالك أو الوكيل بالعطل كتابياً، واحتفظ بما يثبت ذلك.",337],["If services are cut or you are disturbed, go to the area's police station and ask for a report.","إذا قُطعت الخدمات أو تعرّض لك المالك، فتوجه إلى مركز الشرطة في المنطقة واطلب محضراً.",338],["To force repairs or claim compensation, file a case with the police report, photos and messages.","لإلزام المالك بالإصلاح أو للمطالبة بالتعويض، ارفع دعوى مرفقاً بها محضر الشرطة والصور والرسائل.",294]],"d":[["Ejari contract and written repair requests","عقد إيجاري وطلبات الإصلاح المكتوبة"],["Photos, videos and any police report","الصور ومقاطع الفيديو وأي محضر شرطة"]],"f":[["Unless agreed otherwise, the landlord does maintenance during the lease and repairs defects that affect the tenant's use.","ما لم يُتفق على غير ذلك، يتولى المالك الصيانة طوال مدة العقد ويصلح العيوب التي تؤثر في انتفاع المستأجر.",0],["Article 34 bars the landlord from cutting services or disturbing the tenant, who can go to the police or claim damages.","تحظر المادة 34 على المالك قطع الخدمات أو التعرض للمستأجر، ويحق للمستأجر اللجوء إلى الشرطة أو المطالبة بالتعويض.",0],["2026 official notes: AC, power and water count as essential; police restore them and record it without a judge's order; damages include non-material harm.","مذكرات رسمية في 2026: التكييف والكهرباء والماء خدمات أساسية، وتعيدها الشرطة وتوثّق الواقعة دون أمر قضائي، ويشمل التعويض الضرر غير المادي.",1]],"dp":[["emirate","In Sharjah, Law 5 of 2024 lets a tenant do needed repairs the landlord ignores and deduct the cost from rent.","في الشارقة يجيز القانون رقم 5 لسنة 2024 للمستأجر إجراء الصيانة الضرورية التي يهملها المالك وخصم كلفتها من الإيجار."]],"c":["Do not withhold rent to force repairs; unpaid rent is a ground for eviction. Keep evidence: compensation needs proof.","لا تمتنع عن دفع الإيجار للضغط من أجل الإصلاح، فعدم الدفع سبب للإخلاء. واحتفظ بالأدلة، فالتعويض يحتاج إلى إثبات."],"au":"dld","l":[332,339,309],"so":[[308,299,309],[340,341,342],[334,335,336]],"v":1},{"id":"housing-abu-dhabi-rent-tawtheeq","q":["Can my landlord in Abu Dhabi raise the rent, and must my lease be registered in Tawtheeq?","هل يحق للمالك في أبوظبي رفع الإيجار، وهل يجب تسجيل عقدي في نظام توثيق؟"],"k":["abu dhabi rent increase 2026","abu dhabi rent freeze","tawtheeq registration","tawteeq abu dhabi how","زيادة الإيجار أبوظبي","تجميد الإيجارات ابوظبي","تسجيل عقد توثيق"],"a":["Not for now. On 3 June 2026, Abu Dhabi cut the yearly rent increase cap from 5% to 0% for residential, commercial and industrial property, until further notice. Renewals and new leases must use the rent in the last registered Tawtheeq contract. Landlords register leases in Tawtheeq; tenants pay a 5% municipality fee via utility bills, but Emiratis renting a home are exempt.","ليس حالياً. ففي 3 يونيو 2026 خفّضت أبوظبي سقف الزيادة السنوية للإيجار من 5% إلى 0% للعقارات السكنية والتجارية والصناعية، حتى إشعار آخر. ويجب أن تعتمد عقود التجديد والعقود الجديدة الإيجار المسجل في آخر عقد توثيق. ويسجّل الملاك العقود في نظام توثيق، ويدفع المستأجرون رسوماً بلدية بنسبة 5% عبر فواتير الخدمات، ويُعفى منها المواطنون المستأجرون للسكن."],"w":["emirati","resident","business"],"m":["abu-dhabi"],"st":[["Ask the landlord for a copy of your registered Tawtheeq contract.","اطلب من المالك نسخة من عقد توثيق المسجل.",343],["At renewal, compare the rent with your last registered Tawtheeq contract; any rise breaks the 0% cap.","عند التجديد، قارن الإيجار بآخر عقد توثيق مسجل، فأي زيادة تخالف سقف 0%.",344],["If the landlord asks for more, report it to ADREC; for other rent disputes, ask the Abu Dhabi Judicial Department.","إذا طلب المالك أكثر، فأبلغ مركز أبوظبي العقاري، وفي النزاعات الإيجارية الأخرى راجع دائرة القضاء في أبوظبي.",345]],"d":[["Your last Tawtheeq contract and the landlord's written renewal offer","آخر عقد توثيق لك وعرض التجديد المكتوب من المالك"]],"f":[["On 3 June 2026, the yearly rent increase cap fell from 5% to 0% for residential, commercial and industrial property, until further notice.","في 3 يونيو 2026 انخفض سقف الزيادة السنوية للإيجار من 5% إلى 0% للعقارات السكنية والتجارية والصناعية، حتى إشعار آخر.",0],["Renewals and new leases must use the rent in the property's last registered Tawtheeq contract.","يجب أن تعتمد عقود التجديد والعقود الجديدة الإيجار الوارد في آخر عقد توثيق مسجل للعقار.",0],["Landlords register leases in Tawtheeq. Tenants pay a 5% municipality fee on the rent or rental index, whichever is higher, via bills over 12 months.","يسجّل الملاك العقود في نظام توثيق، ويدفع المستأجر رسوماً بلدية 5% من الإيجار أو مؤشر الإيجار أيهما أعلى، عبر الفواتير على مدى 12 شهراً.",1],["UAE nationals with residential leases are exempt from the annual municipality fee.","يُعفى المواطنون أصحاب عقود الإيجار السكنية من الرسوم البلدية السنوية.",2]],"dp":[["status","Emiratis renting a home do not pay the municipality fee.","لا يدفع المواطنون المستأجرون للسكن الرسوم البلدية."],["other","The freeze is temporary; ADREC can lift or change it, so check its news before you renew.","التجميد مؤقت، وقد يرفعه مركز أبوظبي العقاري أو يعدّله، فراجع أخباره قبل التجديد."]],"c":["The release does not mention ADGM, which has its own rules; check with ADREC. Get any lease change in writing.","لا يذكر البيان سوق أبوظبي العالمي الذي له قواعده الخاصة، فتحقق لدى المركز. واطلب أي تعديل على العقد كتابياً."],"au":"adrec","l":[346,161,347],"so":[[348,349,350],[326,10,327],[351,349,347]],"v":1,"ch":["2026-06","Abu Dhabi cut the allowed yearly rent increase from 5% to 0% until further notice.","خفّضت أبوظبي نسبة الزيادة السنوية المسموحة للإيجار من 5% إلى 0% حتى إشعار آخر.",0]},{"id":"housing-sharjah-rent-rules","q":["What are the rent increase and eviction rules for tenants in Sharjah?","ما قواعد زيادة الإيجار والإخلاء للمستأجرين في الشارقة؟"],"k":["sharjah rent increase rules","sharjah new rental law 2024","can sharjah landlord increase rent","sharjah eviction notice","sharja tenancy law 3 years","زيادة الإيجار الشارقة","قانون الإيجار الجديد الشارقة","إخلاء المستأجر الشارقة"],"a":["Under Sharjah's Law 5 of 2024, the landlord cannot raise the rent in the first 3 years unless you agree. If you accept an early rise, the next must wait 2 years; later rises must match a fair rent. You cannot be made to leave within 3 years for a home, or 5 for business premises, except for set reasons, such as unpaid rent, or own use with 3 months' notice.","بموجب قانون الشارقة رقم 5 لسنة 2024، لا يجوز للمالك زيادة الإيجار خلال أول 3 سنوات إلا بموافقتك. وإذا قبلت زيادة مبكرة، فلا تجوز زيادة أخرى قبل سنتين، وبعد ذلك ترتبط الزيادة بأجرة المثل. ولا يجوز إخلاؤك قبل 3 سنوات للمسكن أو 5 سنوات للعقار التجاري، إلا لأسباب محددة، مثل عدم دفع الإيجار، أو السكن الشخصي مع إشعار قبل 3 أشهر."],"w":["emirati","resident","business"],"m":["sharjah"],"st":[["Make sure the landlord certifies the lease within 15 days of drafting it.","تأكد من أن المالك صدّق العقد خلال 15 يوماً من تحريره.",352],["Pay on time: rent unpaid 15 days after it is due can lead to eviction.","ادفع في الموعد، فعدم دفع الإيجار خلال 15 يوماً من استحقاقه قد يؤدي إلى الإخلاء.",343],["For disputes, or if the landlord will not certify the lease, apply to the Center; its urgent judge can order it.","في النزاعات، أو إذا رفض المالك تصديق العقد، فتقدّم إلى المركز، إذ يمكن لقاضي الأمور المستعجلة فيه الأمر بذلك.",353]],"d":[["Certified lease contract","عقد الإيجار المصدّق"],["Rent receipts or cheque copies, and any landlord notice","إيصالات الإيجار أو نسخ الشيكات، وأي إشعار من المالك"]],"f":[["Law 5 of 2024: no rent rise in the first 3 years unless agreed; after an agreed early rise, none for 2 years; later rises follow fair rent.","القانون رقم 5 لسنة 2024: لا زيادة في الإيجار خلال أول 3 سنوات إلا بالاتفاق، وبعد زيادة مبكرة متفق عليها لا زيادة لمدة سنتين، ثم تتبع الزيادة أجرة المثل.",0],["No eviction before 3 years (homes) or 5 years (commercial, industrial, professional) unless a ground applies, e.g. rent unpaid 15 days after due.","لا إخلاء قبل 3 سنوات للمساكن أو 5 سنوات للعقارات التجارية والصناعية والمهنية إلا لسبب محدد، مثل عدم دفع الإيجار خلال 15 يوماً من استحقاقه.",0],["Own use: the owner or an adult first-degree relative has no other suitable home, gives at least 3 months' notice, and moves in within 2 months for 1 year.","السكن الشخصي: ألا يملك المالك أو قريبه البالغ من الدرجة الأولى سكناً مناسباً آخر، مع إشعار قبل 3 أشهر على الأقل، والسكن خلال شهرين مدة سنة.",0],["The landlord must certify the lease and pay the fees within 15 days of drafting it; late certification brings a fine.","على المالك تصديق العقد ودفع الرسوم خلال 15 يوماً من تحريره، ويترتب على التأخير غرامة إدارية.",0]],"dp":[["emirate","This is Sharjah's law; Dubai and Abu Dhabi have different rent rules.","هذا قانون الشارقة، ولدبي وأبوظبي قواعد مختلفة للإيجار."]],"c":["Fair rent is set by the executive regulations, and the rent-freeze periods can be changed by decision, so check with the Center. A sale does not end your lease.","تُحدد أجرة المثل وفق اللائحة التنفيذية، ويمكن تعديل مدد تجميد الإيجار بقرار، فتحقق لدى المركز. وبيع العقار لا ينهي عقدك."],"au":"sharjah-municipality","l":[354,161,336],"so":[[334,335,336]],"v":1,"ch":["2024-09","Sharjah issued Law 5 of 2024: a 3-year rent freeze and longer protection from eviction.","أصدرت الشارقة القانون رقم 5 لسنة 2024: تجميد الإيجار 3 سنوات وحماية أطول من الإخلاء.",0]},{"id":"housing-dubai-sharing-subletting","q":["Can I sublet a room or share my rented flat in Dubai?","هل يجوز لي تأجير غرفة من الباطن أو مشاركة شقتي المستأجرة في دبي؟"],"k":["can i sublet my apartment dubai","rent out a room dubai legal","shared housing law dubai 2026","partition room dubai legal","تأجير غرفة من الباطن دبي","قانون السكن المشترك دبي","بارتشن دبي مخالفة"],"a":["Not without the landlord's written consent; unauthorised subletting is a ground for eviction. Under Law 4 of 2026, a unit used as shared housing also needs a Dubai Municipality permit; only the owner or an authorised company may lease it, and tenants may not sublet any part. Fines run from AED 500 to AED 500,000, and up to AED 1 million for repeats.","لا يجوز ذلك دون موافقة كتابية من المالك، والتأجير من الباطن دون إذن سبب للإخلاء. وبموجب القانون رقم 4 لسنة 2026، تحتاج الوحدة المستخدمة سكناً مشتركاً إلى تصريح من بلدية دبي، ولا يؤجرها إلا المالك أو منشأة مرخصة، ولا يجوز للمستأجر تأجير أي جزء منها من الباطن. وتتراوح الغرامات بين 500 و500,000 درهم، وتصل إلى مليون درهم عند التكرار."],"w":["emirati","resident","business"],"m":["dubai"],"st":[["Check your Ejari contract, and get the landlord's written consent before you sublet or take in paying housemates.","راجع عقد إيجاري، واحصل على موافقة المالك الكتابية قبل التأجير من الباطن أو إسكان آخرين بمقابل.",343],["If you rent a room or bed space, ask the owner or operator for the shared housing permit and a written contract.","إذا استأجرت غرفة أو سريراً، فاطلب من المالك أو المشغّل تصريح السكن المشترك وعقداً مكتوباً.",355]],"d":[["Ejari contract and the landlord's written consent to sublet","عقد إيجاري وموافقة المالك الكتابية على التأجير من الباطن"]],"f":[["Tenants may not sublet or assign the lease without the landlord's written consent; doing so is a ground for eviction.","لا يجوز للمستأجر التأجير من الباطن أو التنازل عن العقد دون موافقة المالك الكتابية، ومخالفة ذلك سبب للإخلاء.",0],["Law 4 of 2026: shared housing needs a Dubai Municipality permit, valid 1 year, or 2 years at the owner's request.","القانون رقم 4 لسنة 2026: يحتاج السكن المشترك إلى تصريح من بلدية دبي مدته سنة، أو سنتان بطلب المالك.",1],["Only the owner or an authorised establishment may lease a shared housing unit; tenants may not sublet any part of it.","لا يؤجر وحدة السكن المشترك إلا المالك أو منشأة مرخصة، ولا يجوز للمستأجر تأجير أي جزء منها من الباطن.",1],["Fines: AED 500 to AED 500,000, doubled for a repeat within 1 year, up to AED 1 million. Existing units have 1 year from the law's start to comply.","الغرامات: من 500 إلى 500,000 درهم، وتتضاعف عند التكرار خلال سنة حتى مليون درهم. وللوحدات القائمة مهلة سنة من بدء سريان القانون لتوفيق أوضاعها.",1]],"dp":[["emirate","Sharjah's Law 5 of 2024 bars handing over the lease and allows re-letting only under its regulations. Other emirates differ.","يمنع قانون الشارقة رقم 5 لسنة 2024 التنازل عن عقد الإيجار، ولا يجيز إعادة التأجير إلا وفق لائحته التنفيذية. ولبقية الإمارات قواعدها."]],"c":["Collective labour housing is excluded. Ask Dubai Municipality whether your flat-share counts as shared housing. DLD can cut services or order eviction.","يُستثنى سكن العمال الجماعي. واسأل بلدية دبي هل يُعد سكنك المشترك سكناً مشتركاً قانونياً. ويحق للدائرة قطع الخدمات أو الأمر بالإخلاء."],"au":"dubai-municipality","l":[356,161,357],"so":[[308,299,309],[358,359,357]],"v":1,"ch":["2026-03","Dubai issued Law 4 of 2026: shared housing needs a permit, and existing units have 1 year to comply.","أصدرت دبي القانون رقم 4 لسنة 2026: يحتاج السكن المشترك إلى تصريح، وللوحدات القائمة مهلة سنة لتوفيق أوضاعها.",1]},{"id":"housing-buy-property-expat","q":["Can I buy property in the UAE as an expat, where, and what fees do I pay?","هل يمكنني بصفتي وافداً شراء عقار في الإمارات، وأين، وما الرسوم؟"],"k":["can expats buy property uae","freehold areas dubai","abu dhabi investment zones foreigners","dld transfer fee 4%","buy flat sharjah foreigner","تملك الأجانب عقار دبي","مناطق التملك الحر","رسوم نقل الملكية دائرة الأراضي"],"a":["Yes, in set areas. Dubai lets foreigners own freehold in designated areas, or hold usufruct or leasehold for up to 99 years. Abu Dhabi allows it in investment areas such as Yas, Saadiyat and Reem, and Sharjah in its development areas. Dubai's transfer fee is 4% of the price, 2% each from buyer and seller.","نعم، في مناطق محددة. فدبي تسمح للأجانب بالتملك الحر في المناطق المخصصة، أو بحق الانتفاع أو الإيجار الطويل حتى 99 عاماً. وتسمح به أبوظبي في المناطق الاستثمارية مثل ياس والسعديات والريم، والشارقة في مناطق التطوير العقاري. ورسوم نقل الملكية في دبي 4% من السعر، بواقع 2% على كل من المشتري والبائع."],"w":["resident","visitor","business"],"m":["dubai","abu-dhabi","sharjah"],"st":[["Check that the property is in an area open to foreign ownership.","تحقق من أن العقار يقع في منطقة يُسمح فيها بتملك الأجانب.",360],["In Dubai, UAE ID holders can buy a mortgage-free freehold unit in DubaiNow, paying through a DLD-approved escrow account.","في دبي، يمكن لحاملي الهوية الإماراتية شراء وحدة تملك حر غير مرهونة عبر تطبيق دبي الآن، والدفع عبر حساب ضمان معتمد من الدائرة.",361]],"d":[["Passport, Emirates ID (if resident) and the signed sale agreement","جواز السفر والهوية الإماراتية (للمقيم) واتفاقية البيع الموقعة"]],"f":[["Dubai (Regulation 3 of 2006): foreigners may own freehold in designated areas, or usufruct or leasehold up to 99 years; no age limit.","دبي (اللائحة رقم 3 لسنة 2006): يحق للأجانب التملك الحر في المناطق المخصصة، أو حق الانتفاع أو الإيجار حتى 99 عاماً، دون حد للعمر.",0],["Abu Dhabi (Law 19 of 2005, amended 2019): expats may own in investment areas; u.ae lists 9, such as Yas, Saadiyat and Reem.","أبوظبي (القانون رقم 19 لسنة 2005 المعدل في 2019): يتملك الوافدون في المناطق الاستثمارية، وتذكر بوابة u.ae تسعاً منها، مثل ياس والسعديات والريم.",0],["Sharjah (Law 2 of 2022 and an Executive Council decision): all nationalities may own all kinds of property in development areas and projects, with no time limit.","الشارقة (القانون رقم 2 لسنة 2022 وقرار المجلس التنفيذي): يحق لجميع الجنسيات تملك العقارات بأنواعها في مناطق ومشاريع التطوير العقاري دون تقييد بمدة.",2],["DubaiNow: 2% each from seller and buyer (4% total), AED 250 title deed, AED 250 map, AED 30 + AED 30 fees, AED 1,000 service fee (AED 500 under AED 500,000) + VAT.","دبي الآن: 2% على كل من البائع والمشتري (4% إجمالاً)، و250 درهماً لسند الملكية، و250 للخريطة، و30 + 30 درهماً رسوماً، ورسم خدمة 1,000 درهم (500 إذا قلّت القيمة عن 500,000) مع الضريبة.",1]],"dp":[["emirate","Other emirates set their own ownership areas; ask the local land department.","لبقية الإمارات مناطق تملك خاصة بها، فاسأل دائرة الأراضي المحلية."],["status","Non-residents can buy in Dubai's freehold areas too, but DubaiNow is only for UAE ID holders.","يمكن لغير المقيمين أيضاً الشراء في مناطق التملك الحر في دبي، لكن تطبيق دبي الآن مخصص لحاملي الهوية الإماراتية."]],"c":["Some official pages still show older Sharjah and Abu Dhabi rules, so check with the land department before you pay.","ما زالت بعض الصفحات الرسمية تعرض قواعد سابقة للشارقة وأبوظبي، فتحقق لدى دائرة الأراضي قبل الدفع."],"au":"dld","l":[362,363,364],"so":[[365,245,364],[366,303,367],[368,335,369]],"v":1},{"id":"housing-golden-visa-property","q":["Can I get a Golden Visa by buying property, and does a mortgaged or off-plan home count?","هل أحصل على الإقامة الذهبية بشراء عقار، وهل يُحتسب العقار المرهون أو قيد الإنشاء؟"],"k":["golden visa property 2 million","golden visa mortgaged property dubai","golden visa off plan property","property golden visa fees dubai","الإقامة الذهبية عقار 2 مليون","اقامة ذهبية عن طريق شراء شقة","جولدن فيزا عقار مرهون"],"a":["Yes, if your property is worth at least AED 2 million. ICP counts off-plan units from an approved local developer, and loans from an approved local bank. In Dubai you apply in person through DLD; a mortgage needs a bank no-objection letter, and a lien stays on the property. There, the 10-year visa costs AED 9,884.75.","نعم، إذا كانت قيمة عقارك 2 مليون درهم على الأقل. وتقبل الهيئة الاتحادية للهوية والجنسية العقارات قيد الإنشاء من مطور محلي معتمد، والتمويل من بنك محلي معتمد. وفي دبي تقدّم شخصياً عبر دائرة الأراضي والأملاك، ويحتاج العقار المرهون إلى خطاب عدم ممانعة من البنك، ويبقى رهن على العقار. وتبلغ هناك تكلفة الإقامة لعشر سنوات 9,884.75 درهماً."],"w":["resident","visitor"],"st":[["If the property is mortgaged, ask your bank for a no-objection letter showing the amount paid and the balance.","إذا كان العقار مرهوناً، فاطلب من البنك خطاب عدم ممانعة يبيّن المدفوع والمتبقي.",370],["In Dubai, go in person to a DLD Golden Visa centre, pay and do the medical test there; the permit is emailed in 7-10 working days.","في دبي، توجّه شخصياً إلى أحد مراكز الإقامة الذهبية التابعة للدائرة، وادفع الرسوم وأجرِ الفحص الطبي هناك، وتصلك الإقامة بالبريد الإلكتروني خلال 7 إلى 10 أيام عمل.",371],["In other emirates, apply through ICP; off-plan units must be bought from an approved developer.","في الإمارات الأخرى، تقدّم عبر الهيئة، ويجب شراء العقار قيد الإنشاء من مطور معتمد.",372]],"d":[["Passport and personal photo","جواز السفر وصورة شخصية"],["Title deed or off-plan sale contract","سند الملكية أو عقد شراء العقار قيد الإنشاء"]],"f":[["ICP: property or off-plan units worth at least AED 2,000,000 from an approved local developer; financing from an approved local bank is allowed.","الهيئة: عقار أو وحدات قيد الإنشاء لا تقل قيمتها عن 2,000,000 درهم من مطور محلي معتمد، ويُقبل التمويل من بنك محلي معتمد.",0],["DLD: the property must be wholly owned by the applicant; a mortgaged one needs a bank no-objection letter showing the amount paid and the balance.","الدائرة: يجب أن يكون العقار مملوكاً بالكامل لمقدم الطلب، ويحتاج العقار المرهون إلى خطاب عدم ممانعة يبيّن المدفوع والمتبقي.",1],["DLD fees for the 10-year visa total AED 9,884.75, incl. AED 4,020 DLD fee and AED 700 medical; it takes 7-10 working days.","رسوم الإقامة لعشر سنوات عبر الدائرة 9,884.75 درهماً، منها 4,020 درهماً للدائرة و700 درهم للفحص الطبي، وتستغرق 7 إلى 10 أيام عمل.",1],["GDRFA Dubai: a share in a jointly owned property must be worth at least AED 2 million, and a lien is placed on the property.","إقامة دبي: يجب ألا تقل قيمة الحصة في العقار المشترك عن 2 مليون درهم، ويوضع رهن على العقار.",2]],"dp":[["emirate","Dubai applications go through DLD and GDRFA Dubai; the other emirates use ICP.","تمر طلبات دبي عبر دائرة الأراضي والأملاك والإدارة العامة للإقامة وشؤون الأجانب في دبي، وتستخدم بقية الإمارات الهيئة الاتحادية."],["other","Joint ownership: DLD asks for whole ownership, but GDRFA accepts a share of AED 2 million or more; ask DLD first.","الملكية المشتركة: تشترط الدائرة ملكية كاملة، وتقبل إقامة دبي حصة لا تقل عن 2 مليون درهم، فاسأل الدائرة أولاً."]],"c":["Official pages differ on details such as joint ownership, so confirm before you buy. In Dubai you must be inside the UAE and apply in person.","تختلف الصفحات الرسمية في تفاصيل مثل الملكية المشتركة، فتأكد قبل الشراء. وفي دبي يجب أن تكون داخل الدولة وأن تتقدم بنفسك."],"au":"icp","so":[[45,4,46],[373,303,374],[375,7,376]],"v":1},{"id":"housing-mortgage-down-payment","q":["How much down payment do I need for a home loan in the UAE?","كم الدفعة الأولى المطلوبة للحصول على قرض سكني في الإمارات؟"],"k":["mortgage down payment uae expat","how much deposit for mortgage dubai","loan to value uae central bank","mortgage for emirati first home","morgage downpayment 20 percent","الدفعة الأولى للقرض العقاري","كم المقدم لشراء بيت بالتمويل","نسبة التمويل العقاري للمواطنين"],"a":["Central Bank rules cap what a bank may lend on your first home. Expats can borrow up to 80% of the value for homes of AED 5 million or less, so you need at least 20% down; above AED 5 million the cap is 70%. UAE nationals can borrow up to 85%, or 75% above AED 5 million. Off-plan homes are capped at 50%, and debt payments must stay within 50% of income.","تحدد قواعد المصرف المركزي الحد الأقصى لما يقرضه البنك على مسكنك الأول. فيمكن للوافد اقتراض حتى 80% من القيمة للمساكن التي لا تتجاوز 5 ملايين درهم، أي أن الدفعة الأولى 20% على الأقل، والحد 70% فيما يزيد على 5 ملايين. ويمكن للمواطن اقتراض حتى 85%، أو 75% فيما يزيد على 5 ملايين. وحد تمويل العقار قيد الإنشاء 50%، ويجب ألا تتجاوز أقساط الديون 50% من الدخل."],"w":["emirati","resident"],"st":[["Work out your budget: all monthly debt payments, including the new loan, must stay within 50% of your income.","احسب ميزانيتك: يجب ألا تتجاوز أقساط ديونك الشهرية كلها، ومنها القرض الجديد، 50% من دخلك.",377],["Save the down payment: at least 20% for an expat's first home up to AED 5 million, or 50% for off-plan, plus purchase fees.","ادّخر الدفعة الأولى: 20% على الأقل لمسكن الوافد الأول حتى 5 ملايين درهم، أو 50% للعقار قيد الإنشاء، إضافة إلى رسوم الشراء.",378],["Get a pre-approval from a licensed UAE bank. Emiratis can also ask about state housing programmes.","احصل على موافقة مبدئية من بنك مرخص في الدولة. ويمكن للمواطنين أيضاً السؤال عن برامج الإسكان الحكومية.",379]],"d":[["Emirates ID, passport, salary certificate and recent bank statements","الهوية الإماراتية وجواز السفر وشهادة الراتب وكشوف حساب بنكية حديثة"],["Sale agreement or property details","اتفاقية البيع أو بيانات العقار"]],"f":[["Expatriates' first home: loan up to 80% of value up to AED 5 million (so at least 20% down), and 70% above that (2020 amendment).","المسكن الأول للوافدين: حد التمويل 80% من القيمة حتى 5 ملايين درهم (أي دفعة أولى 20% على الأقل)، و70% فيما يزيد على ذلك (تعديل 2020).",0],["UAE nationals' first home: loan up to 85% of value up to AED 5 million, and 75% above that.","المسكن الأول للمواطنين: حد التمويل 85% حتى 5 ملايين درهم، و75% فيما يزيد على ذلك.",1],["Total monthly debt repayments, including the mortgage, may not exceed 50% of gross monthly income.","يجب ألا يتجاوز مجموع أقساط الديون الشهرية، ومنها القرض العقاري، 50% من إجمالي الدخل الشهري.",1],["Loans for off-plan property are capped at 50% of the property value.","حد تمويل العقارات قيد الإنشاء 50% من قيمة العقار.",1]],"dp":[["status","UAE nationals can borrow more (85%) than expatriates (80%) on a first home.","يستطيع المواطن اقتراض نسبة أعلى (85%) من الوافد (80%) لمسكنه الأول."],["salary","Income limits the loan: all debt payments must stay within 50% of it.","يحدد الدخل قيمة القرض: يجب ألا تتجاوز أقساط الديون كلها 50% منه."]],"c":["These are maximums; a bank can ask for more, and second homes have their own limits. Check current limits with the Central Bank (CBUAE) or your bank.","هذه حدود قصوى، وقد يطلب البنك أكثر، وللمسكن الثاني حدود خاصة. فتحقق من الحدود الحالية لدى المصرف المركزي أو بنكك."],"au":"centralbank","l":[380,363,381],"so":[[382,383,384],[385,383,386]]},{"id":"housing-offplan-escrow","q":["I am buying off-plan in Dubai. How is my money protected, and what if I or the developer cannot finish?","أشتري عقاراً قيد الإنشاء في دبي، كيف تُحمى أموالي، وماذا يحدث إذا تعثرت أنا أو المطور؟"],"k":["off plan escrow account dubai","developer delayed project refund dubai","cant pay off plan installments","حساب الضمان عقار قيد الإنشاء","تعثر المطور استرداد الأموال دبي","ما قدرت اسدد اقساط المطور"],"a":["Pay only into the project's escrow account: by law it funds only that project and is safe from the developer's creditors. The sale must be entered in DLD's interim register, or it is void. If RERA cancels the project, you get all your payments back. If you stop paying, the developer must go through DLD, which first gives you 30 days' notice.","ادفع فقط في حساب الضمان الخاص بالمشروع، فبحكم القانون لا يُستخدم إلا للمشروع، ولا يجوز لدائني المطور الحجز عليه. ويجب قيد البيع في السجل العقاري المبدئي لدى الدائرة، وإلا كان باطلاً. وإذا ألغت مؤسسة التنظيم العقاري المشروع، تُرد إليك كل دفعاتك. وإذا توقفت عن الدفع، يجب أن يلجأ المطور إلى الدائرة، التي تمنحك أولاً إشعاراً مدته 30 يوماً."],"m":["dubai"],"st":[["Before paying, confirm with DLD that the project is registered; pay only into its escrow account and keep every receipt.","قبل الدفع، تأكد لدى الدائرة من تسجيل المشروع، وادفع في حساب الضمان الخاص به فقط واحتفظ بكل إيصال.",387],["If you cannot pay, talk to the developer early; DLD gives 30 days' notice and can help you settle.","إذا تعذّر عليك الدفع، فتحدث إلى المطور مبكراً، إذ تمنحك الدائرة إشعاراً مدته 30 يوماً ويمكنها المساعدة في التسوية.",303],["If the project is cancelled, ask DLD about a refund; a stalled one may need a court case.","إذا أُلغي المشروع، فاسأل الدائرة عن استرداد أموالك، وقد يحتاج المتعثر منه إلى دعوى قضائية.",388]],"d":[["Sale agreement and interim register (Oqood) certificate","اتفاقية البيع وشهادة القيد في السجل العقاري المبدئي (عقود)"]],"f":[["Law 8 of 2007: each project has its own escrow account, used only for its construction and safe from the developer's creditors.","القانون رقم 8 لسنة 2007: لكل مشروع حساب ضمان مستقل لا يُستخدم إلا في إنشائه، ولا يجوز لدائني المطور الحجز عليه.",0],["Any off-plan sale is void unless entered in the Interim Property Register.","يقع باطلاً أي بيع على الخريطة ما لم يُقيد في السجل العقاري المبدئي.",1],["If a buyer defaults, DLD gives 30 days' notice. Over 80% built, the developer may claim the balance, auction, or cancel keeping up to 40%.","إذا تخلّف المشتري، تمنحه الدائرة إشعاراً مدته 30 يوماً. وإذا تجاوز الإنجاز 80%، فللمطور المطالبة بالباقي أو البيع بالمزاد أو الفسخ مع الاحتفاظ بما يصل إلى 40%.",2],["60-80% built: keep up to 40%; under 60%: 25%; not started: 30%. Refund the rest within 1 year or 60 days of resale, whichever is first (60 days if not started).","عند إنجاز 60-80%: الاحتفاظ بما يصل إلى 40%، وأقل من 60%: 25%، ولم يبدأ العمل: 30%. ويُرد الباقي خلال سنة أو 60 يوماً من إعادة البيع أيهما أسبق (60 يوماً إن لم يبدأ العمل).",2],["If RERA cancels the project, the developer must refund all buyer payments.","إذا ألغت مؤسسة التنظيم العقاري المشروع، يلتزم المطور برد جميع دفعات المشترين.",2]],"dp":[["emirate","This is Dubai's law. Abu Dhabi updated its off-plan rules in 2025; ask ADREC there. Other emirates differ.","هذا قانون دبي. وقد حدّثت أبوظبي قواعد البيع على الخريطة في 2025، فاسأل مركز أبوظبي العقاري هناك. ولبقية الإمارات قواعدها."]],"c":["These steps go through DLD, not straight to court, but you can still sue if a developer misuses them.","تمر هذه الإجراءات عبر الدائرة لا عبر المحكمة مباشرة، لكن يحق لك التقاضي إذا أساء المطور استخدامها."],"au":"dld","l":[389,390,391],"so":[[392,299,391],[393,299,394],[395,299,396]],"v":1},{"id":"housing-dubai-service-charges","q":["I own a flat in Dubai. Who sets the service charges, and what if I don't pay?","أملك شقة في دبي، من يحدد رسوم الخدمات، وماذا يحدث إذا لم أدفعها؟"],"k":["service charges dubai who decides","service charge too high dubai complain","who pays service charges owner or tenant","srvice charges not paid dubai","رسوم الخدمات دبي","رسوم الصيانة شقة تملك حر","اعتراض على رسوم الخدمات ريرا"],"a":["In a shared building, owners pay service and usage charges, split by unit size, unless a lease moves them to the tenant. The management company cannot charge anything without RERA approval of an audited budget. You cannot hold back approved charges: after a 30-day notice, the Rental Disputes Center can enforce the debt and auction the unit.","في المباني المشتركة يدفع الملاك رسوم الخدمات والاستخدام بحسب مساحة كل وحدة، ما لم ينقلها عقد الإيجار إلى المستأجر. ولا يجوز لشركة الإدارة فرض أي مبلغ دون موافقة مؤسسة التنظيم العقاري على ميزانية مدققة. ولا يجوز الامتناع عن الرسوم المعتمدة، فبعد إشعار مدته 30 يوماً يمكن لمركز فض المنازعات الإيجارية تنفيذ الدين وبيع الوحدة بالمزاد."],"m":["dubai"],"st":[["Ask the management company for the RERA-approved budget and your unit's share.","اطلب من شركة الإدارة الميزانية المعتمدة من المؤسسة وحصة وحدتك.",397],["If a charge was not approved by RERA, raise it with RERA before paying it.","إذا لم تعتمد المؤسسة رسماً ما، فاعرض الأمر عليها قبل دفعه.",398],["If you get a payment notice, pay or settle within 30 days. If you rent the unit out, say in the lease who pays.","إذا وصلك إشعار بالدفع، فادفع أو تفاهم خلال 30 يوماً. وإذا أجّرت الوحدة، فحدد في العقد من يدفع.",399]],"d":[["Title deed","سند الملكية"],["Service charge invoices and the approved budget","فواتير رسوم الخدمات والميزانية المعتمدة"]],"f":[["Owners pay service and usage charges for common areas, including district cooling, unless the lease says otherwise, and stay liable if a tenant defaults.","يدفع الملاك رسوم الخدمات والاستخدام للأجزاء المشتركة، ومنها التبريد المركزي، ما لم ينص عقد الإيجار على غير ذلك، ويبقون مسؤولين إذا تخلّف المستأجر.",1],["Each owner's share follows the unit's area against the total area; the money goes into a dedicated bank account for the project.","تُحسب حصة كل مالك بنسبة مساحة وحدته إلى المساحة الكلية، وتودع الأموال في حساب بنكي مخصص للمشروع.",0],["A management entity may not charge or collect any amount without RERA approval; budgets need a certified auditor's approval.","لا يجوز لجهة الإدارة فرض أو تحصيل أي مبلغ دون موافقة المؤسسة، وتحتاج الميزانيات إلى اعتماد مدقق معتمد.",0],["Unpaid charges: a RERA-approved notice gives 30 days to pay; then the RDC can enforce the debt and auction the unit.","عند عدم الدفع يُمنح المالك إشعاراً معتمداً من المؤسسة بالدفع خلال 30 يوماً، ثم يُنفذ الدين عبر مركز فض المنازعات الإيجارية وقد تُباع الوحدة بالمزاد.",0]],"dp":[["emirate","This is Dubai's law. Abu Dhabi issued its own rules for jointly owned property in 2025; other emirates differ.","هذا قانون دبي. وقد أصدرت أبوظبي قواعدها الخاصة بالعقارات المشتركة في 2025، ولبقية الإمارات قواعدها."]],"c":["Do not hold back approved charges over a service complaint; complain separately. A unit cannot be sold until its charges are paid.","لا تحجب الرسوم المعتمدة بسبب شكوى من الخدمة، بل قدّم الشكوى منفصلة. ولا يجوز بيع الوحدة قبل سداد رسومها."],"au":"dld","l":[400,401,402],"so":[[403,299,402],[404,303,405]],"v":1}]},{"topic":"emirati","title":{"en":"Services for UAE nationals","ar":"خدمات المواطنين الإماراتيين"},"checked":"2026-11-08","entries":[{"id":"emirati-private-sector-rights","q":["I'm Emirati and work for a private company. What is my minimum salary and what are my rights?","أنا مواطن وأعمل في شركة خاصة. ما الحد الأدنى لراتبي وما حقوقي؟"],"k":["minimum salary for emirati in private sector","emirati minimum wage 6000","emiratization quota fine","الحد الأدنى لراتب المواطن في القطاع الخاص","راتب المواطن 6000 درهم","حقوق المواطن في الشركات الخاصه"],"a":["Firms under MOHRE must now pay every Emirati at least AED 6,000 a month (new permits from 1 January 2026, existing staff from 30 June 2026). They must also register you for pension within a month of your work permit, pay you through the Wages Protection System, pay you as much as others in the same job, and not cut your pay for government support you get.","يجب على المنشآت الخاضعة للوزارة أن تدفع لكل مواطن 6,000 درهم شهرياً على الأقل (للتصاريح الجديدة منذ 1 يناير 2026، وللعاملين الحاليين منذ 30 يونيو 2026). وعليها أيضاً تسجيلك في المعاشات خلال شهر من صدور تصريح العمل، ودفع راتبك عبر نظام حماية الأجور، وألا يقل عن رواتب نظرائك في الوظيفة نفسها، وألا تخصم منه بسبب دعم حكومي تحصل عليه."],"w":["emirati","business"],"s":["private"],"st":[["Check that your contract and payslip show at least AED 6,000 a month.","تأكد من أن عقدك وكشف راتبك يُظهران 6,000 درهم شهرياً على الأقل.",406],["Check that you are registered for pension and that contributions are paid.","تحقق من تسجيلك في المعاشات ومن سداد الاشتراكات.",407],["Paid below the minimum, late, or less than others in the same job? File a complaint.","إذا كان راتبك أقل من الحد الأدنى أو تأخر أو كان أقل من نظرائك في الوظيفة نفسها، فقدّم شكوى.",406]],"d":[["Employment contract and recent payslips","عقد العمل وكشوف الراتب الحديثة"]],"f":[["Emirati minimum pay in private firms: AED 6,000 a month for new, renewed or amended permits from 1 January 2026.","الحد الأدنى لأجر المواطن في الشركات الخاصة 6,000 درهم شهرياً للتصاريح الجديدة أو المجددة أو المعدلة من 1 يناير 2026.",1],["Existing pay had to reach AED 6,000 by 30 June 2026. From 1 July 2026, lower pay doesn't count for Emiratisation and the firm's new permits stop.","كان يجب رفع الرواتب القائمة إلى 6,000 درهم بحلول 30 يونيو 2026، ومن 1 يوليو 2026 لا تُحتسب الرواتب الأقل في التوطين وتُوقف تصاريح المنشأة الجديدة.",1],["Employers must register Emiratis for pension and start contributions within a month of the work permit.","على صاحب العمل تسجيل المواطن في المعاشات وبدء الاشتراكات خلال شهر من صدور تصريح العمل.",0],["50+ workers: add 2% Emiratis in skilled jobs a year (10% by 2026), or pay AED 6,000 a month per missing Emirati from 2023, rising AED 1,000 a year to 2026.","50 عاملاً فأكثر: زيادة المواطنين في الوظائف المهارية 2% سنوياً (10% بحلول 2026)، وإلا دفع 6,000 درهم شهرياً عن كل مواطن ناقص منذ 2023 تزيد 1,000 درهم سنوياً حتى 2026.",0]],"dp":[["sector","These rules cover firms under MOHRE. In a free zone or government job, ask your employer.","تشمل هذه القواعد المنشآت الخاضعة للوزارة، فإن كنت تعمل في منطقة حرة أو جهة حكومية فاسأل جهة عملك."],["emirate","In Abu Dhabi, private-sector Emiratis are covered by the Abu Dhabi Pension Fund, not GPSSA.","في أبوظبي يخضع المواطنون العاملون في القطاع الخاص لصندوق أبوظبي للمعاشات لا للهيئة العامة للمعاشات."]],"c":["Firms of 20-49 workers in 14 sectors also had hiring targets for 2024-2025. Targets and fines run to 2026; check MOHRE for later years.","كان على المنشآت التي يعمل بها 20-49 عاملاً في 14 قطاعاً أهداف توظيف أيضاً لعامي 2024 و2025. وتمتد الأهداف والغرامات حتى 2026، فراجع الوزارة بشأن ما بعدها."],"au":"mohre","so":[[408,10,409],[410,0,411]],"v":1,"ch":["2026-01","The Emirati minimum rose to AED 6,000 a month, after AED 4,000 and then AED 5,000.","ارتفع الحد الأدنى لأجر المواطن إلى 6,000 درهم شهرياً بعد 4,000 ثم 5,000 درهم.",1],"h":"wage-guard"},{"id":"emirati-gpssa-pension","q":["I'm Emirati in a new private-sector job. How do I register for pension, and how much is deducted?","أنا مواطن في وظيفة جديدة بالقطاع الخاص. كيف أُسجَّل في التقاعد، وكم يُقتطع من راتبي؟"],"k":["gpssa registration private sector","pension deduction emirati salary","gpssa 11 percent","التسجيل في هيئة المعاشات القطاع الخاص","كم نسبة اشتراك التقاعد للمواطن","استقطاع التقاعد 11%"],"a":["Your employer must register you with GPSSA in your first month. If hired on or after 31 October 2023, you pay 11% of your contribution salary and your employer 15%; if that salary is under AED 20,000, the government pays 2.5% of the employer's share. Those hired earlier stay on the 1999 law's rates.","يجب أن يسجلك صاحب العمل لدى الهيئة العامة للمعاشات والتأمينات الاجتماعية في شهرك الأول. وإذا عُيّنت في 31 أكتوبر 2023 أو بعده تدفع 11% من راتب حساب الاشتراك ويدفع صاحب العمل 15%، وإذا قلّ هذا الراتب عن 20,000 درهم تدفع الحكومة 2.5% من حصة صاحب العمل. ومن عُيّنوا قبل ذلك تبقى عليهم نسب قانون 1999."],"w":["emirati","business"],"m":["dubai","sharjah","ajman","umm-al-quwain","ras-al-khaimah","fujairah"],"s":["private"],"st":[["Check you qualify: Emirati, aged 18-60, and medically fit with an approved report.","تأكد من استيفاء الشروط: مواطن، وعمرك بين 18 و60 سنة، ولائق طبياً بتقرير معتمد.",412],["After your employer registers you, check each month that contributions are paid.","بعد أن يسجلك صاحب العمل، تحقق كل شهر من سداد الاشتراكات.",413],["To dispute a decision, appeal to the Insurance Appeals Committee within 5 years of entitlement, before court.","للاعتراض على قرار، تظلّم أمام لجنة التظلمات التأمينية خلال 5 سنوات من الاستحقاق قبل المحكمة.",414]],"d":[["Approved medical fitness report","تقرير لياقة طبية معتمد"]],"f":[["Law No. 57 of 2023: 26% in total (you 11%, employer 15%); in the private sector the government pays 2.5% of the 15% if the contribution salary is under AED 20,000.","القانون رقم 57 لسنة 2023: 26% إجمالاً (11% عليك و15% على صاحب العمل)، وفي القطاع الخاص تدفع الحكومة 2.5% من الـ15% إذا قلّ راتب حساب الاشتراك عن 20,000 درهم.",0],["The 2023 law does not apply to Emiratis employed before 31 October 2023.","لا يسري قانون 2023 على المواطنين المعيّنين قبل 31 أكتوبر 2023.",1],["1999 law: 20% in total; 5% from you and, in the private sector, 12.5% from the employer and 2.5% from the government.","قانون 1999: 20% إجمالاً، 5% عليك، وفي القطاع الخاص 12.5% على صاحب العمل و2.5% على الحكومة.",0],["Register within the first month of joining; age 18-60 and medically fit. Appeal within 5 years of entitlement.","التسجيل خلال الشهر الأول من الالتحاق، بعمر بين 18 و60 سنة ولياقة طبية، والتظلم خلال 5 سنوات من الاستحقاق.",0],["From September 2026, private employers also pay their own share of pension contributions for Emiratis in Nafis.","اعتباراً من سبتمبر 2026 يدفع أصحاب العمل في القطاع الخاص أيضاً حصتهم من اشتراكات التقاعد عن المواطنين المسجلين في «نافس».",2]],"dp":[["emirate","GPSSA does not cover Abu Dhabi's government and private sectors or Sharjah's government sector; they have local funds.","لا تشمل الهيئة القطاعين الحكومي والخاص في أبوظبي ولا القطاع الحكومي في الشارقة، فلها صناديق محلية."],["other","Hired before 31 October 2023? The 1999 law's rates apply; from that date, the 2023 law's.","إذا عُيّنت قبل 31 أكتوبر 2023 فتنطبق نسب قانون 1999، ومن ذلك التاريخ نسب قانون 2023."]],"c":["Nafis rules changed in September 2026; ask GPSSA or Nafis how this affects you.","تغيرت قواعد «نافس» في سبتمبر 2026، فاسأل الهيئة أو «نافس» عن أثر ذلك عليك."],"au":"gpssa","l":[415,161,416],"so":[[417,414,418],[419,414,416],[420,421,422]],"v":1,"ch":["2026-09","Private employers now also pay their own share of pension contributions for Emiratis in Nafis.","يدفع أصحاب العمل في القطاع الخاص الآن أيضاً حصتهم من اشتراكات تقاعد المواطنين المسجلين في «نافس».",2]},{"id":"emirati-housing-programmes","q":["I'm Emirati and need a home. Which housing programme do I apply to, and do I qualify?","أنا مواطن وأحتاج إلى مسكن. لأي برنامج إسكان أتقدم، وهل أستحق المساعدة؟"],"k":["sheikh zayed housing programme apply","housing loan emirati how to apply","zayed housing eligibility","برنامج الشيخ زايد للاسكان التسجيل","شروط زايد للإسكان","طلب مساعده سكنيه"],"a":["Abu Dhabi citizens usually apply to ADHA and Dubai citizens to MBRHE; Sharjah and Ras Al Khaimah also have local bodies. Others apply to the federal Sheikh Zayed Housing Programme, run by the Ministry of Energy and Infrastructure (MOEI). You must support a citizen family, not have owned a suitable home in the last 10 years, and never have had government housing help.","يتقدم مواطنو أبوظبي عادةً إلى هيئة أبوظبي للإسكان، ومواطنو دبي إلى مؤسسة محمد بن راشد للإسكان، وللشارقة ورأس الخيمة جهات محلية أيضاً. ويتقدم غيرهم إلى برنامج الشيخ زايد للإسكان الاتحادي التابع لوزارة الطاقة والبنية التحتية. ويشترط أن تعيل أسرة مواطنة، وألا تكون امتلكت مسكناً مناسباً خلال آخر 10 سنوات، وألا تكون حصلت على مساعدة سكنية حكومية من قبل."],"w":["emirati"],"st":[["Federal: fill in the housing assistance request and attach your documents.","البرنامج الاتحادي: املأ طلب المساعدة السكنية وأرفق مستنداتك.",423],["If the online service shows as suspended, call 800 6634.","إذا ظهرت الخدمة الإلكترونية موقوفة، فاتصل على 800 6634.",424],["Expect a decision in about 45 working days.","يصدر القرار عادةً خلال نحو 45 يوم عمل.",425]],"d":[["Family book and Emirates ID","خلاصة القيد وبطاقة الهوية"],["Papers from other bodies must carry their stamp (digital stamp accepted)","مستندات الجهات الأخرى مختومة منها (ويُقبل الختم الرقمي)"]],"f":[["Federal conditions: citizen with family book and ID, supporting a citizen family, no suitable home owned in the last 10 years, no earlier government housing help.","شروط البرنامج الاتحادي: مواطن لديه خلاصة قيد وهوية، ويعيل أسرة مواطنة، ولم يمتلك مسكناً مناسباً خلال آخر 10 سنوات، ولم يحصل على مساعدة سكنية حكومية سابقة.",1],["Foreign wife: you need children with her or more than 7 years of marriage. Monthly income must be no more than AED 100,000.","إذا كانت الزوجة غير مواطنة يُشترط وجود أبناء منها أو مرور أكثر من 7 سنوات على الزواج، وألا يزيد الدخل الشهري على 100,000 درهم.",1],["No fee; about 45 working days. Toll-free 800 6634. On 8 Nov 2026 the online service showed as temporarily suspended.","بلا رسوم، ونحو 45 يوم عمل. الرقم المجاني 800 6634. وفي 8 نوفمبر 2026 ظهرت الخدمة الإلكترونية موقوفة مؤقتاً.",1],["Federal loans are interest-free over 25 years; grants go to the poorest. Orphans, widows, the elderly and people with special needs come first.","القروض الاتحادية بلا فوائد وتُسدَّد على 25 سنة، والمنح لأشد الفئات حاجة، والأولوية للأيتام والأرامل وكبار السن وأصحاب الهمم.",0]],"dp":[["emirate","Abu Dhabi (ADHA), Dubai (MBRHE), Sharjah (Department of Housing) and Ras Al Khaimah (Sheikh Saud Housing Programme) have their own rules.","لأبوظبي (هيئة أبوظبي للإسكان) ودبي (مؤسسة محمد بن راشد للإسكان) والشارقة (دائرة الإسكان) ورأس الخيمة (برنامج الشيخ سعود للإسكان) قواعدها الخاصة."],["status","The federal document list depends on your gender, marital status and category.","تختلف قائمة المستندات في البرنامج الاتحادي حسب الجنس والحالة الاجتماعية وفئة المتقدم."]],"c":["MOEI's page lists no grant or loan amounts and says your income decides which you get. Ask MOEI for current limits.","لا تذكر صفحة الوزارة قيم المنح أو القروض، وتقول إن دخلك يحدد نوع المساعدة. اسأل الوزارة عن الحدود الحالية."],"au":"szhp","so":[[426,10,427],[428,429,430]],"v":1},{"id":"emirati-marriage-grant","q":["We are both Emirati and getting married. Can we get the marriage grant, and how do we apply?","نحن مواطنان مقبلان على الزواج. هل نستحق منحة الزواج، وكيف نتقدم بطلبها؟"],"k":["marriage grant uae how to apply","70000 marriage grant emirati","marriage grant salary 25000","منحة الزواج 70 الف شروط","طريقة التقديم على منحة الزواج","منحه الزواج للمواطنين كم"],"a":["The federal marriage grant is AED 70,000. Both spouses must be Emirati, the groom at least 21 and the bride at least 18, and the groom's net income no more than AED 25,000 a month. Apply to the Ministry of Family within 6 months of the marriage contract, then attend the Edaad courses within 1 year of applying.","منحة الزواج الاتحادية 70,000 درهم. ويشترط أن يكون الزوجان مواطنَين، وألا يقل عمر الزوج عن 21 سنة والزوجة عن 18 سنة، وألا يزيد صافي دخل الزوج على 25,000 درهم شهرياً. قدّم الطلب إلى وزارة الأسرة خلال 6 أشهر من عقد الزواج، ثم احضرا دورات «إعداد» خلال سنة من تقديم الطلب."],"w":["emirati"],"st":[["Apply within 6 months of the marriage contract; upload documents within 3 months of applying.","قدّم الطلب خلال 6 أشهر من عقد الزواج، وارفع المستندات خلال 3 أشهر من تقديمه.",431],["Attend the Edaad courses within 1 year of applying.","احضرا دورات «إعداد» خلال سنة من تقديم الطلب.",432],["Within 1 year of payment, send a court-certified marriage acknowledgment or a child's birth certificate.","خلال سنة من صرف المنحة، قدّم إشهاد زواج مصدقاً من المحكمة أو شهادة ميلاد طفل.",433]],"d":[["Detailed salary certificate and last 3 months' bank statements","شهادة راتب مفصلة وكشوف حساب آخر 3 أشهر"],["Property ownership statement (Sharjah: also from Planning and Survey)","شهادة ملكية عقارات (ولمواطني الشارقة من دائرة التخطيط والمساحة أيضاً)"],["Bank letter showing your IBAN","رسالة من البنك برقم الآيبان"]],"f":[["Grant: AED 70,000. Free to apply; service time 30 working days. Ministry phone: 800 114.","المنحة 70,000 درهم، والتقديم مجاني، ومدة إنجاز الخدمة 30 يوم عمل. هاتف الوزارة: 800 114.",0],["Both spouses Emirati; at the contract the groom is 21+ and the bride 18+; groom's net income (after pension and housing allowance) up to AED 25,000.","الزوجان مواطنان، وعمر الزوج 21 سنة فأكثر والزوجة 18 سنة فأكثر عند العقد، وصافي دخل الزوج (بعد خصم التقاعد وبدل السكن) حتى 25,000 درهم.",0],["Deadlines: apply within 6 months of the contract, documents within 3 months, Edaad within 1 year of applying, proof within 1 year of payment.","المواعيد: الطلب خلال 6 أشهر من العقد، والمستندات خلال 3 أشهر، و«إعداد» خلال سنة من الطلب، والإثبات خلال سنة من الصرف.",0],["Abu Dhabi: newlyweds in Medeem earning up to AED 50,000 a month can get up to AED 75,000 in rent help from ADHA.","أبوظبي: يمكن للمتزوجين حديثاً المسجلين في «مديم» ممن لا يزيد دخلهم على 50,000 درهم شهرياً الحصول على دعم إيجار حتى 75,000 درهم من هيئة أبوظبي للإسكان.",1]],"dp":[["emirate","Abu Dhabi adds newlywed help such as ADHA rent support.","تضيف أبوظبي دعماً للمتزوجين حديثاً مثل دعم الإيجار من هيئة أبوظبي للإسكان."],["status","The groom must not already be married, unless an exemption in Article 4 of Cabinet Resolution No. 5 of 2017 applies.","يجب ألا يكون الزوج متزوجاً، إلا إذا انطبق عليه استثناء في المادة 4 من قرار مجلس الوزراء رقم 5 لسنة 2017."]],"c":["Not for anyone who already had this or any other UAE grant. News reports say FNC members want the rules reviewed, so check with the Ministry of Family first.","لا تُصرف لمن حصل عليها أو على أي منحة أخرى في الدولة. وتفيد تقارير صحفية بأن أعضاء في المجلس الوطني يطالبون بمراجعة الشروط، فتحقق من وزارة الأسرة أولاً."],"au":"ministry-of-family","l":[434,435,436],"so":[[437,432,436],[438,439,440]],"v":1},{"id":"emirati-family-book","q":["How do I get my own family book (khulasat al qaid), or update it after a marriage, birth or divorce?","كيف أستخرج خلاصة قيد خاصة بي، أو أعدّلها بعد زواج أو ولادة أو طلاق؟"],"k":["how to get family book uae","khulasat al qaid issue","add newborn to family book","استخراج خلاصة القيد","اضافة مولود في خلاصة القيد","خلاصة قيد للمطلقة"],"a":["ICP issues the family book (family data). You can get your own as a citizen marrying for the first time, an unmarried citizen aged 30 or over, or a divorced or widowed Emirati woman. Apply with UAE PASS in the ICP app or website; fees are AED 25 plus AED 50 and it takes about 2 days. To add a newborn later, the head of the family uses ICP's Amend Family Data service.","تصدر الهيئة الاتحادية للهوية والجنسية خلاصة القيد (البيانات الأسرية). ويمكنك استخراج خلاصة خاصة بك إذا كنت مواطناً متزوجاً لأول مرة، أو مواطناً غير متزوج بلغ 30 سنة فأكثر، أو مواطنة مطلقة أو أرملة. قدّم الطلب بالهوية الرقمية عبر تطبيق الهيئة أو موقعها؛ والرسوم 25 درهماً و50 درهماً، وتستغرق نحو يومين. ولإضافة مولود لاحقاً يستخدم رب الأسرة خدمة «تعديل البيانات الأسرية»."],"w":["emirati"],"st":[["Log in with UAE PASS and choose 'Issue Family Data'.","سجّل الدخول بالهوية الرقمية واختر خدمة «إصدار البيانات الأسرية».",441],["Check your details, attach the documents for your case and pay the fees.","راجع بياناتك وأرفق مستندات حالتك وادفع الرسوم.",442],["Spouse not Emirati, or contract from abroad or over 1 year old? Get the extra papers first.","إذا كان أحد الزوجين غير مواطن أو كان العقد صادراً في الخارج أو مضى عليه أكثر من سنة، فجهّز المستندات الإضافية أولاً.",443]],"d":[["Personal photo and marriage contract","صورة شخصية وعقد الزواج"],["Foreign spouse: both birth certificates, latest qualifications and both employers' letters","الزوج غير المواطن: شهادتا ميلاد الزوجين وآخر مؤهل لكل منهما وشهادتان «لمن يهمه الأمر» من جهتي العمل"],["Divorced, widowed or unmarried 30+: Sharia court status declaration","للمطلقة والأرملة وغير المتزوج فوق 30 سنة: إشهاد حالة من المحكمة الشرعية"]],"f":[["Fees: AED 25 for the statistical statement plus AED 50 to apply; about 2 days.","الرسوم: 25 درهماً لطلب البيان الإحصائي و50 درهماً رسوم الطلب، ونحو يومين للإنجاز.",0],["Own family book: first-time married citizen, unmarried citizen aged 30+, or divorced or widowed citizen woman.","تُصدر خلاصة مستقلة للمواطن المتزوج لأول مرة، وللمواطن غير المتزوج الذي بلغ 30 سنة فأكثر، وللمواطنة المطلقة أو الأرملة.",0],["A widow gets her own record only if no children are registered in her late husband's record.","لا تُصدر للأرملة خلاصة مستقلة إلا إذا لم يكن هناك أبناء مسجلون في قيد زوجها المتوفى.",0],["Contracts issued abroad or over 1 year old need a Marriage Continuity Certificate from inside the UAE.","العقود الصادرة في الخارج أو التي مضى عليها أكثر من سنة تحتاج إلى شهادة استمرار زواج من داخل الدولة.",0],["Adding a newborn or separating a divorced woman is a family data change; the citizen head of the family applies.","إضافة مولود أو فصل المطلقة من تعديلات البيانات الأسرية، ويقدّم الطلب رب الأسرة المواطن.",1]],"dp":[["status","Married, divorced, widowed and unmarried applicants each have their own document list.","لكل من المتزوج والمطلقة والأرملة وغير المتزوج قائمة مستندات خاصة."],["other","Marrying a foreigner adds documents; Armed Forces sta
