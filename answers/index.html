<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wadeh · واضح</title>
<style>
:root{
--paper:#f3f5f1;--card:#fff;--ink:#122a2a;--muted:#53686a;--teal:#0a6b61;--alert:#ad4128;--gold:#7a5b00;
--line:color-mix(in srgb,var(--ink) 14%,transparent);
--teal-soft:color-mix(in srgb,var(--teal) 11%,var(--card));
--alert-soft:color-mix(in srgb,var(--alert) 11%,var(--card));
--gold-soft:color-mix(in srgb,var(--gold) 13%,var(--card));
--font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
--font-ar:'Noto Sans Arabic','IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0d1716;--card:#152322;--ink:#e3eeeb;--muted:#9fb3af;--teal:#5fc8b8;--alert:#f08b6e;--gold:#e3c46e;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0d1716;--card:#152322;--ink:#e3eeeb;--muted:#9fb3af;--teal:#5fc8b8;--alert:#f08b6e;--gold:#e3c46e;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:130px}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 var(--font);overflow-wrap:break-word}
[dir="rtl"] body{font-family:var(--font-ar);line-height:1.75}
main{max-width:1080px;margin:0 auto;padding:14px 14px 72px;display:flex;flex-direction:column;gap:16px;outline:none}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:clamp(26px,6vw,38px)}h2{font-size:22px}h3{font-size:18px}
[dir="rtl"] h1,[dir="rtl"] h2{line-height:1.45}
p{margin:0}
a{color:var(--teal);text-underline-offset:3px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:8px}
.skip{position:absolute;inset-inline-start:-999px;top:8px;background:var(--card);padding:10px 14px;border-radius:8px;z-index:40}
.skip:focus{inset-inline-start:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;line-height:1.2;min-width:0}
.brand small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.logo{width:38px;height:42px;background:var(--teal);color:var(--card);display:grid;place-items:center;font:700 21px var(--font-ar);flex:none;clip-path:polygon(50% 0,100% 16%,100% 58%,50% 100%,0 58%,0 16%)}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 14px;min-height:44px;cursor:pointer;font-size:15px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--card);font-weight:700}
.seg button[lang="ar"]{font-family:var(--font-ar)}
.status{font-size:14px;padding:8px 12px;min-height:44px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink);max-width:100%;min-width:0;text-align:start}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.ready .dot{background:var(--teal)}.status.off .dot{background:var(--alert)}
#aiStatusText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.status .chev{color:var(--muted);font-size:11px}
.banner{font-size:15px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.tabs{position:sticky;top:0;z-index:10;background:var(--paper);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:8px 0}
@media (min-width:860px){.tabs{grid-template-columns:repeat(7,minmax(0,1fr))}}
.tab{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:14px;font-weight:700;min-height:48px;cursor:pointer;color:var(--ink);line-height:1.15;text-align:center}
.tab[aria-selected="true"]{background:var(--teal);color:var(--card);border-color:var(--teal)}
.tab .cnt{font-size:12px;border-radius:999px;padding:0 6px;background:var(--alert);color:#fff}
.panel{display:flex;flex-direction:column;gap:16px;outline:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal)}
.lead{max-width:62ch;color:var(--muted)}
textarea,input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],select{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 14px;font-size:17px;min-height:48px}
textarea{min-height:96px;resize:vertical}
label{font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:6px}
label small{font-weight:400;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:12px;padding:10px 18px;min-height:48px;font-weight:700;font-size:16px;cursor:pointer;background:var(--ink);color:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none}
.btn.teal{background:var(--teal);color:var(--card)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--alert);color:var(--card)}
.btn.sm{min-height:44px;padding:8px 12px;font-size:15px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:wait}
.iconbtn{width:44px;height:44px;min-height:44px;padding:0;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-size:15px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px;color:var(--ink);text-align:start}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--card);border-color:var(--teal);font-weight:700}
.chip.gap{border-style:dashed}
.chip .tag{font-size:12px;color:var(--muted);margin-inline-start:6px}
.chip[aria-pressed="true"] .tag{color:inherit}
.tip{font-size:15px;color:var(--muted)}
.err{color:var(--alert);font-size:15px;font-weight:700}.err:empty{display:none}
.note{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line);display:inline-block;max-width:100%}
.pill.ok{background:var(--teal-soft);color:var(--teal);border-color:transparent}
.pill.bad{background:var(--alert-soft);color:var(--alert);border-color:transparent}
.pill.chg{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.askbox textarea{font-size:18px;min-height:88px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile,.jcard,.eitem,.authcard,.calc{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;gap:6px}
.tile,.jcard,.eitem{cursor:pointer;text-align:start}
.tile{min-height:64px;gap:2px}
.tile b{font-size:16px}.tile span{font-size:14px;color:var(--muted)}
.jlist{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:720px){.jlist{grid-template-columns:repeat(3,minmax(0,1fr))}}
.jcard{flex-direction:row;gap:10px;align-items:center;min-height:56px}
.jicon{font-size:24px;width:40px;height:40px;display:grid;place-items:center;background:var(--paper);border-radius:12px;flex:none}
.profile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.profile .chip{min-height:44px;padding:6px 12px}
.profile .chip b{font-weight:700}
.chooser{border:1.5px dashed var(--teal);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--teal-soft)}
.trace{list-style:none;margin:0;padding:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.trace li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.trace .sn{font-weight:700}
details.tracebox>summary,details.more>summary{font-weight:700;color:var(--muted);min-height:44px;cursor:pointer}
.scpop a,.src a,.plan p>a{display:inline-flex;align-items:center;min-height:44px}
.k{font-size:12px;font-weight:700;border-radius:999px;padding:1px 7px;text-align:center;border:1.5px solid currentColor;white-space:nowrap;display:inline-block;min-width:44px}
.k.ai{color:var(--teal)}.k.rule{color:var(--muted)}
.asked{font-size:16px;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:10px}
.clar{border:2px solid var(--teal);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:14px;background:var(--teal-soft)}
.clar fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.clar legend{font-weight:700;padding:0;margin-bottom:4px}
.why{font-size:14px;color:var(--muted)}
.answer{border-inline-start:5px solid var(--teal);background:var(--teal-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.answer.rules{border-inline-start-color:var(--muted);background:var(--paper)}
.answer .who{font-size:14px;font-weight:700;color:var(--muted)}
.answer ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.cite{font-size:13px;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--paper)}
.warn{border:1.5px solid var(--alert);background:var(--alert-soft);border-radius:12px;padding:10px 12px;font-size:15px}
.stale{border:1.5px dashed var(--gold);background:var(--gold-soft);border-radius:12px;padding:8px 12px;font-size:15px}
.plan{display:flex;flex-direction:column;gap:14px}
.plan h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan ol,.plan ul{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:8px}
.where{display:block;font-size:14px;color:var(--muted)}
.facts{list-style:none;padding:0!important;display:grid;gap:8px}
.facts li{background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
details.sc{display:inline-block;max-width:100%}
details.sc>summary{list-style:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:4px 12px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
details.sc>summary::-webkit-details-marker{display:none}
.scpop{margin-top:6px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);display:flex;flex-direction:column;gap:2px;font-size:14px;overflow-wrap:anywhere}
.src{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.chans{display:flex;flex-wrap:wrap;gap:8px}
.chan{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1.5px solid var(--teal);border-radius:12px;text-decoration:none;background:var(--teal-soft);color:var(--ink);font-weight:700;font-size:15px;max-width:100%;overflow-wrap:anywhere}
span.chan{border-style:dashed;font-weight:400}
.handoff{border-inline-start:4px solid var(--gold);padding:8px 12px;background:var(--gold-soft);border-radius:10px;font-size:15px}
.calc{gap:8px;background:var(--paper)}
.calc .res{font-size:18px;font-weight:700}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:620px){.row{grid-template-columns:1fr 1fr}}
.actbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.actbar{grid-template-columns:repeat(4,minmax(0,1fr))}}
.actbar .btn{width:100%}
.box{background:var(--paper);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.outtext{font-size:15px;line-height:1.5;min-height:200px;white-space:pre-wrap}
.gapcard{border:2px dashed var(--alert);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.eitem{width:100%}
.eitem b{font-size:16px}.eitem .one{font-size:15px;color:var(--muted)}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;cursor:pointer;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
.check input{width:22px;height:22px;accent-color:var(--teal);flex:none;margin:2px 0 0}
.check.done{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:var(--paper);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.stat b{font-size:24px;font-variant-numeric:tabular-nums}.stat span{font-size:14px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.bars li{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center}
.bars i{display:block;height:10px;border-radius:99px;background:var(--teal)}
.trust{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.tour{border:2px solid var(--gold);background:var(--gold-soft)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.toast{position:fixed;inset-inline:12px;bottom:16px;margin:0 auto;max-width:520px;background:var(--ink);color:var(--card);border-radius:14px;padding:12px 16px;font-size:15px;z-index:50;box-shadow:0 6px 24px rgba(0,0,0,.25)}
/* AI panel */
.aipanel{border:2px solid var(--teal)}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.aipanel h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ailist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.airow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.airow.active{border-color:var(--teal);background:var(--teal-soft)}
.ainame{display:flex;flex-direction:column;font-size:15px;min-width:0}
.ainame span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.aiuse,.aihelp{grid-column:1/-1}
.aiuse{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msel{max-width:100%;flex:1 1 220px;font-size:15px;padding:8px 10px;min-height:44px}
.next{background:var(--paper);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.aipanel .pill.done{background:var(--ink);color:var(--card);border-color:transparent}
@media (max-width:480px){.airow{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i="skip"></a>
<main id="main" tabindex="-1">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">و</span><span><span id="brandName">Wadeh · واضح</span><small id="tagline">UAE answers you can check</small></span></div>
    <div class="top-actions">
      <div class="seg" role="group" data-ia="langGroup" aria-label="Language"><button type="button" id="langEn" lang="en" aria-pressed="true">English</button><button type="button" id="langAr" lang="ar" aria-pressed="false">العربية</button></div>
      <button type="button" class="status" id="aiStatus" aria-expanded="false" aria-controls="aiPanel"><span class="dot"></span><span id="aiStatusText">…</span><span class="chev" aria-hidden="true">▾</span></button>
      <button type="button" class="btn ghost iconbtn" id="themeBtn" aria-pressed="false" data-ia="themeLabel" aria-label="Dark screen"></button>
    </div>
  </header>
  <p class="banner" data-i="banner"></p>
  <section class="card aipanel" id="aiPanel" aria-labelledby="aih" hidden></section>
  <nav class="tabs" id="tabs" role="tablist" data-ia="tabsLabel" aria-label="Sections">
    <button type="button" class="tab" role="tab" id="tab-ask" aria-controls="p-ask" aria-selected="true"><span data-i="tAsk"></span></button>
    <button type="button" class="tab" role="tab" id="tab-library" aria-controls="p-library" aria-selected="false" tabindex="-1"><span data-i="tLib"></span></button>
    <button type="button" class="tab" role="tab" id="tab-life" aria-controls="p-life" aria-selected="false" tabindex="-1"><span data-i="tLife"></span></button>
    <button type="button" class="tab" role="tab" id="tab-changes" aria-controls="p-changes" aria-selected="false" tabindex="-1"><span data-i="tChg"></span></button>
    <button type="button" class="tab" role="tab" id="tab-saved" aria-controls="p-saved" aria-selected="false" tabindex="-1"><span data-i="tSaved"></span><span class="cnt" id="savedCnt" hidden></span></button>
    <button type="button" class="tab" role="tab" id="tab-gaps" aria-controls="p-gaps" aria-selected="false" tabindex="-1"><span data-i="tGaps"></span><span class="cnt" id="gapCnt" hidden></span></button>
    <button type="button" class="tab" role="tab" id="tab-how" aria-controls="p-how" aria-selected="false" tabindex="-1"><span data-i="tHow"></span></button>
  </nav>

  <section class="panel" id="p-ask" role="tabpanel" aria-labelledby="tab-ask" tabindex="-1">
    <div id="tourBox"></div>
    <div class="hero">
      <p class="eyebrow" data-i="eyebrow"></p>
      <h1 id="h1" data-i="h1"></h1>
      <p class="lead" data-i="heroP"></p>
    </div>
    <p class="warn" id="noKB" hidden data-i="noKB"></p>
    <form class="card askbox" id="askForm" novalidate>
      <label for="q"><span data-i="askLabel"></span><small data-i="askHint"></small></label>
      <textarea id="q" dir="auto" maxlength="600" rows="3" data-ip="askPh" placeholder=""></textarea>
      <div class="actions"><button type="submit" class="btn teal" id="askBtn" data-i="askBtn"></button><button type="button" class="btn ghost iconbtn" id="micBtn" hidden data-ia="mic" aria-label="Speak"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V22h2v-3.1A7 7 0 0 0 19 12z"/></svg></button><span class="tip" id="micMsg" role="status"></span></div>
      <p class="err" id="askErr" role="alert"></p>
      <div><p class="tip" data-i="tryH"></p><div class="chips" id="chips"></div></div>
    </form>
    <div class="card" id="profileCard"><div id="profileBar"></div></div>
    <section class="card" id="result" aria-labelledby="runH" hidden>
      <h2 id="runH" tabindex="-1" data-i="runH"></h2>
      <p class="asked" id="asked" dir="auto"></p>
      <details class="tracebox" id="traceBox" open><summary data-i="traceH"></summary><ol class="trace" id="traceList" aria-live="polite"></ol></details>
      <div id="runBody" class="plan"></div>
    </section>
    <section class="card" aria-labelledby="topicsH"><h2 id="topicsH" data-i="topicsH"></h2><div class="tiles" id="tiles"></div></section>
    <section class="card" id="homeLife" aria-labelledby="lifeHomeH"><h2 id="lifeHomeH" data-i="lifeHomeH"></h2><div class="jlist" id="homeJourneys"></div></section>
  </section>

  <section class="panel" id="p-library" role="tabpanel" aria-labelledby="tab-library" tabindex="-1" hidden>
    <div class="hero"><h2 data-i="libH"></h2><p class="lead" data-i="libP"></p></div>
    <div id="libView"></div>
  </section>
  <section class="panel" id="p-life" role="tabpanel" aria-labelledby="tab-life" tabindex="-1" hidden>
    <div class="hero"><h2 data-i="lifeH"></h2><p class="lead" data-i="lifeP"></p></div>
    <div id="lifeView"></div>

3/dubai-health","DoH activates 24/7 mental health support hotline 800-SAKINA (725462)","https://www.doh.gov.ae/en/news/doh-activates-247-mental-health-support-hotline-800-sakina-(725462)","Mental Health and Emotional Well-Being (m-health guide)","https://www.ehs.gov.ae/assets/2a4fe0b2/m-health.aspx","The clinic or hospital that treated you","Treating doctor","Employer HR","Attestation of Sick Leaves and Medical Reports","Ministry of Health and Prevention (MOHAP)","https://mohap.gov.ae/en/w/attestation-of-medical-leaves-and-reports","School registrar","School finance office","School; then KHDA online complaint form","KHDA Registration and Refund Policy for all Dubai Private Schools (effective 23 March 2026)","https://web.khda.gov.ae/KHDA/media/KHDA/Registration_and_Refund_Policy_for_all_Dubai_Private_Schools_En_3.pdf","School Registration & Refund Policy for Private Schools in Dubai: FAQs for parents","Knowledge and Human Development Authority (KHDA)","https://web.khda.gov.ae/KHDA/media/KHDA/School-FAQ-s.pdf","Registration and Refund Policy for all Dubai Private Schools","whi.ae, MOHRE app or Business Services and Guidance Centres","DHA-approved insurer","DoH-licensed insurer","Employer (household)","whi.ae or your insurer","Ministry of Human Resources and Emiratisation (MOHRE)","GC 03/2024 Updated Table of Benefits for Essential Benefits Plan","Frequently Asked Questions (Dubai health insurance)","thiqa.ae or the Thiqa app","ifhas.gov.ae; SEHA and other listed centres","Enaya, 800 ENAYA","Abu Dhabi Law No. 23 of 2005 Concerning Health Insurance in the Emirate of Abu Dhabi","https://www.doh.gov.ae/-/media/0BE585B5E6814D81913697DD6E644C02.ashx","Thiqa programme, Government of Abu Dhabi (run with Daman)","Abu Dhabi Public Health Centre calls on Thiqa cardholders to benefit from the IFHAS programme","https://www.doh.gov.ae/en/news/abu-dhabi-public-health-centre-calls-on-thiqa-cardholders-to-benefit-from-the-ifhas-programme","Education authority in the issuing country","Legal translation office","MOE website (online form) or MOE offices in Dubai and Abu Dhabi","MOE website","KHDA website","Equalising high school certificates","UAE Government portal (u.ae)","https://u.ae/en/information-and-services/education/school-education-k-12/equalising-high-school-certificates","Attest School Certificate","https://web.khda.gov.ae/en/Services/Student-Related-Services/Attestation-of-School-Certificate"],"topics":[{"topic":"residency","title":{"en":"Residency, visas and Emirates ID","ar":"الإقامة والتأشيرات والهوية الإماراتية"},"checked":"2026-11-08","entries":[{"id":"residency-grace-period","q":["My residence visa was cancelled or expired. How many days can I stay?","أُلغيت إقامتي أو انتهت. كم يوماً يمكنني البقاء في الدولة؟"],"k":["visa cancelled how many days can i stay","grace period after visa cancellation uae","grace periode after visa cancelation dubai","مهلة السماح بعد إلغاء الإقامة","كم يوم مهلة بعد كنسل الفيزا","لغوا اقامتي كم يوم اقعد","مدة البقاء بعد انتهاء الاقامة"],"a":["ICP's grace period depends on your residence: 180 days for Golden, Green and Blue holders and families, widows or divorcees of residents, students who finished studying and foreign relatives of Emiratis; 90 days for skilled workers (levels 1-3) and property owners; 60 for permits with a guarantor or host; 30 for others. Then the fine is AED 50 a day.","تعتمد مهلة الهيئة على نوع إقامتك: 180 يوماً لحاملي الإقامة الذهبية والخضراء والزرقاء وأسرهم، ولأرامل المقيمين ومطلقاتهم، وللطلاب بعد إنهاء دراستهم، ولأقارب المواطنين من حملة الجوازات الأجنبية؛ و90 يوماً للعمال المهرة (المستويات 1-3) وملاك العقارات؛ و60 يوماً للإقامات الصادرة بكفيل أو مستضيف؛ و30 يوماً لبقية الفئات. وبعدها الغرامة 50 درهماً عن كل يوم."],"w":["resident"],"st":[["Private sector: your employer cancels the MOHRE work permit first. Make sure you get your wages and end-of-service pay.","في القطاع الخاص: يلغي صاحب العمل تصريح العمل لدى الوزارة أولاً. تأكد من استلام أجورك ومكافأة نهاية الخدمة.",0],["Check the end date in your file, then get a new visa, change your status or leave in time.","راجع تاريخ الانتهاء في ملفك، ثم استخرج إقامة جديدة أو عدّل وضعك أو غادر في الموعد.",1],["If you stay longer, pay the fines before you renew or leave.","إذا تجاوزت المهلة، فادفع الغرامات قبل التجديد أو المغادرة.",2]],"f":[["180 days: Golden, Green and Blue holders and families, widows or divorcees of residents, students after studies, foreign relatives of Emiratis.","180 يوماً: حاملو الإقامة الذهبية والخضراء والزرقاء وأسرهم، وأرامل المقيمين ومطلقاتهم، والطلاب بعد الدراسة، وأقارب المواطنين الأجانب.",0],["90 days: skilled workers (levels 1-3) and property owners. 60 days: permits with a guarantor or host. 30 days: all others.","90 يوماً: العمال المهرة (المستويات 1-3) وملاك العقارات. 60 يوماً: الإقامات بكفيل أو مستضيف. 30 يوماً: بقية الفئات.",0],["Staying after the grace period costs AED 50 a day.","البقاء بعد انتهاء المهلة غرامته 50 درهماً عن كل يوم.",0],["GDRFA Dubai's cancellation page gives a 60-day grace period.","تذكر صفحة الإلغاء لدى إقامة دبي مهلة 60 يوماً.",1],["u.ae says dependants get 6 months from expiry or cancellation.","تذكر بوابة u.ae أن للمُعالين 6 أشهر من الانتهاء أو الإلغاء.",2]],"dp":[["visa","Each residence type has its own grace period.","لكل نوع إقامة مهلته الخاصة."],["emirate","Dubai visas follow GDRFA Dubai: its cancellation page says 60 days, its Green visa page 180.","تتبع إقامات دبي إقامة دبي: تذكر صفحة الإلغاء لديها 60 يوماً، وصفحة الإقامة الخضراء 180 يوماً."]],"c":["Official pages differ: ICP's table, GDRFA Dubai's 60 days and u.ae's 6 months for dependants. Go by the date in your own file, or ask ICP or GDRFA Dubai.","الصفحات الرسمية غير متطابقة: جدول الهيئة، و60 يوماً لدى إقامة دبي، و6 أشهر للمُعالين في u.ae. اعتمد على التاريخ في ملفك، أو اسأل الهيئة أو إقامة دبي."],"au":"icp","so":[[3,4,5],[6,7,8],[9,10,11]],"v":1,"h":"wage-guard","cl":{"kind":"deadline","fact":1,"days":[30,60,90,180],"label":{"en":"Last day of your grace period","ar":"آخر يوم في مهلة السماح"},"start":{"en":"Date the visa was cancelled or expired","ar":"تاريخ إلغاء الإقامة أو انتهائها"}}},{"id":"residency-overstay-fines","q":["I overstayed my visa. How much is the fine and how do I settle it?","تجاوزت مدة تأشيرتي. كم الغرامة وكيف أسوّيها؟"],"k":["overstay fine uae per day","visa overstay fine dubai how to pay","overstay fines waiver uae","over stay fine check online","غرامة التأخير على الإقامة","غرامة تجاوز مدة الزيارة","كم غرامة المخالفة باليوم","اعفاء من غرامات الاقامة"],"a":["The fine is AED 50 for each day you stay after your visa or grace period ends, for visit and residence visas alike. Check and pay online, then renew, change your status or leave. In Dubai, if you cannot pay, you can ask GDRFA for an exemption.","الغرامة 50 درهماً عن كل يوم بعد انتهاء التأشيرة أو المهلة، وهي واحدة لتأشيرات الزيارة والإقامة. استعلم عنها وادفعها إلكترونياً، ثم جدّد أو عدّل وضعك أو غادر. وفي دبي، إذا عجزت عن الدفع، يمكنك أن تطلب من إقامة دبي الإعفاء."],"w":["resident","visitor"],"st":[["Check and pay your fines online or at a service centre.","استعلم عن غراماتك وادفعها إلكترونياً أو في مركز خدمة.",12],["Can't pay? In Dubai, ask for an exemption with a letter giving your reasons. The fee is AED 15.75 if your sponsor is a person.","لا تستطيع الدفع؟ في دبي اطلب الإعفاء برسالة توضح أسبابك، والرسوم 15.75 درهماً إذا كان كفيلك فرداً.",13],["After paying, renew, change your status or leave the UAE.","بعد الدفع، جدّد أو عدّل وضعك أو غادر الدولة.",14]],"d":[["Passport copy","صورة جواز السفر"],["For an exemption: a letter giving the reasons and why you can't pay","لطلب الإعفاء: رسالة توضح الأسباب وعدم القدرة على الدفع"]],"f":[["Overstay fine: AED 50 per day for expired or cancelled visas and permits.","غرامة التجاوز: 50 درهماً يومياً للتأشيرات والإقامات المنتهية أو الملغاة.",0],["Dubai exemption request: AED 15.75 fee when the sponsor is an individual.","طلب الإعفاء في دبي: رسوم 15.75 درهماً إذا كان الكفيل فرداً.",1],["ICP's 2026 waiver covered fines from 28 Feb 2026 for people who could not leave because of airspace closures.","شمل إعفاء الهيئة في 2026 الغرامات المترتبة منذ 28 فبراير 2026 على من تعذّر سفرهم بسبب إغلاق الأجواء.",2]],"dp":[["emirate","Dubai files are checked, paid and exempted through GDRFA Dubai; other emirates through ICP.","ملفات دبي يُستعلم عنها وتُدفع غراماتها ويُطلب إعفاؤها عبر إقامة دبي، وبقية الإمارات عبر الهيئة."],["visa","Your grace period, and so the day fines start, depends on your visa type.","تختلف مهلتك، وبالتالي يوم بدء الغرامة، بحسب نوع تأشيرتك."]],"c":["In Dubai, GDRFA's fines committee may ask for more papers; a waiver is not guaranteed. Amnesties come only when ICP or GDRFA announce them. Never pay anyone to clear fines unofficially.","في دبي قد تطلب لجنة الغرامات لدى إقامة دبي مستندات إضافية، والإعفاء غير مضمون. ولا يكون العفو العام إلا بإعلان من الهيئة أو إقامة دبي. لا تدفع لأي شخص لإسقاط الغرامات بطرق غير رسمية."],"au":"icp","so":[[15,4,16],[17,7,18],[19,4,20]],"v":1,"ch":["2026-03","ICP waived overstay fines from 28 Feb 2026 for people stuck by airspace closures. In Jun 2026 it set a final 30-day window to 9 Jul 2026 (reported by WAM); normal fines apply again.","أعفت الهيئة من غرامات التجاوز منذ 28 فبراير 2026 من علقوا بسبب إغلاق الأجواء. وفي يونيو 2026 منحت مهلة أخيرة مدتها 30 يوماً حتى 9 يوليو 2026 (بحسب وام)، فعادت الغرامات المعتادة.",2],"cl":{"kind":"per-day","fact":0,"rate":50,"unit":"AED","label":{"en":"Overstay fine so far","ar":"غرامة التجاوز حتى الآن"},"input":{"en":"Days over the limit","ar":"عدد أيام التجاوز"}}},{"id":"residency-newborn-visa","q":["We had a baby in the UAE. What are the deadlines for the birth certificate and the baby's visa?","رُزقنا بمولود في الإمارات. ما المواعيد النهائية لشهادة الميلاد وإقامة الطفل؟"],"k":["newborn baby visa deadline uae","baby residence visa 120 days","new born visa late fine","birth certificate private hospital dubai","اقامة المولود الجديد كم يوم","مهلة اقامة المولود 120 يوم","اضافة المولود في خلاصة القيد"],"a":["Register the birth within 30 days. Expat parents then have 120 days from the birth to get the birth certificate, passport, Emirates ID and residence visa. After that a daily fine applies, and the baby cannot leave the UAE until it is done. Emirati parents add the baby to the family data with ICP.","سجّل الولادة خلال 30 يوماً. وأمام الوالدين المقيمين 120 يوماً من تاريخ الولادة لاستخراج شهادة الميلاد والجواز والهوية والإقامة. وبعدها تُفرض غرامة يومية، ولا يُسمح للطفل بمغادرة الدولة حتى تنتهي الإجراءات. أما الوالدان المواطنان فيضيفان المولود إلى بيانات الأسرة لدى الهيئة."],"w":["resident","emirati"],"st":[["Get the birth certificate: government hospitals issue it; after a private-hospital birth, apply to MOHAP or your emirate's health authority.","احصل على شهادة الميلاد: تصدرها المستشفيات الحكومية، وبعد الولادة في مستشفى خاص قدّم لدى وزارة الصحة أو الجهة الصحية في إمارتك.",21],["Expats: attest the certificate with MOHAP and MOFA. A DHA or DoH stamp counts as the MOHAP seal.","للمقيمين: صدّق الشهادة لدى وزارة الصحة ووقاية المجتمع ووزارة الخارجية، وختم هيئة الصحة بدبي أو دائرة الصحة بأبوظبي يعادل ختم الوزارة.",22],["Get the baby's passport, then apply for the residence visa and Emirates ID before day 120.","استخرج جواز الطفل، ثم قدّم على إقامته وهويته قبل اليوم 120.",23],["Emiratis: the Mabrouk Ma Yak bundle covers the birth certificate, family data, passport and Emirates ID.","للمواطنين: تشمل باقة «مبروك ما ياك» شهادة الميلاد وبيانات الأسرة والجواز والهوية.",24]],"d":[["Birth notification and parents' passports","إشعار الولادة وجوازا الوالدين"],["Baby's passport and photo","جواز الطفل وصورته"]],"f":[["Residents must register a birth within 30 days.","على المقيمين تسجيل الولادة خلال 30 يوماً.",0],["Expats have 120 days from birth for the certificate, passport, Emirates ID and visa.","للمقيمين 120 يوماً من الولادة لإنهاء الشهادة والجواز والهوية والإقامة.",0],["u.ae: AED 100 per day after the 120 days, and the baby can't leave until it is done.","بحسب u.ae: 100 درهم عن كل يوم بعد 120 يوماً، ولا يغادر الطفل حتى تنتهي الإجراءات.",0],["ICP's fine card lists AED 50 per day for an expired newborn registration.","تذكر بطاقة الغرامات لدى الهيئة 50 درهماً يومياً عن انتهاء مدة تسجيل المولود.",1]],"dp":[["status","Emirati babies are added to the family data and get an Emirates ID and passport; expat babies also need a residence visa.","يُضاف المولود المواطن إلى بيانات الأسرة ويحصل على الهوية والجواز، أما المولود المقيم فيحتاج أيضاً إلى إقامة."],["emirate","Dubai visas go through GDRFA Dubai; other emirates through ICP.","تُعالج إقامات دبي عبر إقامة دبي، وبقية الإمارات عبر الهيئة."],["other","If the parents have different nationalities, the baby takes the father's nationality.","إذا اختلفت جنسية الوالدين، يأخذ الطفل جنسية الأب."]],"c":["Official pages differ on the late visa fine: u.ae says AED 100 a day, ICP's fine card AED 50. Apply early, and ask ICP or GDRFA Dubai for the exact amount.","تختلف الصفحات الرسمية في غرامة تأخر الإقامة: تذكر u.ae مبلغ 100 درهم يومياً، وبطاقة الغرامات لدى الهيئة 50 درهماً. قدّم مبكراً، واسأل الهيئة أو إقامة دبي عن المبلغ الدقيق."],"au":"icp","so":[[25,10,26],[15,4,16]],"v":1,"cl":{"kind":"deadline","fact":1,"days":[30,120],"label":{"en":"Deadline counted from the birth","ar":"الموعد النهائي محسوباً من تاريخ الولادة"},"start":{"en":"Baby's date of birth","ar":"تاريخ ميلاد الطفل"}}},{"id":"residency-emirates-id-renewal","q":["My Emirates ID expired. Is there a fine, and how do I renew it?","انتهت هويتي الإماراتية. هل توجد غرامة، وكيف أجددها؟"],"k":["emirates id renewal fine","emirates id expired grace period","emirates id late fine per day","renew emirates id online icp","emirates id renwal fees","غرامة تأخير تجديد الهوية","تجديد الهوية الاماراتية اونلاين","الهويه منتهيه كم الغرامه"],"a":["You have 30 days after the card expires to renew without a fine. After that, the fine is AED 20 a day, up to AED 1,000. Emiratis can renew in the last year of validity, residents in the last 6 months. Residents renew the ID along with the residence; Dubai residences go through GDRFA Dubai.","لديك 30 يوماً بعد انتهاء البطاقة للتجديد دون غرامة، وبعدها تُفرض غرامة 20 درهماً عن كل يوم وبحد أقصى 1,000 درهم. يستطيع المواطن التجديد في السنة الأخيرة من صلاحية البطاقة، والمقيم في آخر 6 أشهر. ويجدد المقيم هويته مع إقامته، وتُجدَّد إقامات دبي عبر إقامة دبي."],"w":["emirati","resident"],"st":[["Renew on the ICP app or website, or at a typing centre or ICP centre.","جدّد عبر تطبيق الهيئة أو موقعها، أو في مركز طباعة معتمد أو أحد مراكز الهيئة.",27],["Residents: renew the residence and ID together. In Dubai, the residence is renewed with GDRFA Dubai.","للمقيمين: جدّد الإقامة والهوية معاً، وفي دبي تُجدَّد الإقامة لدى إقامة دبي.",28],["Pay the fee: residents AED 100 per year of residence plus AED 100 smart fee; Emiratis AED 100 under 21 (5-year card) or AED 200 from 21 (10-year card).","ادفع الرسوم: المقيم 100 درهم عن كل سنة إقامة و100 درهم للخدمة الذكية، والمواطن 100 درهم دون 21 عاماً (بطاقة 5 سنوات) أو 200 درهم من 21 عاماً (10 سنوات).",29],["The new card comes by approved courier.","تصلك البطاقة الجديدة عبر شركة توصيل معتمدة.",30]],"d":[["Recent photo, different from the one on your current card","صورة شخصية حديثة مختلفة عن صورة البطاقة الحالية"],["Residents: passport valid for at least 3 months","للمقيمين: جواز سفر ساري لمدة 3 أشهر على الأقل"]],"f":[["Grace period: 30 days after expiry; then AED 20 a day, up to AED 1,000.","المهلة 30 يوماً بعد الانتهاء، ثم 20 درهماً يومياً بحد أقصى 1,000 درهم.",0],["Renewal window: last year of validity for Emiratis; last 6 months for residents.","فترة التجديد: السنة الأخيرة من الصلاحية للمواطن، وآخر 6 أشهر للمقيم.",0],["Resident fee: AED 100 per year of residence, plus AED 100 smart service fee.","رسوم المقيم: 100 درهم عن كل سنة إقامة، و100 درهم رسوم الخدمة الذكية.",1],["Emirati fee: AED 100 for a 5-year card (under 21) or AED 200 for a 10-year card (21 and over).","رسوم المواطن: 100 درهم لبطاقة 5 سنوات (دون 21 عاماً) أو 200 درهم لبطاقة 10 سنوات (21 عاماً فأكثر).",1],["The passport must be valid for at least 3 months.","يجب أن يكون الجواز سارياً 3 أشهر على الأقل.",1]],"dp":[["status","Emiratis renew earlier and pay a flat fee; residents pay per year and need a valid residence.","يجدد المواطن مبكراً برسوم ثابتة، ويدفع المقيم عن كل سنة ويحتاج إلى إقامة سارية."],["emirate","Outside Dubai, ICP links the residence and ID renewals; in Dubai the residence goes through GDRFA Dubai.","خارج دبي تربط الهيئة تجديد الإقامة بتجديد الهوية، وفي دبي تُجدَّد الإقامة عبر إقامة دبي."]],"c":["If the delay was not your fault, ask ICP about its 'Request for Exemption from Delay Fees' service; only approved exemption cases qualify.","إذا لم يكن التأخير بسببك، فاسأل الهيئة عن خدمة «طلب الإعفاء من رسوم التأخير»، ولا يُعفى إلا من تشمله قرارات الإعفاء المعتمدة."],"au":"icp","so":[[31,4,32],[33,4,34]],"v":1,"cl":{"kind":"deadline","fact":0,"days":30,"label":{"en":"Last day before the daily fine starts","ar":"آخر يوم قبل بدء الغرامة اليومية"},"start":{"en":"Card expiry date","ar":"تاريخ انتهاء البطاقة"}}},{"id":"residency-sponsor-spouse-children","q":["How much salary do I need to sponsor my wife and children?","كم يجب أن يكون راتبي لأكفل زوجتي وأبنائي؟"],"k":["minimum salary to sponsor family uae","family visa salary 4000","sponsor wife visa dubai requirements","son over 25 visa uae","family visa salery requirment","كم الراتب المطلوب لكفالة العائلة","كفالة الزوجة والعيال اقامة","شروط الاقامة العائلية"],"a":["You need a monthly salary of at least AED 4,000, or AED 3,000 plus housing. You can sponsor your spouse, unmarried daughters, sons under 25 and children with special needs. Their visas are linked to yours: if yours is cancelled, theirs must be too.","تحتاج راتباً شهرياً لا يقل عن 4,000 درهم، أو 3,000 درهم مع سكن. ويمكنك كفالة الزوج أو الزوجة، والبنات غير المتزوجات، والأبناء دون 25 عاماً، والأبناء من أصحاب الهمم. وترتبط إقاماتهم بإقامتك، فإذا أُلغيت إقامتك وجب إلغاء إقاماتهم."],"w":["resident"],"st":[["With the documents below, apply online: through ICP outside Dubai, or GDRFA Dubai for a Dubai visa.","قدّم الطلب إلكترونياً بالمستندات أدناه: عبر الهيئة خارج دبي، أو عبر إقامة دبي لإقامات دبي.",35],["If your family is already in the UAE on a visit visa, ask for a status change (AED 500).","إذا كانت أسرتك داخل الدولة بتأشيرة زيارة، فاطلب تعديل الوضع (500 درهم).",36],["Family members aged 18 and over do a medical test, then everyone gets an Emirates ID.","يجري أفراد الأسرة من عمر 18 عاماً فأكثر الفحص الطبي، ثم يحصل الجميع على الهوية.",37]],"d":[["Passport and photo for each family member","جواز وصورة لكل فرد من الأسرة"],["Attested marriage contract and children's birth certificates","عقد زواج وشهادات ميلاد الأبناء مصدقة"],["Salary certificate or employment contract","شهادة راتب أو عقد عمل"]],"f":[["Salary: at least AED 4,000, or AED 3,000 plus employer housing.","الراتب: 4,000 درهم على الأقل، أو 3,000 درهم مع سكن من صاحب العمل.",0],["Eligible: spouse, unmarried daughters, sons under 25, children with special needs.","المؤهلون: الزوج أو الزوجة، والبنات غير المتزوجات، والأبناء دون 25 عاماً، والأبناء من أصحاب الهمم.",1],["Family members aged 18 and over must pass a medical test.","يجب أن يجتاز أفراد الأسرة من عمر 18 عاماً فأكثر الفحص الطبي.",1],["ICP fees: AED 100 application, AED 100 per year, AED 100 smart service; AED 500 to change status inside the UAE.","رسوم الهيئة: 100 درهم للطلب، و100 درهم عن كل سنة، و100 درهم للخدمة الذكية، و500 درهم لتعديل الوضع داخل الدولة.",0],["Dubai: GDRFA's humanitarian route covers children aged 25 and over (with proof of study or a degree) and sponsors earning under AED 4,000.","دبي: يشمل المسار الإنساني لدى إقامة دبي الأبناء من عمر 25 عاماً فأكثر (بإثبات الدراسة أو التخرج) والكفلاء الذين يقل دخلهم عن 4,000 درهم.",2]],"dp":[["emirate","Dubai visas go through GDRFA Dubai, which has its own fees.","تُعالج إقامات دبي عبر إقامة دبي برسومها الخاصة."],["visa","Golden and Green holders have wider family rights, such as sponsoring older children or relatives.","لحاملي الإقامة الذهبية والخضراء حقوق أوسع، مثل كفالة الأبناء الأكبر سناً أو الأقارب."]],"c":["Sons who turn 25 need another route, such as GDRFA Dubai's humanitarian service. Outside Dubai, ask ICP.","يحتاج الابن الذي يبلغ 25 عاماً إلى مسار آخر، مثل خدمة الحالات الإنسانية لدى إقامة دبي. وخارج دبي اسأل الهيئة."],"au":"icp","so":[[38,4,39],[9,10,11],[40,7,41]],"v":1},{"id":"residency-sponsor-parents","q":["Can I sponsor my parents on a residence visa? What salary do I need?","هل يمكنني كفالة والديّ بإقامة؟ وكم الراتب المطلوب؟"],"k":["sponsor parents visa uae salary","parents residence visa dubai requirements","sponsor mother and father visa","parents visa deposit uae","sponser parents dubai","كفالة الوالدين في الامارات","كم الراتب لكفالة الوالدين","اقامة للام والابو"],"a":["Yes. In Dubai, GDRFA asks for a salary of at least AED 10,000, a tenancy contract that fits the family, and a guarantee of AED 5,000 per request, up to AED 15,000. The permit lasts one year and can be renewed. ICP's card for the other emirates gives no separate parent salary, so confirm with ICP first.","نعم. في دبي تطلب إقامة دبي راتباً لا يقل عن 10,000 درهم، وعقد إيجار يناسب عدد أفراد الأسرة، وضماناً قدره 5,000 درهم لكل طلب بحد أقصى 15,000 درهم. ومدة الإقامة سنة قابلة للتجديد. ولا تذكر بطاقة خدمة الهيئة في الإمارات الأخرى راتباً خاصاً بالوالدين، لذا تأكد من الهيئة أولاً."],"w":["resident"],"st":[["Prepare the documents listed below.","جهّز المستندات المذكورة أدناه.",42],["Apply. In Dubai use GDRFA's humanitarian cases residence service; elsewhere use ICP.","قدّم الطلب: في دبي عبر خدمة إقامة الحالات الإنسانية لدى إقامة دبي، وفي غيرها عبر الهيئة.",43],["After approval, pay the guarantee, then do the medical test and Emirates ID.","بعد الموافقة ادفع الضمان، ثم أجرِ الفحص الطبي واستخرج الهوية.",44]],"d":[["Parents' passport copies","صور جوازات الوالدين"],["Proof of kinship, such as your attested birth certificate","إثبات القرابة، مثل شهادة ميلادك المصدقة"],["Salary certificate or employment contract","شهادة راتب أو عقد عمل"],["Attested tenancy contract that fits the family size","عقد إيجار مصدق يناسب عدد أفراد الأسرة"],["Bank statements for the last 3 months","كشف حساب بنكي لآخر 3 أشهر"]],"f":[["Dubai: salary of at least AED 10,000 to sponsor parents or parents-in-law; the permit lasts one year and is renewable.","دبي: راتب لا يقل عن 10,000 درهم لكفالة الوالدين أو والدي الزوج أو الزوجة، والإقامة سنة واحدة قابلة للتجديد.",0],["Dubai: guarantee of AED 5,000 per request, up to AED 15,000 in total.","دبي: ضمان 5,000 درهم لكل طلب، وبإجمالي لا يتجاوز 15,000 درهم.",0],["ICP: guarantee of AED 5,000 per person in humanitarian cases, up to AED 15,000; proof of kinship is needed.","الهيئة: ضمان 5,000 درهم للفرد في الحالات الإنسانية بحد أقصى 15,000 درهم، ويُشترط إثبات القرابة.",1],["Golden Residence holders can sponsor their parents.","يمكن لحاملي الإقامة الذهبية كفالة والديهم.",2]],"dp":[["emirate","Dubai publishes the AED 10,000 rule; other emirates follow ICP, which lists no separate parent salary.","تنشر دبي شرط 10,000 درهم، وتتبع الإمارات الأخرى الهيئة التي لا تذكر راتباً خاصاً بالوالدين."],["visa","Golden holders can sponsor parents; Green holders can sponsor first-degree relatives.","يمكن لحاملي الإقامة الذهبية كفالة الوالدين، ولحاملي الإقامة الخضراء كفالة الأقارب من الدرجة الأولى."]],"c":["Older guides quote higher salary figures for Dubai, but the current GDRFA page says AED 10,000. Check the service card on the day you apply.","تذكر أدلة قديمة أرقام رواتب أعلى لدبي، لكن صفحة إقامة دبي الحالية تذكر 10,000 درهم. راجع بطاقة الخدمة يوم التقديم."],"au":"icp","so":[[40,7,41],[38,4,39],[45,4,46]],"v":1},{"id":"residency-visit-visa-income","q":["How much must I earn to bring relatives or friends on a visit visa?","كم يجب أن يكون دخلي لأستقدم أقاربي أو أصدقائي بتأشيرة زيارة؟"],"k":["visit visa for parents salary requirement","family visit visa minimum salary uae","sponsor friend visit visa 15000","visit visa for brother sister uae","visit visa sponser salary","كم الراتب لزيارة عائلية","فيزا زيارة للوالدين شروط الراتب","زيارة لصديق كم لازم راتبي"],"a":["Since ICP's September 2025 update, a resident host needs a monthly income of at least AED 4,000 for first-degree relatives, AED 8,000 for second- or third-degree relatives, and AED 15,000 for friends. The visa allows a stay of 30, 60 or 90 days, and the visitor must enter within 60 days of issue.","منذ تحديث الهيئة في سبتمبر 2025، يحتاج المقيم المستضيف إلى دخل شهري لا يقل عن 4,000 درهم للأقارب من الدرجة الأولى، و8,000 درهم للأقارب من الدرجتين الثانية والثالثة، و15,000 درهم للأصدقاء. وتسمح التأشيرة بالبقاء 30 أو 60 أو 90 يوماً، ويجب أن يدخل الزائر خلال 60 يوماً من إصدارها."],"w":["resident"],"st":[["Check the visitor's degree of kinship and your income.","تحقق من درجة قرابة الزائر ومن دخلك.",47],["Apply with the documents below, then pay the fees and the guarantee.","قدّم الطلب بالمستندات أدناه، ثم ادفع الرسوم والضمان.",35],["After the visitor leaves, ask for the guarantee back.","بعد مغادرة الزائر، اطلب استرداد الضمان.",36]],"d":[["Visitor's passport (valid 6 months) and photo","جواز الزائر (ساري 6 أشهر) وصورته"],["Proof of kinship","إثبات القرابة"],["Your proof of income","إثبات دخلك"]],"f":[["Since ICP's 29 Sep 2025 update: AED 4,000 a month for first-degree relatives.","منذ تحديث الهيئة في 29 سبتمبر 2025: 4,000 درهم شهرياً للأقارب من الدرجة الأولى.",0],["AED 8,000 a month for second- or third-degree relatives; AED 15,000 for friends.","8,000 درهم شهرياً للأقارب من الدرجتين الثانية والثالثة، و15,000 درهم للأصدقاء.",0],["Stay of 30, 60 or 90 days; total stay with extensions up to 120 days.","مدة البقاء 30 أو 60 أو 90 يوماً، وبالتمديد حتى 120 يوماً إجمالاً.",1],["Guarantee: AED 1,000 single entry or AED 2,000 multiple entry.","الضمان: 1,000 درهم للدخول الواحد أو 2,000 درهم للدخول المتعدد.",1],["The visitor must enter within 60 days of issue, with a passport valid for 6 months.","يجب أن يدخل الزائر خلال 60 يوماً من الإصدار، بجواز ساري 6 أشهر.",1]],"dp":[["emirate","Hosts in Dubai apply through GDRFA Dubai; others through ICP.","يقدّم المستضيفون في دبي عبر إقامة دبي، والبقية عبر الهيئة."],["other","The degree of kinship sets the income you need.","تحدد درجة القرابة الدخل المطلوب منك."]],"c":["Your proof of kinship must match the relation you claim. If unsure which degree your relative counts as, ask ICP or GDRFA Dubai.","يجب أن يطابق إثبات القرابة الصلة التي تذكرها. وإذا لم تتأكد من درجة قرابة الزائر، فاسأل الهيئة أو إقامة دبي."],"au":"icp","so":[[48,4,49],[50,4,51]],"v":1,"ch":["2025-09","ICP set tiered income rules for visit-visa hosts: AED 4,000 for first-degree relatives, AED 8,000 for second or third degree, AED 15,000 for friends.","حددت الهيئة شروط دخل متدرجة لمستضيفي الزوار: 4,000 درهم للأقارب من الدرجة الأولى، و8,000 درهم للدرجتين الثانية والثالثة، و15,000 درهم للأصدقاء.",0]},{"id":"residency-visit-visa-extend-change","q":["Can I extend my visit visa, or switch to a residence visa without leaving the UAE?","هل يمكنني تمديد تأشيرة الزيارة أو تحويلها إلى إقامة دون مغادرة الدولة؟"],"k":["extend visit visa inside uae","visit visa extension dubai","change visit visa to residence inside country","status change fee uae","visit visa extention","تمديد الزيارة داخل الدولة","تحويل الزيارة الى اقامة بدون خروج","تعديل الوضع داخل الدولة"],"a":["Often yes. ICP can extend a visit visa once or more, but the total stay can't go over 120 days. To move to a residence visa from inside the UAE, your new sponsor applies and pays a status change fee of AED 500. Act before the visa ends, because the overstay fine is AED 50 a day.","غالباً نعم. يمكن للهيئة تمديد تأشيرة الزيارة مرة أو أكثر، على ألا تتجاوز مدة البقاء الإجمالية 120 يوماً. وللتحويل إلى إقامة من داخل الدولة يقدّم كفيلك الجديد الطلب ويدفع رسوم تعديل الوضع وقدرها 500 درهم. تحرّك قبل انتهاء التأشيرة، لأن غرامة التجاوز 50 درهماً عن كل يوم."],"w":["visitor"],"st":[["To extend, your sponsor or host applies before the visa ends.","للتمديد، يقدّم الكفيل أو المستضيف الطلب قبل انتهاء التأشيرة.",52],["To switch to residence, the employer or family sponsor applies for the residence and a change of status.","للتحويل إلى إقامة، يقدّم صاحب العمل أو كفيل الأسرة طلب الإقامة وتعديل الوضع.",53],["Do the medical test and apply for the Emirates ID.","أجرِ الفحص الطبي وقدّم على الهوية.",37]],"d":[["Passport","جواز السفر"],["For residence: employment contract or proof of kinship","للإقامة: عقد العمل أو إثبات القرابة"]],"f":[["Visit visas are for 30, 60 or 90 days; ICP may extend them once or more, up to 120 days in total.","تأشيرات الزيارة لمدة 30 أو 60 أو 90 يوماً، ويجوز للهيئة تمديدها مرة أو أكثر حتى 120 يوماً إجمالاً.",0],["Change of status inside the UAE: AED 500.","تعديل الوضع داخل الدولة: 500 درهم.",1],["Overstay or expired entry visa: AED 50 per day.","تجاوز المدة أو انتهاء تأشيرة الدخول: 50 درهماً يومياً.",0]],"dp":[["visa","Limits differ by visa type, such as a standard visit, the 5-year tourist visa or other entry permits.","تختلف الحدود بحسب نوع التأشيرة، مثل الزيارة العادية أو السياحية لـ5 سنوات أو تصاريح الدخول الأخرى."],["emirate","Dubai-issued visas are extended through GDRFA Dubai; others through ICP.","تُمدَّد تأشيرات دبي عبر إقامة دبي، وغيرها عبر الهيئة."],["sector","Private-sector jobs need a MOHRE work permit before the residence.","تحتاج وظائف القطاع الخاص إلى تصريح عمل من وزارة الموارد البشرية والتوطين قبل الإقامة."]],"c":["Extensions are up to the authority. Don't count on a grace period after a visit visa ends; fines start once it expires.","التمديد يخضع لتقدير الجهة المختصة. لا تعتمد على وجود مهلة بعد انتهاء تأشيرة الزيارة، فالغرامات تبدأ عند انتهائها."],"au":"icp","so":[[50,4,51],[38,4,39],[48,4,49]],"v":1,"ch":["2025-09","ICP updated the conditions, durations and extension rules of visit visas and added four new visit categories.","حدّثت الهيئة شروط تأشيرات الزيارة ومددها وقواعد تمديدها، وأضافت أربع فئات زيارة جديدة.",2]},{"id":"residency-golden-visa","q":["Do I qualify for the Golden Visa, and how do I apply?","هل أستحق الإقامة الذهبية، وكيف أقدّم عليها؟"],"k":["golden visa eligibility uae","golden visa requirements 2026","golden visa property 2 million","golden visa salary 30000","golden visa elegibility check","شروط الاقامة الذهبية","كيف احصل على الاقامة الذهبية","الفيزا الذهبية للعقار"],"a":["The Golden Visa is a 10-year residence that renews and needs no sponsor. Main routes: property or investments worth AED 2 million, professionals with a degree earning AED 30,000 a month, entrepreneurs, top students, exceptional talents and humanitarian pioneers. Holders can sponsor their spouse, children of any age and parents. Check your eligibility with ICP first.","الإقامة الذهبية إقامة لمدة 10 سنوات تتجدد ولا تحتاج كفيلاً. أبرز مساراتها: عقار أو استثمارات بقيمة 2 مليون درهم، والمهنيون من حملة البكالوريوس براتب 30,000 درهم شهرياً، ورواد الأعمال، والطلبة المتفوقون، وأصحاب المواهب الاستثنائية، ورواد العمل الإنساني. ويمكن لحاملها كفالة الزوج أو الزوجة والأبناء دون حد للعمر والوالدين. تحقق من أهليتك لدى الهيئة أولاً."],"w":["resident","visitor","business"],"st":[["Pick your category and check that you meet its rules.","حدّد فئتك وتحقق من استيفاء شروطها.",54],["Gather proof: title deeds, salary certificate, attested degree or recommendation letters.","اجمع الإثباتات: سندات الملكية، أو شهادة الراتب، أو الشهادة الجامعية المصدقة، أو خطابات التوصية.",55],["Apply through ICP, or GDRFA Dubai if you live in Dubai. Some talent and scientist routes need a recommendation from the relevant authority.","قدّم عبر الهيئة، أو عبر إقامة دبي إن كنت في دبي. وتحتاج بعض مسارات المواهب والعلماء إلى توصية من الجهة المختصة.",14],["If you are abroad, ICP gives a 6-month multiple-entry visa to finish the process.","إذا كنت خارج الدولة، تمنحك الهيئة تأشيرة دخول متعدد لمدة 6 أشهر لإكمال الإجراءات.",4]],"d":[["Passport and photo","جواز السفر وصورة شخصية"],["Proof for your category, such as title deeds or a salary certificate","إثبات خاص بفئتك، مثل سندات الملكية أو شهادة الراتب"],["Attested degree, for professionals and graduates","شهادة جامعية مصدقة للمهنيين والخريجين"]],"f":[["Golden Residence lasts 10 years, renews automatically and needs no sponsor.","مدة الإقامة الذهبية 10 سنوات، وتتجدد تلقائياً، ولا تحتاج كفيلاً.",0],["Property or investment route: at least AED 2 million; property can be off-plan from an approved developer or financed by an approved local bank.","مسار العقار أو الاستثمار: 2 مليون درهم على الأقل، ويجوز أن يكون العقار على الخريطة من مطور معتمد أو ممولاً من بنك محلي معتمد.",0],["Specialised professionals: bachelor's degree, MOHRE level 1 or 2, and AED 30,000 monthly salary.","المهنيون المتخصصون: بكالوريوس، والمستوى المهني 1 أو 2 لدى الوزارة، وراتب شهري 30,000 درهم.",0],["Applicants abroad get a 6-month multiple-entry visa, renewable for 6 more months.","يحصل المتقدمون من الخارج على تأشيرة دخول متعدد لمدة 6 أشهر، قابلة للتجديد 6 أشهر أخرى.",0],["u.ae still lists 5-year terms for some categories, such as real estate investors.","ما زالت u.ae تذكر مدة 5 سنوات لبعض الفئات، مثل المستثمرين العقاريين.",1]],"dp":[["emirate","Dubai residents apply via GDRFA Dubai; others via ICP.","يقدّم سكان دبي عبر إقامة دبي، والبقية عبر الهيئة."]],"c":["Some u.ae pages still show 5-year terms; ICP's guide says 10 years. Apply only through official channels, and be wary of anyone who 'guarantees' a Golden Visa for a fee.","ما زالت بعض صفحات u.ae تذكر مدة 5 سنوات، بينما يذكر دليل الهيئة 10 سنوات. قدّم عبر القنوات الرسمية فقط، واحذر ممن «يضمن» لك الإقامة الذهبية مقابل مبلغ."],"au":"icp","so":[[45,4,46],[56,10,57]],"v":1},{"id":"residency-green-visa","q":["What is the Green Visa, and do I qualify?","ما الإقامة الخضراء، وهل أستحقها؟"],"k":["green visa uae requirements","green visa freelancer income","green visa salary 15000","self sponsored visa uae 5 years","green visa eligiblity","شروط الاقامة الخضراء","الاقامة الخضراء للعمل الحر","فيزا خضراء راتب 15 الف"],"a":["The Green Visa is a renewable 5-year residence you sponsor yourself. Skilled employees need a bachelor's degree, MOHRE skill level 1-3 and a salary of at least AED 15,000 a month. Freelancers need a MOHRE freelance permit, a degree or specialised diploma, and AED 360,000 a year from freelancing over the past two years, or proof of solvency. Investors and partners can also apply.","الإقامة الخضراء إقامة قابلة للتجديد لمدة 5 سنوات بكفالة ذاتية. يحتاج الموظف الماهر إلى بكالوريوس، ومستوى مهني من 1 إلى 3 لدى وزارة الموارد البشرية والتوطين، وراتب شهري لا يقل عن 15,000 درهم. ويحتاج المستقل إلى تصريح عمل حر من الوزارة، وبكالوريوس أو دبلوم متخصص، ودخل من العمل الحر قدره 360,000 درهم سنوياً خلال السنتين السابقتين، أو إثبات الملاءة المالية. ويمكن للمستثمرين والشركاء التقديم أيضاً."],"w":["resident","visitor","business"],"st":[["Employees: check your MOHRE skill level and contract salary.","للموظفين: تحقق من مستواك المهني لدى الوزارة ومن راتب عقدك.",58],["Freelancers: get a MOHRE freelance permit first.","للمستقلين: احصل أولاً على تصريح عمل حر من وزارة الموارد البشرية والتوطين.",0],["Apply for the Green Residence. In Dubai, use GDRFA Dubai.","قدّم على الإقامة الخضراء، وفي دبي عبر إقامة دبي.",35],["Do the medical test and get your Emirates ID.","أجرِ الفحص الطبي واستخرج الهوية.",37]],"d":[["Valid passport and photo","جواز سفر ساري وصورة شخصية"],["Attested degree or specialised diploma","شهادة جامعية أو دبلوم متخصص مصدق"],["Salary certificate and contract (employees), or freelance permit and bank statements (freelancers)","شهادة الراتب والعقد (للموظفين)، أو تصريح العمل الحر وكشوف الحساب (للمستقلين)"]],"f":[["Green Residence lasts 5 years, can be renewed, and needs no sponsor.","مدة الإقامة الخضراء 5 سنوات، وقابلة للتجديد، ولا تحتاج كفيلاً.",0],["Skilled workers: MOHRE level 1-3, bachelor's degree, AED 15,000 monthly salary.","العمال المهرة: المستوى 1-3 لدى الوزارة، وبكالوريوس، وراتب شهري 15,000 درهم.",0],["Freelancers: AED 360,000 a year from freelancing over the previous two years, or proof of financial solvency.","المستقلون: دخل من العمل الحر لا يقل عن 360,000 درهم سنوياً خلال السنتين السابقتين، أو إثبات الملاءة المالية.",0],["Grace period after the permit ends: 180 days.","المهلة بعد انتهاء الإقامة: 180 يوماً.",1],["ICP fees: AED 100 a year, plus AED 100 application and AED 100 smart fees; investors put in at least AED 1,000,000 in cash.","رسوم الهيئة: 100 درهم عن كل سنة، و100 درهم للطلب و100 درهم للخدمة الذكية، ومساهمة المستثمر 1,000,000 درهم نقداً على الأقل.",2]],"dp":[["visa","Employees, freelancers and investors each need different proof.","يحتاج كل من الموظفين والمستقلين والمستثمرين إلى إثباتات مختلفة."],["emirate","Dubai applications go through GDRFA Dubai, with Dubai fees.","تُقدَّم طلبات دبي عبر إقامة دبي وبرسومها."]],"c":["Investors need proof of investment and licences. ICP's guide sets no amount, but its service card says AED 1,000,000 in cash; confirm with ICP.","يحتاج المستثمر إلى إثبات الاستثمار والتراخيص. لا يحدد دليل الهيئة مبلغاً، لكن بطاقة الخدمة لديها تذكر 1,000,000 درهم نقداً، فتأكد من الهيئة."],"au":"icp","so":[[59,4,60],[61,7,62],[38,4,39]],"v":1},{"id":"residency-retirement-visa","q":["I'm retiring. Can I keep living in the UAE on a retirement visa?","سأتقاعد. هل يمكنني البقاء في الإمارات بتأشيرة تقاعد؟"],"k":["retirement visa uae requirements","retired expat visa dubai 55","retirement visa income per month","retiree visa property 1 million","retirment visa uae","تأشيرة التقاعد في الامارات","شروط اقامة المتقاعدين","اقامة متقاعد فوق 55"],"a":["Yes. The retirement visa lasts 5 years and can be renewed. ICP asks for 15 years of work or age 55, plus property worth AED 1 million, a deposit of AED 1 million, or yearly income of AED 240,000. GDRFA Dubai asks for both 15 years of work and age 55.","نعم. مدة تأشيرة التقاعد 5 سنوات قابلة للتجديد. تشترط الهيئة 15 سنة عمل أو بلوغ 55 عاماً، مع عقار بقيمة 1 مليون درهم، أو وديعة بقيمة 1 مليون درهم، أو دخل سنوي قدره 240,000 درهم. أما إقامة دبي فتشترط 15 سنة عمل وبلوغ 55 عاماً معاً."],"w":["resident","visitor"],"st":[["Gather proof for your route: title deed, deposit certificate or 6 months of bank statements.","اجمع إثبات مسارك: سند الملكية أو شهادة الوديعة أو كشف حساب لآخر 6 أشهر.",63],["Apply online.","قدّم الطلب إلكترونياً.",64],["Deposit route: move the money to a UAE financial institution within 60 days of the visa being issued.","مسار الوديعة: حوّل المبلغ إلى مؤسسة مالية في الدولة خلال 60 يوماً من إصدار الإقامة.",65],["Do the medical test and get your Emirates ID.","أجرِ الفحص الطبي واستخرج الهوية.",37]],"d":[["Passport and photo","جواز السفر وصورة شخصية"],["Title deed or valuation, or deposit certificate with proof of transfer","سند الملكية أو التقييم، أو شهادة الوديعة مع إثبات التحويل"],["Income route: 6 months of bank statements and an official letter on the income source","مسار الدخل: كشف حساب لـ6 أشهر وخطاب رسمي يوضح مصدر الدخل"]],"f":[["Retirement visa: 5 years, renewable on the same terms.","تأشيرة التقاعد: 5 سنوات، قابلة للتجديد بالشروط نفسها.",0],["ICP: at least 15 years of work, or age 55.","الهيئة: 15 سنة عمل على الأقل، أو بلوغ 55 عاماً.",1],["GDRFA Dubai: at least 15 years of work and age 55.","إقامة دبي: 15 سنة عمل على الأقل وبلوغ 55 عاماً.",0],["Property or deposit of AED 1 million (deposit made within 60 days of issue), or yearly income of AED 240,000 with 6 months of bank statements.","عقار أو وديعة بقيمة 1 مليون درهم (تُودع خلال 60 يوماً من الإصدار)، أو دخل سنوي 240,000 درهم مع كشف حساب لـ6 أشهر.",1],["u.ae: 15 years of work and age 55; yearly income of AED 180,000 in general and AED 240,000 in Dubai.","بحسب u.ae: 15 سنة عمل وبلوغ 55 عاماً، ودخل سنوي 180,000 درهم بشكل عام و240,000 درهم في دبي.",2]],"dp":[["emirate","Dubai requires both the age and work-years conditions; ICP accepts either.","تشترط دبي العمر وسنوات الخدمة معاً، وتقبل الهيئة أحدهما."],["salary","Your pension or other fixed income must reach the yearly minimum.","يجب أن يبلغ معاشك أو دخلك الثابت الحد الأدنى السنوي."],["other","In Dubai, a mortgaged home counts only if the amount already paid meets the minimum.","في دبي، لا يُحتسب العقار المرهون إلا إذا بلغ المبلغ المسدد الحد الأدنى."]],"c":["Official pages differ outside Dubai: u.ae says AED 180,000 income and both conditions; ICP says AED 240,000 and either condition. Confirm with ICP first.","تختلف الصفحات الرسمية خارج دبي: تذكر u.ae دخلاً قدره 180,000 درهم والشرطين معاً، وتذكر الهيئة 240,000 درهم وأحد الشرطين. تأكد من الهيئة أولاً."],"au":"icp","so":[[66,7,67],[38,4,39],[68,10,69]],"v":1},{"id":"residency-outside-6-months","q":["I've been outside the UAE for more than 6 months. Is my residence cancelled, and how do I come back?","بقيت خارج الإمارات أكثر من 6 أشهر. هل أُلغيت إقامتي، وكيف أعود؟"],"k":["outside uae more than 6 months visa","re-entry permit uae 180 days","return permit resident abroad 6 months","residence cancelled while outside country","reentry permit uae fee","البقاء خارج الدولة اكثر من 6 شهور","تصريح دخول بعد 6 أشهر خارج الدولة","طلعت برا الامارات 6 شهور شو يصير بالاقامة"],"a":["Usually yes: a residence visa is cancelled after more than 180 days in a row abroad. If it is still valid and you have a good reason, ICP can give you a permit to return. The fine is AED 100 for every 30 days or less abroad, and you must enter within 30 days of approval. Golden, Green and Blue holders don't need it.","غالباً نعم: تُلغى الإقامة بعد البقاء خارج الدولة أكثر من 180 يوماً متواصلة. وإذا كانت ما زالت سارية ولديك سبب مقبول، يمكن للهيئة أن تمنحك تصريحاً بالعودة. والغرامة 100 درهم عن كل 30 يوماً أو أقل في الخارج، ويجب أن تدخل خلال 30 يوماً من الموافقة. ولا يحتاج إليه حاملو الإقامة الذهبية والخضراء والزرقاء."],"w":["resident"],"st":[["If your residence is still valid, apply from outside the UAE after day 180, with more than 30 days left on it. Upload proof of why you stayed away.","إذا كانت إقامتك سارية، فقدّم من خارج الدولة بعد اليوم 180، على أن يتبقى فيها أكثر من 30 يوماً، وارفع ما يثبت سبب بقائك في الخارج.",27],["Pay the fees and enter within 30 days of approval.","ادفع الرسوم وادخل خلال 30 يوماً من الموافقة.",70],["Dubai visa? ICP's service doesn't cover Dubai; ask GDRFA Dubai or an Amer centre how to return.","إقامتك صادرة من دبي؟ خدمة الهيئة لا تشمل دبي، فاسأل إقامة دبي أو أحد مراكز آمر عن طريقة العودة.",71]],"d":[["Passport and residence details","جواز السفر وبيانات الإقامة"],["Proof of the reason for staying outside more than 6 months","إثبات سبب البقاء في الخارج أكثر من 6 أشهر"]],"f":[["More than 180 days in a row outside the UAE cancels a residence visa.","البقاء خارج الدولة أكثر من 180 يوماً متواصلة يلغي الإقامة.",0],["Apply from abroad after 180 days, while the residence has more than 30 days left.","التقديم من الخارج بعد 180 يوماً، مع بقاء أكثر من 30 يوماً في الإقامة.",1],["Fees: AED 100 for every 30 days or less spent outside, plus AED 100 smart service fee.","الرسوم: 100 درهم عن كل 30 يوماً أو أقل في الخارج، و100 درهم للخدمة الذكية.",1],["After approval, you must enter within 30 days.","بعد الموافقة يجب الدخول خلال 30 يوماً.",1],["Golden, Green and Blue holders, and a husband sponsored by his Emirati wife, can enter any time while the residence is valid.","يمكن لحاملي الإقامة الذهبية والخضراء والزرقاء، وللزوج المكفول من زوجته المواطنة، الدخول في أي وقت ما دامت الإقامة سارية.",1]],"dp":[["visa","Golden, Green and Blue holders are exempt.","حاملو الإقامة الذهبية والخضراء والزرقاء معفون."],["emirate","Dubai-issued residence goes through GDRFA Dubai, not ICP.","إقامات دبي تُعالج عبر إقامة دبي لا عبر الهيئة."],["status","Some groups keep their visa longer, such as foreign wives of Emiratis, students abroad and patients treated abroad.","تحتفظ بعض الفئات بإقامتها مدة أطول، مثل الزوجات الأجنبيات للمواطنين والطلاب في الخارج والمرضى المعالَجين في الخارج."]],"c":["If your residence has already expired, this permit won't help; you need a new entry permit and visa. Approval depends on your reason. Dubai residents: check with GDRFA Dubai.","إذا انتهت إقامتك فعلاً فلن يفيدك هذا التصريح، وستحتاج إلى تصريح دخول وإقامة جديدين. وتعتمد الموافقة على سببك. ولسكان دبي: راجعوا إقامة دبي."],"au":"icp","so":[[72,10,73],[74,4,75]],"v":1,"cl":{"kind":"deadline","fact":0,"days":180,"label":{"en":"Day 180 outside the UAE","ar":"اليوم 180 خارج الدولة"},"start":{"en":"Date you left the UAE","ar":"تاريخ مغادرتك الدولة"}}},{"id":"residency-widow-divorced","q":["My husband died or we divorced. Can I stay in the UAE without a sponsor?","توفي زوجي أو تطلقنا. هل يمكنني البقاء في الإمارات دون كفيل؟"],"k":["visa for divorced woman uae","widow residence visa uae","visa after divorce dubai wife","can i stay in uae after divorce","divorce visa uae women","اقامة المطلقة في الامارات","اقامة الارملة بدون كفيل","بعد الطلاق كيف اطلع اقامة"],"a":["Yes. A foreign widow or divorced woman can get a one-year residence extension without a new sponsor, renewable once. Her children are included if they were on the husband's visa. Apply within six months, with proof of housing and income.","نعم. يمكن للأرملة أو المطلقة الأجنبية الحصول على تمديد لإقامتها لمدة سنة دون كفيل جديد، قابل للتجديد مرة واحدة. ويشمل ذلك أبناءها إذا كانوا على إقامة الزوج. قدّمي خلال ستة أشهر، مع إثبات السكن والدخل."],"w":["resident"],"st":[["Apply within six months, from inside the UAE, with proof of housing and income. Your visa must have been valid at the death or divorce.","قدّمي خلال ستة أشهر وأنتِ داخل الدولة، مع إثبات السكن والدخل، ويجب أن تكون إقامتك سارية وقت الوفاة أو الطلاق.",76],["Add your children if you have custody. Their visas are linked to yours.","أضيفي أبناءك إذا كانت لك الحضانة، وترتبط إقاماتهم بإقامتك.",36],["Before it ends, renew it or move to another visa, such as a work visa.","قبل انتهائها جدّديها أو انتقلي إلى إقامة أخرى مثل إقامة العمل.",36]],"d":[["Passport, photo, and death certificate or divorce document","جواز السفر وصورة شخصية وشهادة الوفاة أو وثيقة الطلاق"],["Proof of housing and of income","إثبات السكن والدخل"],["Children's birth certificates and custody papers","شهادات ميلاد الأبناء وأوراق الحضانة"]],"f":[["u.ae: a one-year extension from the death or divorce, renewable once, with no new sponsor.","بحسب u.ae: تمديد لمدة سنة من تاريخ الوفاة أو الطلاق، قابل للتجديد مرة واحدة، دون كفيل جديد.",0],["ICP: the residence can be issued within 6 months of the death or divorce, if she shows housing and income.","الهيئة: يجوز إصدار الإقامة خلال 6 أشهر من الوفاة أو الطلاق، مع إثبات السكن والقدرة المالية.",1],["Dubai: GDRFA can issue a one-year permit within 6 months; renewal goes to a committee.","دبي: يمكن لإقامة دبي إصدار إقامة لمدة سنة خلال 6 أشهر، ويُحال التجديد إلى لجنة مختصة.",2]],"dp":[["status","If the husband was Emirati, a widow or divorcee without children can also apply.","إذا كان الزوج مواطناً، يمكن أيضاً للأرملة أو المطلقة التي ليس لها أبناء التقديم."],["emirate","In Dubai, apply through GDRFA's humanitarian cases service.","في دبي، قدّمي عبر خدمة الحالات الإنسانية لدى إقامة دبي."]],"c":["Pages differ on renewal: u.ae says once, ICP a similar period for valid reasons, and Dubai a committee decision. Custody disputes go to a committee. Ask ICP or GDRFA Dubai.","تختلف الصفحات في التجديد: تذكر u.ae مرة واحدة، والهيئة مدة مماثلة لأسباب مقبولة، ودبي قرار لجنة. وتفصل لجنة في نزاعات الحضانة. اسألي الهيئة أو إقامة دبي."],"au":"icp","so":[[72,10,73],[48,4,49],[40,7,41]],"v":1,"ch":["2025-09","ICP's decision covered custodial widows or divorcees of foreign husbands and their children, if they apply within 6 months.","شمل قرار الهيئة الأرامل والمطلقات الحاضنات لأزواج أجانب وأبناءهن، إذا قدّمن خلال 6 أشهر.",1]},{"id":"residency-emirati-foreign-family","q":["I'm Emirati. How do I get residence for my foreign wife, husband, children or parents?","أنا مواطن. كيف أستخرج إقامة لزوجتي أو زوجي أو أبنائي أو والديّ من حملة الجوازات الأجنبية؟"],"k":["emirati sponsor foreign wife visa","uae national foreign husband residence","residence for foreign wife of emirati","citizen family residence 5 years","اقامة الزوجة الاجنبية للمواطن","كفالة الزوج الاجنبي للمواطنة","اقامة ام مواطن اجنبية","اقامه زوجه مواطن"],"a":["An Emirati can sponsor a foreign-passport spouse, parent or child for a 5-year residence, and they don't need a job. A foreign widowed or divorced mother of an Emirati can be sponsored by her oldest child. A foreign wife of an Emirati keeps her residence even after more than 180 days abroad.","يمكن للمواطن كفالة زوجه أو زوجته أو والديه أو أبنائه من حملة الجوازات الأجنبية بإقامة لمدة 5 سنوات دون الحاجة إلى عمل. ويمكن لأكبر الأبناء كفالة أمه الأجنبية الأرملة أو المطلقة. وتحتفظ الزوجة الأجنبية للمواطن بإقامتها حتى لو بقيت خارج الدولة أكثر من 180 يوماً."],"w":["emirati"],"st":[["Prepare the passport, photo and proof of the relation: attested marriage contract, birth certificates or proof of kinship.","جهّز الجواز والصورة وإثبات صلة القرابة: عقد زواج مصدق، أو شهادات ميلاد، أو إثبات قرابة.",77],["Apply online, or through GDRFA Dubai if you live in Dubai.","قدّم إلكترونياً، أو عبر إقامة دبي إذا كنت في دبي.",35],["Your relative does the medical test and gets an Emirates ID.","يجري قريبك الفحص الطبي ويحصل على الهوية.",37]],"d":[["Passport and photo","جواز السفر وصورة شخصية"],["Attested marriage contract (spouse)","عقد زواج مصدق (للزوج أو الزوجة)"],["Birth certificates (children)","شهادات الميلاد (للأبناء)"],["Proof of kinship (parents)","إثبات القرابة (للوالدين)"]],"f":[["A citizen's foreign-passport spouse, parent or child can get a 5-year residence without working.","يمكن لزوج المواطن أو زوجته أو والديه أو أبنائه من حملة الجوازات الأجنبية الحصول على إقامة 5 سنوات دون عمل.",0],["A foreign widowed or divorced mother of a citizen can be sponsored by her oldest child.","يمكن لأكبر الأبناء المواطنين كفالة أمه الأجنبية الأرملة أو المطلقة.",0],["Foreign wives of Emiratis are exempt from the rule that cancels residence after 180 days abroad.","الزوجات الأجنبيات للمواطنين مستثنيات من قاعدة إلغاء الإقامة بعد 180 يوماً خارج الدولة.",1],["A husband sponsored by his Emirati wife can enter at any time after 6 months abroad while his residence is valid.","يمكن للزوج المكفول من زوجته المواطنة الدخول في أي وقت بعد 6 أشهر في الخارج ما دامت إقامته سارية.",2]],"dp":[["other","The documents depend on the relation: spouse, child or parent.","تعتمد المستندات على صلة القرابة: زوج أو ابن أو والد."],["emirate","Dubai residents apply through GDRFA Dubai; others through ICP.","يقدّم سكان دبي عبر إقامة دبي، والبقية عبر الهيئة."]],"c":["Fees and extra documents vary by case. Check the ICP or GDRFA Dubai service card before you apply.","تختلف الرسوم والمستندات الإضافية بحسب الحالة. راجع بطاقة الخدمة لدى الهيئة أو إقامة دبي قبل التقديم."],"au":"icp","so":[[78,10,11],[72,10,73],[74,4,75]],"v":1},{"id":"residency-domestic-worker","q":["How do I sponsor a housemaid or nanny, and what income do I need?","كيف أكفل عاملة منزلية أو مربية، وما الدخل المطلوب؟"],"k":["sponsor maid visa uae requirements","housemaid visa salary requirement","nanny visa dubai how to","domestic worker work permit mohre","maid visa sponsership","كفالة خادمة في الامارات","شروط استقدام عاملة منزلية","كم الراتب لكفالة شغالة"],"a":["First get a MOHRE work permit for the worker, then the residence and Emirates ID. Emiratis apply with a valid Emirates ID. Expat residents need a family income of at least AED 25,000 on a recent salary certificate. The worker must be 18 to 60, and expat sponsors pay ICP a AED 5,000 guarantee for each year of residence.","احصل أولاً على تصريح عمل للعامل من وزارة الموارد البشرية والتوطين، ثم على الإقامة والهوية. يقدّم المواطن بهوية إماراتية سارية. ويحتاج المقيم إلى دخل للأسرة لا يقل عن 25,000 درهم بموجب شهادة راتب حديثة. ويجب أن يكون عمر العامل بين 18 و60 عاماً، ويدفع الكفيل المقيم للهيئة ضماناً قدره 5,000 درهم عن كل سنة إقامة."],"w":["emirati","resident"],"s":["domestic"],"st":[["Apply for the work permit through an approved service centre or MOHRE's app or website. It takes about 2 working days.","قدّم طلب تصريح العمل عبر مركز خدمة معتمد أو تطبيق الوزارة أو موقعها، ويستغرق نحو يومي عمل (2).",79],["Keep a domestic worker insurance policy on your file.","احتفظ بوثيقة تأمين للعامل المساعد على ملفك.",0],["After the worker arrives, finish the medical test, residence and Emirates ID within 60 days of entry.","بعد وصول العامل، أنهِ الفحص الطبي والإقامة والهوية خلال 60 يوماً من دخوله.",80]],"d":[["Your passport copy and Emirates ID","صورة جوازك وهويتك الإماراتية"],["Residents: salary certificate, marriage proof and housing contract; investors: 3-month bank statement","للمقيم: شهادة راتب وإثبات الزواج وعقد السكن، وللمستثمر: كشف حساب لـ3 أشهر"],["Worker's passport copy and colour photo","صورة جواز العامل وصورة شخصية ملونة"]],"f":[["Resident sponsors: family income of at least AED 25,000; investors: AED 25,000 a month with 3 months of bank statements.","الكفيل المقيم: دخل أسرة لا يقل عن 25,000 درهم، والمستثمر: 25,000 درهم شهرياً مع كشف حساب لـ3 أشهر.",0],["Worker age: 18 to 60; over 60 only if already in the UAE and cancelled by a domestic employer within 3 months.","عمر العامل: من 18 إلى 60 عاماً، وفوق 60 فقط إذا كان داخل الدولة وألغى إقامته صاحب عمل منزلي خلال 3 أشهر.",0],["Work permit: 2 years for Emiratis, GCC citizens and diplomats; 1 or 2 years for Golden holders; 1 year for residents. Issued in 2 working days.","تصريح العمل: سنتان (2) للمواطن والخليجي والدبلوماسي، وسنة أو سنتان (1 أو 2) لحامل الإقامة الذهبية، وسنة واحدة (1) للمقيم، ويصدر خلال يومي عمل (2).",0],["Expat sponsors: AED 5,000 recruitment guarantee per year; the residence must be done within 60 days of entry.","الكفيل المقيم: ضمان استقدام 5,000 درهم عن كل سنة، ويجب إنهاء الإقامة خلال 60 يوماً من الدخول.",1]],"dp":[["status","Emiratis show a valid Emirates ID and get a 2-year permit; residents must meet the income rule.","يقدّم المواطن هوية سارية ويحصل على تصريح لسنتين (2)، ويجب على المقيم استيفاء شرط الدخل."],["emirate","MOHRE lists separate fees for Dubai, and Dubai residence goes through GDRFA Dubai.","تخصص الوزارة جدول رسوم مستقلاً لدبي، وتُعالج إقامة دبي عبر إقامة دبي."]],"c":["Check the current fee table on MOHRE's service card for your emirate. Applying on the website or app avoids service centre commission.","راجع جدول الرسوم الحالي في بطاقة خدمة الوزارة لإمارتك. والتقديم عبر الموقع أو التطبيق يجنبك عمولة مركز الخدمة."],"au":"mohre","so":[[81,0,82],[38,4,39]],"v":1}]},{"topic":"work","title":{ until it ends. You can leave sooner only if your employer agrees; otherwise, the side that cuts the notice short pays the other the wage for the missing days. Probation has its own rules.","قدّم إشعاراً كتابياً بحسب عقدك، ومدته قانوناً 30 يوماً على الأقل و90 يوماً على الأكثر. وتواصل العمل بأجر كامل حتى نهايته. ولا يجوز لك المغادرة قبل ذلك إلا بموافقة صاحب العمل، وإلا دفع الطرف الذي قصّر في الإشعار للطرف الآخر أجر الأيام المتبقية. ولفترة التجربة قواعد خاصة."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Hand in a dated, written resignation and keep proof. Work your notice unless you agree in writing to shorten or waive it.","سلّم استقالة مكتوبة ومؤرخة واحتفظ بما يثبت استلامها، واعمل خلال مدة الإشعار ما لم تتفق كتابياً على تقصيرها أو الإعفاء منها.",90],["If your final dues are not paid on time, file a complaint.","إذا لم تُدفع مستحقاتك النهائية في موعدها، فقدّم شكوى.",58]],"d":[["Dated resignation letter","خطاب استقالة مؤرخ"]],"f":[["Notice is at least 30 and at most 90 days, in writing, and the same for both sides unless it favours the worker.","الإشعار 30 يوماً على الأقل و90 يوماً على الأكثر، ويكون كتابياً ومتساوياً للطرفين ما لم يكن في مصلحة العامل.",0],["The side that skips the notice pays the other a notice allowance based on the worker's last wage.","يدفع الطرف الذي لا يلتزم بالإشعار للطرف الآخر بدلاً عنه يُحسب على أساس آخر أجر للعامل.",0],["You may quit without notice if the employer breaks its duties and does not fix them after you tell MOHRE 14 working days ahead.","يجوز لك ترك العمل دون إشعار إذا أخلّ صاحب العمل بالتزاماته ولم يصحح ذلك بعد إبلاغك الوزارة قبل 14 يوم عمل.",0],["On probation: 14 days' notice to leave the UAE, or 1 month to join another UAE employer.","خلال التجربة: إشعار 14 يوماً لمغادرة الدولة، أو شهر للانتقال إلى صاحب عمل آخر في الدولة.",1]],"dp":[["other","On probation, notice depends on whether you leave the UAE or join another UAE employer.","خلال التجربة، تختلف مدة الإشعار بحسب مغادرتك الدولة أو انتقالك إلى صاحب عمل آخر eck the probation length in your contract. It cannot be more than 6 months.","تحقّق من مدة التجربة في عقدك، ولا يجوز أن تزيد على 6 أشهر.",96],["Ask MOHRE if a ban could apply, then give written notice: 14 days to leave the UAE, or 1 month to join a new UAE employer.","اسأل الوزارة عن احتمال الحظر، ثم قدّم إشعاراً كتابياً: 14 يوماً لمغادرة الدولة، أو شهراً للانتقال إلى صاحب عمل جديد فيها.",97]],"f":[["Probation is up to 6 months and cannot be extended.","لا تزيد فترة التجربة على 6 أشهر، ولا يجوز تمديدها.",0],["Employer: 14 days' written notice. Worker: 14 days to leave the UAE, or at least 1 month to join another UAE employer.","صاحب العمل: إشعار كتابي 14 يوماً. العامل: 14 يوماً لمغادرة الدولة، أو شهر على الأقل للانتقال إلى صاحب عمل آخر فيها.",0],["The new employer pays the old one's recruitment costs unless agreed otherwise, also if you return within 3 months.","يعوّض صاحب العمل الجديد السابقَ عن تكاليف الاستقدام ما لم يُتفق على غير ذلك، وكذلك إذا عدت خلال 3 أشهر.",0],["Ending the contract in probation without employer breach can bring a 1-year work permit ban, counted from leaving the UAE.","قد يؤدي إنهاء العقد خلال التجربة دون إخلال من صاحب العمل إلى حظر تصريح العمل لمدة سنة من تاريخ مغادرة الدولة.",1]],"dp":[["visa","MOHRE may exempt family-visa and Golden Visa holders and in-demand skilled workers from the ban.","يجوز للوزارة إعفاء حاملي الإقامة العائلية والذهبية وأصحاب المهارات المطلوبة من الحظر."],["other","The ban applies only if your employer met its duties. If it broke the contract, you can show this to MOHRE.","لا يُطبّق الحظر إلا إذا التزم صاحب العمل بواجباته، فإن أخلّ بالعقد يمكنك إثبات ذلك أمام الوزارة."]],"c":["A ban follows an employer complaint that MOHRE checks, and you can contest it. Government, DIFC and ADGM jobs have their own rules. General information, not legal advice.","يصدر الحظر بعد شكوى من صاحب العمل تتحقق منها الوزارة، ويمكنك التظلم منه. وللوظائف الحكومية ومركز دبي المالي وسوق أبوظبي العالمي قواعد خاصة. هذه معلومات عامة وليست استشارة قان
