ونية."],"au":"mohre","l":[98,99,86],"so":[[94,10,95],[100,10,101]],"v":1},{"id":"work-annual-leave","q":["How many days of annual leave do I get, and can I carry over or cash in unused days?","كم يوماً من الإجازة السنوية أستحق، وهل يمكنني ترحيل الأيام غير المستخدمة أو صرف بدلها نقداً؟"],"k":["annual leave uae labour law","how many leave days per year dubai","carry forward annual leave uae","leave encashment uae","الإجازة السنوية في قانون العمل الإماراتي","ترحيل الاجازة السنوية","بدل الاجازة كاش"],"a":["After 1 year of service you get at least 30 paid days a year; between 6 and 12 months, 2 days per month. With your employer's approval you can carry over up to half a year's leave, or agree on cash instead. Your employer cannot block your leave for more than 2 years in a row. When you leave, unused days are paid at your basic wage.","بعد سنة من الخدمة تستحق 30 يوماً مدفوعة الأجر على الأقل كل سنة، وإذا كانت خدمتك بين 6 و12 شهراً فيومين عن كل شهر. ويمكنك بموافقة صاحب العمل ترحيل نصف إجازة السنة كحد أقصى، أو الاتفاق على بدل نقدي. ولا يجوز لصاحب العمل منعك من إجازتك أكثر من سنتين متتاليتين. وعند ترك العمل تُصرف الأيام غير المستخدمة على أساس الراتب الأساسي."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Check your balance and company policy, and agree your dates. Get any carry-over approved in writing.","تحقّق من رصيدك ومن سياسة المنشأة واتفق على المواعيد، واحصل على موافقة كتابية على أي ترحيل.",102],["When you leave, check that the final settlement pays every unused day. If not, complain.","عند ترك العمل، تأكد أن المخالصة النهائية تشمل كل الأيام غير المستخدمة، وإلا فقدّم شكوى.",58]],"f":[["30 paid days a year after 1 year of service; 2 days a month for service between 6 and 12 months.","30 يوماً مدفوعة الأجر سنوياً بعد سنة من الخدمة، ويومان عن كل شهر إذا كانت الخدمة بين 6 و12 شهراً.",0],["With the employer's approval, a worker may carry over no more than half of the annual leave, or agree to cash in lieu.","يجوز للعامل بموافقة صاحب العمل ترحيل ما لا يزيد على نصف إجازته السنوية، أو الاتفاق على بدل نقدي عنها.",1],["An employer cannot stop a worker using leave for more than 2 consecutive years, unless the worker chose to carry it over or take cash.","لا يجوز لصاحب العمل منع العامل من استخدام إجازته أكثر من سنتين متتاليتين، إلا إذا اختار العامل ترحيلها أو صرف بدلها.",0],["On leaving, unused leave and a share for the last part year are paid at basic wage.","عند انتهاء الخدمة يُصرف بدل الإجازات غير المستخدمة وجزء السنة الأخيرة على أساس الراتب الأساسي.",0]],"dp":[["other","Part-time workers get leave based on the hours in their contract.","يحصل العامل بدوام جزئي على إجازة بحسب ساعات العمل في عقده."],["other","Public holidays inside your leave count as leave days, unless your contract or policy is better.","تُحتسب العطلات الرسمية الواقعة خلال إجازتك من أيامها، ما لم يكن عقدك أو سياسة المنشأة أفضل."]],"c":["Your employer sets dates around work needs, in agreement with you. Government, DIFC and ADGM jobs have their own rules. General information, not legal advice.","يحدد صاحب العمل المواعيد بحسب ظروف العمل وبالاتفاق معك. وللوظائف الحكومية ومركز دبي المالي العالمي وسوق أبوظبي العالمي قواعد خاصة. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[98,103,86],"so":[[104,10,105],[89,0,86]],"v":1},{"id":"work-sick-leave","q":["How much sick leave do I get, and will I be paid?","كم يوماً من الإجازة المرضية أستحق، وهل أتقاضى أجري خلالها؟"],"k":["sick leave uae labour law","sick leave salary deduction dubai","sick leave during probation uae","how many sick days per year uae","الإجازة المرضية في قانون العمل الإماراتي","خصم الراتب في الاجازة المرضية","كم يوم سك ليف بالسنة"],"a":["After probation you can take up to 90 days of sick leave a year: the first 15 days on full pay, the next 30 on half pay, and the rest unpaid. Tell your employer within 3 days and hand in a medical report. There is no paid sick leave on probation. Your employer cannot dismiss you or give you notice while you are on sick leave.","بعد انتهاء فترة التجربة يحق لك ما يصل إلى 90 يوماً من الإجازة المرضية في السنة: أول 15 يوماً بأجر كامل، ثم 30 يوماً بنصف أجر، والباقي دون أجر. وعليك إبلاغ صاحب العمل خلال 3 أيام وتقديم تقرير طبي. ولا توجد إجازة مرضية مدفوعة خلال التجربة. ولا يجوز لصاحب العمل فصلك أو توجيه إشعار إنهاء إليك أثناء إجازتك المرضية."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Tell your employer within 3 days and hand in a medical report.","أبلغ صاحب العمل خلال 3 أيام وسلّمه تقريراً طبياً.",106],["Check your payslip. If your pay is cut wrongly, raise it with HR, then file a complaint.","راجع قسيمة راتبك، وإذا خُصم أجرك دون حق فراجع الموارد البشرية ثم قدّم شكوى.",58]],"d":[["Medical report, and proof you told your employer","التقرير الطبي، وما يثبت إبلاغك صاحب العمل"]],"f":[["Up to 90 days a year after probation, in one block or in parts: 15 days on full pay, 30 on half pay, the rest unpaid.","حتى 90 يوماً في السنة بعد التجربة، متصلة أو متقطعة: 15 يوماً بأجر كامل، و30 بنصف أجر، والباقي دون أجر.",0],["Tell the employer within 3 days and submit a medical report.","يجب إبلاغ صاحب العمل خلال 3 أيام وتقديم تقرير طبي.",0],["No paid sick leave on probation; the employer may give unpaid sick leave with a medical report.","لا إجازة مرضية مدفوعة خلال التجربة، ويجوز لصاحب العمل منح إجازة مرضية دون أجر بتقرير طبي.",0],["No dismissal or notice during sick leave. If you cannot return after all 90 days, the employer may end the contract and pay your dues.","لا يجوز الفصل أو الإشعار أثناء الإجازة المرضية، وإذا تعذرت عودتك بعد استنفاد 90 يوماً جاز إنهاء العقد مع دفع مستحقاتك.",0]],"dp":[["other","Illness caused by your own misconduct, such as alcohol or drugs, or by breaking safety rules is not paid.","لا يُدفع أجر عن المرض الناتج عن سوء سلوكك، مثل الكحول أو المخدرات، أو عن مخالفة تعليمات السلامة."],["other","Work injuries and work-related diseases follow separate compensation rules.","تخضع إصابات العمل وأمراض المهنة لقواعد تعويض مستقلة."]],"c":["Your contract or company policy may give more. Government, DIFC and ADGM jobs have their own rules. General information, not legal advice.","قد يمنحك عقدك أو سياسة المنشأة أكثر. وللوظائف الحكومية ومركز دبي المالي العالمي وسوق أبوظبي العالمي قواعد خاصة. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[98,107,86],"so":[[104,10,105]],"v":1,"h":"wage-guard"},{"id":"work-maternity-paternity","q":["How long is maternity leave, and do fathers get paternity leave?","كم مدة إجازة الأمومة، وهل يحصل الآباء على إجازة أبوة؟"],"k":["maternity leave uae private sector","paternity leave uae how many days","nursing break hours uae","إجازة الأمومة في القطاع الخاص","اجازة الوضع كم يوم","اجازة الابوة للرجال الامارات"],"a":["A mother gets 60 days of maternity leave: 45 on full pay, then 15 on half pay. She may add up to 45 unpaid days if pregnancy or birth makes her ill, and 30 paid days if the baby is sick or disabled. Each parent also gets 5 paid working days of parental leave within 6 months of the birth.","تحصل الأم على إجازة أمومة مدتها 60 يوماً: 45 يوماً بأجر كامل ثم 15 يوماً بنصف أجر. ويجوز لها إضافة ما يصل إلى 45 يوماً دون أجر إذا مرضت بسبب الحمل أو الولادة، و30 يوماً بأجر إذا كان المولود مريضاً أو من أصحاب الهمم. ويحصل كل من الوالدين أيضاً على إجازة والدية مدفوعة مدتها 5 أيام عمل خلال 6 أشهر من الولادة."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Give HR a medical certificate with the expected birth date. Each parent books the 5 days of parental leave within 6 months of the birth.","سلّمي الموارد البشرية شهادة طبية بموعد الولادة المتوقع، ويطلب كل من الوالدين الإجازة الوالدية (5 أيام) خلال 6 أشهر من الولادة.",102],["Emirati mothers in Abu Dhabi: get an employer no-objection letter and apply for leave support within 30 days of the birth.","للأمهات المواطنات في أبوظبي: احصلي على شهادة عدم ممانعة من صاحب العمل، وقدّمي طلب دعم الإجازة خلال 30 يوماً من الولادة.",108]],"d":[["Medical certificate and proof of birth; for Abu Dhabi support, also a salary certificate and IBAN","شهادة طبية وما يثبت الولادة، ولدعم أبوظبي أيضاً شهادة راتب ورقم الحساب المصرفي (IBAN)"]],"f":[["Maternity leave: 60 days, 45 on full pay and 15 on half pay.","إجازة الأمومة: 60 يوماً، منها 45 يوماً بأجر كامل و15 يوماً بنصف أجر.",0],["Extra: up to 45 unpaid days for illness from pregnancy or birth; 30 paid days, then 30 unpaid, for a sick or disabled baby.","إضافية: حتى 45 يوماً دون أجر للمرض الناتج عن الحمل أو الولادة، و30 يوماً بأجر ثم 30 يوماً دون أجر لمولود مريض أو من أصحاب الهمم.",0],["Parental leave: 5 paid working days for each parent, within 6 months of the birth.","الإجازة الوالدية: 5 أيام عمل مدفوعة لكل من الوالدين خلال 6 أشهر من الولادة.",0],["Nursing breaks: paid, up to 1 hour a day in total, for 6 months after the birth.","فترات الرضاعة: مدفوعة الأجر، لا تتجاوز ساعة يومياً، لمدة 6 أشهر بعد الولادة.",0],["Abu Dhabi: Emirati mothers in private jobs with an Abu Dhabi family book can get up to 90 days' paid leave with state support; apply within 30 days.","أبوظبي: للأم المواطنة في القطاع الخاص المقيدة في خلاصة قيد من أبوظبي إجازة مدفوعة حتى 90 يوماً بدعم حكومي، ويُقدَّم الطلب خلال 30 يوماً من الولادة.",1]],"dp":[["sector","Government staff have their own HR laws and maternity rules. DIFC and ADGM have their own rules too.","لموظفي الحكومة قوانين موارد بشرية وقواعد أمومة خاصة بهم، ولمركز دبي المالي العالمي وسوق أبوظبي العالمي قواعدهما أيضاً."],["emirate","Abu Dhabi adds paid leave support for eligible Emirati mothers in private jobs, with employer consent.","تضيف أبوظبي دعماً للإجازة المدفوعة للأمهات المواطنات المؤهلات في القطاع الخاص، بموافقة صاحب العمل."]],"c":["Your contract may give more. Your employer may not dismiss you or give notice because of pregnancy or maternity leave. General information, not legal advice.","قد يمنحك عقدك أكثر من ذلك. ولا يجوز لصاحب العمل فصلك أو توجيه إشعار إنهاء إليك بسبب الحمل أو إجازة الأمومة. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[84,109,86],"so":[[104,10,105],[110,111,112]],"v":1,"ch":["2024-09","Abu Dhabi began supporting up to 90 days of paid maternity leave for eligible Emirati mothers in private jobs, for births from 1 September 2024.","بدأت أبوظبي دعم إجازة أمومة مدفوعة حتى 90 يوماً للأمهات المواطنات المؤهلات في القطاع الخاص، للمواليد من 1 سبتمبر 2024.",1],"cl":{"kind":"deadline","fact":0,"days":60,"label":{"en":"Last day of maternity leave","ar":"آخر يوم في إجازة الأمومة"},"start":{"en":"First day of your leave","ar":"أول يوم في إجازتك"}}},{"id":"work-unemployment-insurance","q":["Must I join the job-loss insurance (ILOE), and how do I claim if I lose my job?","هل يجب أن أشترك في التأمين ضد التعطل عن العمل، وكيف أطالب بالتعويض إذا فقدت وظيفتي؟"],"k":["iloe uae","unemployment insurance uae fine","ILOE fine 400 how to pay","التأمين ضد التعطل عن العمل","غرامة عدم الاشتراك في التأمين ضد التعطل","كيف اطالب بتعويض التعطل"],"a":["Most private-sector and federal government workers must join, Emiratis and expats alike. It costs up to AED 5 a month if your basic salary is below AED 16,000, or AED 10 if above. After 12 months of cover, if you lose your job for a reason other than resigning or misconduct, you can claim 60% of your insured salary for up to 3 months, within 30 days.","يجب على معظم العاملين في القطاع الخاص والحكومة الاتحادية الاشتراك، مواطنين ووافدين. وتبلغ التكلفة حتى 5 دراهم شهرياً إذا كان راتبك الأساسي أقل من 16,000 درهم، و10 دراهم إذا زاد عليه. وبعد 12 شهراً من الاشتراك، إذا فقدت عملك لسبب غير الاستقالة أو التأديب، يمكنك المطالبة خلال 30 يوماً بـ60% من راتبك المؤمَّن عليه لمدة تصل إلى 3 أشهر."],"w":["resident","emirati"],"s":["private","government"],"st":[["Subscribe, or check that your policy is active.","اشترك، أو تأكد من أن وثيقتك سارية.",113],["If you lose your job, claim within 30 days of the job ending or of a labour dispute being settled.","إذا فقدت عملك، فقدّم المطالبة خلال 30 يوماً من انتهاء العمل أو من تسوية النزاع العمالي.",114]],"f":[["Premium: up to AED 5 a month if basic salary is below AED 16,000; up to AED 10 a month if above.","القسط: حتى 5 دراهم شهرياً إذا كان الراتب الأساسي أقل من 16,000 درهم، وحتى 10 دراهم شهرياً إذا زاد عليه.",0],["Benefit: 60% of the insured salary for up to 3 months per claim, capped at AED 10,000 or AED 20,000 a month by category.","التعويض: 60% من الراتب المؤمَّن عليه لمدة تصل إلى 3 أشهر لكل مطالبة، بحد أقصى 10,000 أو 20,000 درهم شهرياً بحسب الفئة.",0],["Needs 12 continuous months of paid cover; claim within 30 days. None after resigning or disciplinary dismissal, or if you are outside the UAE.","يُشترط اشتراك مدفوع 12 شهراً متصلة، وتقديم المطالبة خلال 30 يوماً، ولا تعويض عند الاستقالة أو الفصل التأديبي أو الوجود خارج الدولة.",0],["u.ae: AED 400 fine for not subscribing and AED 400 for unpaid premiums.","بوابة u.ae: غرامة 400 درهم لعدم الاشتراك و400 درهم لعدم دفع الأقساط.",0],["MOHRE (2023): AED 400 and AED 200 respectively, taken from salary or end-of-service pay; instalments allowed.","الوزارة (2023): 400 درهم و200 درهم على التوالي، تُخصم من الراتب أو مكافأة نهاية الخدمة، ويجوز تقسيطها.",1]],"dp":[["status","Exempt: investors who own their firm, domestic workers, temporary-contract workers, under-18s, and pensioners in a new job.","المعفون: المستثمرون مالكو منشآتهم، والعمالة المساعدة، وأصحاب العقود المؤقتة، ومن هم دون 18 عاماً، والمتقاعدون في عمل جديد."],["sector","It covers the private sector and federal government. Local government staff should ask their HR.","يشمل النظام القطاع الخاص والحكومة الاتحادية، ويسأل موظفو الجهات الحكومية المحلية إدارة الموارد البشرية."]],"c":["Payouts stop when you start a new job. Official pages differ on the unpaid-premium fine (AED 200 or 400), so check your MOHRE file, where you can also pay.","يتوقف التعويض عند بدء عمل جديد. وتختلف الصفحات الرسمية في غرامة عدم دفع الأقساط (200 أو 400 درهم)، فتحقق من ملفك لدى الوزارة حيث يمكنك الدفع أيضاً."],"au":"mohre","l":[115,116,117],"so":[[118,10,119],[120,0,121]],"v":1,"h":"career-compass"},{"id":"work-unpaid-salary","q":["My salary is late or has not been paid. What can I do?","راتبي متأخر أو لم يُدفع. ماذا أفعل؟"],"k":["salary not paid uae what to do","company not paying salary dubai complaint","late salery complaint mohre","شكوى عدم دفع الراتب","تأخير الرواتب وزارة الموارد البشرية","الشركة ما عطتني راتبي"],"a":["Since 1 June 2026, each month's wages are due on the 1st of the next month, paid through the Wage Protection System. If yours is late, ask your employer in writing, then complain to MOHRE. MOHRE tries to settle it and can decide claims up to AED 50,000; bigger cases go to court. Claim within 2 years of the job ending.","منذ 1 يونيو 2026 يُستحق أجر كل شهر في اليوم الأول من الشهر التالي، ويُدفع عبر نظام حماية الأجور. فإذا تأخر راتبك فاطلبه من صاحب العمل كتابةً، ثم قدّم شكوى إلى الوزارة. وتحاول الوزارة التسوية، ويمكنها الفصل في المطالبات حتى 50,000 درهم، وتُحال القضايا الأكبر إلى المحكمة. وقدّم مطالبتك خلال سنتين من انتهاء العمل."],"w":["resident","emirati"],"s":["private"],"st":[["Ask your employer in writing to pay, and keep a copy.","اطلب من صاحب العمل الدفع كتابةً، واحتفظ بنسخة.",122],["File a salary complaint with your contract, bank statements and messages.","قدّم شكوى راتب مرفقاً بها عقدك وكشوف حسابك والمراسلات.",123]],"f":[["From 1 June 2026, wages are due on the 1st day of each month for the month before (Resolution 340 of 2026).","اعتباراً من 1 يونيو 2026 تُستحق الأجور في اليوم الأول من كل شهر عن الشهر السابق (القرار رقم 340 لسنة 2026).",1],["If wages are late, MOHRE suspends the employer's new work permits on the 5th day after the due date.","إذا تأخرت الأجور، توقف الوزارة إصدار تصاريح عمل جديدة لصاحب العمل في اليوم 5 بعد موعد الاستحقاق.",1],["MOHRE can decide claims up to AED 50,000; the Court of Appeal can review within 15 working days. Claims lapse 2 years after the job ends.","يمكن للوزارة الفصل في المطالبات حتى 50,000 درهم، ولمحكمة الاستئناف مراجعة القرار خلال 15 يوم عمل. وتسقط المطالبات بعد سنتين من انتهاء العمل.",2],["MOHRE call centre: 600590000. Labour claims and advice line: 80084 (toll-free). No court fees for worker claims under AED 100,000.","مركز اتصال الوزارة: 600590000، وخط المطالبات والاستشارات العمالية المجاني: 80084. ولا رسوم قضائية على مطالبات العمال التي تقل عن 100,000 درهم.",0],["At firms with 25 or more workers, MOHRE registers a labour dispute for unpaid workers automatically on day 16 after the due date.","في المنشآت التي يعمل بها 25 عاملاً أو أكثر، تسجّل الوزارة نزاعاً عمالياً للعمال غير المدفوعة أجورهم تلقائياً في اليوم 16 بعد موعد الاستحقاق.",1]],"dp":[["sector","Free zone, DIFC and ADGM staff should ask their zone authority how to complain.","يسأل العاملون في المناطق الحرة ومركز دبي المالي وسوق أبوظبي العالمي سلطة منطقتهم عن طريقة الشكوى."],["other","MOHRE can order the employer to keep paying your wages for up to 2 months while the dispute runs.","يمكن للوزارة إلزام صاحب العمل بمواصلة دفع أجرك مدة أقصاها شهران أثناء النزاع."]],"c":["Before you stop working, ask MOHRE, because a work abandonment report can lead to a ban. General information, not legal advice.","قبل أن تتوقف عن العمل استشر الوزارة، لأن بلاغ الانقطاع عن العمل قد يؤدي إلى حظر. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[124,125,86],"so":[[126,10,127],[128,0,129],[130,0,86]],"v":1,"ch":["2026-06","Wages became due on the 1st of each month, with set day-by-day steps against late payers.","أصبحت الأجور مستحقة في اليوم الأول من كل شهر، مع إجراءات محددة بالأيام ضد المتأخرين في الدفع.",1],"h":"wage-guard"},{"id":"work-termination-rights","q":["My employer ended my contract. What must they pay me, and was it legal?","أنهى صاحب العمل عقدي. ما الذي يجب أن يدفعه لي، وهل كان الإنهاء قانونياً؟"],"k":["terminated what are my rights uae","fired without reason uae compensation","arbitrary dismissal uae labour law","final settlement after termination dubai","حقوقي بعد إنهاء الخدمة","الفصل التعسفي في قانون العمل الإماراتي","فنشوني من الشغل وش حقوقي"],"a":["Unless you did something serious listed in the law, your employer must give 30 to 90 days' written notice or pay for it. You are owed unpaid wages, unused leave, gratuity after 1 year, and your trip home unless you join a new employer, all within 14 days. If you were fired for a valid complaint or lawsuit, a court can add up to 3 months' wage.","ما لم ترتكب مخالفة جسيمة مما ينص عليه القانون، يجب على صاحب العمل أن يمنحك إشعاراً كتابياً من 30 إلى 90 يوماً أو يدفع بدله. ويحق لك الأجر غير المدفوع، وبدل الإجازات غير المستخدمة، ومكافأة نهاية الخدمة بعد سنة، وتكلفة عودتك ما لم تلتحق بصاحب عمل جديد، وكلها خلال 14 يوماً. وإذا فُصلت بسبب شكوى أو دعوى ثبتت صحتها، فللمحكمة أن تقضي لك بتعويض يصل إلى أجر 3 أشهر."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Get the notice in writing, with the reason and last day. Check the settlement: notice pay, wages, leave, gratuity and ticket home.","احصل على إشعار الإنهاء مكتوباً مع السبب وآخر يوم عمل، وراجع المخالصة: بدل الإشعار والأجور والإجازات والمكافأة وتذكرة العودة.",102],["Do not sign that you were paid until you are. If dues are unpaid after 14 days, or the dismissal was unfair, complain.","لا توقّع على الاستلام قبل الدفع فعلاً، وإذا لم تُدفع المستحقات بعد 14 يوماً أو كان الفصل تعسفياً فقدّم شكوى.",58]],"d":[["Termination letter, contract, payslips and any warnings","خطاب الإنهاء والعقد وقسائم الراتب وأي إنذارات"]],"f":[["Notice is 30 to 90 days in writing; the side that does not give it pays the notice wage.","الإشعار من 30 إلى 90 يوماً كتابةً، ويدفع الطرف الذي لا يلتزم به بدل الإشعار.",0],["Dismissal without notice is allowed only for listed reasons, such as forged papers, assault, or absence over 7 days in a row or 20 days a year.","لا يجوز الفصل دون إشعار إلا لأسباب محددة، مثل المستندات المزورة أو الاعتداء أو الغياب أكثر من 7 أيام متصلة أو 20 يوماً في السنة.",0],["Wages and all dues, including gratuity after 1 year of service, must be paid within 14 days of the contract ending.","تُدفع الأجور وكل المستحقات، ومنها المكافأة بعد سنة من الخدمة، خلال 14 يوماً من انتهاء العقد.",1],["Unfair dismissal for a valid complaint or lawsuit: court compensation up to 3 months' wage, on top of notice pay and gratuity.","الفصل التعسفي بسبب شكوى أو دعوى ثبتت صحتها: تعويض تقدّره المحكمة بحد أقصى أجر 3 أشهر، إضافة إلى بدل الإشعار والمكافأة.",0],["The employer pays your trip home, unless you joined another employer or the termination was caused by you.","يتحمل صاحب العمل تكلفة عودتك، ما لم تلتحق بصاحب عمل آخر أو يكن سبب الإنهاء راجعاً إليك.",1]],"dp":[["other","If your employer gives notice, you may take 1 unpaid day a week to look for work, telling them 3 days ahead.","إذا كان الإشعار من صاحب العمل، فلك يوم واحد أسبوعياً دون أجر للبحث عن عمل، مع إبلاغه قبل 3 أيام."],["status","Emiratis get pension rights instead of the gratuity.","يحصل المواطنون على حقوق التقاعد بدلاً من مكافأة نهاية الخدمة."]],"c":["A court sets any unfair dismissal pay; it is not automatic. You may also claim job-loss insurance (ILOE). Government, DIFC and ADGM jobs have their own rules. Not legal advice.","تقدّر المحكمة أي تعويض عن الفصل التعسفي، وهو ليس تلقائياً. وقد يحق لك أيضاً تعويض التأمين ضد التعطل. وللوظائف الحكومية ومركز دبي المالي وسوق أبوظبي العالمي قواعد خاصة. ليست استشارة قانونية."],"au":"mohre","l":[84,131,86],"so":[[92,10,93],[89,0,86]],"v":1,"h":"wage-guard"},{"id":"work-hours-overtime","q":["How many hours can I be made to work, and how is overtime paid, including in Ramadan?","كم ساعة يمكن أن يُطلب مني العمل، وكيف يُدفع العمل الإضافي، بما في ذلك في رمضان؟"],"k":["working hours uae labour law","overtime calculation uae","ramadan working hours private sector","midday break rules uae","ساعات العمل في القطاع الخاص","حساب الاوفر تايم","دوام رمضان كم ساعة"],"a":["Normal hours are up to 8 a day and 48 a week. Overtime is capped at 2 hours a day and paid at your basic hourly wage plus at least 25%, or 50% between 10 pm and 4 am. Work on your rest day earns a substitute day off or basic pay plus 50%. In Ramadan, normal hours are cut by 2 hours a day.","ساعات العمل العادية لا تتجاوز 8 ساعات يومياً و48 ساعة أسبوعياً. ولا يزيد العمل الإضافي على ساعتين يومياً، ويُدفع بأجر الساعة الأساسي مضافاً إليه 25% على الأقل، أو 50% بين الساعة 10 مساءً و4 صباحاً. ويُعوَّض العمل في يوم الراحة بيوم بديل أو بالأجر الأساسي مضافاً إليه 50%. وفي رمضان تُخفّض ساعات العمل العادية ساعتين يومياً."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Check your hours and rest day in your contract, and keep your own record of overtime and who asked for it.","تحقّق من ساعات عملك ويوم راحتك في عقدك، واحتفظ بسجل للعمل الإضافي ومن طلبه منك.",132],["If overtime is missing from your payslip, raise it with HR, then complain.","إذا لم يظهر العمل الإضافي في قسيمة راتبك فراجع الموارد البشرية، ثم قدّم شكوى.",58]],"d":[["Timesheets and messages asking you to work extra hours","سجلات الحضور والرسائل التي تطلب منك العمل ساعات إضافية"]],"f":[["Normal hours: up to 8 a day and 48 a week.","ساعات العمل العادية: حتى 8 ساعات يومياً و48 ساعة أسبوعياً.",0],["Overtime: up to 2 hours a day; total hours may not pass 144 in any 3 weeks.","العمل الإضافي: حتى ساعتين يومياً، ولا يتجاوز مجموع الساعات 144 ساعة كل 3 أسابيع.",1],["Overtime pay: basic hourly wage plus at least 25%; plus 50% from 10 pm to 4 am, except for shift workers.","أجر العمل الإضافي: أجر الساعة الأساسي مضافاً إليه 25% على الأقل، و50% من 10 مساءً إلى 4 صباحاً، عدا العاملين بنظام النوبات.",0],["Rest day work: a substitute day off, or basic wage plus 50%.","العمل في يوم الراحة: يوم بديل، أو الأجر الأساسي مضافاً إليه 50%.",0],["Ramadan: normal working hours are reduced by 2 hours a day.","رمضان: تُخفّض ساعات العمل العادية ساعتين يومياً.",0]],"dp":[["other","Board members, managers with employer powers, ship crews and some technical jobs are exempt from the hour limits.","يُستثنى من حدود الساعات أعضاء مجالس الإدارة، والمديرون الذين يملكون صلاحيات صاحب العمل، وأطقم السفن، وبعض الأعمال الفنية."],["other","Outdoor work: from 15 June to 15 September, work in direct sun is banned from 12:30 pm to 3 pm.","العمل في الأماكن المكشوفة: يُحظر العمل تحت أشعة الشمس المباشرة من 12:30 ظهراً حتى 3 عصراً، من 15 يونيو إلى 15 سبتمبر."],["sector","Government staff follow their own working hours, including in Ramadan.","يتبع موظفو الحكومة مواعيد دوام خاصة بهم، بما في ذلك في رمضان."]],"c":["Working on a public holiday also earns another day off or extra pay. Commuting time is not counted as work, except for some groups. General information, not legal advice.","يُعوَّض العمل في العطلة الرسمية أيضاً بيوم بديل أو بأجر إضافي. ولا يُحتسب وقت التنقل إلى العمل من ساعات العمل، إلا لفئات معينة. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[98,133,86],"so":[[134,10,135],[89,0,86]],"v":1,"h":"wage-guard"},{"id":"work-non-compete","q":["My contract has a non-compete clause. Can I join a competitor after I leave?","عقدي يتضمن شرط عدم المنافسة. هل يمكنني العمل لدى منافس بعد ترك عملي؟"],"k":["non compete clause uae","can my employer stop me joining competitor uae","non compete exemption 3 months salary","شرط عدم المنافسة في عقد العمل","هل شرط عدم المنافسة قانوني بالامارات","الاعفاء من شرط عدم المنافسه"],"a":["A non-compete is valid only if your job gave you access to clients or trade secrets. It must be limited in time, place and type of work, and last at most 2 years after the contract ends. It does not apply if the contract ended in probation or because of your employer. You can also be released by paying up to 3 months' wage, with your old employer's written consent.","لا يصح شرط عدم المنافسة إلا إذا أتاح لك عملك معرفة العملاء أو أسرار العمل، ويجب أن يُحدَّد بالزمان والمكان ونوع العمل، وألا تتجاوز مدته سنتين من انتهاء العقد. ولا يُطبَّق إذا انتهى العقد خلال التجربة أو بسبب صاحب العمل. ويمكن إعفاؤك منه أيضاً بدفع تعويض لا يتجاوز أجر 3 أشهر بموافقة كتابية من صاحب العمل السابق."],"w":["resident","emirati"],"s":["private","free-zone"],"st":[["Check the clause's time limit, area and type of work. Ask your old employer to waive it in writing, or agree a release payment of up to 3 months' wage.","تحقّق من مدة الشرط ونطاقه ونوع العمل، واطلب من صاحب العمل السابق التنازل عنه كتابةً، أو اتفق على تعويض للإعفاء لا يتجاوز أجر 3 أشهر.",136],["If you disagree, the dispute goes to MOHRE first, then to court, where the employer must prove its loss.","عند الخلاف يُعرض النزاع على الوزارة أولاً ثم على المحكمة، وعلى صاحب العمل إثبات الضرر.",137]],"d":[["Your contract and any written waiver or release agreement","عقدك وأي تنازل أو اتفاق إعفاء مكتوب"]],"f":[["A non-compete may last at most 2 years from the end of the contract, limited by time, place and type of work.","لا تتجاوز مدة شرط عدم المنافسة سنتين من انتهاء العقد، ويُحدَّد بالزمان والمكان ونوع العمل.",0],["It applies only if the job gave access to the employer's clients or business secrets.","لا يُطبَّق إلا إذا أتاح العمل الاطلاع على عملاء صاحب العمل أو أسرار عمله.",1],["It does not apply if the reason for ending the contract lies with the employer or its breach of duties.","لا يُطبَّق إذا كان سبب إنهاء العقد راجعاً إلى صاحب العمل أو إخلاله بالتزاماته.",1],["Release: the contract ended in probation, or you or the new employer pay up to 3 months' wage with the old employer's written consent.","الإعفاء: إذا انتهى العقد خلال التجربة، أو دفعتَ أنت أو صاحب العمل الجديد تعويضاً لا يتجاوز أجر 3 أشهر بموافقة كتابية من صاحب العمل السابق.",1],["In court the employer must prove its loss, and its claim is not heard after 1 year from discovering the breach.","أمام المحكمة يقع على صاحب العمل إثبات الضرر، ولا تُسمع دعواه بعد سنة من اكتشاف المخالفة.",1]],"dp":[["other","Some in-demand jobs named by the Minister of Human Resources can be exempt.","قد تُعفى بعض المهن المطلوبة التي يحددها وزير الموارد البشرية والتوطين."],["sector","The DIFC and ADGM free zones have their own employment rules.","لمنطقتي مركز دبي المالي العالمي وسوق أبوظبي العالمي قواعد عمل خاصة بهما."]],"c":["A clause wider than needed to protect the business may not be enforced, but only a court decides. You and your employer can agree in writing to drop it. General information, not legal advice.","قد لا يُنفَّذ الشرط إذا كان أوسع مما يلزم لحماية العمل، لكن المحكمة وحدها تقرر ذلك. ويمكنك الاتفاق كتابياً مع صاحب العمل على إلغائه. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[98,138,86],"so":[[94,10,95],[89,0,86]],"v":1,"h":"career-compass"},{"id":"work-change-job-ban","q":["Can I change jobs before my contract ends, and will I get a labour ban?","هل يمكنني تغيير وظيفتي قبل انتهاء عقدي، وهل سيُفرض عليّ حظر عمل؟"],"k":["labour ban uae new law","change job without noc uae","absconding case uae how to remove","can i switch jobs before contract ends uae","حظر العمل سنة في الامارات","بلاغ انقطاع عن العمل كيف الغيه","نقل الكفالة بدون موافقة الشركة"],"a":["Yes, if you leave lawfully: when the contract ends, by agreement, after you resign and serve notice, or if your employer ends it without your fault. MOHRE blocks a new work permit for 1 year only in set cases: you quit in probation when the employer did nothing wrong, a work abandonment report against you is proven, or your permit at a fake company is cancelled.","نعم، إذا تركت العمل بطريقة قانونية: عند انتهاء العقد، أو بالاتفاق، أو بعد الاستقالة وإتمام مدة الإشعار، أو إذا أنهى صاحب العمل العقد دون خطأ منك. ولا تحظر الوزارة إصدار تصريح عمل جديد لمدة سنة إلا في حالات محددة: الاستقالة خلال التجربة دون إخلال من صاحب العمل، أو ثبوت بلاغ انقطاع عن العمل ضدك، أو إلغاء تصريحك لدى منشأة وهمية."],"w":["resident"],"s":["private"],"st":[["Resign in writing and serve your notice, or agree an earlier exit in writing.","قدّم استقالتك كتابةً وأكمل مدة الإشعار، أو اتفق كتابياً على خروج مبكر.",102],["Your new employer applies for your transfer work permit.","يتقدّم صاحب العمل الجديد بطلب تصريح عمل انتقال لك.",139],["Check your file for a ban or absence report. If one is unfair, file a grievance with proof.","تحقّق من وجود حظر أو بلاغ انقطاع عن العمل في ملفك، وإذا كان غير مبرر فقدّم تظلماً مع ما يثبت ذلك.",140]],"d":[["Resignation letter with proof of receipt; proof of attendance or a valid reason for any absence","خطاب الاستقالة وما يثبت استلامه، وما يثبت حضورك أو عذرك المقبول عن أي غياب"]],"f":[["You may join a new employer if the contract expired, ended lawfully (such as by agreement or after notice), or was ended by the employer without your fault.","يجوز لك الالتحاق بصاحب عمل جديد إذا انتهى العقد، أو أُنهي بطريقة قانونية كالاتفاق أو بعد الإشعار، أو أنهاه صاحب العمل دون خطأ منك.",1],["1-year ban cases: quitting in probation with no employer breach, a proven work abandonment report, or a permit cancelled at a fake company.","حالات الحظر لمدة سنة: الاستقالة خلال التجربة دون إخلال من صاحب العمل، أو ثبوت بلاغ انقطاع عن العمل، أو إلغاء التصريح لدى منشأة وهمية.",0],["Exempt in abandonment cases: family-visa workers, Golden Visa holders, in-demand skilled workers and those rejoining the same employer.","المعفون في حالات الانقطاع: العاملون على إقامة عائلية، وحاملو الإقامة الذهبية، وأصحاب المهارات المطلوبة، ومن يعود إلى المنشأة نفسها.",0],["Absence without a valid reason for more than 7 days in a row, or 20 days in a year, lets the employer dismiss without notice.","الغياب دون عذر مقبول أكثر من 7 أيام متصلة أو 20 يوماً في السنة يجيز لصاحب العمل الفصل دون إشعار.",1]],"dp":[["visa","Family-visa and Golden Visa holders are exempt from the ban in work abandonment cases.","يُعفى العاملون على إقامة عائلية وحاملو الإقامة الذهبية من الحظر في حالات الانقطاع عن العمل."],["sector","Free zone jobs follow the free zone's own permit rules.","تتبع وظائف المناطق الحرة قواعد التصاريح الخاصة بكل منطقة."]],"c":["A ban comes only after MOHRE checks the employer's complaint, and it ends by itself after the year. Check for a non-compete clause before joining a rival. General information, not legal advice.","لا يُفرض الحظر إلا بعد تحقق الوزارة من شكوى صاحب العمل، ويُرفع تلقائياً بعد انقضاء السنة. وتحقّق من وجود شرط عدم منافسة قبل الالتحاق بمنافس. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[98,141,86],"so":[[100,10,101],[92,10,93]],"v":1,"h":"career-compass"},{"id":"work-family-visa-second-job","q":["Can I work on a family visa, take a second job, or work freelance?","هل يمكنني العمل بإقامة عائلية، أو العمل في وظيفة ثانية، أو العمل الحر؟"],"k":["work on husband visa uae","can i work on family visa dubai","part time job permit uae second job","freelance permit mohre","work permit for family sponsored resident","اشتغل على اقامة زوجي","تصريح عمل لمن على كفالة الاسرة","تصريح عمل جزئي وظيفة ثانية"],"a":["Yes, but you always need a MOHRE work permit, which the employer applies for; working without one is illegal. On a family visa, a UAE employer can hire you with a permit for family-sponsored residents, so you keep your family visa. A full-time contract is for one employer; a second job needs a part-time contract and permit. If your residence is self-sponsored, you can apply for a MOHRE freelance permit.","نعم، لكنك تحتاج دائماً إلى تصريح عمل من وزارة الموارد البشرية والتوطين يتقدّم به صاحب العمل، والعمل دون تصريح مخالف للقانون. فإذا كنت على إقامة عائلية، يمكن لصاحب عمل في الدولة تعيينك بتصريح خاص بالمقيمين على كفالة أسرهم مع احتفاظك بإقامتك العائلية. والعقد بدوام كامل يكون لصاحب عمل واحد، أما الوظيفة الثانية فتحتاج إلى عقد وتصريح بدوام جزئي. وإذا كانت إقامتك على كفالتك الذاتية فيمكنك طلب تصريح عمل حر."],"w":["resident"],"s":["private"],"st":[["Find an employer registered with MOHRE; it applies for your permit, not you. On a family visa, ask for the 'family sponsorship resident' permit.","ابحث عن صاحب عمل مسجل لدى الوزارة، فهو من يتقدّم بطلب تصريحك وليس أنت، وإذا كنت على إقامة عائلية فاطلب تصريح «المقيم على كفالة أسرته».",142],["For a second job, sign a part-time contract; the new employer gets a part-time permit.","للوظيفة الثانية، وقّع عقداً بدوام جزئي، ويستخرج صاحب العمل الجديد تصريح عمل بدوام جزئي.",139],["To work for yourself, apply for a freelance permit if your residence is self-sponsored.","للعمل لحسابك الخاص، اطلب تصريح عمل حر إذا كانت إقامتك على كفالتك الذاتية.",0]],"d":[["Passport, residence details and Emirates ID","جواز السفر وبيانات الإقامة وبطاقة الهوية الإماراتية"],["Job offer or part-time contract","عرض العمل أو عقد العمل بدوام جزئي"]],"f":[["Working in the UAE without a valid work permit is illegal (Article 6 of the Labour Law).","العمل في الدولة دون تصريح عمل ساري المفعول مخالف للقانون (المادة 6 من قانون العمل).",0],["MOHRE issues a work permit for residents sponsored by their family; it is valid for 2 years.","تصدر الوزارة تصريح عمل للمقيمين على كفالة أسرهم، ومدته سنتان.",0],["A part-time permit lets a worker work for more than one employer after getting MOHRE's permit.","يتيح تصريح العمل بدوام جزئي للعامل العمل لدى أكثر من صاحب عمل بعد الحصول على تصريح من الوزارة.",0],["The freelance permit is for self-employment with no employer sponsor and no employment contract.","تصريح العمل الحر مخصص للعمل المستقل دون كفالة صاحب عمل ودون عقد عمل.",0],["Permit fees range from AED 250 to AED 3,450, by the company's category; the private tutor permit is free.","تتراوح رسوم التصاريح بين 250 و3,450 درهماً بحسب فئة المنشأة، وتصريح الدروس الخصوصية مجاني.",0]],"dp":[["visa","Family-visa holders use the family sponsorship permit; Golden Visa holders have their own permit type.","يستخدم حاملو الإقامة العائلية تصريح الكفالة الأسرية، ولحاملي الإقامة الذهبية نوع تصريح خاص بهم."],["other","Giving private lessons needs a separate private tutor permit.","يتطلب إعطاء الدروس الخصوصية تصريحاً مستقلاً خاصاً بالمدرسين الخصوصيين."]],"c":["Some cases may need your sponsor's or current employer's consent, so confirm with MOHRE before you start. Free zone companies use their own permits. General information, not legal advice.","قد تتطلب بعض الحالات موافقة كفيلك أو صاحب عملك الحالي، فتأكد من الوزارة قبل البدء. وتستخدم شركات المناطق الحرة تصاريحها الخاصة. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[143,144,145],"so":[[146,10,147]],"v":1,"h":"career-compass"},{"id":"work-domestic-workers","q":["What rights does a domestic worker (maid, nanny, driver) have: days off, leave and pay?","ما حقوق العامل المساعد (عاملة المنزل أو المربية أو السائق): الراحة والإجازات والأجر؟"],"k":["housemaid rights uae","domestic worker day off uae law","maid annual leave ticket uae","nanny salary late complaint mohre","حقوق العمالة المساعدة في الامارات","اجازة الخادمة السنوية وتذكرة السفر","شكوى على الكفيل الخدامة","عطلة الشغالة الاسبوعية"],"a":["Domestic workers get a paid weekly day off and at least 12 hours of rest a day, 8 of them in a row. They get at least 30 days of paid annual leave, a return ticket home every 2 years, and 30 days of sick leave a year (15 on full pay, 15 on half pay). The employer provides housing, food and medical care, and the worker keeps their own passport and ID.","يحق للعامل المساعد يوم راحة أسبوعي مدفوع الأجر، وراحة يومية لا تقل عن 12 ساعة منها 8 ساعات متصلة. وله إجازة سنوية مدفوعة لا تقل عن 30 يوماً، وتذكرة عودة إلى بلده كل سنتين، وإجازة مرضية 30 يوماً في السنة (15 يوماً بأجر كامل و15 بنصف أجر). ويوفر صاحب العمل السكن والطعام والرعاية الطبية، ويحتفظ العامل بجواز سفره وهويته."],"w":["resident","emirati"],"s":["domestic"],"st":[["Use a contract on MOHRE's standard form and give the worker a copy.","استخدم عقداً وفق النموذج الموحد المعتمد من الوزارة، وسلّم العامل نسخة منه.",148],["Pay wages on time, within 10 days of the due date, and keep a record of each payment.","ادفع الأجر في موعده خلال 10 أيام من تاريخ استحقاقه، واحتفظ بسجل لكل دفعة.",149],["If there is a dispute, either side can complain. MOHRE tries to settle it within 2 weeks and can decide claims up to AED 50,000.","عند النزاع يمكن لأي طرف تقديم شكوى، وتحاول الوزارة تسويته خلال أسبوعين، ويمكنها الفصل في المطالبات حتى 50,000 درهم.",150],["Either side can challenge a MOHRE decision in court within 15 working days. File any other court claim within 3 months of the job ending.","يمكن لأي طرف الطعن في قرار الوزارة أمام المحكمة خلال 15 يوم عمل، وقدّم أي دعوى أخرى أمام المحكمة خلال 3 أشهر من انتهاء العمل.",151]],"d":[["Signed standard contract and records of wage payments","عقد العمل الموحد الموقّع وسجلات دفع الأجور"],["Passport and Emirates ID copies","نسخ من جواز السفر وبطاقة الهوية"]],"f":[["A paid weekly day off, and at least 12 hours of rest a day, 8 of them in a row.","يوم راحة أسبوعي مدفوع، وراحة يومية لا تقل عن 12 ساعة منها 8 ساعات متصلة.",1],["At least 30 days' paid annual leave, a ticket home every 2 years, and 30 days' sick leave a year (15 full pay, 15 half pay).","إجازة سنوية مدفوعة لا تقل عن 30 يوماً، وتذكرة إلى البلد كل سنتين، وإجازة مرضية 30 يوماً في السنة (15 بأجر كامل و15 بنصف أجر).",1],["Wages must be paid within 10 days of the due date.","يجب دفع الأجر خلال 10 أيام من تاريخ استحقاقه.",0],["MOHRE tries to settle within 2 weeks and can decide claims up to AED 50,000; either side may go to court within 15 working days.","تحاول الوزارة التسوية خلال أسبوعين، ويمكنها الفصل في المطالبات حتى 50,000 درهم، ولأي طرف اللجوء إلى المحكمة خلال 15 يوم عمل.",1],["Court claims are not heard after 3 months from the end of the job; domestic workers pay no court fees.","لا تُسمع الدعاوى بعد 3 أشهر من انتهاء العمل، والعمال المساعدون معفون من الرسوم القضائية.",1]],"dp":[["status","The rules protect both sides: employers can also complain about a worker or a recruitment office.","تحمي القواعد الطرفين، إذ يمكن لصاحب العمل أيضاً تقديم شكوى ضد العامل أو مكتب الاستقدام."],["other","If a recruitment office breaks its contract, it must replace the worker or refund the fees.","إذا أخلّ مكتب الاستقدام بعقده، فعليه توفير عامل بديل أو رد الرسوم."]],"c":["Gratuity for domestic workers follows Cabinet rules, so ask MOHRE for the current formula. Employers may not take recruitment money from the worker. General information, not legal advice.","تخضع مكافأة نهاية الخدمة للعمالة المساعدة لقواعد مجلس الوزراء، فاسأل الوزارة عن طريقة حسابها. ولا يجوز تحصيل مبالغ استقدام من العامل. هذه معلومات عامة وليست استشارة قانونية."],"au":"mohre","l":[152,153,154],"so":[[155,10,156],[157,0,154]],"v":1,"h":"wage-guard"}]},{"topic":"business","title":{"en":"Starting and running a business","ar":"تأسيس الأعمال وإدارتها"},"checked":"2026-11-08","entries":[{"id":"business-corporate-tax-register","q":["Do I have to register for corporate tax, and what is the deadline?","هل يجب أن أسجل في ضريبة الشركات؟ وما آخر موعد للتسجيل؟"],"k":["do i need to register for corporate tax uae","corporate tax registration deadline freelancer","coprate tax registration penalty 10000","هل لازم اسجل في ضريبة الشركات","تسجيل الافراد في ضريبة الشركات","غرامة التاخير في تسجيل ضريبه الشركات"],"a":["Every company, free zone ones included, must register with the Federal Tax Authority (FTA) on EmaraTax, even if it will pay no tax. A person trading in their own name registers once business turnover passes AED 1 million in a calendar year, by 31 March of the next year. Late registration costs AED 10,000, waived if the first return is filed within 7 months.","يجب على كل شركة، ومنها شركات المناطق الحرة، التسجيل لدى الهيئة الاتحادية للضرائب عبر إمارات تاكس، حتى لو لن تدفع ضريبة. ويسجل من يعمل باسمه إذا تجاوزت إيرادات أعماله مليون درهم في سنة ميلادية، في موعد أقصاه 31 مارس من السنة التالية. وغرامة التأخر 10,000 درهم، وتُلغى إذا قُدّم أول إقرار خلال 7 أشهر."],"w":["business","emirati","resident"],"st":[["Apply for free and upload your papers; the FTA decides within 20 business days.","قدّم الطلب مجاناً وارفع مستنداتك، وتبت الهيئة فيه خلال 20 يوم عمل.",158],["If you registered late, file your first return within 7 months of your first tax period ending.","إذا تأخرت في التسجيل، فقدّم أول إقرار خلال 7 أشهر من نهاية أول فترة ضريبية.",159]],"d":[["Trade licence, incorporation papers, and IDs of owners over 25% and signatories","الرخصة التجارية ووثائق التأسيس، وهويات الملاك بأكثر من 25% والمفوضين بالتوقيع"]],"f":[["Individuals register if business turnover exceeds AED 1 million in a calendar year; salary and personal investment or property income do not count.","يسجل الفرد إذا تجاوزت إيرادات أعماله مليون درهم في سنة ميلادية، ولا يُحتسب الراتب ولا دخل الاستثمار الشخصي أو العقاري.",0],["Individuals apply by 31 March of the year after they pass the threshold.","يقدّم الفرد الطلب في موعد أقصاه 31 مارس من السنة التالية لتجاوزه الحد.",1],["Late registration penalty: AED 10,000. Registration is free, takes up to 20 business days, and needs ID for owners over 25%.","غرامة التأخر في التسجيل 10,000 درهم. والتسجيل مجاني، ويستغرق حتى 20 يوم عمل، ويتطلب هوية الملاك بأكثر من 25%.",0],["The fine is waived automatically if the first return is filed within 7 months of the first tax period's end, not the usual 9.","تُلغى الغرامة تلقائياً إذا قُدّم أول إقرار خلال 7 أشهر من نهاية أول فترة ضريبية، بدلاً من 9 أشهر المعتادة.",2]],"dp":[["status","Companies register whatever their income, by a date set from their licence or incorporation date; individuals only above the turnover limit.","تسجل الشركات أياً كان دخلها في موعد يُحدد حسب تاريخ رخصتها أو تأسيسها، والأفراد فقط فوق حد الإيرادات."]],"c":["Registering does not mean you owe tax. The waiver covers only the first tax period. General information, not tax advice.","التسجيل لا يعني أنك ستدفع ضريبة. ويقتصر الإعفاء على أول فترة ضريبية. هذه معلومات عامة وليست استشارة ضريبية."],"au":"fta","l":[160,161,162],"so":[[163,164,165],[166,164,167],[168,164,169]],"v":1,"ch":["2025-04","The late-registration fine is now waived if the first return is filed within 7 months.","أصبحت غرامة التأخر في التسجيل تُلغى إذا قُدّم أول إقرار خلال 7 أشهر.",2]},{"id":"business-corporate-tax-rate-sbr","q":["How much corporate tax will my small business pay? Does small business relief apply to me?","كم ضريبة الشركات التي سيدفعها مشروعي الصغير؟ وهل يشملني إعفاء الأعمال الصغيرة؟"],"k":["uae corporate tax rate 9%","small business relief 3 million","small busniess relief extended 2029","corporate tax 375000 exemption","ضريبة الشركات 9 بالمية","اعفاء الاعمال الصغيرة 3 مليون","كم نسبة ضريبة الشركات في الامارات"],"a":["Taxable income up to AED 375,000 is taxed at 0%, and income above that at 9%. If your revenue is AED 3 million or less in this and every earlier tax period, you can choose Small Business Relief and be treated as having no taxable income. A 2026 decision extended it to tax periods ending by 31 December 2029. You must still register and file.","يخضع الدخل الخاضع للضريبة حتى 375,000 درهم لنسبة 0%، وما زاد عليه لنسبة 9%. وإذا كانت إيراداتك 3 ملايين درهم أو أقل في الفترة الحالية وكل الفترات السابقة، يمكنك اختيار إعفاء الأعمال الصغيرة فتُعامَل كأنه لا دخل خاضعاً للضريبة لديك. ومدّد قرار صدر في 2026 الإعفاء ليشمل الفترات الضريبية المنتهية حتى 31 ديسمبر 2029. ويبقى عليك التسجيل وتقديم الإقرار."],"w":["business","emirati","resident"],"st":[["Add up your revenue (sales, not profit) for this and every earlier tax period.","اجمع إيراداتك (المبيعات لا الأرباح) للفترة الحالية وكل الفترات السابقة.",170],["If it is AED 3 million or less each time, elect the relief in that period's return.","إذا كانت 3 ملايين درهم أو أقل في كل مرة، فاختر الإعفاء في إقرار تلك الفترة.",159],["If not, pay 0% on the first AED 375,000 of taxable income and 9% on the rest.","وإلا فادفع 0% على أول 375,000 درهم من الدخل الخاضع للضريبة، و9% على الباقي.",159]],"f":[["Taxable income up to AED 375,000 is taxed at 0%; income above it at 9%.","الدخل الخاضع للضريبة حتى 375,000 درهم نسبته 0%، وما زاد عليه 9%.",0],["The relief needs revenue of AED 3 million or less in the current and all previous tax periods, and is elected for each period.","يشترط الإعفاء ألا تتجاوز الإيرادات 3 ملايين درهم في الفترة الحالية وكل الفترات السابقة، ويُختار عن كل فترة.",1],["Qualifying Free Zone Persons and members of multinational groups with revenue over AED 3.15 billion cannot claim it.","لا يحق للشخص المؤهل في المنطقة الحرة ولا لأعضاء المجموعات متعددة الجنسيات التي تتجاوز إيراداتها 3.15 مليار درهم المطالبة به.",1],["Ministerial Decision No. 131 of 2026 extends the relief to tax periods ending on or before 31 December 2029.","يمدّد القرار الوزاري رقم 131 لسنة 2026 الإعفاء ليشمل الفترات الضريبية المنتهية في 31 ديسمبر 2029 أو قبله.",2]],"dp":[["other","Once revenue passes AED 3 million in any period, the relief is closed for all later periods.","إذا تجاوزت الإيرادات 3 ملايين درهم في أي فترة، فلا يمكن استخدام الإعفاء في الفترات اللاحقة."]],"c":["The test uses revenue, not profit. In a relief period no other exemptions, reliefs or deductions apply. General information, not tax advice.","يعتمد الشرط على الإيرادات لا الأرباح. وفي فترة الإعفاء لا تُطبَّق إعفاءات أو خصومات أخرى. هذه معلومات عامة وليست استشارة ضريبية."],"au":"fta","l":[171,172,173],"so":[[174,10,175],[176,164,177],[178,179,180]],"v":1,"ch":["2026-08","The relief was due to end with tax periods ending in 2026; it now runs to 31 December 2029.","كان الإعفاء سينتهي مع الفترات المنتهية في 2026، وأصبح ممتداً حتى 31 ديسمبر 2029.",2]},{"id":"business-vat-registration","q":["When must my business register for VAT?","متى يجب أن تسجل منشأتي في ضريبة القيمة المضافة؟"],"k":["vat registration threshold uae","when do i need to register for vat dubai","vat 375000 or 187500","vat registraion freelancer uae","متى لازم اسجل في الضريبة المضافة","حد التسجيل في ضريبة القيمة المضافة","التسجيل الطوعي في الضريبه 187500"],"a":["You must register for VAT when your taxable sales and imports passed AED 375,000 in the past 12 months, or will in the next 30 days. Apply on EmaraTax within 30 days of crossing that line. Above AED 187,500 you may register by choice. VAT is 5%, registration is free, and you then file a return for every tax period.","يجب التسجيل في ضريبة القيمة المضافة إذا تجاوزت مبيعاتك ووارداتك الخاضعة للضريبة 375,000 درهم خلال آخر 12 شهراً، أو يُتوقع تجاوزها خلال 30 يوماً القادمة. قدّم الطلب عبر إمارات تاكس خلال 30 يوماً من تجاوز الحد. ويمكنك التسجيل اختيارياً فوق 187,500 درهم. نسبة الضريبة 5%، والتسجيل مجاني، وبعده تقدّم إقراراً عن كل فترة ضريبية."],"w":["business","emirati","resident"],"st":[["Add up taxable sales and imports for the past 12 months and the next 30 days.","اجمع مبيعاتك ووارداتك الخاضعة للضريبة لآخر 12 شهراً وللـ30 يوماً القادمة.",181],["Apply with your licence, owners' IDs and a signed sales declaration; the number comes within 20 business days.","قدّم الطلب مع الرخصة وهويات الملاك وإقرار موقّع بالمبيعات، ويصدر الرقم الضريبي خلال 20 يوم عمل.",158],["Charge 5% VAT on taxable sales and file every return on time.","أضف ضريبة 5% على المبيعات الخاضعة للضريبة، وقدّم كل إقرار في موعده.",159]],"d":[["Signed sales declaration, with invoices or contracts as proof","إقرار موقّع بالمبيعات، مع فواتير أو عقود كإثبات"]],"f":[["Registration is mandatory if taxable supplies and imports exceed AED 375,000 over the past 12 months, or will within the next 30 days.","التسجيل إلزامي إذا تجاوزت التوريدات والواردات الخاضعة للضريبة 375,000 درهم خلال آخر 12 شهراً، أو يُتوقع ذلك خلال 30 يوماً القادمة.",0],["Voluntary registration starts above AED 187,500; taxable expenses can count.","يبدأ التسجيل الاختياري فوق 187,500 درهم، ويمكن احتساب المصروفات الخاضعة للضريبة.",0],["Apply within 30 days of becoming required to register. It is free and takes up to 20 business days.","قدّم الطلب خلال 30 يوماً من وجوب التسجيل، والخدمة مجانية وتستغرق حتى 20 يوم عمل.",0],["The standard VAT rate is 5%.","النسبة الأساسية لضريبة القيمة المضافة 5%.",1]],"dp":[["other","Startups with costs but no sales yet can register by choice based on taxable expenses.","يمكن للمشاريع الناشئة التي لديها مصروفات دون مبيعات التسجيل اختيارياً على أساس المصروفات الخاضعة للضريبة."],["status","A non-resident business must register for any taxable supply in the UAE, whatever its size, unless someone in the UAE must pay the VAT.","على المنشأة غير المقيمة التسجيل عند أي توريد خاضع للضريبة في الدولة أياً كان حجمه، ما لم يكن شخص في الدولة ملزماً بدفع الضريبة."]],"c":["Late registration brings a penalty; some penalty amounts changed recently, so check tax.gov.ae. VAT and corporate tax are separate registrations.","التأخر في التسجيل يعرّضك لغرامة، وقد تغيّرت بعض مبالغ الغرامات مؤخراً، فراجع موقع الهيئة. والتسجيل في ضريبة القيمة المضافة منفصل عن ضريبة الشركات."],"au":"fta","l":[182,161,183],"so":[[184,164,185],[186,10,187],[188,164,189]],"v":1,"ch":["2026-04","Cabinet Decision No. 129 of 2025 changed several VAT and excise penalty amounts from 14 April 2026.","عدّل قرار مجلس الوزراء رقم 129 لسنة 2025 عدداً من غرامات ضريبة القيمة المضافة والضريبة الانتقائية اعتباراً من 14 أبريل 2026.",2],"cl":{"kind":"deadline","fact":2,"days":30,"label":{"en":"Last day to apply for VAT registration","ar":"آخر يوم لطلب التسجيل في ضريبة القيمة المضافة"},"start":{"en":"Date you passed the registration threshold","ar":"تاريخ تجاوزك حد التسجيل"}}},{"id":"business-e-invoicing","q":["When do I have to start e-invoicing, and what do I need to do?","متى يجب أن أبدأ بالفوترة الإلكترونية؟ وماذا عليّ أن أفعل؟"],"k":["uae e-invoicing deadline","e invoicing mandatory date uae 2027","einvoicing accredited service provider deadline","e-invoice fine uae","الفوترة الالكترونية الامارات موعد","مزود خدمة معتمد للفوترة الإلكترونية","الفوتره الالكترونيه للشركات الصغيرة"],"a":["E-invoicing covers business-to-business and business-to-government sales. Businesses with yearly revenue of AED 50 million or more had to appoint an accredited service provider by 30 October 2026 and go live by 1 January 2027. Smaller ones appoint one by 31 March 2027 and go live on 1 July 2027. Missing this can cost AED 5,000 a month.","تشمل الفوترة الإلكترونية المعاملات بين الشركات، وبين الشركات والجهات الحكومية. وكان على الشركات التي تبلغ إيراداتها السنوية 50 مليون درهم أو أكثر تعيين مزود خدمة معتمد بحلول 30 أكتوبر 2026 والبدء في موعد أقصاه 1 يناير 2027. أما الأصغر فتعيّن مزوداً بحلول 31 مارس 2027 وتبدأ في 1 يوليو 2027. والتأخر قد يكلّف 5,000 درهم شهرياً."],"w":["business"],"st":[["Check your yearly revenue against the AED 50 million line.","قارن إيراداتك السنوية بحد 50 مليون درهم.",170],["Sign up with an accredited service provider (ASP) from the Ministry of Finance list.","تعاقد مع مزود خدمة معتمد من قائمة وزارة المالية.",190],["Set up your system to issue and receive e-invoices through the ASP.","جهّز نظامك لإصدار الفواتير الإلكترونية واستلامها عبر المزود.",191]],"f":[["Scope: all business-to-business (B2B) and business-to-government (B2G) transactions.","النطاق: جميع المعاملات بين الشركات (B2B) وبين الشركات والحكومة (B2G).",0],["Revenue of AED 50 million or more: appoint a provider by 30 October 2026 (was 31 July) and go live by 1 January 2027.","الإيرادات 50 مليون درهم أو أكثر: تعيين المزود بحلول 30 أكتوبر 2026 (بدلاً من 31 يوليو) والبدء في موعد أقصاه 1 يناير 2027.",1],["Revenue below AED 50 million: appoint by 31 March 2027, go live 1 July 2027. Government entities: 31 March and 1 October 2027.","الإيرادات أقل من 50 مليون درهم: التعيين بحلول 31 مارس 2027 والبدء في 1 يوليو 2027. والجهات الحكومية: 31 مارس و1 أكتوبر 2027.",0],["Not implementing or not appointing a provider: AED 5,000, then AED 5,000 a month, capped at AED 50,000 in 12 months.","عدم التطبيق أو عدم تعيين مزود: 5,000 درهم ثم 5,000 درهم شهرياً، بحد أقصى 50,000 درهم خلال 12 شهراً.",2]],"dp":[["other","Your dates depend on whether yearly revenue is AED 50 million or more; government entities come last.","تعتمد مواعيدك على ما إذا كانت إيراداتك السنوية 50 مليون درهم أو أكثر، وتأتي الجهات الحكومية أخيراً."]],"c":["The 30 October 2026 date has passed, so a large business without a provider should act now. Some transactions are excluded; check mof.gov.ae.","انقضى موعد 30 أكتوبر 2026، فعلى الشركة الكبيرة التي لم تعيّن مزوداً أن تتحرك فوراً. وبعض المعاملات مستثناة، فراجع موقع وزارة المالية."],"au":"mof","l":[192,193,194],"so":[[195,179,196],[197,179,198],[199,179,194]],"v":1,"ch":["2026-10","Cabinet Decision No. 173 of 2026 set the e-invoicing fines, replacing Decision No. 106 of 2025.","حدّد قرار مجلس الوزراء رقم 173 لسنة 2026 غرامات الفوترة الإلكترونية بدلاً من القرار رقم 106 لسنة 2025.",2]},{"id":"business-ubo-register","q":["What is the beneficial owner (UBO) register, and does my company need one?","ما سجل المستفيد الحقيقي، وهل تحتاجه شركتي؟"],"k":["ubo declaration uae","beneficial owner register dubai company","ultimate beneficial owner form free zone","ubo fine uae","سجل المستفيد الحقيقي","نموذج المستفيد الحقيقي للشركات","غرامة عدم تقديم بيانات المستفيد الحقيقي"],"a":["Most licensed companies, including those in commercial free zones, must keep a register of their beneficial owners: the people who own or control 25% or more, or control the company in other ways. Give it and your partners' register to your licensing authority within 60 days of licensing, and report changes within 15 days. Financial free zones and fully government-owned companies are exempt.","يجب على معظم الشركات المرخصة، ومنها شركات المناطق الحرة التجارية، الاحتفاظ بسجل للمستفيدين الحقيقيين، وهم الأشخاص الذين يملكون 25% أو أكثر أو يسيطرون على الشركة بطرق أخرى. قدّمه مع سجل الشركاء إلى جهة الترخيص خلال 60 يوماً من الترخيص، وأبلغ عن أي تغيير خلال 15 يوماً. وتُستثنى المناطق الحرة المالية والشركات المملوكة بالكامل للحكومة."],"w":["business"],"s":["private","free-zone"],"st":[["Identify every person who owns or controls 25% or more, directly or through other companies.","حدد كل شخص يملك أو يسيطر على 25% أو أكثر، مباشرة أو عبر شركات أخرى.",200],["Submit the beneficial owner and partners registers within 60 days of licensing.","قدّم سجل المستفيدين الحقيقيين وسجل الشركاء خلال 60 يوماً من الترخيص.",201],["Report any change within 15 days.","أبلغ عن أي تغيير خلال 15 يوماً.",202]],"d":[["Each owner's full name, nationality, date and place of birth, address, and passport or ID details","الاسم الكامل لكل مستفيد وجنسيته وتاريخ ومكان ميلاده وعنوانه وبيانات جوازه أو هويته"]],"f":[["A beneficial owner owns or controls 25% or more of the capital or votes, directly or through a chain, or can appoint or remove most directors.","المستفيد الحقيقي من يملك أو يسيطر على 25% أو أكثر من رأس المال أو حقوق التصويت، مباشرة أو عبر سلسلة ملكية، أو يملك تعيين أغلب المديرين أو عزلهم.",0],["The registers go to the Registrar within 60 days of licensing; any data change is reported within 15 days.","تُقدَّم السجلات إلى المسجل خلال 60 يوماً من الترخيص، ويُبلَّغ عن أي تغيير في البيانات خلال 15 يوماً.",0],["Exempt: companies wholly owned by federal or local government and their wholly owned companies, and financial free zones.","يُستثنى: الشركات المملوكة بالكامل للحكومة الاتحادية أو المحلية والشركات المملوكة لها بالكامل، والمناطق الحرة المالية.",0],["Most violations bring a written notice first; repeats bring fines of AED 5,000 to AED 100,000, and after a third the licence can be suspended.","تبدأ أغلب المخالفات بإنذار كتابي، وتؤدي المخالفة المتكررة إلى غرامات من 5,000 إلى 100,000 درهم، وبعد الثالثة يجوز تعليق الرخصة.",1]],"dp":[["other","If no one reaches 25%, record whoever controls the company by other means, or failing that, senior management.","إذا لم يبلغ أحد 25%، فسجّل من يسيطر على الشركة بطرق أخرى، وإلا فالإدارة العليا."]],"c":["Companies in financial free zones follow their zone's own rules. Nominee directors must tell the company within 15 days. Not legal advice.","تتبع شركات المناطق الحرة المالية قواعد منطقتها. وعلى عضو مجلس الإدارة الصوري إبلاغ الشركة خلال 15 يوماً. هذه ليست استشارة قانونية."],"au":"economy","l":[203,204,205],"so":[[206,207,205],[208,207,209]],"v":1},{"id":"business-mainland-vs-free-zone","q":["Should I set up on the mainland or in a free zone? Can a free zone company work on the mainland?","هل أؤسس شركتي في البر الرئيسي أم في منطقة حرة؟ وهل يمكن لشركة المنطقة الحرة العمل في البر الرئيسي؟"],"k":["mainland vs free zone uae","can free zone company work in mainland dubai","free zone mainland operating permit","100% ownership mainland dubai","الفرق بين المنطقة الحرة والبر الرئيسي","شركة منطقة حرة تشتغل داخل دبي","رخصة مين لاند ولا فري زون"],"a":["A mainland company can sell anywhere in the UAE, and foreigners can own up to 100% of most mainland activities. A free zone company trades inside its zone and abroad, but generally needs a licensed distributor or a mainland branch to sell on the mainland. In Dubai, free zone firms with a Dubai Unified Licence can get a 6-month mainland permit for AED 5,000.","تستطيع شركة البر الرئيسي البيع في أي مكان في الدولة، ويمكن للأجانب تملك حتى 100% من معظم أنشطتها. أما شركة المنطقة الحرة فتتعامل داخل منطقتها ومع الخارج، وتحتاج عادة إلى موزع مرخص أو فرع في البر الرئيسي للبيع فيه. وفي دبي، يمكن لشركات المناطق الحرة الحاصلة على رخصة دبي الموحدة الحصول على تصريح للعمل في البر الرئيسي لمدة 6 أشهر مقابل 5,000 درهم."],"w":["business","emirati","resident"],"s":["private","free-zone"],"st":[["For the mainland, get a licence from your emirate's economic department; for a free zone, apply to a zone that licenses your activity.","للبر الرئيسي احصل على رخصة من الدائرة الاقتصادية في إمارتك، وللمنطقة الحرة قدّم إلى منطقة ترخّص نشاطك.",210],["Dubai free zone company with mainland clients: apply for the mainland operating permit online.","شركة منطقة حرة في دبي لديها عملاء في البر الرئيسي: قدّم إلكترونياً على تصريح العمل في البر الرئيسي.",211]],"f":[["Foreigners can own up to 100% of most mainland companies; defence, telecoms, banking and insurance, commercial agencies and a few other activities are excluded.","يمكن للأجانب تملك حتى 100% من معظم شركات البر الرئيسي، وتُستثنى أنشطة مثل الدفاع والاتصالات والبنوك والتأمين والوكالات التجارية وأنشطة قليلة أخرى.",0],["Free zone companies generally cannot sell directly on the mainland; they use a licensed mainland distributor or a mainland branch or company.","لا يُسمح لشركات المناطق الحرة عادة بالبيع مباشرة في البر الرئيسي، فتعمل عبر موزع مرخص أو فرع أو شركة فيه.",1],["Dubai's Free Zone Mainland Operating Permit costs AED 5,000, lasts 6 months, renews for the same fee and needs a Dubai Unified Licence.","تصريح العمل في البر الرئيسي لشركات المناطق الحرة في دبي رسومه 5,000 درهم ومدته 6 أشهر، ويُجدد بالرسوم نفسها، ويتطلب رخصة دبي الموحدة.",2],["Mainland income under the permit is subject to 9% corporate tax and needs separate accounts.","يخضع دخل البر الرئيسي بموجب التصريح لضريبة الشركات بنسبة 9%، ويتطلب حسابات منفصلة.",2]],"dp":[["emirate","The operating permit is a Dubai scheme. Elsewhere, ask your free zone and the local economic department.","تصريح العمل نظام خاص بدبي، وفي الإمارات الأخرى اسأل منطقتك الحرة والدائرة الاقتصادية المحلية."],["other","The permit first covers non-regulated activities such as consultancy, design and trading; regulated sectors are to be added later.","يشمل التصريح أولاً الأنشطة غير المنظمة مثل الاستشارات والتصميم والتجارة، على أن تُضاف القطاعات المنظمة لاحقاً."]],"c":["Free zone tax benefits cover only qualifying income. Check with your free zone before you sign a lease.","تقتصر مزايا المناطق الحرة الضريبية على الدخل المؤهل. تأكد من منطقتك الحرة قبل توقيع عقد الإيجار."],"au":"det-dubai","l":[212,161,213],"so":[[214,10,215],[216,10,217],[218,219,220]],"v":1,"ch":["2025-10","Dubai launched a permit that lets free zone companies work on the mainland, under Executive Council Resolution No. 11 of 2025.","أطلقت دبي تصريحاً يتيح لشركات المناطق الحرة العمل في البر الرئيسي بموجب قرار المجلس التنفيذي رقم 11 لسنة 2025.",2]},{"id":"business-advertiser-permit","q":["Do I need a permit to advertise or promote products on Instagram, TikTok or Snapchat?","هل أحتاج تصريحاً للإعلان أو الترويج للمنتجات على إنستغرام أو تيك توك أو سناب شات؟"],"k":["advertiser permit uae","influencer license uae 2026","do i need license to advertise on instagram dubai","tiktok promotion permit uae","advertizer permit fee","تصريح معلن الامارات","رخصة مشاهير السوشل ميديا","هل احتاج رخصة اعلان في الانستقرام"],"a":["Yes. Anyone who publishes advertising or media content on social media or other digital platforms, paid or unpaid, needs a permit from the National Media Authority (NMA). You need a commercial licence and must finish the NMA's training. The permit is free for the first 3 years, then costs AED 1,000. Visitors apply through a licensed UAE advertising agency.","نعم. كل من ينشر محتوى إعلانياً أو إعلامياً على وسائل التواصل الاجتماعي أو المنصات الرقمية الأخرى، بمقابل أو دونه، يحتاج تصريحاً من الهيئة الوطنية للإعلام. وتحتاج رخصة تجارية وإكمال برنامج التدريب لدى الهيئة. والتصريح مجاني في أول 3 سنوات، ثم رسومه 1,000 درهم. أما الزوار فيقدّمون عبر وكالة إعلان مرخصة في الدولة."],"st":[["Get a commercial licence that covers your activity, if you do not have one.","احصل على رخصة تجارية تغطي نشاطك إن لم تكن لديك.",221],["Complete the NMA training on media laws and content standards.","أكمل برنامج التدريب لدى الهيئة حول قوانين الإعلام ومعايير المحتوى.",222],["Apply online; a decision takes 3 working days, and any fee is paid after approval.","قدّم الطلب إلكترونياً، ويصدر القرار خلال 3 أيام عمل، وتُدفع الرسوم بعد الموافقة.",223]],"d":[["Digital ID, passport, personal photo and commercial licence","الهوية الرقمية وجواز السفر وصورة شخصية والرخصة التجارية"]],"f":[["The permit covers individuals who publish advertising or media content on social media, websites or other digital platforms, paid or free.","يشمل التصريح الأفراد الذين ينشرون محتوى إعلانياً أو إعلامياً على وسائل التواصل أو المواقع أو المنصات الرقمية الأخرى، بمقابل أو مجاناً.",0],["Fee: free for the first 3 years, then AED 1,000. Processing takes 3 working days.","الرسوم: مجاني في أول 3 سنوات، ثم 1,000 درهم. ومدة الإنجاز 3 أيام عمل.",0],["Conditions: good conduct, the NMA training done, no previously cancelled permit and nothing owed to the authority.","الشروط: حسن السيرة، وإكمال تدريب الهيئة، وعدم إلغاء تصريح سابق، وعدم وجود مستحقات للهيئة.",0],["Visitors apply through a licensed UAE advertising agency, must be 18 or older, and get 3 months, extendable up to 6 in total, for AED 500.","يقدّم الزوار عبر وكالة إعلان مرخصة في الدولة، ويُشترط ألا يقل العمر عن 18 سنة، ومدة التصريح 3 أشهر قابلة للتمديد حتى 6 أشهر إجمالاً، مقابل 500 درهم.",1],["The NMA is a federal authority set up under Federal Decree-Law No. 11 of 2025 to regulate and license media.","الهيئة الوطنية للإعلام جهة اتحادية أُنشئت بموجب المرسوم بقانون اتحادي رقم 11 لسنة 2025 لتنظيم الإعلام وترخيصه.",2]],"dp":[["status","Visitors use a separate, temporary permit through a licensed agency.","يستخدم الزوار تصريحاً مؤقتاً منفصلاً عبر وكالة مرخصة."],["other","Free promotion still counts: the permit covers paid and unpaid content.","الترويج المجاني مشمول أيضاً، فالتصريح يغطي المحتوى المدفوع وغير المدفوع."]],"c":["Older articles name the UAE Media Council; the National Media Authority now lists this permit. Every post must meet media content standards. Not legal advice.","تذكر المقالات القديمة مجلس الإمارات للإعلام، أما الآن فتعرض الهيئة الوطنية للإعلام هذا التصريح. ويجب أن يلتزم كل منشور بمعايير المحتوى الإعلامي. هذه ليست استشارة قانونية."],"au":"media-council","l":[224,161,225],"so":[[226,222,227],[228,222,229],[230,222,231]],"v":1},{"id":"business-trade-licence","q":["How do I get a trade licence for a mainland business in Dubai, Abu Dhabi or Sharjah?","كيف أحصل على رخصة تجارية لنشاط في البر الرئيسي في دبي أو أبوظبي أو الشارقة؟"],"k":["how to get trade license dubai","trade licence abu dhabi steps","sharjah trade license new","initial approval trade name dubai","طريقة استخراج رخصة تجارية","رخصة تجارية دبي خطوات","كيف اطلع رخصه تجاريه في ابوظبي"],"a":["Licences come from your emirate's economic department: DET in Dubai, ADDED through TAMM in Abu Dhabi, and SEDD in Sharjah. Choose your activity and legal form, reserve a trade name, get initial approval, sign the company papers, rent premises, then pay and collect the licence. Initial approval does not let you trade. Pay within 30 days of the payment voucher.","تصدر الرخص من الدائرة الاقتصادية في إمارتك: دائرة الاقتصاد والسياحة في دبي، ودائرة التنمية الاقتصادية عبر «تم» في أبوظبي، ودائرة التنمية الاقتصادية في الشارقة. اختر النشاط والشكل القانوني، واحجز الاسم التجاري، واحصل على الموافقة المبدئية، ووقّع عقود الشركة، واستأجر المقر، ثم ادفع واستلم الرخصة. الموافقة المبدئية لا تسمح بمزاولة النشاط. وادفع خلال 30 يوماً من إشعار الدفع."],"w":["business","emirati","resident"],"s":["private"],"st":[["Pick your activity from over 2,000 options, a legal form and a trade name, and get initial approval.","اختر نشاطك من أكثر من 2,000 نشاط، وشكلاً قانونياً واسماً تجارياً، واحصل على الموافقة المبدئية.",232],["Sign and attest the memorandum of association, and a local service agent contract if needed.","وقّع عقد التأسيس ووثّقه، وكذلك عقد وكيل الخدمات المحلي إن لزم.",233],["Rent premises; in Dubai, register the lease in Ejari.","استأجر المقر، وفي دبي سجّل العقد في إيجاري.",234],["Submit documents and any extra approvals, pay within 30 days, and collect the licence.","قدّم المستندات وأي موافقات إضافية، وادفع خلال 30 يوماً، واستلم الرخصة.",235]],"d":[["Initial approval receipt, attested lease and attested memorandum of association","إيصال الموافقة المبدئية وعقد الإيجار الموثق وعقد التأسيس الموثق"],["Approvals from other authorities, if your activity needs them","موافقات الجهات الأخرى إن تطلبها نشاطك"]],"f":[["There are over 2,000 business activities. Initial approval means no objection; it does not let you run the business.","هناك أكثر من 2,000 نشاط تجاري. والموافقة المبدئية تعني عدم الممانعة، ولا تسمح بمزاولة النشاط.",0],["Licence fees must be paid within 30 days of the payment voucher, or the application is cancelled.","يجب دفع رسوم الرخصة خلال 30 يوماً من إشعار الدفع، وإلا يُلغى الطلب.",0],["Businesses wholly owned by non-GCC nationals need a local service agent, under an attested contract.","تحتاج المنشآت المملوكة بالكامل لغير مواطني دول مجلس التعاون إلى وكيل خدمات محلي بعقد موثق.",0],["Foreign investors need approval from the residency department before initial approval.","يحتاج المستثمر الأجنبي موافقة إدارة الإقامة وشؤون الأجانب قبل الموافقة المبدئية.",0]],"dp":[["emirate","Dubai uses DET, Invest in Dubai and Ejari; Abu Dhabi uses ADDED through TAMM; Sharjah uses SEDD. Each sets its own fees and steps.","في دبي: دائرة الاقتصاد والسياحة ومنصة استثمر في دبي وإيجاري. وفي أبوظبي: دائرة التنمية الاقتصادية عبر «تم». وفي الشارقة: دائرة التنمية الاقتصادية. ولكل منها رسومها وخطواتها."],["status","Emiratis and other GCC nationals do not need a local service agent.","لا يحتاج المواطنون ومواطنو دول مجلس التعاون إلى وكيل خدمات محلي."]],"c":["Fees differ by emirate, activity and licence type, so get a quote first. Regulated activities such as health or education need the regulator's approval first.","تختلف الرسوم حسب الإمارة والنشاط ونوع الرخصة، فاطلب تقديراً أولاً. وتحتاج الأنشطة المنظمة مثل الصحة أو التعليم موافقة الجهة الرقابية أولاً."],"au":"u-ae","l":[236,161,237],"so":[[238,10,239]],"v":1},{"id":"business-emirati-support-funds","q":["I am Emirati and want to start a business. Where can I get funding or support?","أنا مواطن وأريد بدء مشروع. من أين أحصل على تمويل أو دعم؟"],"k":["funding for emirati entrepreneurs","khalifa fund loan requirements","sme support uae nationals","national sme programme membership","دعم المشاريع للمواطنين","صندوق خليفة تمويل مشروع","قرض مشروع صغير للمواطنين","برنامج رواد الشارقه تمويل"],"a":["Support depends on your emirate. Federally, the National SME Programme at the Ministry of Economy and Tourism offers financing, training and access to government purchases, and SMEs get at least 10% of federal procurement. In Abu Dhabi, the Khalifa Fund lends to Emirati-owned businesses. Dubai has Dubai Founders HQ, Sharjah has Ruwad, Ras Al Khaimah has the Saud bin Saqr Establishment, and Ajman has Reyada.","يعتمد الدعم على إمارتك. على المستوى الاتحادي، يقدّم البرنامج الوطني للمشاريع والمنشآت الصغيرة والمتوسطة في وزارة الاقتصاد والسياحة تمويلاً وتدريباً وفرصاً في المشتريات الحكومية، وتحصل هذه المشاريع على 10% على الأقل من المشتريات الاتحادية. وفي أبوظبي يموّل صندوق خليفة المشاريع المملوكة للمواطنين، وفي دبي «دبي فاوندرز إتش كيو»، وفي الشارقة مؤسسة رواد، وفي رأس الخيمة مؤسسة سعود بن صقر، وفي عجمان برنامج ريادة."],"w":["emirati"],"s":["private"],"st":[["Join the National SME Programme to unlock federal benefits.","انضم إلى البرنامج الوطني للمشاريع الصغيرة والمتوسطة للاستفادة من المزايا الاتحادية.",240],["If your trade licence is 100% Emirati-owned, join the Khalifa Fund membership; it can waive licence fees in most emirates.","إذا كانت رخصتك مملوكة للمواطنين 100%، فانضم إلى عضوية صندوق خليفة، فقد تُعفيك من رسوم الرخصة في معظم الإمارات.",241],["For a Khalifa Fund loan, apply yourself through TAMM; a power of attorney is not accepted.","لطلب قرض من صندوق خليفة، قدّم بنفسك عبر منصة تم، ولا تُقبل الوكالة.",242],["Outside Abu Dhabi, apply to Dubai Founders HQ (Dubai), Ruwad (Sharjah), RAK SME (Ras Al Khaimah) or Reyada (Ajman).","خارج أبوظبي، قدّم إلى «دبي فاوندرز إتش كيو» (دبي) أو رواد (الشارقة) أو مؤسسة سعود بن صقر (رأس الخيمة) أو ريادة (عجمان).",243],["Register as a supplier to bid for the SME share of federal purchases.","سجّل كمورّد لتنافس على حصة المشاريع الصغيرة من المشتريات الاتحادية.",179]],"d":[["Emirates ID","الهوية الإماراتية"],["Trade licence","الرخصة التجارية"]],"f":[["The National SME Programme was set up by Federal Law No. 2 of 2014 and offers financing, training and access to government procurement.","أُنشئ البرنامج الوطني بموجب القانون الاتحادي رقم 2 لسنة 2014، ويقدّم تمويلاً وتدريباً وفرصاً في المشتريات الحكومية.",0],["SMEs get at least 10% of federal procurement each year, plus 10% extra on their bid evaluation score.","تحصل المشاريع الصغيرة والمتوسطة على 10% على الأقل من المشتريات الاتحادية سنوياً، و10% إضافية في درجة تقييم عروضها.",0],["Khalifa Fund loans need an Emirati owner aged 21-60 and an Abu Dhabi business running at least 2 years (3 for a new branch).","تشترط قروض صندوق خليفة مالكاً مواطناً عمره بين 21 و60 سنة، ومشروعاً في أبوظبي يعمل منذ سنتين على الأقل (3 للفرع الجديد).",1],["Khalifa Fund loan sizes: microfinance up to AED 500,000; small loans up to AED 1 million, or AED 2 million in manufacturing.","حدود قروض صندوق خليفة: التمويل الأصغر حتى 500,000 درهم، والقروض الصغيرة حتى مليون درهم، أو 2 مليون في الصناعة.",1],["Khalifa Fund membership needs a 100% Emirati trade licence and can waive licence issue and renewal fees in most emirates.","تشترط عضوية صندوق خليفة رخصة مملوكة للمواطنين 100%، وقد تعفي من رسوم إصدار الرخصة وتجديدها في معظم الإمارات.",1]],"dp":[["emirate","Each emirate runs its own fund; Khalifa Fund loans are only for businesses based in Abu Dhabi.","لكل إمارة صندوقها، وقروض صندوق خليفة مخصصة للمشاريع القائمة في أبوظبي فقط."],["other","A brand-new idea may start with training or incubation, since Khalifa Fund loans need 2 years of trading.","قد تبدأ الفكرة الجديدة بالتدريب أو الاحتضان، لأن قروض صندوق خليفة تشترط سنتين من النشاط."]],"c":["Each fund sets its own sectors, limits and terms, and these change often. Check eligibility on the fund's site before you sign a lease or borrow elsewhere.","يحدد كل صندوق قطاعاته وحدوده وشروطه، وهي تتغير كثيراً. تحقق من الأهلية على موقع الصندوق قبل توقيع عقد إيجار أو الاقتراض من جهة أخرى."],"au":"economy","so":[[244,245,246],[247,248,249]],"v":1},{"id":"business-hire-first-employee","q":["I want to hire my first employee. What do I need to do?","أريد توظيف أول موظف لدي. ما الذي يجب أن أفعله؟"],"k":["how to hire employee uae company","establishment card mohre","work permit for new employee dubai","employment visa process for company","quota approval mohre","كيف اوظف موظف في شركتي","بطاقة المنشأة وزارة الموارد البشرية","اصدار تصريح عمل لموظف جديد"],"a":["First register your business with MOHRE to get an establishment card and an e-signature card, and get a quota for how many staff you may hire. Then apply for a work permit with a signed job offer, and pay the fees within its 60 days. The employee enters on a 2-month entry permit, does a medical test and Emirates ID, and then gets a residence visa.","سجّل منشأتك أولاً لدى وزارة الموارد البشرية والتوطين للحصول على بطاقة المنشأة وبطاقة التوقيع الإلكتروني، واحصل على حصة تحدد عدد الموظفين المسموح بهم. ثم قدّم طلب تصريح العمل مع عرض وظيفي موقّع، وادفع الرسوم خلال مدة صلاحيته البالغة 60 يوماً. ويدخل الموظف بتصريح دخول مدته شهران، ويجري الفحص الطبي ويستخرج الهوية، ثم يحصل على الإقامة."],"w":["business"],"s":["private"],"st":[["Register the establishment to get its card, then the e-signature card after an inspection.","سجّل المنشأة لتحصل على بطاقتها، ثم بطاقة التوقيع الإلكتروني بعد التفتيش.",58],["Get quota approval for how many staff you may hire.","احصل على موافقة الحصة لعدد الموظفين المسموح بهم.",0],["Apply for the work permit with a signed job offer and the documents below.","قدّم طلب تصريح العمل مع عرض عمل موقّع والمستندات المذكورة أدناه.",0],["Pay the approval fees and guarantee within the permit's 60 days, or it is cancelled.","ادفع رسوم الموافقة والضمان خلال 60 يوماً من صلاحية التصريح، وإلا يُلغى.",250],["Get the entry permit, then the medical test, Emirates ID and residence visa within 2 months.","استخرج تصريح الدخول، ثم الفحص الطبي والهوية والإقامة خلال شهرين.",251]],"d":[["Copy of the business licence and the e-signature card","نسخة الرخصة التجارية وبطاقة التوقيع الإلكتروني"],["Worker's colour photo and passport valid at least 6 months","صورة ملونة للعامل وجواز سفر صالح 6 أشهر على الأقل"],["Qualifications attested by the Ministry of Foreign Affairs","المؤهلات مصدقة من وزارة الخارجية"]],"f":[["The e-signature card is required before you can apply for work permits.","بطاقة التوقيع الإلكتروني شرط قبل التقديم على تصاريح العمل.",0],["A work permit is valid 60 days; if fees and guarantee are not paid in time, it is cancelled.","صلاحية تصريح العمل 60 يوماً، وإذا لم تُدفع الرسوم والضمان خلالها يُلغى.",0],["Bank guarantee: AED 3,000 per employee, refundable after the employee leaves and the labour card is cancelled.","الضمان البنكي: 3,000 درهم عن كل موظف، ويُسترد بعد انتهاء خدمته وإلغاء بطاقة العمل.",0],["The work entry permit is valid 2 months; the medical test, Emirates ID and labour card follow within that time.","صلاحية تصريح دخول العمل شهران، ويُجرى خلالهما الفحص الطبي وتُستخرج الهوية وبطاقة العمل.",0],["The worker must be 18 or older, with a passport valid at least 6 months.","يجب ألا يقل عمر العامل عن 18 سنة، وأن يكون جوازه صالحاً 6 أشهر على الأقل.",0]],"dp":[["emirate","The company file, entry permit and visa go through GDRFA in Dubai; the Emirates ID goes through ICP.","يتم فتح ملف المنشأة وتصريح الدخول والإقامة عبر إقامة دبي في دبي، أما الهوية فعبر الهيئة الاتحادية للهوية والجنسية."],["other","Doctors, pharmacists, nurses and teachers also need approval from their sector authority.","يحتاج الأطباء والصيادلة والممرضون والمعلمون أيضاً موافقة الجهة المختصة بقطاعهم."],["sector","Free zone companies usually hire through their free zone authority instead of MOHRE.","تعيّن شركات المناطق الحرة عادة عبر سلطة المنطقة الحرة بدلاً من الوزارة."]],"c":["Other duties apply once staff start, such as paying wages through the Wage Protection System. Check current employer duties with MOHRE.","تترتب التزامات أخرى بعد بدء العمل، مثل دفع الأجور عبر نظام حماية الأجور. تحقق من التزامات صاحب العمل الحالية لدى الوزارة."],"au":"mohre","so":[[252,253,254]],"v":1,"h":"wage-guard"},{"id":"business-close-company","q":["How do I close my company and cancel the licence properly?","كيف أغلق شركتي وألغي الرخصة بالطريقة الصحيحة؟"],"k":["how to close company dubai","cancel trade license uae steps","company liquidation uae","deregister corporate tax after closing","vat deregistration cancel license","طريقة الغاء الرخصة التجارية","تصفية شركة في الامارات","الغاء التسجيل الضريبي بعد اغلاق الشركه"],"a":["Closing involves several offices. Pay your staff and cancel their visas first, then cancel the licence with your economic department or free zone, which may require a liquidation. Apply to deregister from VAT within 30 business days, and from corporate tax within 3 months of stopping business. VAT is closed only after the final return is approved and all tax and penalties are paid.","يتطلب الإغلاق المرور بعدة جهات. ادفع مستحقات موظفيك وألغِ إقاماتهم أولاً، ثم ألغِ الرخصة لدى الدائرة الاقتصادية أو المنطقة الحرة، وقد يتطلب ذلك تصفية. وقدّم طلب إلغاء التسجيل في ضريبة القيمة المضافة خلال 30 يوم عمل، وفي ضريبة الشركات خلال 3 أشهر من توقف النشاط. ولا يُلغى تسجيل ضريبة القيمة المضافة إلا بعد اعتماد الإقرار الأخير ودفع كل الضرائب والغرامات."],"w":["business"],"s":["private","free-zone"],"st":[["Pay final wages and end-of-service dues, and cancel all visas.","ادفع الأجور الأخيرة ومكافآت نهاية الخدمة، وألغِ جميع الإقامات.",255],["Pass an owners' resolution, appoint a liquidator if required, settle debts and fees, and cancel the licence.","أصدر قرار الملاك، وعيّن مصفّياً إن لزم، وسدّد الديون والرسوم، وألغِ الرخصة.",256],["Within 3 months, apply to deregister from corporate tax.","خلال 3 أشهر، قدّم طلب إلغاء التسجيل في ضريبة الشركات.",159],["Within 30 business days, apply to deregister from VAT; file the final return and pay within 28 days of deregistration.","خلال 30 يوم عمل، قدّم طلب إلغاء التسجيل في ضريبة القيمة المضافة، وقدّم الإقرار الأخير وادفع خلال 28 يوماً من إلغاء التسجيل.",159]],"d":[["Licence cancellation certificate and financial statements up to the cancellation date","شهادة إلغاء الرخصة والقوائم المالية حتى تاريخ الإلغاء"],["Liquidation letter and owners' or board resolution","خطاب التصفية وقرار الملاك أو مجلس الإدارة"]],"f":[["Corporate tax: apply to deregister within 3 months of the business stopping, dissolving or being liquidated.","ضريبة الشركات: يُقدَّم طلب إلغاء التسجيل خلال 3 أشهر من توقف النشاط أو الحل أو التصفية.",0],["For a closure, the FTA asks for the licence cancellation and financial statements up to that date. It is free and takes up to 40 working days.","عند الإغلاق تطلب الهيئة مستند إلغاء الرخصة والقوائم المالية حتى تاريخه، والخدمة مجانية وتستغرق حتى 40 يوم عمل.",1],["VAT: apply to deregister within 30 business days of the obligation arising. It is free and takes up to 30 business days.","ضريبة القيمة المضافة: يُقدَّم طلب إلغاء التسجيل خلال 30 يوم عمل من نشوء الالتزام، والخدمة مجانية وتستغرق حتى 30 يوم عمل.",2],["VAT is closed only after the final return is approved and all tax and penalties are paid; that return is due within 28 days of deregistration.","لا يُلغى تسجيل ضريبة القيمة المضافة إلا بعد اعتماد الإقرار الأخير ودفع كل الضرائب والغرامات، ويُستحق هذا الإقرار خلال 28 يوماً من إلغاء التسجيل.",2]],"dp":[["sector","Free zone companies close through their free zone; mainland ones through their emirate's economic department.","تُغلق شركات المناطق الحرة عبر منطقتها، وشركات البر الرئيسي عبر الدائرة الاقتصادية في إمارتها."],["emirate","V
