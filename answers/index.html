ff and others who need approval to marry need a no-objection letter.","الزواج من غير مواطن يتطلب مستندات إضافية، ويحتاج منتسبو القوات المسلحة وغيرهم ممن يلزمهم إذن بالزواج إلى رسالة عدم ممانعة."]],"c":["A foreign contract needs an Arabic translation attested by the UAE embassy and MOFA. If your case does not fit these groups, ask ICP.","يحتاج العقد الصادر في الخارج إلى ترجمة عربية مصدقة من سفارة الدولة ووزارة الخارجية. وإذا لم تنطبق حالتك على هذه الفئات فاسأل الهيئة."],"au":"icp","so":[[444,4,445],[446,4,32]],"v":1},{"id":"emirati-passport-renewal","q":["How do I renew my Emirati passport, and how much does it cost?","كيف أجدد جواز سفري الإماراتي، وكم الرسوم؟"],"k":["renew emirati passport","uae passport renewal fees citizen","renew passport for my child uae national","تجديد الجواز الاماراتي","رسوم تجديد جواز السفر للمواطنين","تجديد جواز ولدي"],"a":["You can renew when your passport has 1 year or less left, or has expired. Apply in the ICP app or website with UAE PASS. Fees are AED 10 to apply, plus AED 90 for a 10-year passport (age 21 and over) or AED 40 for a 5-year one (under 21), and AED 15 for delivery. It takes about 2 days.","يمكنك التجديد إذا بقيت على انتهاء جوازك سنة أو أقل أو إذا انتهى. قدّم الطلب عبر تطبيق الهيئة الاتحادية للهوية والجنسية أو موقعها بالهوية الرقمية. والرسوم 10 دراهم للطلب، و90 درهماً لجواز صالح 10 سنوات (لمن عمره 21 سنة فأكثر) أو 40 درهماً لجواز صالح 5 سنوات (لمن هو دون 21)، و15 درهماً للتوصيل، وتستغرق الخدمة نحو يومين."],"w":["emirati"],"st":[["Log in with UAE PASS and choose 'Renewal Passport'.","سجّل الدخول بالهوية الرقمية واختر خدمة «تجديد جواز السفر».",441],["Upload a recent ICAO-standard photo that differs from your current passport photo, then pay.","ارفع صورة حديثة مطابقة لمعايير منظمة الطيران المدني الدولي ومختلفة عن صورة جوازك الحالي، ثم ادفع الرسوم.",29],["If asked, give fingerprints and a signature at a centre. The passport is then delivered.","إذا طُلب منك، فقدّم البصمة والتوقيع في أحد المراكز، ثم يُسلَّم الجواز بالتوصيل.",447],["Living abroad? Use ICP's 'Renewal of Passports for Citizens Residing Abroad' service.","تقيم في الخارج؟ استخدم خدمة الهيئة «تجديد جوازات المواطنين المقيمين في الخارج».",29]],"d":[["Recent personal photo meeting ICAO standards","صورة شخصية حديثة مطابقة لمعايير منظمة الطيران المدني الدولي"]],"f":[["Renewal is allowed once 1 year or less of validity is left, or after expiry.","يُسمح بالتجديد عندما تبقى على انتهاء الجواز سنة أو أقل، أو بعد انتهائه.",0],["Fees: AED 10 application; AED 40 for 5 years or AED 90 for 10 years; AED 15 delivery.","الرسوم: 10 دراهم للطلب، و40 درهماً لمدة 5 سنوات أو 90 درهماً لمدة 10 سنوات، و15 درهماً للتوصيل.",0],["Validity: 10 years for citizens aged 21 and over, 5 years under 21. Service time: about 2 days.","الصلاحية: 10 سنوات للمواطن البالغ 21 سنة فأكثر، و5 سنوات لمن هو دون 21. مدة الإنجاز: نحو يومين.",0],["Exempt from the fees: people covered by the Social Security Law, and people of determination and with autism.","يُعفى من الرسوم المشمولون بقانون الضمان الاجتماعي، وأصحاب الهمم والمصابون بالتوحد.",1]],"dp":[["other","Age decides validity and fee: under 21 gets 5 years, 21 and over gets 10 years.","يحدد العمر مدة الصلاحية والرسوم: 5 سنوات لمن هو دون 21، و10 سنوات لمن بلغ 21 فأكثر."],["status","Citizens abroad use a separate service. Social security recipients and people of determination pay no fees.","يستخدم المواطنون في الخارج خدمة مستقلة، ويُعفى المشمولون بالضمان الاجتماعي وأصحاب الهمم من الرسوم."]],"c":["To change your details or replace a full passport, ICP has a separate 'Replacement of passport' service. For a lost or damaged passport, ask ICP.","لتعديل بياناتك أو استبدال جواز امتلأت صفحاته، لدى الهيئة خدمة مستقلة هي «استبدال جواز السفر». ولفقدان الجواز أو تلفه، اسأل الهيئة."],"au":"icp","so":[[448,4,449],[450,4,32]],"v":1},{"id":"emirati-abu-dhabi-housing","q":["I'm an Emirati in Abu Dhabi. What housing help can I get, and is there extra support for newlyweds or big families?","أنا مواطن من أبوظبي. ما المساعدات السكنية المتاحة لي، وهل يوجد دعم إضافي للمتزوجين حديثاً أو الأسر الكبيرة؟"],"k":["abu dhabi housing loan emirati","adha housing benefit apply tamm","rental assistance newly married abu dhabi","قرض سكني ابوظبي للمواطنين","دعم الايجار للمتزوجين الجدد ابوظبي","خصم القرض السكني المولود الرابع"],"a":["The Abu Dhabi Housing Authority (ADHA) gives the emirate's citizens housing grants, loans and residential land. Newlyweds in the Medeem programme who have filed a housing application and earn up to AED 50,000 a month can get up to AED 75,000 in rent help. Families with a 4th, 5th or 6th child born after 8 July 2024 can get loan relief.","تقدم هيئة أبوظبي للإسكان لمواطني الإمارة منحاً وقروضاً سكنية وأراضي سكنية. ويمكن للمتزوجين حديثاً المسجلين في برنامج «مديم» ممن قدّموا طلب انتفاع سكني ولا يزيد دخلهم على 50,000 درهم شهرياً الحصول على دعم إيجار يصل إلى 75,000 درهم. وتحصل الأسر التي رُزقت بالطفل الرابع أو الخامس أو السادس بعد 8 يوليو 2024 على تخفيف في القرض."],"w":["emirati"],"m":["abu-dhabi"],"st":[["Apply for a housing benefit, such as a grant, land, or a purchase or construction loan.","قدّم طلب انتفاع سكني، مثل منحة أو أرض أو قرض شراء أو بناء.",451],["Newlyweds: join Medeem and file a housing application, then ask for rent help.","للمتزوجين حديثاً: سجّل في «مديم» وقدّم طلب انتفاع سكني، ثم اطلب دعم الإيجار.",452],["When a 4th, 5th or 6th child is born, apply for the loan deduction or a longer repayment term.","عند ولادة الطفل الرابع أو الخامس أو السادس، اطلب خصماً من القرض أو تمديد مدة السداد.",452]],"f":[["Newlywed rent help: up to AED 75,000, set by income and family size; valid 2 years, renewable up to 4 years in total.","دعم الإيجار للمتزوجين حديثاً: حتى 75,000 درهم حسب الدخل وحجم الأسرة، لمدة سنتين قابلة للتجديد حتى 4 سنوات إجمالاً.",0],["Rent help needs Medeem enrolment, income up to AED 50,000 a month, a filed housing application, no real estate owned, and a rented home in Abu Dhabi.","يشترط دعم الإيجار التسجيل في «مديم»، ودخلاً لا يزيد على 50,000 درهم شهرياً، وطلب انتفاع سكني مقدماً، وعدم تملك أي عقار، وأن يكون المسكن المستأجر في أبوظبي.",0],["Incomes of AED 21,000-50,000: AED 30,000 off the loan for the 4th child, AED 30,000 for the 5th and AED 40,000 for the 6th.","للدخل من 21,000 إلى 50,000 درهم: خصم 30,000 درهم من القرض عن الطفل الرابع، و30,000 عن الخامس، و40,000 عن السادس.",0],["Incomes above AED 50,000: 3 more years of loan term per 4th, 5th or 6th child, up to 25 years in total.","للدخل فوق 50,000 درهم: تمديد مدة القرض 3 سنوات عن كل من الطفل الرابع والخامس والسادس، بحد أقصى 25 سنة.",0],["Child relief covers children born after 8 July 2024 and ADHA construction, purchase or demolish-and-rebuild loans.","يشمل تخفيف القرض المواليد بعد 8 يوليو 2024، وقروض الهيئة للبناء أو الشراء أو الهدم وإعادة البناء.",0]],"dp":[["salary","Income sets the rent-help amount, and whether you get a loan deduction (AED 21,000-50,000) or a longer term (above AED 50,000).","يحدد الدخل قيمة دعم الإيجار، وهل تحصل على خصم من القرض (21,000-50,000 درهم) أو تمديد للمدة (فوق 50,000 درهم)."],["emirate","This is for Abu Dhabi citizens. Dubai citizens use MBRHE; others use the Sheikh Zayed Housing Programme or a local body.","هذه الخدمات لمواطني أبوظبي. ويتقدم مواطنو دبي إلى مؤسسة محمد بن راشد للإسكان، وغيرهم إلى برنامج الشيخ زايد للإسكان أو جهة محلية."]],"c":["ADHA's page gives no main loan or grant amounts, no documents, and no child relief for incomes under AED 21,000. Check with ADHA before you apply.","لا تذكر صفحة الهيئة قيم القروض والمنح الأساسية ولا المستندات، ولا تخفيفاً عن الأبناء لمن يقل دخله عن 21,000 درهم. تحقق من الهيئة قبل التقديم."],"au":"adha","so":[[438,439,440],[426,10,427]],"v":1,"ch":["2024-07","ADHA added loan relief for a 4th, 5th or 6th child born after 8 July 2024.","أضافت الهيئة تخفيفاً للقرض السكني عند ولادة الطفل الرابع أو الخامس أو السادس بعد 8 يوليو 2024.",0]},{"id":"emirati-national-service","q":["How long is national service, and who is exempt or can postpone it?","ما مدة الخدمة الوطنية، ومن يُعفى منها أو يمكنه تأجيلها؟"],"k":["national service duration uae","how long is national service emirati 11 months","only son exempt national service","postpone national service for university","مدة الخدمة الوطنية","اعفاء الابن الوحيد من الخدمة الوطنية","الخدمه الوطنيه كم شهر"],"a":["National service is mandatory for medically fit Emirati men and optional for women. It lasts 11 months with a high school diploma or higher, and 3 years for men who did not finish high school. Only sons and the medically unfit are permanently exempt. Students under 29 in a course of 2 years or more can postpone.","الخدمة الوطنية إلزامية للذكور المواطنين اللائقين طبياً واختيارية للإناث. ومدتها 11 شهراً لحملة الثانوية العامة فما فوق، و3 سنوات للذكور الذين لم يكملوا الثانوية. ويُعفى نهائياً الابن الوحيد وغير اللائق طبياً. ويمكن للطالب دون 29 سنة الملتحق بدراسة مدتها سنتان أو أكثر تأجيل الخدمة."],"w":["emirati"],"st":[["Check whether you are exempt (only son, medically unfit) or can postpone (studies).","تحقق مما إذا كنت معفى (ابن وحيد أو غير لائق طبياً) أو يحق لك التأجيل (الدراسة).",453],["If you work, tell your employer. It must let you serve and keep your job or a similar one.","إذا كنت تعمل فأبلغ جهة عملك، فهي ملزمة بالسماح لك بأداء الخدمة والاحتفاظ بوظيفتك أو بوظيفة مماثلة.",454],["When a temporary exemption ends, report for service.","عند زوال سبب الإعفاء المؤقت، راجع الجهات المختصة لأداء الخدمة.",455]],"f":[["Length: 11 months for men with high school or above, and for women; 3 years for men without high school.","المدة: 11 شهراً للذكور من حملة الثانوية فما فوق وللإناث، و3 سنوات للذكور دون الثانوية.",0],["Permanent exemption: only sons and the medically unfit. Temporary: carers of parents or siblings with special needs, and prisoners.","الإعفاء الدائم: الابن الوحيد وغير اللائق طبياً. والمؤقت: من يعول والدين أو إخوة من أصحاب الهمم، ومن يقضي عقوبة سجن.",0],["Postponement: under 29 in a course of 2 years or more; a secondary average of 90% or more; or 18+ still in morning school.","التأجيل: لمن هو دون 29 سنة ويدرس برنامجاً مدته سنتان أو أكثر، أو حصل على 90% فأكثر في الثانوية، أو بلغ 18 سنة وما زال في الدراسة الصباحية.",0],["Not enlisting by 29 without a valid reason: 1 month to 1 year in jail and/or a AED 10,000-50,000 fine; you can still be called after 30.","عدم الالتحاق حتى سن 29 دون عذر: الحبس من شهر إلى سنة و/أو غرامة من 10,000 إلى 50,000 درهم، ويمكن استدعاؤك بعد سن 30.",0],["Employers must release Emirati staff to serve; service time counts toward pension and end-of-service benefits.","على أصحاب العمل السماح للموظفين المواطنين بأداء الخدمة، وتُحتسب مدتها في المعاش ومكافأة نهاية الخدمة.",0]],"dp":[["other","Education sets the length: high school or above means 11 months; below that, 3 years.","يحدد المؤهل الدراسي المدة: 11 شهراً لحملة الثانوية فما فوق، و3 سنوات لمن هم دونها."],["sector","Working men are not exempt. Government and private employers must keep their job.","لا يُعفى الموظفون من الخدمة، وعلى جهات العمل الحكومية والخاصة الاحتفاظ بوظائفهم."]],"c":["Those who do not meet the conditions may do administrative, civil or technical service for the same period. Ask about your own case.","يمكن لمن لا يستوفي الشروط أداء خدمة إدارية أو مدنية أو فنية للمدة نفسها. اسأل الجهات المختصة عن حالتك."],"au":"uae-armed-forces","l":[456,161,457],"so":[[458,10,457]],"v":1},{"id":"emirati-health-cover","q":["As an Emirati, which government health cover do I get: Thiqa, Enaya or something else?","بصفتي مواطناً، ما التأمين الصحي الحكومي الذي يشملني: ثقة أم عناية أم غيرهما؟"],"k":["thiqa card how to get","thiqa for emiratis from dubai","enaya registration dubai citizens","health insurance for emiratis sharjah","بطاقة ثقة للمواطنين","تسجيل في ثقة","برنامج عناية دبي للمواطنين","التامين الصحي لمواطني الشارقه"],"a":["It depends on your emirate. Thiqa covers Abu Dhabi nationals in its public and private network, and nationals of other emirates who don't live in Abu Dhabi in its public network; enrol or renew online. Dubai citizens without other government cover use Enaya. Sharjah Health Authority has covered all Sharjah citizens since January 2020.","يعتمد ذلك على إمارتك. يغطي برنامج «ثقة» مواطني أبوظبي في شبكته الحكومية والخاصة، ومواطني الإمارات الأخرى غير المقيمين في أبوظبي في شبكته الحكومية، ويتم التسجيل والتجديد إلكترونياً. ويستخدم مواطنو دبي غير المشمولين بتأمين حكومي آخر برنامج «عناية». ومنذ يناير 2020 تغطي هيئة الشارقة الصحية جميع مواطني الشارقة."],"w":["emirati"],"st":[["Thiqa: enrol or renew online.","«ثقة»: سجّل أو جدّد إلكترونياً.",459],["Non-UAE family members sponsored by an Emirati: the Emirati applies through SEHA.","أفراد الأسرة غير المواطنين المكفولون من مواطن: يقدّم المواطن الطلب عبر «صحة».",460],["Dubai citizens: register in Enaya online or at an Enaya kiosk.","مواطنو دبي: سجّل في «عناية» إلكترونياً أو عبر أجهزة الخدمة الذاتية.",461],["Sharjah citizens: contact the Department of Health Insurance at Sharjah Health Authority.","مواطنو الشارقة: تواصل مع إدارة التأمين الصحي في هيئة الشارقة الصحية.",462]],"d":[["Emirates ID","بطاقة الهوية الإماراتية"]],"f":[["Thiqa, Abu Dhabi nationals: full cover in the public and private network, emergencies in the UAE and abroad, no annual limit.","«ثقة» لمواطني أبوظبي: تغطية كاملة في الشبكة الحكومية والخاصة، والطوارئ داخل الدولة وخارجها، دون حد سنوي.",0],["Thiqa, nationals of other emirates not living in Abu Dhabi: full cover in the public network only, plus emergencies in the UAE and worldwide.","«ثقة» لمواطني الإمارات الأخرى غير المقيمين في أبوظبي: تغطية كاملة في الشبكة الحكومية فقط، مع علاج الطوارئ داخل الدولة وخارجها.",0],["Non-UAE family members sponsored by an Emirati: public network only, emergencies inside the UAE; the Emirati applies through SEHA.","أفراد الأسرة غير المواطنين المكفولون من مواطن: الشبكة الحكومية فقط، والطوارئ داخل الدولة، ويقدّم المواطن الطلب عبر «صحة».",0],["Enaya covers Dubai citizens without other government insurance, and Dubai Government staff.","يغطي «عناية» مواطني دبي غير المشمولين بتأمين حكومي آخر، وموظفي حكومة دبي.",1],["Sharjah: cover was extended to all Sharjah citizens in January 2020.","الشارقة: امتدت التغطية لتشمل جميع مواطني الشارقة في يناير 2020.",1]],"dp":[["emirate","Your emirate and home decide the scheme: Thiqa (Abu Dhabi), Enaya (Dubai) or Sharjah Health Authority. EHS also issues health cards.","تحدد إمارتك ومكان سكنك البرنامج: «ثقة» (أبوظبي) أو «عناية» (دبي) أو هيئة الشارقة الصحية. وتصدر مؤسسة الإمارات للخدمات الصحية بطاقات صحية أيضاً."],["status","Non-UAE family members sponsored by an Emirati get narrower Thiqa cover.","يحصل أفراد الأسرة غير المواطنين المكفولون من مواطن على تغطية أضيق في «ثقة»."]],"c":["Networks and benefits change; check your cover in the app before treatment. This is not medical advice.","قد تتغير الشبكات والمزايا، فتحقق من تغطيتك في التطبيق قبل العلاج. هذه ليست استشارة طبية."],"au":"doh-ad","so":[[463,464,465],[466,10,467]],"v":1},{"id":"emirati-nafis-salary-support","q":["I'm Emirati in the private sector. What Nafis salary support can I get after the 2026 changes?","أنا مواطن أعمل في القطاع الخاص. ما دعم الراتب الذي يمكنني الحصول عليه من «نافس» بعد تعديلات 2026؟"],"k":["nafis salary support amount 2026","nafees salary support how much","nafis new rules september 2026","nafis child allowance no limit","دعم نافس الجديد 2026","كم دعم الراتب من نافس","تخفيض دعم نافس 500 درهم","علاوة الابناء نافس بدون حد"],"a":["From September 2026, Nafis support needs a salary of at least AED 6,000 a month. Salary support is up to AED 6,000 with a bachelor's degree, AED 5,000 with a diploma and AED 4,000 with secondary school. Existing support falls by AED 500 every 6 months until it reaches the new level. The child allowance no longer caps the number of children.","اعتباراً من سبتمبر 2026 يشترط دعم «نافس» راتباً لا يقل عن 6,000 درهم شهرياً. ويصل دعم الراتب إلى 6,000 درهم لحملة البكالوريوس، و5,000 درهم لحملة الدبلوم، و4,000 درهم لخريجي الثانوية. وينخفض الدعم الحالي 500 درهم كل 6 أشهر حتى يبلغ المستوى الجديد، ولم يعد لعلاوة الأبناء حد أقصى لعدد الأبناء."],"w":["emirati"],"s":["private","free-zone"],"st":[["Register or update your profile, including your degree and salary.","سجّل في المنصة أو حدّث ملفك، بما في ذلك مؤهلك وراتبك.",468],["Already supported? Check your monthly amount; cuts apply automatically from September 2026.","تحصل على الدعم حالياً؟ تابع المبلغ الشهري، فالتخفيضات تُطبق تلقائياً من سبتمبر 2026.",468],["In a free zone or other firm outside MOHRE or Central Bank pay rules, and paid under AED 6,000? Ask your employer to raise your pay.","تعمل في منطقة حرة أو جهة خارج قواعد الأجور لدى الوزارة والمصرف المركزي وراتبك أقل من 6,000 درهم؟ اطلب من جهة عملك رفع راتبك.",454]],"d":[["Degree or school certificate","شهادة المؤهل الدراسي"]],"f":[["From September 2026, all Nafis support needs a salary of at least AED 6,000 a month.","اعتباراً من سبتمبر 2026 يشترط كل دعم «نافس» راتباً لا يقل عن 6,000 درهم شهرياً.",0],["Maximum support: AED 6,000 bachelor's, AED 5,000 diploma, AED 4,000 secondary; below secondary, AED 4,000 if married or with dependants, else AED 3,000 (salary up to AED 20,000).","الحد الأقصى للدعم: 6,000 درهم للبكالوريوس، و5,000 للدبلوم، و4,000 للثانوية، ولمن دون الثانوية 4,000 للمتزوج أو من يعول وإلا 3,000 (براتب لا يتجاوز 20,000 درهم).",0],["Existing recipients: support adjusts automatically from September 2026, falling AED 500 every 6 months to the new level; the phase-in takes up to 3 years.","المستفيدون الحاليون: يُعدَّل الدعم تلقائياً من سبتمبر 2026، فينخفض 500 درهم كل 6 أشهر حتى المستوى الجديد، ويكتمل التطبيق خلال 3 سنوات كحد أقصى.",0],["Outside MOHRE and Central Bank pay rules and paid under AED 6,000: 100% of support for 6 months from September 2026, then 70% for 6 months, then 30% for 3 months.","العاملون خارج قواعد الأجور لدى الوزارة والمصرف المركزي برواتب أقل من 6,000 درهم: 100% من الدعم 6 أشهر من سبتمبر 2026، ثم 70% لمدة 6 أشهر، ثم 30% لمدة 3 أشهر.",0],["Child allowance: no cap on the number of children. Private employers now also pay their own share of pension contributions.","علاوة الأبناء: دون حد أقصى لعدد الأبناء. ويدفع أصحاب العمل في القطاع الخاص الآن أيضاً حصتهم من اشتراكات التقاعد.",0]],"dp":[["salary","Paid under AED 6,000 a month? You get no new support. Below secondary school, pay must also be no more than AED 20,000.","إذا قلّ راتبك عن 6,000 درهم شهرياً فلا تستحق دعماً جديداً، ولمن دون الثانوية يجب أيضاً ألا يتجاوز الراتب 20,000 درهم."],["sector","Workers outside MOHRE and Central Bank pay rules, such as in free zones, get a phased cut if paid under AED 6,000.","يخضع العاملون خارج قواعد الأجور لدى الوزارة والمصرف المركزي، كالمناطق الحرة، لتخفيض تدريجي إذا قلّ راتبهم عن 6,000 درهم."]],"c":["ETCC's release states the AED 20,000 ceiling only for the below-secondary group and gives no child allowance amount. Ask Nafis what applies to you.","لا يذكر بيان المجلس سقف 20,000 درهم إلا لفئة من هم دون الثانوية، ولا يحدد قيمة علاوة الأبناء. اسأل «نافس» عما ينطبق عليك."],"au":"nafis","so":[[469,421,422]],"v":1,"ch":["2026-09","New Nafis rules began: AED 6,000 minimum salary, new support levels, AED 500 cuts for existing recipients and no cap on children.","بدأت قواعد «نافس» الجديدة: حد أدنى للراتب 6,000 درهم، ومستويات دعم جديدة، وتخفيض 500 درهم للمستفيدين الحاليين، ودون حد لعدد الأبناء.",0],"h":"career-compass"},{"id":"emirati-social-welfare","q":["We are a low-income Emirati family. What monthly social support can we get, and from whom?","نحن أسرة مواطنة ذات دخل محدود. ما الدعم الاجتماعي الشهري الذي يمكننا الحصول عليه، ومن أي جهة؟"],"k":["social welfare emirati low income apply","social support ministry of community empowerment","inflation allowance emirati 25000","الدعم الاجتماعي للمواطنين ذوي الدخل المحدود","علاوة التضخم للمواطنين","مساعده اجتماعيه وزارة تمكين المجتمع"],"a":["Low-income Emirati families can apply to the federal Social Welfare Programme of the Ministry of Community Empowerment (MoCE). It pays a basic allowance and may add a housing allowance. If you are under 55 and able to work, you must have a job with pension cover or be retired. Families earning under AED 25,000 a month can also get an inflation allowance for food, fuel and utilities.","يمكن للأسر المواطنة محدودة الدخل التقدم إلى برنامج الدعم الاجتماعي الاتحادي لدى وزارة تمكين المجتمع، ويصرف علاوة أساسية وقد يضيف بدل سكن. وإذا كان عمرك دون 55 سنة وكنت قادراً على العمل، فيجب أن تكون موظفاً مشمولاً بالتقاعد أو متقاعداً. ويمكن للأسر التي يقل دخلها عن 25,000 درهم شهرياً الحصول أيضاً على علاوة التضخم للغذاء والوقود والكهرباء والماء."],"w":["emirati"],"st":[["Federal: sign in with UAE PASS or create an account, apply and attach the documents.","البرنامج الاتحادي: سجّل الدخول بالهوية الرقمية أو أنشئ حساباً، وقدّم الطلب وأرفق المستندات.",470],["If your family earns under AED 25,000 a month, ask MoCE about the inflation allowance.","إذا قلّ دخل أسرتك عن 25,000 درهم شهرياً، فاسأل الوزارة عن علاوة التضخم.",471],["Abu Dhabi, Dubai or Sharjah citizen? Also check your emirate's own programme.","مواطن من أبوظبي أو دبي أو الشارقة؟ تحقق أيضاً من برنامج إمارتك.",472]],"d":[["Emirates ID and detailed salary certificates for the head of family and wife or wives","بطاقة الهوية وشهادات راتب مفصلة لرب الأسرة والزوجة أو الزوجات"],["Papers for leased properties and proof of income from any trade licence","مستندات العقارات المؤجرة وإثبات الدخل من أي رخصة تجارية"]],"f":[["Federal programme: citizen living permanently in the UAE, main applicant 21+; if able to work and under 55, employed with pension cover or retired.","البرنامج الاتحادي: مواطن مقيم إقامة دائمة في الدولة، والمستفيد الرئيسي 21 سنة فأكثر، وإذا كان قادراً على العمل ودون 55 سنة فيجب أن يكون موظفاً مشمولاً بالتقاعد أو متقاعداً.",1],["Family income and assets must be below set limits. Applying is free; service time is 21 working days. MoCE call centre: 800623.","يجب أن يقل دخل الأسرة وأصولها عن الحدود المقررة. التقديم مجاني، ومدة إنجاز الخدمة 21 يوم عمل. مركز اتصال الوزارة: 800623.",1],["Inflation allowance: family income under AED 25,000 a month. Food: AED 500 per spouse and AED 250 per child, up to 4 children.","علاوة التضخم: أن يقل دخل الأسرة عن 25,000 درهم شهرياً. والغذاء: 500 درهم لكل من الزوجين و250 درهماً لكل ابن بحد أقصى 4 أبناء.",0],["Fuel: AED 300, 600 or 900 per spouse by fuel price band. Electricity and water: 50% of the bill or AED 400 a month, whichever is lower.","الوقود: 300 أو 600 أو 900 درهم لكل من الزوجين حسب شريحة سعر الوقود. والكهرباء والماء: 50% من الفاتورة أو 400 درهم شهرياً أيهما أقل.",0],["Children count until 21, or 25 in higher education. The housing allowance needs the applicant to be 25+ and own no suitable home.","يُحتسب الأبناء حتى سن 21، أو 25 في التعليم العالي. ويشترط بدل السكن أن يكون عمر المتقدم 25 سنة فأكثر وألا يملك مسكناً مناسباً.",0]],"dp":[["emirate","Abu Dhabi, Dubai and Sharjah have local programmes; Dubai's CDA also gives one-time and emergency help.","لأبوظبي ودبي والشارقة برامج محلية، وتقدم هيئة تنمية المجتمع في دبي أيضاً مساعدات لمرة واحدة وطارئة."],["status","Orphans, some people of determination and some widowed or divorced mothers of young children are exempt from the age and work rules.","يُستثنى من شرطي العمر والعمل الأيتام وبعض أصحاب الهمم وبعض الأرامل والمطلقات الحاضنات لأطفال صغار."]],"c":["The 2024 Social Support law and its 2025 regulations set the basic allowance and income limits; u.ae and the MoCE page do not list them. Ask MoCE about your case.","يحدد مرسوم الدعم الاجتماعي لسنة 2024 ولائحته لسنة 2025 قيم العلاوة الأساسية وحدود الدخل، ولا تذكرها البوابة الرسمية ولا صفحة الوزارة. اسأل الوزارة عن حالتك."],"au":"community","l":[473,161,474],"so":[[475,10,474],[476,477,478]],"v":1},{"id":"emirati-mother-children","q":["I'm an Emirati woman married to a foreigner. Can my children get UAE citizenship, and what support do they get meanwhile?","أنا مواطنة متزوجة من أجنبي. هل يمكن لأبنائي الحصول على الجنسية الإماراتية، وما الدعم المتاح لهم حتى ذلك الحين؟"],"k":["children of emirati mother citizenship","emirati mother foreign father nationality apply","my mom is emirati can i get passport","nafis children of emirati mothers 3000","جنسية أبناء المواطنات","ابناء المواطنة من اب اجنبي الجنسية","امي مواطنة كيف اخذ الجنسية","دعم نافس لابناء المواطنات"],"a":["Children of an Emirati mother and a foreign father can apply to ICP for UAE nationality; the competent authorities review each case under the Nationality Law. Meanwhile, the mother can sponsor a foreign-passport child for a 5-year residence visa. From September 2026, such children in private-sector jobs can get Nafis support of up to AED 3,000 a month.","يمكن لأبناء الأم المواطنة والأب الأجنبي التقدم إلى الهيئة الاتحادية للهوية والجنسية بطلب الجنسية، وتدرس الجهات المختصة كل حالة وفق قانون الجنسية. وحتى ذلك الحين يمكن للأم كفالة ابنها حامل الجواز الأجنبي بإقامة مدتها 5 سنوات. ومن سبتمبر 2026 يمكن لهؤلاء الأبناء العاملين في القطاع الخاص الحصول على دعم من «نافس» يصل إلى 3,000 درهم شهرياً."],"w":["emirati","resident"],"st":[["Apply for your child's nationality, or call ICP first to ask about eligibility.","قدّمي طلب الجنسية لابنك، أو اتصلي بالهيئة أولاً للاستفسار عن الاستحقاق.",479],["Meanwhile, keep your child's residence valid; as a citizen you can sponsor a 5-year residence.","حافظي في الأثناء على إقامة ابنك سارية، فبصفتك مواطنة يمكنك كفالته بإقامة مدتها 5 سنوات.",480],["If your child works in the private sector, they can apply for the new Nafis support.","إذا كان ابنك يعمل في القطاع الخاص، فيمكنه التقدم لدعم «نافس» الجديد.",468]],"f":[["ICP: children of female citizens can apply for UAE nationality; the competent authorities review each application under the Nationality Law.","الهيئة: يمكن لأبناء المواطنات التقدم بطلب الجنسية الإماراتية، وتدرس الجهات المختصة كل طلب وفق قانون الجنسية.",0],["ICP call centre: 600522222 (from abroad 00971600522222).","مركز اتصال الهيئة: 600522222 (ومن الخارج 00971600522222).",0],["A UAE citizen's foreign-passport spouse, parent or child can get a 5-year residence visa without working in the UAE; the citizen sponsors.","يمكن لزوج المواطن أو والديه أو أبنائه من حملة الجوازات الأجنبية الحصول على إقامة لمدة 5 سنوات دون الحاجة إلى العمل، بكفالة المواطن.",1],["Nafis, from September 2026: up to AED 3,000 a month for children of Emirati mothers in private jobs paying AED 6,000-20,000, with an accredited bachelor's.","نافس، من سبتمبر 2026: حتى 3,000 درهم شهرياً لأبناء المواطنات العاملين في القطاع الخاص برواتب من 6,000 إلى 20,000 درهم ويحملون بكالوريوس معتمداً.",2]],"dp":[["status","Nationality depends on each family's case under the Nationality Law; it is not automatic.","تعتمد الجنسية على حالة كل أسرة وفق قانون الجنسية، وهي ليست تلقائية."],["emirate","Residence files in Dubai are handled by GDRFA Dubai, not ICP.","تتولى الإدارة العامة للإقامة وشؤون الأجانب في دبي ملفات الإقامة في دبي بدلاً من الهيئة."],["salary","Nafis support needs a private-sector salary of AED 6,000-20,000 and a bachelor's degree.","يشترط دعم «نافس» راتباً في القطاع الخاص من 6,000 إلى 20,000 درهم وشهادة بكالوريوس."]],"c":["Older news reports give different minimum ages to apply; ICP's FAQ states none, so ask ICP before you apply.","تذكر تقارير صحفية قديمة أعماراً مختلفة للتقديم، ولا تحدد أسئلة الهيئة الشائعة سناً، فاسألي الهيئة قبل التقديم."],"au":"icp","so":[[481,4,32],[482,10,11],[420,421,422]],"v":1,"ch":["2026-09","Nafis added support of up to AED 3,000 a month for children of Emirati mothers working in the private sector.","أضاف «نافس» دعماً يصل إلى 3,000 درهم شهرياً لأبناء المواطنات العاملين في القطاع الخاص.",2]},{"id":"emirati-dubai-housing-mbrhe","q":["I'm a Dubai citizen. How do I get housing help from MBRHE, such as a grant to build a house on my plot?","أنا مواطن من دبي. كيف أحصل على دعم سكني من مؤسسة محمد بن راشد للإسكان، مثل منحة لبناء مسكن على أرضي؟"],"k":["mbrhe housing grant apply","dubai housing loan for citizens","mbrhe construction grant 750000","how to apply mbrhe","مؤسسة محمد بن راشد للاسكان التقديم","منحة بناء مسكن دبي","قرض سكني دبي للمواطنين","شروط منحة الاسكان دبي"],"a":["Dubai citizens apply to the Mohammed Bin Rashid Housing Establishment (MBRHE), which offers residential plots, ready homes, housing loans and grants. Under its 2021 rules, the construction grant is up to AED 750,000 to build on a plot granted to you in Dubai, if neither spouse owns a suitable home in the UAE. In May 2026, citizens' construction loan approvals got 1 more year of validity.","يتقدم مواطنو دبي إلى مؤسسة محمد بن راشد للإسكان، التي تقدم أراضي سكنية ومساكن جاهزة وقروضاً ومنحاً سكنية. ووفق لائحتها لعام 2021 تصل منحة بناء المسكن إلى 750,000 درهم للبناء على أرض سكنية ممنوحة لك في دبي، بشرط ألا يملك أي من الزوجين مسكناً مناسباً في الدولة. وفي مايو 2026 مُدّدت صلاحية موافقات قروض بناء مساكن المواطنين سنة إضافية."],"w":["emirati"],"m":["dubai"],"st":[["For the construction grant, you first need a residential plot granted to you in Dubai.","للحصول على منحة البناء يجب أولاً أن تكون لديك أرض سكنية ممنوحة في دبي.",483],["Apply and upload the plot map and drawings approved by Dubai Municipality.","قدّم الطلب وارفع خريطة الأرض والمخططات المعتمدة من بلدية دبي.",484],["After approval, start building within 1 year.","بعد الموافقة ابدأ البناء خلال سنة.",485]],"d":[["Copy of the residential plot map","صورة من خريطة الأرض السكنية"],["Building drawings approved by Dubai Municipality","مخططات بناء معتمدة من بلدية دبي"]],"f":[["2021 rules: construction grant up to AED 750,000 to build on a granted Dubai plot that is empty or under construction.","لائحة 2021: منحة بناء مسكن حتى 750,000 درهم للبناء على أرض سكنية ممنوحة في دبي خالية أو قيد الإنشاء.",0],["Conditions: a Dubai land grant, a housing need, no suitable home owned by either spouse in the UAE, and paying any cost above the grant.","الشروط: منحة أرض سكنية في دبي، ووجود مشكلة إسكانية، وعدم تملك أي من الزوجين مسكناً مناسباً في الدولة، والتعهد بدفع الفرق عن قيمة المنحة.",0],["The plot is mortgaged to MBRHE for 25 years; building is capped at 6,000 sq ft and must start within 1 year of approval.","تُرهن الأرض لصالح المؤسسة 25 سنة، ولا تتجاوز مساحة البناء 6,000 قدم مربع، ويبدأ البناء خلال سنة من الموافقة.",0],["Men must support a wife or a relative living with them; women must be widowed or divorced with children, support a relative, or be married to a non-citizen.","يشترط في الرجل أن يعيل زوجته أو قريباً يقيم معه، وفي المرأة أن تكون أرملة أو مطلقة حاضنة لأبنائها أو معيلة لقريب أو متزوجة من غير مواطن.",0],["May 2026: Dubai extended the validity of citizens' housing construction loan approvals by 1 year.","مايو 2026: مدّدت دبي صلاحية موافقات قروض بناء مساكن المواطنين سنة واحدة.",1]],"dp":[["status","Widowed or divorced women with children, and Emirati women married to non-citizens, have their own conditions.","للأرامل والمطلقات الحاضنات لأبنائهن، وللمواطنات المتزوجات من غير مواطنين، شروط خاصة."],["other","If your plot was granted because you showed you could afford to build, you normally can't get the construction grant.","إذا مُنحت الأرض على أساس قدرتك المالية على البناء، فلا يحق لك عادةً طلب منحة بناء المسكن."]],"c":["These grant rules date from 2021; lifting the mortgage early means repaying the grant. Amounts and loan terms may have changed, so check with MBRHE first.","تعود قواعد المنحة هذه إلى عام 2021، وفك الرهن مبكراً يعني سداد المنحة. وقد تكون القيم وشروط القروض تغيرت، فتحقق من المؤسسة أولاً."],"au":"mbrhe","l":[486,487,488],"so":[[489,490,488],[491,219,492],[426,10,427]],"v":1,"ch":["2026-05","Dubai extended the validity of citizens' housing construction loan approvals by 1 year.","مدّدت دبي صلاحية موافقات قروض بناء مساكن المواطنين سنة واحدة.",1]},{"id":"emirati-nafis-wives","q":["My husband is Emirati and I work for a private company. Can I get Nafis salary support?","زوجي مواطن وأنا أعمل في شركة خاصة. هل يمكنني الحصول على دعم الراتب من «نافس»؟"],"k":["nafis support for wife of emirati","foreign wife of emirati nafis 3000","nafis wives of citizens conditions","can wife of uae national get nafis","دعم نافس لزوجات المواطنين","زوجة المواطن الاجنبية نافس","شروط دعم زوجات المواطنين 3000","نافس للزوجه غير المواطنه"],"a":["From September 2026, Nafis offers up to AED 3,000 a month to wives of Emirati men who work in the private sector. You need a salary of AED 6,000-15,000, an accredited bachelor's degree, and either 2 children or 5 years of marriage. Your husband must be an Emirati working in the public or private sector, retired, or medically unable to work.","اعتباراً من سبتمبر 2026 يقدم «نافس» دعماً يصل إلى 3,000 درهم شهرياً لزوجات المواطنين العاملات في القطاع الخاص. ويشترط راتب من 6,000 إلى 15,000 درهم، وشهادة بكالوريوس معتمدة، ووجود طفلين أو مرور 5 سنوات على الزواج. ويجب أن يكون الزوج مواطناً يعمل في القطاع الحكومي أو الخاص، أو متقاعداً، أو عاجزاً عن العمل لأسباب طبية."],"w":["emirati","resident"],"s":["private"],"st":[["Check your salary, degree accreditation and marriage details against the conditions.","قارني راتبك واعتماد شهادتك وبيانات زواجك بالشروط.",468],["Register on Nafis and apply for the support for wives of citizens.","سجّلي في «نافس» وقدّمي طلب دعم زوجات المواطنين.",468]],"d":[["Bachelor's degree accredited by the Ministry of Higher Education and Scientific Research","شهادة بكالوريوس معتمدة من وزارة التعليم العالي والبحث العلمي"],["Proof of your marriage, any children and your husband's job, retirement or medical condition","إثبات الزواج والأبناء إن وُجدوا وعمل الزوج أو تقاعده أو حالته الطبية"]],"f":[["From September 2026: up to AED 3,000 a month for wives of Emirati men working in the private sector.","من سبتمبر 2026: دعم حتى 3,000 درهم شهرياً لزوجات المواطنين العاملات في القطاع الخاص.",0],["Salary AED 6,000-15,000 a month and a bachelor's degree accredited by the Ministry of Higher Education and Scientific Research.","راتب من 6,000 إلى 15,000 درهم شهرياً، وشهادة بكالوريوس معتمدة من وزارة التعليم العالي والبحث العلمي.",0],["At least 2 children or 5 years of marriage; the husband works in the public or private sector, is retired, or is medically unable to work.","طفلان على الأقل أو 5 سنوات زواج، وأن يعمل الزوج في القطاع الحكومي أو الخاص أو يكون متقاعداً أو عاجزاً طبياً عن العمل.",0],["After 2 years of marriage, doctors, teachers, PhD holders from top-500 universities and some vital jobs are exempt from the children and 5-year rules.","بعد سنتين من الزواج تُعفى الطبيبات والمعلمات وحاملات الدكتوراه من أفضل 500 جامعة وبعض الوظائف الحيوية من شرطي الأبناء والسنوات الخمس.",0]],"dp":[["salary","A salary below AED 6,000 or above AED 15,000 a month rules you out.","إذا كان الراتب أقل من 6,000 أو أكثر من 15,000 درهم شهرياً فلا يحق لك الدعم."],["status","Doctors, teachers, some PhD holders and some vital jobs need only 2 years of marriage.","تكفي سنتان من الزواج للطبيبات والمعلمات وبعض حاملات الدكتوراه وبعض الوظائف الحيوية."],["status","The marriage must still be in place. ETCC told Al Khaleej that divorced or widowed wives are not covered for now.","يجب أن يكون الزواج قائماً، فقد أفاد المجلس لصحيفة الخليج بأن المطلقات والأرامل غير مشمولات في المرحلة الحالية."],["other","If you are Emirati yourself, regular Nafis salary support applies instead.","إذا كنتِ مواطنة فينطبق عليكِ دعم الراتب العادي من «نافس» بدلاً من ذلك."]],"c":["The ETCC release lists no documents or support period, and the point on divorced or widowed wives comes from a news report. Check with Nafis first.","لا يذكر بيان المجلس المستندات ولا مدة الدعم، والمعلومة عن المطلقات والأرامل مصدرها تقرير صحفي، فتحققي من «نافس» أولاً."],"au":"nafis","so":[[469,421,422],[493,494,495,0]],"v":1,"ch":["2026-09","Nafis added support of up to AED 3,000 a month for wives of Emirati men working in the private sector.","أضاف «نافس» دعماً يصل إلى 3,000 درهم شهرياً لزوجات المواطنين العاملات في القطاع الخاص.",0],"h":"career-compass"}]},{"topic":"family","title":{"en":"Family, marriage and inheritance","ar":"الأسرة والزواج والميراث"},"checked":"2026-11-08","entries":[{"id":"family-civil-marriage","q":["We are non-Muslims. How do we get a civil marriage in the UAE?","نحن غير مسلمين. كيف نعقد زواجاً مدنياً في الإمارات؟"],"k":["civil marriage abu dhabi non muslim","how to get married in dubai as expats","civil wedding uae for tourists","court marriage abu dhabi fees","civil marrige uae requirments","زواج مدني ابوظبي لغير المسلمين","كيف اتزوج زواج مدني في الامارات","عقد زواج مدني دبي"],"a":["You can marry at a civil court, with no religious ceremony. Abu Dhabi's Civil Family Court takes residents and visitors aged 18+ if neither is a UAE national, for AED 300 (AED 2,500 express). Dubai Courts also marry non-Muslims aged 21+ if one partner lives in Dubai.","يمكنكما الزواج أمام محكمة مدنية دون مراسم دينية. تقبل محكمة الأسرة المدنية في أبوظبي المقيمين والزوار من سن 18 عاماً إذا لم يكن أي منهما مواطناً، برسوم 300 درهم (2,500 درهم للخدمة السريعة). وتعقد محاكم دبي أيضاً زواج غير المسلمين من سن 21 عاماً إذا أقام أحدهما في دبي."],"w":["resident","visitor"],"st":[["Pick a court and apply online with your documents.","اختر المحكمة وقدّم الطلب إلكترونياً مع مستنداتك.",496],["Abu Dhabi decides within 10 working days, or 1 with express. Then pay.","تبت أبوظبي في الطلب خلال 10 أيام عمل، أو يوم واحد في الخدمة السريعة، ثم ادفع.",497],["Attend the short ceremony together; no witnesses are needed.","احضرا المراسم القصيرة معاً، ولا حاجة إلى شهود.",498]],"d":[["Passports, and Emirates IDs if residents","جوازا السفر، والهويتان الإماراتيتان للمقيمين"],["Proof any earlier marriage ended","ما يثبت انتهاء أي زواج سابق"],["Dubai: proof you are single; foreign papers attested and translated into Arabic","في دبي: إثبات عدم الزواج، وتصديق المستندات الأجنبية وترجمتها إلى العربية"]],"f":[["Abu Dhabi: AED 300 regular (up to 10 working days) or AED 2,500 express (1 working day).","أبوظبي: 300 درهم للخدمة العادية (حتى 10 أيام عمل) أو 2,500 درهم للسريعة (يوم عمل واحد).",0],["Abu Dhabi: both 18+, neither a UAE national, any religion; visitors must attend in person.","أبوظبي: الطرفان من سن 18 عاماً، وليس أي منهما مواطناً، أياً كان الدين، ويحضر الزوار بأنفسهم.",0],["Dubai: both non-Muslim, aged 21+, at least one a Dubai resident; the licence is issued within 24 hours.","دبي: الطرفان غير مسلمين، من سن 21 عاماً، وأحدهما على الأقل مقيم في دبي، وتصدر رخصة الزواج خلال 24 ساعة.",1],["Federal rules (Article 2, Cabinet Resolution No. 122 of 2023) set a minimum age of 21.","تحدد القواعد الاتحادية (المادة 2، قرار مجلس الوزراء رقم 122 لسنة 2023) سن 21 عاماً حداً أدنى.",1]],"dp":[["emirate","Abu Dhabi: 18+, visitors welcome. Dubai: 21+, one partner living in Dubai.","أبوظبي: من سن 18 عاماً ويُقبل الزوار. دبي: من سن 21 عاماً مع إقامة أحد الطرفين فيها."],["status","Dubai serves non-Muslims only. Abu Dhabi serves any religion but not UAE nationals.","تخدم دبي غير المسلمين فقط، وتخدم أبوظبي أتباع أي دين عدا المواطنين."]],"c":["Foreign papers usually need attestation and an Arabic translation. A civil marriage brings civil rules on divorce, custody and inheritance.","تحتاج المستندات الأجنبية عادة إلى تصديق وترجمة عربية. ويترتب على الزواج المدني تطبيق القواعد المدنية في الطلاق والحضانة والميراث."],"au":"adjd","l":[499,500,501],"so":[[502,503,504],[505,10,506]],"v":1},{"id":"family-register-will","q":["I'm a non-Muslim expat. Where do I register a will in the UAE, and what does it cost?","أنا مقيم غير مسلم. أين أسجّل وصيتي في الإمارات، وكم تكلف؟"],"k":["how to register a will in dubai","difc will cost","non muslim will abu dhabi adjd","do i need a will in uae as expat","difc wil registraton fees","تسجيل وصية لغير المسلمين","رسوم تسجيل الوصية في ابوظبي","وصية غير المسلم في دبي"],"a":["A registered will lets you choose who gets your UAE assets and who cares for your children. Register it with the DIFC Courts (full will AED 10,000), the Abu Dhabi Judicial Department (AED 950, or AED 2,500 special) or the Dubai Courts notary (AED 2,000). Without one, default shares apply.","تتيح لك الوصية المسجلة أن تحدد من يرث أصولك في الإمارات ومن يرعى أطفالك. سجّلها لدى محاكم مركز دبي المالي العالمي (الوصية الكاملة 10,000 درهم)، أو دائرة القضاء في أبوظبي (950 درهماً، أو 2,500 درهم للخاصة)، أو الكاتب العدل في محاكم دبي (2,000 درهم). وبدونها تُطبَّق الأنصبة الافتراضية."],"w":["resident"],"st":[["Choose a registry: DIFC Courts, ADJD or the Dubai Courts notary.","اختر جهة التسجيل: محاكم المركز أو دائرة القضاء في أبوظبي أو الكاتب العدل في محاكم دبي.",507],["Fill in its will form, naming heirs and a guardian, and book an appointment.","املأ نموذج الوصية وسمِّ الورثة والوصي، واحجز موعداً.",508],["Pay and sign. Update the will after big life changes (DIFC: AED 550).","ادفع ووقّع، وحدّث الوصية بعد التغيّرات الكبيرة (محاكم المركز: 550 درهماً).",509]],"d":[["Passport and Emirates ID copies","نسخ جواز السفر والهوية الإماراتية"],["Dubai Courts: Ministry of Justice-certified Arabic translation of non-Arabic papers","في محاكم دبي: ترجمة عربية معتمدة من وزارة العدل للمستندات غير العربية"]],"f":[["DIFC full will (2023 fees): AED 10,000, or AED 15,000 for mirror wills; the AED 1,000 booking fee is lost if you cancel.","الوصية الكاملة في محاكم المركز (رسوم 2023): 10,000 درهم، أو 15,000 درهم للوصيتين المتطابقتين، ولا يُسترد رسم الحجز 1,000 درهم عند الإلغاء.",0],["DIFC guardianship, business, financial-assets or digital-assets will: AED 5,000; property will: AED 7,500; changes: AED 550.","في محاكم المركز: وصية الوصاية أو الأعمال أو الأصول المالية أو الأصول الرقمية 5,000 درهم، ووصية العقار 7,500 درهم، والتعديل 550 درهماً.",0],["ADJD will registration: AED 950 regular or AED 2,500 special.","تسجيل الوصية في دائرة القضاء بأبوظبي: 950 درهماً للعادية أو 2,500 درهم للخاصة.",1],["Dubai Courts notary: AED 2,000 to ratify a non-Muslim will; parties must be 21+.","الكاتب العدل في محاكم دبي: 2,000 درهم لتصديق وصية غير المسلم، ويجب أن يكون الأطراف من سن 21 عاماً.",2]],"dp":[["status","The Dubai Courts notary takes only non-Muslim testators. ADJD takes non-UAE nationals of any religion. Ask DIFC about its rules.","لا يقبل الكاتب العدل في محاكم دبي إلا الموصين غير المسلمين، وتقبل دائرة القضاء في أبوظبي غير المواطنين من أي دين، فاسأل محاكم المركز عن شروطها."],["other","If you only need a guardian or one type of asset covered, a cheaper DIFC will may do.","إذا كنت تحتاج إلى تعيين وصي أو تغطية نوع واحد من الأصول فقط، فقد تكفيك وصية أقل كلفة في المركز."]],"c":["DIFC's fee table dates from 2023; confirm fees before you book. For a large or cross-border estate, ask a lawyer.","يعود جدول رسوم محاكم المركز إلى 2023، فتأكد من الرسوم قبل الحجز. وإذا كانت التركة كبيرة أو في أكثر من دولة فاستشر محامياً."],"au":"difc-courts","l":[510,161,501],"so":[[511,512,513],[502,503,504],[514,515,516]],"v":1},{"id":"family-inheritance-non-muslim","q":["I'm a non-Muslim. Who inherits my assets in the UAE if I die without a will?","أنا غير مسلم. من يرث أموالي في الإمارات إذا توفيت دون وصية؟"],"k":["non muslim inheritance uae without will","expat dies without will uae who inherits","will my wife inherit in dubai","does sharia law apply to expats inheritance","inheritence law uae christians","ميراث غير المسلمين في الامارات","توزيع تركة غير المسلم بدون وصية","الوافد اذا مات بدون وصية من يورثه"],"a":["Non-Muslims can use the UAE civil law or ask for their home country's law. In Abu Dhabi, with no registered will, the spouse gets half and the children share the other half equally, sons and daughters alike. With no children, the rest goes to the parents, then siblings. A registered will overrides these shares.","يمكن لغير المسلمين تطبيق القانون المدني في الإمارات أو طلب تطبيق قانون بلدهم. وفي أبوظبي، إذا لم توجد وصية مسجلة، يحصل الزوج أو الزوجة على النصف، ويتقاسم الأبناء النصف الآخر بالتساوي ذكوراً وإناثاً. وإن لم يوجد أبناء ذهب الباقي إلى الوالدين ثم الإخوة. والوصية المسجلة تتقدم على هذه الأنصبة."],"w":["resident"],"st":[["Gather the death, marriage and children's birth certificates.","اجمع شهادة الوفاة وعقد الزواج وشهادات ميلاد الأبناء.",517],["Open an estate case at the court where the assets are. An executor applies to enforce any registered will.","افتح دعوى تركة لدى محكمة الإمارة التي فيها الأصول، ويطلب منفذ الوصية المسجلة تنفيذها.",518],["The court names the heirs and their shares, then the assets are shared out.","تحدد المحكمة الورثة وأنصبتهم، ثم تُوزَّع الأصول.",519]],"d":[["Death certificate (attested if issued abroad)","شهادة الوفاة (مصدقة إذا صدرت في الخارج)"],["Marriage and birth certificates, heirs' IDs, and any registered will","عقد الزواج وشهادات الميلاد وهويات الورثة، وأي وصية مسجلة"]],"f":[["Abu Dhabi, no will: the spouse gets half; the children share the other half equally, with no gender difference.","أبوظبي دون وصية: للزوج أو الزوجة النصف، ويتقاسم الأبناء النصف الآخر بالتساوي دون تفرقة بين الجنسين.",0],["No children: the rest goes to the parents equally; if one parent has died, that half goes to the siblings.","عند عدم وجود أبناء: يذهب الباقي إلى الوالدين بالتساوي، وإذا توفي أحدهما يذهب نصيبه إلى الإخوة.",0],["Non-Muslim residents may follow their home country's laws or choose the UAE personal status laws.","يجوز للمقيمين غير المسلمين اتباع قوانين بلدهم أو اختيار قوانين الأحوال الشخصية في الإمارات.",1]],"dp":[["emirate","Abu Dhabi applies its own civil law; other emirates apply the federal civil law.","تطبق أبوظبي قانونها المدني الخاص، وتطبق بقية الإمارات القانون المدني الاتحادي."],["status","A Muslim's estate follows Sharia shares instead.","أما تركة المسلم فتُوزَّع وفق الأنصبة الشرعية."]],"c":["Abu Dhabi and federal rules can differ in detail, so confirm with the court. This is general information, not legal advice.","قد تختلف قواعد أبوظبي عن القواعد الاتحادية في التفاصيل، فتأكد من المحكمة. هذه معلومات عامة وليست استشارة قانونية."],"au":"adjd","l":[520,521,522],"so":[[502,503,504],[505,10,506]],"v":1},{"id":"family-muslim-marriage","q":["How do we register a Muslim marriage contract in the UAE?","كيف نوثّق عقد زواج إسلامي في الإمارات؟"],"k":["marriage contract dubai courts","nikah registration abu dhabi","premarital test uae before marriage","e-zawaj moj appointment","عقد زواج في المحكمة الشرعية","كيف اسوي عقد قران في دبي","فحص ما قبل الزواج الامارات"],"a":["Muslim marriages follow the Personal Status Law in force since 15 April 2025. After a premarital medical test, a court, a marriage officer (ma'thun) or an e-service concludes the contract with the bride's consent, her guardian where required and 2 witnesses. Dubai charges AED 220 plus the officer's fee.","يخضع زواج المسلمين لقانون الأحوال الشخصية النافذ منذ 15 أبريل 2025. وبعد الفحص الطبي قبل الزواج، تعقد المحكمة أو المأذون أو الخدمة الإلكترونية العقد برضا العروس ووليّها عند اللزوم وبحضور شاهدين. وتتقاضى دبي 220 درهماً إضافة إلى أتعاب المأذون."],"w":["emirati","resident"],"st":[["Take the premarital test at an approved centre (Emiratis add a genetic test); attest and translate foreign papers.","أجرِ فحص ما قبل الزواج في مركز معتمد (ويضيف المواطنون فحصاً جينياً)، وصدّق المستندات الأجنبية وترجمها.",523],["Book a court, a marriage officer or e-Zawaj, and attend with the guardian if required and 2 witnesses.","احجز لدى المحكمة أو المأذون أو عبر الزواج الإلكتروني، واحضروا مع الوليّ عند اللزوم وشاهدين.",524],["Emiratis: apply for the marriage grant within 6 months.","للمواطنين: قدّموا طلب منحة الزواج خلال 6 أشهر.",432]],"d":[["Emirates IDs or passports; premarital medical certificates","الهويات الإماراتية أو جوازات السفر، وشهادتا الفحص الطبي"],["Divorce or death certificate if married before","شهادة الطلاق أو الوفاة لمن سبق له الزواج"]],"f":[["Federal Decree-Law No. 41 of 2024 on Personal Status took effect on 15 April 2025.","دخل المرسوم بقانون اتحادي رقم 41 لسنة 2024 بشأن الأحوال الشخصية حيز التنفيذ في 15 أبريل 2025.",0],["Valid contract: the bride's consent, a guardian if she is Muslim (not needed for a foreign bride whose home law needs none), and 2 witnesses.","شروط صحة العقد: رضا العروس، ووليّها إن كانت مسلمة (ولا يلزم للأجنبية التي لا يشترطه قانون بلدها)، وشاهدان.",0],["From January 2025, Emiratis also need a genetic test covering 570 genes.","منذ يناير 2025 يحتاج المواطنون أيضاً إلى فحص جيني يشمل 570 جيناً.",0],["Dubai Courts: AED 220 plus the officer's fee; male witnesses; one partner must be a Dubai citizen or resident.","محاكم دبي: 220 درهماً إضافة إلى أتعاب المأذون، والشاهدان ذكران، ويكون أحد الطرفين مواطناً من دبي أو مقيماً فيها.",1],["Marriage grant: AED 70,000 for Emirati couples with net monthly income up to AED 25,000; apply within 6 months.","منحة الزواج: 70,000 درهم للزوجين المواطنين إذا لم يتجاوز صافي الدخل الشهري 25,000 درهم، ويُقدَّم الطلب خلال 6 أشهر.",0]],"dp":[["emirate","Federal courts cover Sharjah, Ajman, Umm Al Quwain and Fujairah; Abu Dhabi, Dubai and RAK have their own.","تغطي المحاكم الاتحادية الشارقة وعجمان وأم القيوين والفجيرة، ولأبوظبي ودبي ورأس الخيمة محاكمها."],["status","Emirati women marrying foreigners, and Emirati men in the forces, police or MOFA, need extra approvals.","تحتاج المواطنات المتزوجات من أجانب، والمواطنون في القوات المسلحة أو الشرطة أو الخارجية، إلى موافقات إضافية."]],"c":["A Muslim woman cannot marry a non-Muslim man unless he converts.","لا يجوز للمسلمة الزواج من غير المسلم ما لم يُسلم."],"au":"moj","l":[525,526,527],"so":[[528,10,529],[530,515,531]],"v":1,"ch":["2025-04","A new Personal Status Law, Decree-Law No. 41 of 2024, took effect on 15 April 2025.","دخل قانون جديد للأحوال الشخصية، هو المرسوم بقانون رقم 41 لسنة 2024، حيز التنفيذ في 15 أبريل 2025.",0]},{"id":"family-divorce","q":["How does divorce work in the UAE for Muslims and for non-Muslims?","كيف يتم الطلاق في الإمارات للمسلمين ولغير المسلمين؟"],"k":["how to file for divorce in uae","non muslim divorce abu dhabi civil court","family guidance divorce dubai","talaq registration uae 15 days","كيف ارفع قضية طلاق","اجراءات الطلاق في الامارات","التوجيه الاسري الطلاق"],"a":["Muslim couples first see a family counsellor; without agreement, the referral letter must reach the court within one month. A husband must document a divorce in court within 15 days. Non-Muslims can get a no-fault divorce; Abu Dhabi's Civil Family Court aims to rule within one month.","يراجع الزوجان المسلمان المرشد الأسري أولاً، وإن لم يتفقا وجب تقديم خطاب الإحالة إلى المحكمة خلال شهر واحد. وعلى الزوج توثيق الطلاق أمام المحكمة خلال 15 يوماً. ويحق لغير المسلمين الطلاق دون إثبات ضرر، وتسعى محكمة الأسرة المدنية في أبوظبي للفصل فيه خلال شهر واحد."],"w":["emirati","resident"],"st":[["Muslims: open a family guidance case and attend the counselling session.","للمسلمين: افتح ملف توجيه أسري واحضر جلسة الإرشاد.",532],["A signed agreement there is enforceable; if none, take the referral letter to court within one month.","الاتفاق الموقّع هناك قابل للتنفيذ، وإلا فقدّم خطاب الإحالة إلى المحكمة خلال شهر واحد.",533],["Non-Muslims: file with the court; no proof of harm is needed.","لغير المسلمين: قدّم الدعوى إلى المحكمة دون حاجة إلى إثبات الضرر.",534]],"d":[["Marriage certificate; both spouses' IDs and passports","عقد الزواج، وهويات الزوجين وجوازات سفرهما"]],"f":[["A husband must document a divorce within 15 days (Article 58), or owe the wife compensation equal to maintenance.","على الزوج توثيق الطلاق خلال 15 يوماً (المادة 58)، وإلا استحقت الزوجة تعويضاً يعادل النفقة.",0],["Family guidance is mandatory for Muslims; the referral letter must reach the court within one month of issue.","التوجيه الأسري إلزامي للمسلمين، ويجب تقديم خطاب الإحالة إلى المحكمة خلال شهر واحد من صدوره.",0],["Abu Dhabi's Civil Family Court aims to finish a civil divorce within one month of filing.","تسعى محكمة الأسرة المدنية في أبوظبي إلى إنهاء دعوى الطلاق المدني خلال شهر واحد من قيدها.",1],["Resolution No. 67 of 2025 gives family guidance agreements the force of an executive deed.","يمنح القرار رقم 67 لسنة 2025 اتفاقات التوجيه الأسري قوة السند التنفيذي.",2]],"dp":[["status","Muslims follow the 2024 law; non-Muslims follow the 2022 civil law or their home country's law.","يخضع المسلمون لقانون 2024، وغير المسلمين لقانون 2022 المدني أو لقانون بلدهم."],["emirate","Abu Dhabi's civil court takes its residents, couples it married, and nationals of non-Sharia countries.","تقبل المحكمة المدنية في أبوظبي المقيمين فيها، ومن عقدت زواجهم، ومواطني الدول التي لا تطبق الشريعة."]],"c":["In khula, children's maintenance and custody cannot be waived. This is general information, not legal advice.","في الخلع لا يجوز التنازل عن نفقة الأطفال وحضانتهم. هذه معلومات عامة وليست استشارة قانونية."],"au":"moj","l":[535,536,527],"so":[[537,10,538],[502,503,504],[539,540,541]],"v":1,"ch":["2025-11","New rules on family guidance, visitation, arbitrators and marriage officers were issued.","صدرت قواعد جديدة بشأن التوجيه الأسري والزيارة والحكمين ومأذوني الزواج.",2]},{"id":"family-custody","q":["After a divorce, who gets custody of the children, and until what age?","بعد الطلاق، لمن تكون حضانة الأطفال وحتى أي عمر؟"],"k":["child custody uae new law 2025","custody age uae mother","who gets custody after divorce dubai","joint custody non muslim abu dhabi","custody age of boys and girls uae","حضانة الاطفال بعد الطلاق الامارات","سن الحضانة في القانون الجديد","الحضانة للام لين متى"],"a":["For Muslims, custody goes first to the mother, then the father, always in the child's best interest. Under the law in force since 15 April 2025, custody lasts until 18 for boys and girls, and from 15 a child may choose which parent to live with. For non-Muslims, joint custody is the default.","للمسلمين، تكون الحضانة للأم أولاً ثم للأب، مع مراعاة مصلحة الطفل دائماً. وبموجب القانون النافذ منذ 15 أبريل 2025 تستمر الحضانة حتى سن 18 عاماً للذكور والإناث، ويحق للطفل من سن 15 عاماً اختيار الوالد الذي يعيش معه. أما لغير المسلمين فالأصل هو الحضانة المشتركة."],"w":["emirati","resident"],"st":[["Try to agree on custody and visits in family guidance, or in a written agreement if you are non-Muslims.","حاولا الاتفاق على الحضانة والزيارة في التوجيه الأسري، أو في اتفاق مكتوب لغير المسلمين.",542],["No agreement? File a custody claim. The parent without custody can ask the court to set visits.","إذا لم تتفقا فارفع دعوى حضانة، ويحق للوالد غير الحاضن طلب تحديد مواعيد الزيارة.",533],["If things change, ask the court to review custody; it can be removed or restored.","إذا تغيّرت الظروف فاطلب من المحكمة مراجعة الحضانة، إذ يمكن إسقاطها أو إعادتها.",533]],"d":[["Marriage contract and divorce document","عقد الزواج ووثيقة الطلاق"],["Children's birth certificates and Emirates IDs","شهادات ميلاد الأطفال وهوياتهم الإماراتية"]],"f":[["Muslim law: custody runs to age 18, or longer if the child's health requires it.","في القانون للمسلمين: تستمر الحضانة حتى سن 18 عاماً، أو أكثر إذا استدعت صحة الطفل.",0],["From age 15, a child may choose which parent to live with.","من سن 15 عاماً يحق للطفل اختيار الوالد الذي يعيش معه.",0],["Federal Decree-Law No. 41 of 2024 on Personal Status took effect on 15 April 2025.","دخل المرسوم بقانون اتحادي رقم 41 لسنة 2024 بشأن الأحوال الشخصية حيز التنفيذ في 15 أبريل 2025.",1],["Civil law (Article 10 of Decree-Law No. 41 of 2022): joint custody is the general rule after divorce.","القانون المدني (المادة 10 من المرسوم بقانون رقم 41 لسنة 2022): الحضانة المشتركة هي الأصل بعد الطلاق.",0]],"dp":[["status","Muslim parents follow the 2024 law; non-Muslim parents follow the civil law.","يخضع الوالدان المسلمان لقانون 2024، ويخضع غير المسلمين للقانون المدني."],["other","The custodian must be 18+, sane, trustworthy and able (Article 113). A mother who remarries a man not related to the child may lose custody unless the court rules otherwise.","يشترط في الحاضن بلوغ 18 عاماً والعقل والأمانة والقدرة (المادة 113)، وقد تفقد الأم الحضانة إذا تزوجت رجلاً غير قريب للطفل ما لم تقرر المحكمة خلاف ذلك."]],"c":["Custody (daily care) differs from guardianship (legal decisions, passport), but a custodian mother decides on schooling (Article 112). This is general information, not legal advice.","الحضانة (الرعاية اليومية) غير الولاية (القرارات القانونية وجواز السفر)، لكن الأم الحاضنة تتولى الولاية التعليمية (المادة 112). هذه معلومات عامة وليست استشارة قانونية."],"au":"moj","l":[543,544,527],"so":[[545,10,538],[528,10,529]],"v":1,"ch":["2025-04","The new Personal Status Law set custody to 18 for boys and girls, with a choice at 15.","جعل قانون الأحوال الشخصية الجديد الحضانة حتى 18 عاماً للذكور والإناث مع حق الاختيار عند 15 عاماً.",0]},{"id":"family-travel-with-child","q":["Can I travel abroad with my child without the other parent's consent?","هل يمكنني السفر بطفلي إلى الخارج دون موافقة الوالد الآخر؟"],"k":["travel with child without father consent uae","can mother travel with kids after divorce dubai","child travel ban uae ex husband","noc from father to travel with child","child travel ban expat divorce","السفر بالطفل بدون موافقة الاب","منع سفر الاطفال الامارات","الحاضنة تسافر بالمحضون"],"a":["After a Muslim divorce, the custodian parent needs the other parent's written consent to take the child abroad. Without it, a court can allow trips of up to 60 days a year with a guarantee of return. The guardian keeps the passport but hands it over for travel. Under the civil law, neither non-Muslim parent may take the child abroad alone if the other objects.","بعد الطلاق بين المسلمين، يحتاج الوالد الحاضن إلى موافقة خطية من الوالد الآخر للسفر بالطفل إلى الخارج. وإن لم تتوفر، يجوز للمحكمة الإذن بسفر لا يتجاوز 60 يوماً في السنة بضمان يكفل عودته. ويحتفظ الولي بجواز السفر ويسلّمه للحاضن عند السفر. وفي القانون المدني، لا يجوز لأي من الوالدين غير المسلمين السفر بالطفل منفرداً إذا اعترض الآخر."],"w":["emirati","resident"],"st":[["Ask the other parent for written consent before you book.","اطلب موافقة مكتوبة من الوالد الآخر قبل حجز السفر.",546],["If they refuse, ask the court for permission to travel.","إذا رفض فاطلب من المحكمة الإذن بالسفر.",547],["Non-Muslims who fear the other parent will leave with the child can ask the court for a travel ban.","يمكن لغير المسلمين الذين يخشون أن يغادر الوالد الآخر بالطفل أن يطلبوا من المحكمة منع سفره.",548]],"d":[["Child's passport and Emirates ID","جواز سفر الطفل وهويته الإماراتية"],["Written consent or court order, and the custody judgment","الموافقة المكتوبة أو أمر المحكمة، وحكم الحضانة"]],"f":[["Article 116: the custodian parent needs the other parent's written approval; a court can allow trips totalling up to 60 days a year with a guarantee of return, or longer for a need.","المادة 116: يحتاج الوالد الحاضن إلى موافقة خطية من الوالد الآخر، ويجوز للمحكمة الإذن بسفر لا يتجاوز مجموعه 60 يوماً في السنة بضمان يكفل العودة، أو أكثر للضرورة.",2],["Article 117: the guardian keeps the child's passport but must hand it over for travel; if he stalls, the court can leave it with the custodian.","المادة 117: يحتفظ الولي بجواز سفر الطفل ويسلّمه للحاضن عند السفر، وإذا تعنّت جاز للمحكمة إبقاؤه في يد الحاضن.",2],["Civil law: neither parent may take the child abroad alone if the other objects; either may ask the court for a temporary travel ban.","في القانون المدني: لا يجوز لأي من الوالدين السفر بالطفل منفرداً إذا اعترض الآخر، ولكل منهما أن يطلب من المحكمة منعاً مؤقتاً لسفر الطفل.",0],["Abu Dhabi's Civil Family Court offers a prohibited steps order to stop a child being taken abroad.","توفر محكمة الأسرة المدنية في أبوظبي أمر منع لمنع إخراج الطفل من الدولة.",1]],"dp":[["status","Muslim parents follow the 2024 Personal Status Law; non-Muslim parents follow the 2022 civil law.","يخضع الوالدان المسلمان لقانون الأحوال الشخصية لعام 2024، ويخضع غير المسلمين للقانون المدني لعام 2022."],["other","If a court has already set custody or travel terms, those terms come first.","إذا حددت المحكمة سابقاً شروط الحضانة أو السفر، فتُقدَّم تلك الشروط."]],"c":["The destination country may have its own consent rules. Taking a child abroad against a court order can lead to legal action. This is general information, not legal advice.","قد تكون لدولة الوجهة قواعدها الخاصة بالموافقة. وقد يؤدي إخراج الطفل خلافاً لأمر المحكمة إلى إجراءات قانونية. هذه معلومات عامة وليست استشارة قانونية."],"au":"moj","l":[549,550,527],"so":[[551,10,538],[502,503,504],[552,540,553]],"v":1,"ch":["2025-04","The 2024 Personal Status Law, in force since April 2025, sets a 60-day yearly cap on court-approved trips.","يحدد قانون الأحوال الشخصية لعام 2024، النافذ منذ أبريل 2025، سقفاً قدره 60 يوماً سنوياً للسفر بإذن المحكمة.",2]},{"id":"family-birth-certificate","q":["We just had a baby. How do we get the birth certificate, and by when?","رُزقنا بمولود. كيف نستخرج شهادة الميلاد، وما المهلة؟"],"k":["how to get birth certificate uae newborn","birth certificate dubai hospital","baby birth certificate deadline uae","mabrouk ma yak","birth certifcate fee ehs","استخراج شهادة ميلاد مولود","شهادة ميلاد المولود كم يوم","مبروك ما ياك"],"a":["Residents must register a birth within 30 days. The hospital issues a birth notification, then the health authority issues the certificate (EHS charges AED 65). Expat parents then attest it and get the baby's passport, Emirates ID and visa within 120 days, or pay a daily fine. Emiratis can use the Mabrouk Ma Yak bundle.","على المقيمين تسجيل المولود خلال 30 يوماً. يصدر المستشفى إشعار الولادة، ثم تصدر الجهة الصحية الشهادة (65 درهماً لدى مؤسسة الإمارات للخدمات الصحية). ثم يصدّقها الوالدان الوافدان ويستخرجان جواز الطفل وهويته وإقامته خلال 120 يوماً، وإلا فُرضت غرامة يومية. ويمكن للمواطنين استخدام باقة «مبروك ما ياك»."],"w":["emirati","resident"],"st":[["Get the birth notification from the hospital. Government hospitals then issue the certificate.","احصل على إشعار الولادة من المستشفى، وتصدر المستشفيات الحكومية الشهادة بعد ذلك.",554],["After a private-hospital birth, apply to the health authority within 30 days.","بعد الولادة في مستشفى خاص، قدّم الطلب إلى الجهة الصحية خلال 30 يوماً.",555],["Expats: attest it (health authority, then MOFA) and get a passport from your embassy.","للمقيمين: صدّقها (الجهة الصحية ثم وزارة الخارجية) واستخرج جوازاً من سفارتك.",556],["Get the residence visa and Emirates ID within 120 days: GDRFA Dubai in Dubai, ICP elsewhere.","استخرج الإقامة والهوية خلال 120 يوماً: من إقامة دبي في دبي، ومن الهيئة الاتحادية للهوية في غيرها.",557]],"d":[["Hospital birth notification","إشعار الولادة من المستشفى"],["Attested marriage certificate translated into Arabic; parents' passports and Emirates IDs","عقد الزواج مصدقاً ومترجماً إلى العربية، وجوازات سفر الوالدين وهوياتهما"]],"f":[["Residents have up to 30 days to register a birth in the UAE.","أمام المقيمين 30 يوماً كحد أقصى لتسجيل المولود في الإمارات.",0],["Residents have 120 days to get the certificate, passport, Emirates ID and visa; u.ae says AED 100 a day is charged after that.","أمام المقيمين 120 يوماً لإنهاء الشهادة والجواز والهوية والإقامة، وتذكر بوابة u.ae أن الغرامة بعدها 100 درهم عن كل يوم.",0],["EHS birth certificate: AED 65, issued at once online; delivery AED 20.75.","شهادة الميلاد من مؤسسة الإمارات للخدمات الصحية: 65 درهماً وتصدر فوراً إلكترونياً، والتوصيل 20.75 درهماً.",1],["Mabrouk Ma Yak (usrati.gov.ae) covers an Emirati baby's certificate, family book entry, passport, Emirates ID and Thiqa.","تشمل باقة «مبروك ما ياك» (usrati.gov.ae) شهادة ميلاد المولود المواطن وقيده في خلاصة القيد وجوازه وهويته وبطاقة ثقة.",0],["ICP's fine card lists AED 50 a day when a stay, visa or newborn registration has expired.","تحدد بطاقة غرامات الهيئة الاتحادية للهوية 50 درهماً عن كل يوم عند انتهاء مدة الإقامة أو التأشيرة أو قيد المولود.",2]],"dp":[["emirate","DHA issues certificates in Dubai and DoH in Abu Dhabi; EHS serves the other emirates.","تصدر هيئة الصحة بدبي الشهادات في دبي، ودائرة الصحة في أبوظبي، وتخدم مؤسسة الإمارات للخدمات الصحية بقية الإمارات."],["visa","Newborn visas: GDRFA Dubai in Dubai; ICP in other emirates.","إقامة المولود: من إقامة دبي في دبي، ومن الهيئة الاتحادية للهوية في بقية الإمارات."]],"c":["Official pages differ on the late fine: u.ae says AED 100 a day, ICP AED 50; ask ICP or GDRFA Dubai. Unmarried parents should ask the health authority before the birth.","تختلف الصفحات الرسمية في غرامة التأخير: تذكر u.ae 100 درهم يومياً والهيئة الاتحادية 50 درهماً، فاسأل الهيئة أو إقامة دبي. وعلى الوالدين غير المتزوجين سؤال الجهة الصحية قبل الولادة."],"au":"mohap","so":[[25,10,26],[558,559,560],[15,4,16]],"v":1,"cl":{"kind":"deadline","fact":0,"days":[30,120],"label":{"en":"Deadline counted from the birth","ar":"الموعد النهائي محسوباً من تاريخ الولادة"},"start":{"en":"Baby's date of birth","ar":"تاريخ ميلاد الطفل"}}},{"id":"family-death-repatriation","q":["A family member died in the UAE. How do we get the death certificate and send the body home?","توفي أحد أفراد عائلتي في الإمارات. كيف نحصل على شهادة الوفاة ونرسل الجثمان إلى بلده؟"],"k":["what to do when someone dies in dubai","how to get death certificate uae","repatriation of body from uae procedure","dead body transport permit uae","death certifcate abu dhabi who pays repatriation","اجراءات الوفاة في الامارات","كيف اطلع شهادة وفاة","نقل جثمان وافد الى بلده"],"a":["If someone dies outside a hospital, call the police on 999. The police stamp the death declaration and issue no-objection letters, for example to release or embalm the body or send it abroad. The health authority then issues the death certificate; EHS charges AED 65 and issues it within 24 hours. For an expatriate, inform their embassy.","إذا حدثت الوفاة خارج المستشفى فاتصل بالشرطة على 999. تختم الشرطة بلاغ الوفاة وتصدر شهادات عدم ممانعة، مثل الإفراج عن الجثمان أو تحنيطه أو نقله إلى الخارج. ثم تصدر الجهة الصحية شهادة الوفاة، وتبلغ رسومها لدى مؤسسة الإمارات للخدمات الصحية 65 درهماً وتصدر خلال 24 ساعة. وإذا كان المتوفى وافداً فأبلغ سفارته."],"st":[["Outside a hospital, call 999. The police report the death and move the body to the morgue.","خارج المستشفى اتصل على 999، وتعدّ الشرطة بلاغ الوفاة وتنقل الجثمان إلى ثلاجة الموتى.",561],["Get the police stamp and the no-objection certificates you need: release, embalming, travel.","احصل على ختم الشرطة وشهادات عدم الممانعة اللازمة: الإفراج والتحنيط والسفر.",562],["Apply for the death certificate with the deceased's ID, passport, visa, death notification and burial permit.","قدّم طلب شهادة الوفاة مع هوية المتوفى وجوازه وإقامته وإشعار الوفاة وتصريح الدفن.",563],["Expatriates: inform the embassy and get the Ministry of Interior permit to transport the body.","للوافدين: أبلغ السفارة واستخرج تصريح نقل الجثمان من وزارة الداخلية.",564]],"d":[["Deceased's Emirates ID, passport and residence visa","هوية المتوفى الإماراتية وجواز سفره وإقامته"],["Death notification and police burial permit","إشعار الوفاة وتصريح الدفن من الشرطة"],["Power of attorney, if needed","توكيل رسمي عند الحاجة"]],"f":[["Report a death outside a hospital to the police on 999.","يُبلَّغ عن الوفاة خارج المستشفى للشرطة على الرقم 999.",0],["EHS death certificate: AED 65, ready within 24 hours; delivery is AED 20.75.","شهادة الوفاة لدى مؤسسة الإمارات للخدمات الصحية: 65 درهماً وتجهز خلال 24 ساعة، والتوصيل 20.75 درهماً.",1],["Relatives up to the 4th degree, a legal representative or an embassy representative can apply to EHS.","يحق للأقارب حتى الدرجة الرابعة أو الممثل القانوني أو ممثل السفارة التقديم لدى المؤسسة.",1],["Labour law (Article 15): the employer pays to prepare and transport a deceased worker's body home if the family asks.","قانون العمل (المادة 15): يتحمل صاحب العمل تكاليف تجهيز جثمان العامل المتوفى ونقله إلى بلده إذا طلبت أسرته ذلك.",2]],"dp":[["emirate","EHS serves the northern emirates; DHA and DoH Abu Dhabi issue certificates in their emirates.","تخدم مؤسسة الإمارات للخدمات الصحية الإمارات الشمالية، وتصدر هيئة الصحة بدبي ودائرة الصحة بأبوظبي الشهادات في إمارتيهما."],["sector","If the deceased worked in the private sector, the employer pays the repatriation costs on the family's request.","إذا كان المتوفى يعمل في القطاع الخاص، يتحمل صاحب العمل تكاليف النقل بناءً على طلب الأسرة."],["status","For an Emirati who dies abroad, the family needs a certificate translated by the UAE embassy and a MOFA report.","إذا توفي مواطن في الخارج، تحتاج الأسرة إلى شهادة مترجمة من سفارة الدولة وتقرير من وزارة الخارجية."]],"c":["An unnatural death also needs a forensic report and a Public Prosecution letter, so it takes longer. To use the certificate abroad, you may need MOFA attestation.","تحتاج الوفاة غير الطبيعية أيضاً إلى تقرير طبي شرعي وكتاب من النيابة العامة، فتستغرق وقتاً أطول. وقد تحتاج إلى تصديق الشهادة من وزارة الخارجية لاستخدامها في الخارج."],"au":"mohap","so":[[565,10,566],[567,559,568],[569,10,570]],"v":1},{"id":"family-domestic-violence","q":["I'm being abused at home. How can I get help and protection in the UAE?","أتعرض للعنف في المنزل. كيف أحصل على المساعدة والحماية في الإمارات؟"],"k":["domestic violence uae help","husband hits me what to do dubai","protection order uae domestic abuse","women shelter abu dhabi number","dubai foundation for women and children number","عنف اسري بلاغ الامارات","زوجي يضربني وين اشتكي","رقم مؤسسة دبي لرعاية النساء والاطفال"],"a":["If you are in danger now, call the police on 999. Domestic violence includes physical, verbal, psychological, sexual and financial abuse and neglect, and Federal Decree-Law No. 13 of 2024 covers it. Helplines include the Dubai Foundation for Women and Children (800111), EWAA shelters (8007283) and the Ministry of Interior (116111).","إذا كنت في خطر الآن فاتصل بالشرطة على 999. يشمل العنف الأسري الإيذاء الجسدي واللفظي والنفسي والجنسي والمالي والإهمال، وينظمه المرسوم بقانون اتحادي رقم 13 لسنة 2024. ومن خطوط المساعدة: مؤسسة دبي لرعاية النساء والأطفال (800111)، ومراكز إيواء (8007283)، ووزارة الداخلية (116111)."],"st":[["In danger? Call 999 or go to the nearest police station.","إذا كنت في خطر فاتصل على 999 أو توجّه إلى أقرب مركز شرطة.",571],["Call a helpline for advice, shelter or a safety plan.","اتصل بخط مساعدة للحصول على المشورة أو الإيواء أو خطة للسلامة.",572],["Get a medical report for any injury, and keep messages and photos somewhere safe.","احصل على تقرير طبي لأي إصابة، واحتفظ بالرسائل والصور في مكان آمن.",573],["File a complaint with the police and ask about a protection order.","قدّم بلاغاً للشرطة واسأل عن أمر الحماية.",574]],"d":[["Emirates ID or passport","الهوية الإماراتية أو جواز السفر"],["Medical report, photos, messages or names of witnesses","التقرير الطبي والصور والرسائل أو أسماء الشهود"]],"f":[["Emergency police number: 999, in every emirate.","رقم الشرطة للطوارئ: 999 في جميع الإمارات.",0],["Helplines: Dubai Foundation for Women and Children 800111; EWAA shelters 8007283; Ministry of Interior 116111; CDA Dubai 800988.","خطوط المساعدة: مؤسسة دبي لرعاية النساء والأطفال 800111، ومراكز إيواء 8007283، ووزارة الداخلية 116111، وهيئة تنمية المجتمع في دبي 800988.",0],["Police safety lines: Aman (Abu Dhabi) 8002626 or SMS 2828; Al Ameen (Dubai) 8004444; Najeed (Sharjah) 901.","خطوط الأمان لدى الشرطة: أمان (أبوظبي) 8002626 أو رسالة إلى 2828، والأمين (دبي) 8004444، ونجيد (الشارقة) 901.",0],["Sharjah protection centres 800 700; Hemaya (Ajman) 800446292; Aman Centre via RAK Police 07-2356666.","مراكز الحماية في الشارقة 800 700، ومؤسسة حماية (عجمان) 800446292، ومركز أمان عبر شرطة رأس الخيمة 07-2356666.",0],["The current law is Federal Decree-Law No. 13 of 2024; the Family Protection Policy lists 6 forms of family violence.","القانون الحالي هو المرسوم بقانون اتحادي رقم 13 لسنة 2024، وتحدد سياسة حماية الأسرة 6 صور للعنف الأسري.",1]],"dp":[["emirate","Each emirate has its own centre: DFWAC and CDA (Dubai), EWAA and Aman (Abu Dhabi), Sharjah protection centres, Hemaya (Ajman), Aman Centre (RAK).","لكل إمارة مركزها: مؤسسة دبي وهيئة تنمية المجتمع (دبي)، وإيواء وأمان (أبوظبي)، ومراكز الحماية في الشارقة، وحماية (عجمان)، ومركز أمان (رأس الخيمة)."],["other","If children are also at risk, tell the helpline; 116111 also takes child abuse reports.","إذا كان الأطفال في خطر أيضاً فأخبر خط المساعدة، فالرقم 116111 يستقبل أيضاً بلاغات الإساءة للأطفال."]],"c":["Ask the police or Public Prosecution about a protection order. Keep evidence where the abuser cannot reach it.","اسأل الشرطة أو النيابة العامة عن أمر الحماية، واحفظ الأدلة بعيداً عن متناول المعتدي."],"au":"community","l":[575,161,576],"so":[[577,10,578],[579,10,580],[581,582,576]],"v":1,"ch":["2024-09","Federal Decree-Law No. 13 of 2024 on protection against domestic violence took effect on 16 September 2024.","دخل المرسوم بقانون اتحادي رقم 13 لسنة 2024 بشأن الحماية من العنف الأسري حيز التنفيذ في 16 سبتمبر 2024.",2]},{"id":"family-child-protection","q":["I think a child is being abused or neglected. How do I report it?","أظن أن طفلاً يتعرض للإساءة أو الإهمال. كيف أبلّغ عن ذلك؟"],"k":["report child abuse uae","child protection hotline 116111","neighbour child neglected dubai report","wadeema law","bullying at school report uae","بلاغ اساءة طفل الامارات","قانون وديمة حقوق الطفل","رقم حماية الطفل 116111"],"a":["Call the Ministry of Interior's child protection line on 116111 or use the Hemayati app; call 999 if the child is in immediate danger. Wadeema's Law protects every child up to 18 from neglect, exploitation and abuse. Specialists can remove a child from home without a court order when danger is imminent. School cases go to the Ministry of Education unit on 80085.","اتصل بخط حماية الطفل في وزارة الداخلية 116111 أو استخدم تطبيق «حمايتي»، واتصل على 999 إذا كان الطفل في خطر داهم. يحمي قانون «وديمة» كل طفل حتى سن 18 عاماً من الإهمال والاستغلال والإساءة. ويحق لاختصاصيي حماية الطفل إخراجه من المنزل دون إذن قضائي عند الخطر الوشيك. وتُرفع حالات المدارس إلى وحدة حماية الطفل في وزارة التربية والتعليم على 80085."],"st":[["If the child is in immediate danger, call 999.","إذا كان الطفل في خطر داهم فاتصل على 999.",571],["Otherwise, report to the MOI Child Protection Centre on 116111 or through the Hemayati app.","وفي غير ذلك، أبلغ مركز حماية الطفل في وزارة الداخلية على 116111 أو عبر تطبيق «حمايتي».",583],["For abuse at school, contact the Ministry of Education Child Protection Unit: 80085 or CPU@moe.gov.ae.","في حالات الإساءة في المدرسة، تواصل مع وحدة حماية الطفل في وزارة التربية والتعليم: 80085 أو CPU@moe.gov.ae.",584],["Say what you know: who, where, what you saw and when. Specialists then assess the case.","اذكر ما تعرفه: من، وأين، وماذا رأيت، ومتى، ثم يقيّم الاختصاصيون الحالة.",585]],"f":[["Emergency police number: 999.","رقم الشرطة للطوارئ: 999.",1],["MOI child protection line: 116111 (toll-free), or the Hemayati app.","خط حماية الطفل في وزارة الداخلية: 116111 (مجاني)، أو تطبيق «حمايتي».",0],["Wadeema's Law (Federal Law No. 3 of 2016 on Child Rights) applies to all children up to 18.","يُطبَّق قانون «وديمة» (القانون الاتحادي رقم 3 لسنة 2016 بشأن حقوق الطفل) على جميع الأطفال حتى سن 18 عاماً.",0],["Ministry of Education Child Protection Unit: 80085 or CPU@moe.gov.ae.","وحدة حماية الطفل في وزارة التربية والتعليم: 80085 أو CPU@moe.gov.ae.",0],["Other lines: DFWAC 800111, CDA 800988, EWAA 8007283, Sharjah 800 700, Hemaya 800446292, Aman Centre RAK 07-2356666.","خطوط أخرى: مؤسسة دبي 800111، وهيئة تنمية المجتمع 800988، وإيواء 8007283، والشارقة 800 700، وحماية 800446292، ومركز أمان برأس الخيمة 07-2356666.",0]],"dp":[["emirate","116111 works across the UAE; each emirate also has its own centre, such as DFWAC in Dubai or EWAA in Abu Dhabi.","يعمل الرقم 116111 في جميع أنحاء الدولة، ولكل إمارة أيضاً مركزها، مثل مؤسسة دبي لرعاية النساء والأطفال أو مراكز إيواء في أبوظبي."],["other","School cases go to the Ministry of Education. Abuse of a child of determination in Abu Dhabi can go to the Zayed Higher Organisation.","تُرفع حالات المدارس إلى وزارة التربية والتعليم، ويمكن رفع حالات الإساءة لأطفال أصحاب الهمم في أبوظبي إلى مؤسسة زايد العليا."]],"c":["Under Wadeema's Law, neglect, such as not registering a birth or not enrolling a child in school, can bring prison or a fine. Report what you saw; specialists will look into it.","بموجب قانون «وديمة» قد يؤدي الإهمال، مثل عدم تسجيل المولود أو عدم إلحاق الطفل بالمدرسة، إلى الحبس أو الغرامة. أبلغ عما رأيته، وسيتولى الاختصاصيون متابعته."],"au":"moi","l":[586,161,587],"so":[[588,10,589],[577,10,578]],"v":1},{"id":"family-inheritance-muslim","q":["A Muslim family member died. How is the estate divided, and how do we get the inheritance certificate?","توفي فرد مسلم من العائلة. كيف تُقسم التركة، وكيف نستخرج إعلام الوراثة؟"],"k":["inheritance law uae muslim shares","how to get inheritance certificate dubai courts","wife share of inheritance uae","estate distribution after death uae","حصر الورثة في الامارات","اعلام وراثة محكمة دبي","نصيب الزوجة من الميراث","كيف نقسم الورث"],"a":["A Muslim's estate is shared by fixed Sharia shares under the Personal Status Law, in force since 15 April 2025. Funeral costs, debts and any will (up to one-third) come first. The heirs then ask the personal status court for an inheritance determination naming every heir and share. A wife, for example, gets 1/8 if her husband left children.","تُقسَّم تركة المسلم وفق الفروض الشرعية في قانون الأحوال الشخصية النافذ منذ 15 أبريل 2025. وتُقدَّم تكاليف التجهيز والديون والوصية في حدود الثلث. ثم يطلب الورثة من محكمة الأحوال الشخصية إعلاماً شرعياً يحدد كل وارث ونصيبه. فمثلاً ترث الزوجة الثُّمن (1/8) إذا ترك زوجها أولاداً."],"w":["emirati","resident"],"st":[["Get the death certificate and papers showing every heir: family book, or marriage and birth certificates.","استخرج شهادة الوفاة والوثائق التي تبيّن جميع الورثة: خلاصة القيد، أو عقود الزواج وشهادات الميلاد.",590],["Apply to the personal status court for an inheritance determination (I'lam Shar'i) listing heirs and shares.","قدّم طلباً إلى محكمة الأحوال الشخصية لإصدار إعلام شرعي يحصر الورثة وأنصبتهم.",591],["If heirs disagree or the estate is complex, the court can appoint an estate administrator.","إذا اختلف الورثة أو كانت التركة معقدة، يجوز للمحكمة تعيين مدير للتركة.",533]],"d":[["Death certificate; family book (Emiratis) or marriage and birth certificates","شهادة الوفاة، وخلاصة القيد للمواطنين أو عقود الزواج وشهادات الميلاد"],["IDs of all heirs and a list of the deceased's assets and debts","هويات جميع الورثة وقائمة بأصول المتوفى وديونه"]],"f":[["Federal Decree-Law No. 41 of 2024 on Personal Status, which covers wills and inheritance, took effect on 15 April 2025.","دخل المرسوم بقانون اتحادي رقم 41 لسنة 2024 بشأن الأحوال الشخصية، الذي ينظم الوصية والميراث، حيز التنفيذ في 15 أبريل 2025.",0],["Article 201: funeral costs come first, then debts, then wills up to one-third (more if heirs agree); the rest goes to the heirs.","المادة 201: تُقدَّم تكاليف تجهيز الميت، ثم الديون، ثم الوصية في حدود الثلث (أو أكثر إذا رضي الورثة)، ثم يُقسم الباقي على الورثة.",1],["Article 209 lists the fixed shares: 2/3, 1/3, 1/6, 1/2, 1/4 and 1/8.","المادة 209: الفروض هي الثلثان والثلث والسدس والنصف والربع والثمن (2/3، 1/3، 1/6، 1/2، 1/4، 1/8).",1],["Article 212: a wife gets 1/4, or 1/8 if her husband left a child or a son's child; wives share it. Article 211: a husband gets 1/2, or 1/4 in the same case.","المادة 212: ترث الزوجة الربع (1/4)، والثمن (1/8) إذا كان للزوج فرع وارث، وتشترك فيه الزوجات. المادة 211: يرث الزوج النصف (1/2)، أو الربع (1/4) في الحالة نفسها.",1],["ADJD fees (2023 guide): AED 150 to open an inheritance file, AED 200 per estate asset (up to AED 2,000), AED 500 to appoint an estate administrator.","رسوم دائرة القضاء في أبوظبي (دليل 2023): 150 درهماً لفتح ملف تركة، و200 درهم لكل أصل (بحد أقصى 2,000 درهم)، و500 درهم لتعيين مدير التركة.",2]],"dp":[["status","Non-Muslims follow civil rules or their home country's law instead.","يخضع غير المسلمين للقواعد المدنية أو لقانون بلدهم بدلاً من ذلك."],["emirate","Abu Dhabi, Dubai and RAK courts handle estates in their emirates; federal courts handle the rest. Fees differ.","تنظر محاكم أبوظبي ودبي ورأس الخيمة في تركات إماراتها، وتنظر المحاكم الاتحادية في البقية، وتختلف الرسوم."],["other","Exact shares depend on which relatives survive: spouse, children, parents or siblings.","تعتمد الأنصبة الدقيقة على الأقارب الأحياء: الزوج أو الزوجة، والأبناء، والوالدين، والإخوة."]],"c":["Rely on the court's determination for exact shares. Fees differ by court; ADJD's guide dates from 2023. For complex estates, consult a licensed lawyer.","اعتمد على إعلام المحكمة لمعرفة الأنصبة الدقيقة. وتختلف الرسوم من محكمة إلى أخرى، ويعود دليل دائرة القضاء إلى 2023. وفي التركات المعقدة استشر محامياً مرخصاً."],"au":"moj","l":[543,592,527],"so":[[593,10,529],[552,540,553],[594,503,595]],"v":1,"ch":["2025-04","A new Personal Status Law, covering wills and inheritance, took effect on 15 April 2025.","دخل قانون جديد للأحوال الشخصية، ينظم الوصية والميراث، حيز التنفيذ في 15 أبريل 2025.",0]},{"id":"family-attest-marriage-certificate","q":["We married abroad. How do we attest our marriage certificate for use in the UAE?","تزوجنا خارج الدولة. كيف نصدّق عقد الزواج لاستخدامه في الإمارات؟"],"k":["marriage certificate attestation uae","attest marriage certificate for family visa","mofa attestation fee marriage certificate","how to att
