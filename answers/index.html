est marriage certificate from india for dubai","marrige certificate atestation mofa","تصديق عقد الزواج من الخارجية","تصديق شهادة زواج من الخارج للاقامة","رسوم تصديق الخارجية"],"a":["A marriage certificate issued abroad is attested in a chain: first by the issuing country's foreign ministry, then by the UAE embassy there, and finally by the UAE Ministry of Foreign Affairs (MOFA) online. MOFA charges AED 150 for personal documents such as marriage certificates; embassies add their own fees. Courts also need a certified Arabic translation.","يُصدَّق عقد الزواج الصادر في الخارج على مراحل: أولاً من وزارة خارجية البلد الذي أصدره، ثم من سفارة الدولة هناك، وأخيراً من وزارة الخارجية الإماراتية إلكترونياً. وتبلغ رسوم الوزارة 150 درهماً للوثائق الشخصية مثل عقود الزواج، وتضيف السفارات رسومها الخاصة. وتطلب المحاكم أيضاً ترجمة عربية معتمدة."],"w":["emirati","resident"],"st":[["Have the certificate attested by the foreign ministry, or the competent authority, of the country that issued it.","صدّق العقد لدى وزارة الخارجية أو الجهة المختصة في البلد الذي أصدره.",596],["Have it attested by the UAE embassy or consulate in that country.","صدّقه لدى سفارة الدولة أو قنصليتها في ذلك البلد.",597],["In the UAE, apply for MOFA attestation online and send the original by courier.","في الإمارات، قدّم طلب التصديق إلكترونياً لدى وزارة الخارجية وأرسل الأصل عبر البريد السريع.",598],["If a court or authority needs it in Arabic, get a legal translation certified by the Ministry of Justice.","إذا طلبته محكمة أو جهة بالعربية، فاستخرج ترجمة قانونية معتمدة من وزارة العدل.",599]],"d":[["Original marriage certificate with the home-country and UAE embassy stamps","أصل عقد الزواج مختوماً من البلد المُصدِر ومن سفارة الدولة"],["Certified Arabic translation, if requested","ترجمة عربية معتمدة عند الطلب"]],"f":[["MOFA attestation of individual documents, including marriage certificates: AED 150.","رسوم تصديق وزارة الخارجية للوثائق الشخصية، ومنها عقود الزواج: 150 درهماً.",0],["MOFA attests through its website or the UAE MOFA app, and the original must be sent by courier.","تصدّق الوزارة عبر موقعها أو تطبيقها الذكي، ويجب إرسال الأصل عبر البريد السريع.",0],["UAE missions abroad set their own fees; the Ottawa embassy, for example, charges AED 150 per document plus a service fee.","تحدد البعثات الإماراتية في الخارج رسومها؛ فسفارة أوتاوا مثلاً تتقاضى 150 درهماً عن كل وثيقة إضافة إلى رسم خدمة.",1],["Dubai Courts require foreign papers attested by the foreign ministry, the UAE embassy and MOFA, plus an Arabic translation certified by the Ministry of Justice.","تشترط محاكم دبي تصديق المستندات الأجنبية من خارجية بلدها وسفارة الدولة ووزارة الخارجية، مع ترجمة عربية معتمدة من وزارة العدل.",2]],"dp":[["other","The order of stamps can differ by country. Ask the UAE embassy that will attest it.","قد يختلف ترتيب الأختام من بلد لآخر، فاسأل سفارة الدولة التي ستصدّقه."],["visa","Family visa files usually ask for it. Dubai visas go through GDRFA Dubai; other emirates through ICP.","تطلبه عادة ملفات إقامة الأسرة، وتُقدَّم إقامات دبي عبر الإدارة العامة للإقامة وشؤون الأجانب في دبي، وبقية الإمارات عبر الهيئة الاتحادية للهوية والجنسية."]],"c":["Steps and embassy fees differ by country, and some missions accept only mailed originals. Check the embassy's page before you send documents.","تختلف الخطوات ورسوم السفارات من بلد لآخر، وبعض البعثات لا تقبل إلا الأصول المرسلة بالبريد. راجع صفحة السفارة قبل إرسال المستندات."],"au":"mofa","so":[[600,601,602],[603,601,604],[605,515,531]],"v":1},{"id":"family-maintenance","q":["After a divorce, who pays child support and alimony, and for how long?","بعد الطلاق، من يدفع نفقة الأطفال ونفقة الزوجة، وإلى متى؟"],"k":["child support uae after divorce","how much alimony dubai court","nafaqa uae new law","alimoney non muslim wife abu dhabi","نفقة الاولاد بعد الطلاق","كم النفقة في الامارات","متعة المطلقة كم","طليقي ما يدفع نفقة العيال"],"a":["For Muslims, the father pays his children's food, clothing, housing, medical and school costs until a daughter marries or works, and a son can earn (longer if still studying). The judge sets the amount from his means and their needs. A divorced wife may get maintenance in her waiting period, and mut'ah of up to a year's maintenance if she did not seek or cause the divorce. For non-Muslims, the judge sets alimony case by case.","للمسلمين، يتحمل الأب نفقة أولاده من طعام وكسوة ومسكن وعلاج وتعليم حتى تتزوج البنت أو تعمل، وحتى يقدر الابن على الكسب (أو أطول إن واصل دراسته). ويقدّر القاضي المبلغ بحسب قدرة الأب وحاجة الأولاد. وقد تستحق المطلقة النفقة في عدتها، ومتعة لا تجاوز نفقة سنة إذا لم تطلب الطلاق ولم تتسبب فيه. ولغير المسلمين يحدد القاضي النفقة حسب كل حالة."],"w":["emirati","resident"],"st":[["Try to agree in family guidance first.","حاولا الاتفاق في التوجيه الأسري أولاً.",532],["No deal? File a maintenance claim; the court can order interim maintenance meanwhile.","إذا لم تتفقا فارفع دعوى نفقة، ويجوز للمحكمة تقرير نفقة مؤقتة أثناء نظرها.",533],["To raise or cut it later, wait a year after the ruling is final, unless the case is exceptional.","لزيادة النفقة أو إنقاصها لاحقاً، انتظر مضي سنة على صيرورة الحكم باتاً إلا في الحالات الاستثنائية.",533],["Non-Muslims: after the divorce judgment, apply to the court for alimony.","لغير المسلمين: بعد حكم الطلاق قدّم طلب النفقة إلى المحكمة.",606]],"d":[["Marriage contract, divorce document and children's birth certificates","عقد الزواج ووثيقة الطلاق وشهادات ميلاد الأطفال"],["Proof of the payer's income; bills for rent, school and medical care","ما يثبت دخل الملزم بالنفقة، وفواتير الإيجار والمدرسة والعلاج"]],"f":[["Article 106: a father supports a daughter until she marries or works, and a son until he can earn like his peers, or while he keeps studying successfully.","المادة 106: ينفق الأب على البنت حتى تتزوج أو تعمل، وعلى الابن حتى يتكسب كأمثاله، أو ما دام يواصل دراسته بنجاح.",0],["Article 97: a claim to raise or cut maintenance is heard only a year after the ruling is final, barring exceptional cases; a rise reaches back at most 6 months.","المادة 97: لا تُسمع دعوى الزيادة أو الإنقاص قبل مضي سنة على صيرورة الحكم باتاً إلا لظروف استثنائية، ولا تسري الزيادة بأثر رجعي لأكثر من 6 أشهر.",0],["Past maintenance: a wife can claim up to 2 years before filing (Article 99); children up to a year (Article 111).","النفقة عن مدة سابقة: للزوجة حتى سنتين قبل رفع الدعوى (المادة 99)، وللأولاد حتى سنة (المادة 111).",0],["Article 102: mut'ah is at most a year's maintenance for women like her, set by the husband's means, and may be paid in instalments.","المادة 102: لا تجاوز المتعة نفقة سنة لأمثال المطلقة، وتُقدَّر بحسب حال الزوج، ويجوز تقسيطها.",0],["Civil law (Decree-Law No. 41 of 2022): the judge weighs marriage length, the wife's age and both finances; alimony ends if she remarries or loses custody.","القانون المدني (المرسوم بقانون رقم 41 لسنة 2022): يراعي القاضي مدة الزواج وعمر الزوجة ووضع الطرفين المالي، وتنتهي النفقة إذا تزوجت أو فقدت الحضانة.",1]],"dp":[["status","Muslims follow the 2024 Personal Status Law; non-Muslims follow the 2022 civil law, where the judge decides each case.","يخضع المسلمون لقانون الأحوال الشخصية لعام 2024، ويخضع غير المسلمين للقانون المدني لعام 2022 حيث يقرر القاضي في كل حالة."],["other","If the custodian has no home of her own, the father also pays for housing her with the children (Article 119).","إذا لم تملك الحاضنة مسكناً، يلتزم الأب أيضاً بأجرة مسكن لها وللأطفال (المادة 119)."]],"c":["The law sets no fixed percentage; the judge decides. Ongoing maintenance ranks ahead of the payer's other debts. This is general information, not legal advice.","لا يحدد القانون نسبة ثابتة، والقرار للقاضي. وتتقدم النفقة المستمرة على سائر ديون الملزم بها. هذه معلومات عامة وليست استشارة قانونية."],"au":"moj","l":[543,607,553],"so":[[608,540,553],[537,10,538],[528,10,529]],"v":1,"ch":["2025-04","A new Personal Status Law, which also governs maintenance, took effect on 15 April 2025.","دخل قانون جديد للأحوال الشخصية، ينظم النفقة أيضاً، حيز التنفيذ في 15 أبريل 2025.",2]}]},{"topic":"everyday","title":{"en":"Driving, police, consumer and online law","ar":"المرور والشرطة وحماية المستهلك والقوانين الرقمية"},"checked":"2026-11-08","entries":[{"id":"everyday-photos-privacy-online","q":["Is it a crime to film someone, or post their photo or video online, without permission?","هل يُعد تصوير شخص أو نشر صوره أو مقاطعه على الإنترنت دون إذنه جريمة؟"],"k":["post photo without permission uae law","can i film someone in public dubai","someone posted my vidoe without consent uae","تصوير شخص بدون اذنه الامارات عقوبة","نشر صور بدون اذن غرامة","واحد صورني ونزلها سناب وش اسوي","سب وقذف في الواتساب الامارات"],"a":["Yes, it can be. Under the federal cybercrime law, filming or photographing people, or sharing their images, without consent to invade their privacy can bring at least 6 months in jail and/or a fine of AED 150,000-500,000. Insulting someone online can bring jail and/or a fine of AED 250,000-500,000. Victims can report it to the police.","نعم، قد يكون جريمة. فبموجب قانون الجرائم الإلكترونية الاتحادي، يُعاقب من يصوّر الآخرين أو ينشر صورهم أو مقاطعهم دون رضاهم بقصد انتهاك خصوصيتهم بالحبس 6 أشهر على الأقل و/أو غرامة من 150,000 إلى 500,000 درهم. ويُعاقب من يسب غيره عبر الإنترنت بالحبس و/أو غرامة من 250,000 إلى 500,000 درهم. ويمكن للضحية إبلاغ الشرطة."],"st":[["Save screenshots, links, account names and dates. Do not insult back or repost it.","احفظ لقطات الشاشة والروابط وأسماء الحسابات والتواريخ، ولا ترد بالإساءة ولا تُعِد النشر.",609],["Ask the platform to remove the post.","اطلب من المنصة حذف المنشور.",610],["Report it: eCrime in Dubai, Aman in Abu Dhabi, the MOI UAE app or a police station elsewhere. Call 999 if threatened.","أبلغ عنه: منصة eCrime في دبي، وخدمة أمان في أبوظبي، وتطبيق وزارة الداخلية أو مركز شرطة في غيرهما. واتصل بالرقم 999 عند التهديد.",611]],"f":[["Art. 44: photographing people in any public or private place, or sharing their photos, without consent and to invade their privacy: at least 6 months' jail and/or AED 150,000-500,000.","المادة 44: تصوير الأشخاص في أي مكان عام أو خاص أو تداول صورهم دون رضاهم وبقصد انتهاك خصوصيتهم: الحبس 6 أشهر على الأقل و/أو غرامة 150,000-500,000 درهم.",0],["Art. 44 also covers photos of accident victims, and publishing even true information to harm someone.","تشمل المادة 44 أيضاً تصوير ضحايا الحوادث، ونشر معلومات ولو كانت صحيحة بقصد الإضرار بالشخص.",0],["Editing a photo or clip to defame or insult someone: at least one year's jail and/or AED 250,000-500,000.","تعديل صورة أو مقطع بقصد التشهير أو الإساءة: الحبس سنة على الأقل و/أو غرامة 250,000-500,000 درهم.",0],["Art. 43: insulting someone online: jail and/or AED 250,000-500,000.","المادة 43: سب الغير عبر الإنترنت: الحبس و/أو غرامة 250,000-500,000 درهم.",0],["u.ae lists Dubai Police eCrime, Abu Dhabi Police Aman, the MOI UAE app, police stations and 999 for reports.","تذكر بوابة u.ae منصة eCrime لشرطة دبي، وخدمة أمان لشرطة أبوظبي، وتطبيق وزارة الداخلية، ومراكز الشرطة، والرقم 999 للإبلاغ.",1]],"dp":[["emirate","The law is federal. Only the reporting channel differs by emirate.","القانون اتحادي، ويختلف مكان الإبلاغ فقط بين الإمارات."]],"c":["Courts judge each case on its facts, such as consent and intent. General information, not legal advice.","تفصل المحاكم في كل حالة بحسب وقائعها، مثل الرضا والقصد. معلومات عامة وليست استشارة قانونية."],"au":"moi","l":[612,613,614],"so":[[615,616,617],[618,245,619]],"v":1},{"id":"everyday-bounced-cheque","q":["A cheque bounced. Is it still a crime, and what happens now?","ارتجع شيك. هل ما زال ذلك جريمة؟ وماذا يحدث الآن؟"],"k":["bounced cheque uae new law","is bounced cheque still criminal in dubai","cheque bounce travel ban uae","cheque bounced insufficent funds what to do","شيك مرتجع الامارات القانون الجديد","شيك بدون رصيد هل يسجن","رجع لي شيك وش اسوي"],"a":["Since 2 January 2022, a cheque that bounces only for lack of funds is no longer a crime. The holder goes to the court's execution judge, who can order payment, seize assets and may ban travel. The bank must pay whatever part is in the account. Fraud, such as closing the account or stopping payment without a legal reason, is still a crime.","منذ 2 يناير 2022، لم يعد ارتجاع الشيك لعدم كفاية الرصيد وحده جريمة. ويتقدم حامل الشيك إلى قاضي التنفيذ في المحكمة، الذي يمكنه الأمر بالسداد والحجز على الأموال، وقد يمنع المدين من السفر. ويلتزم البنك بصرف الجزء المتوفر في الحساب. أما الاحتيال، مثل إغلاق الحساب أو طلب وقف الصرف دون سبب قانوني، فما زال جريمة."],"st":[["Holder: get a bank certificate showing the bounce reason and any amount paid.","لحامل الشيك: احصل من البنك على شهادة تبين سبب الارتجاع وأي مبلغ صُرف.",620],["File a cheque execution request with the execution judge (in Dubai, online with Dubai Courts).","قدّم طلب تنفيذ الشيك إلى قاضي التنفيذ (وفي دبي إلكترونياً لدى محاكم دبي).",621],["Dubai fees: 2% of the unpaid value (AED 200 min, AED 5,000 max), plus AED 300 for a travel ban.","رسوم دبي: 2% من القيمة غير المسددة (200 درهم حداً أدنى و5,000 حداً أقصى)، و300 درهم لطلب المنع من السفر.",515],["Drawer: once notified, you have 15 days in Dubai to pay or propose a settlement.","لمُصدر الشيك: بعد إعلانك، لديك 15 يوماً في دبي للسداد أو تقديم مقترح تسوية.",515]],"d":[["Bank certificate of the bounce, and your IBAN certificate","شهادة البنك بارتجاع الشيك، وشهادة رقم الآيبان الخاص بك"]],"f":[["The cheque amendments took effect on 2 January 2022; issuing a cheque without enough funds is no longer a crime.","بدأ تطبيق تعديلات أحكام الشيك في 2 يناير 2022، ولم يعد إصدار شيك دون رصيد كافٍ جريمة.",0],["Still crimes: stopping payment without a legal reason, closing or emptying the account, or writing or signing so it cannot be cashed.","تبقى جرائم: طلب وقف الصرف دون سبب قانوني، وإغلاق الحساب أو سحب رصيده، والكتابة أو التوقيع بطريقة تمنع الصرف.",0],["If funds are short, the bank must pay the available part unless the holder refuses partial payment.","إذا لم يكفِ الرصيد، يلتزم البنك بصرف الجزء المتوفر ما لم يرفض الحامل الصرف الجزئي.",0],["Dubai Courts: 2% of the unpaid value (min AED 200, max AED 5,000) plus small service fees; travel ban request AED 300; 15 days to pay or settle.","محاكم دبي: 2% من القيمة غير المسددة (الحد الأدنى 200 والأقصى 5,000 درهم) مع رسوم خدمة بسيطة، وطلب المنع من السفر 300 درهم، و15 يوماً للسداد أو التسوية.",1]],"dp":[["emirate","You file with the competent court. The fees shown are Dubai Courts' fees; other emirates set their own.","يُقدَّم الطلب إلى المحكمة المختصة. والرسوم المذكورة خاصة بمحاكم دبي، ولكل إمارة رسومها."]],"c":["A travel ban is not automatic; the judge decides. The holder may refuse partial payment and claim the full amount. Not legal advice.","المنع من السفر ليس تلقائياً بل يقرره القاضي. ولحامل الشيك رفض الصرف الجزئي والمطالبة بكامل المبلغ. ليست استشارة قانونية."],"au":"dubai-courts","l":[622,161,623],"so":[[624,625,626],[627,515,628]],"v":1},{"id":"everyday-travel-ban-check","q":["How do I check if I have a travel ban, and how do I get it lifted?","كيف أعرف إذا كان عليّ منع سفر؟ وكيف يُرفع؟"],"k":["how to check travel ban uae","travle ban check online dubai police","do i have travel ban for unpaid loan","lift travel ban abu dhabi court","الاستعلام عن منع السفر الامارات","كيف اعرف اني ممنوع من السفر","منع سفر بسبب قرض بنك"],"a":["A travel ban usually comes from a court or prosecution case, often over debts, bounced cheques or criminal complaints. You can check online with Dubai Police (financial cases), the Abu Dhabi Judicial Department and the Public Prosecution. Check before you go to the airport. The body that issued the ban lifts it, usually after you pay, settle or win an objection.","يصدر منع السفر عادةً في قضية أمام محكمة أو نيابة، وغالباً بسبب ديون أو شيكات مرتجعة أو بلاغات جنائية. ويمكنك الاستعلام إلكترونياً لدى شرطة دبي (القضايا المالية) ودائرة القضاء في أبوظبي والنيابة العامة. استعلم قبل الذهاب إلى المطار. وترفع المنعَ الجهةُ التي أصدرته، غالباً بعد السداد أو التسوية أو قبول التظلم."],"st":[["Dubai: check for financial cases.","دبي: استعلم عن القضايا المالية.",629],["Abu Dhabi: check for claims that prohibit travel.","أبوظبي: استعلم عن الدعاوى المانعة من السفر.",630],["Criminal cases or other emirates: use the Public Prosecution case enquiry, or ask at a police station.","القضايا الجنائية أو الإمارات الأخرى: استخدم خدمة الاستعلام عن القضايا لدى النيابة العامة، أو اسأل في مركز شرطة.",631],["To lift a debt ban, pay or settle and ask the court that issued it to cancel it. You can also object; in Abu Dhabi, usually within 7 days of notice.","لرفع منع سفر بسبب دين، سدّد أو تصالح واطلب من المحكمة التي أصدرته إلغاءه. ويمكنك التظلم أيضاً، وفي أبوظبي عادةً خلال 7 أيام من الإعلان.",632]],"f":[["u.ae lists online checks: Dubai Police financial cases (website or app), ADJD's Estafser eService and the Public Prosecution case enquiry.","تذكر بوابة u.ae خدمات استعلام إلكترونية: القضايا المالية لدى شرطة دبي (الموقع أو التطبيق)، وخدمة «استفسر» لدى دائرة القضاء في أبوظبي، والاستعلام عن القضايا لدى النيابة العامة.",0],["Abu Dhabi: a debt travel ban lapses if no main claim is filed within 8 days of the order, or enforcement of the final judgment does not start within 30 days.","أبوظبي: يسقط منع السفر بسبب الدين إذا لم تُرفع الدعوى الموضوعية خلال 8 أيام من صدور الأمر، أو لم يبدأ تنفيذ الحكم النهائي خلال 30 يوماً.",1],["Abu Dhabi: objections are usually due within 7 days of notice; the travel ban request fee is AED 400.","أبوظبي: يُقدَّم التظلم عادةً خلال 7 أيام من الإعلان، ورسم طلب المنع من السفر 400 درهم.",1]],"dp":[["emirate","Each emirate's courts issue and lift their own bans. The Dubai Police and ADJD checks cover their own emirate.","تصدر محاكم كل إمارة قرارات المنع وترفعها، وتغطي خدمتا شرطة دبي ودائرة القضاء في أبوظبي إمارتيهما."],["other","Criminal cases go through the police and prosecution; civil debts go through the court's execution judge.","تمر القضايا الجنائية عبر الشرطة والنيابة، أما الديون المدنية فعبر قاضي التنفيذ في المحكمة."]],"c":["Online checks may not cover every emirate or case. If in doubt, ask a lawyer, an immigration office or a police station before you travel.","قد لا تغطي خدمات الاستعلام الإلكترونية كل الإمارات أو كل القضايا. وعند الشك، اسأل محامياً أو مكتب هجرة أو مركز شرطة قبل السفر."],"au":"u-ae","so":[[633,245,634],[635,503,636]],"v":1},{"id":"everyday-traffic-fines-pay-discount","q":["How do I check and pay my traffic fines? Can I get a discount or pay in instalments?","كيف أستعلم عن مخالفاتي المرورية وأدفعها؟ وهل يمكنني الحصول على خصم أو التقسيط؟"],"k":["check traffic fines uae","pay traffic fines online dubai","traffic fine discount abu dhabi 35","can i pay trafic fines in installments","الاستعلام عن المخالفات المرورية","خصم المخالفات المرورية ابوظبي","تقسيط المخالفات المرورية"],"a":["You can check and pay fines in official apps such as MOI UAE, Dubai Police, RTA and TAMM. In Dubai, you must pay a vehicle's fines before renewing its registration. Abu Dhabi gives 35% off if you pay within 60 days (not for serious violations) and 25% off after that up to one year. It also offers interest-free instalments over one year through banks.","يمكنك الاستعلام عن المخالفات ودفعها عبر التطبيقات الرسمية مثل تطبيق وزارة الداخلية وشرطة دبي وهيئة الطرق والمواصلات ومنصة تم. وفي دبي يجب دفع مخالفات المركبة قبل تجديد تسجيلها. وتمنح أبوظبي خصم 35% عند السداد خلال 60 يوماً (عدا المخالفات الخطرة) و25% بعدها حتى سنة، وتتيح التقسيط دون فوائد لمدة سنة عبر البنوك."],"st":[["Look up your fines and black points.","استعلم عن مخالفاتك ونقاطك السوداء.",637],["Abu Dhabi: pay within 60 days of the violation for 35% off, or later within a year for 25% off.","أبوظبي: ادفع خلال 60 يوماً من تاريخ المخالفة لتحصل على خصم 35%، أو لاحقاً خلال سنة لخصم 25%.",638],["Abu Dhabi: for a large total, ask about interest-free instalments over one year through banks.","أبوظبي: إذا كان المجموع كبيراً فاسأل عن التقسيط دون فوائد لمدة سنة عبر البنوك.",639],["Dubai: pay all fines on the vehicle before renewing its registration.","دبي: سدّد كل مخالفات المركبة قبل تجديد تسجيلها.",640]],"f":[["RTA: to renew a vehicle in Dubai, pay all its pending fines; fines on your other vehicles issued less than 6 months ago need not be paid first.","هيئة الطرق: لتجديد تسجيل مركبة في دبي سدّد جميع مخالفاتها، ولا يلزم أولاً سداد مخالفات مركباتك الأخرى الصادرة منذ أقل من 6 أشهر.",0],["Abu Dhabi: 35% off if paid within 60 days of the violation (serious violations excluded); 25% off after 60 days up to one year.","أبوظبي: خصم 35% عند السداد خلال 60 يوماً من المخالفة (عدا المخالفات الخطرة)، و25% بعد 60 يوماً حتى سنة.",1],["Abu Dhabi: fines can be paid in interest-free instalments over one year through banks.","أبوظبي: يمكن تقسيط المخالفات دون فوائد على مدى سنة عبر البنوك.",1]],"dp":[["emirate","Each emirate sets its own discounts and instalments, so check with the police force that issued the fine. The renewal rule shown is RTA's in Dubai.","تحدد كل إمارة خصوماتها وخطط التقسيط، فراجع جهة الشرطة التي حررت المخالفة. وشرط التجديد المذكور خاص بهيئة الطرق في دبي."],["other","Serious violations do not get Abu Dhabi's 35% discount.","لا تحصل المخالفات الخطرة على خصم 35% في أبوظبي."]],"c":["Discount schemes can change or end, so check the amount shown in the app before paying. Some violations also bring black points or car impoundment.","قد تتغير برامج الخصم أو تنتهي، فتأكد من المبلغ الظاهر في التطبيق قبل الدفع. وبعض المخالفات تترتب عليها نقاط سوداء أو حجز المركبة."],"au":"moi","so":[[641,642,643],[644,645,646]],"v":1},{"id":"everyday-foreign-licence-exchange","q":["Can I swap my foreign driving licence for a UAE one, or must I take lessons and tests?","هل يمكنني استبدال رخصة قيادتي الأجنبية برخصة إماراتية، أم يجب أن أتدرب وأجتاز الاختبارات؟"],"k":["convert driving liscence dubai","exchange foreign licence uae country list","uk licence to uae licence","can i drive in dubai with foreign licence","تبديل الرخصة الأجنبية بالإماراتية","تحويل رخصة القيادة دبي","عندي رخصة اجنبية ابي اسوق بالامارات"],"a":["Residents with a valid licence from an approved country can exchange it without driving school. In Dubai, the RTA list includes GCC states, the US, the UK and many European countries, and fees total AED 1,050 with the eye test. Abu Dhabi (TAMM) and the other emirates (MOI) run their own services. Otherwise, you apply for a new licence through a driving institute and pass the tests.","يمكن للمقيم الذي يحمل رخصة سارية من دولة معتمدة أن يستبدلها دون مدرسة قيادة. وفي دبي تشمل قائمة هيئة الطرق دول الخليج والولايات المتحدة والمملكة المتحدة وكثيراً من الدول الأوروبية، ومجموع الرسوم 1,050 درهماً مع فحص النظر. ولأبوظبي (منصة تم) وباقي الإمارات (وزارة الداخلية) خدماتها الخاصة. وفي غير ذلك تتقدم لرخصة جديدة عبر معهد قيادة وتجتاز الاختبارات."],"w":["emirati","resident","visitor"],"st":[["Check that your country is on your emirate's list.","تحقق من وجود دولتك في قائمة إمارتك.",647],["Do an electronic eye test (AED 140-180 in Dubai, depending on the centre).","أجرِ فحص النظر الإلكتروني (140-180 درهماً في دبي حسب المركز).",648],["Apply with your Emirates ID, original licence and a legal translation if needed.","قدّم الطلب بالهوية الإماراتية والرخصة الأصلية وترجمة قانونية عند الحاجة.",649],["Country not listed: apply through a driving institute and pass the theory and road tests.","إذا لم تكن دولتك مدرجة: تقدّم عبر معهد قيادة واجتز الاختبارين النظري والعملي.",650]],"f":[["Dubai exchange fees: traffic file 200, licence 600, handbook 50, eye test 180, knowledge and innovation 20; total AED 1,050.","رسوم الاستبدال في دبي: فتح ملف مروري 200، والرخصة 600، والكتيب 50، وفحص النظر 180، والمعرفة والابتكار 20؛ والمجموع 1,050 درهماً.",0],["The Dubai eye test costs AED 140-180, depending on the test centre.","تتراوح رسوم فحص النظر في دبي بين 140 و180 درهماً حسب المركز.",0],["Visit visa holders may drive light vehicles and motorcycles in Dubai only with a GCC or approved-country licence.","يحق لحاملي تأشيرة الزيارة قيادة المركبات الخفيفة والدراجات النارية في دبي فقط برخصة خليجية أو من دولة معتمدة.",0],["Licences from non-listed countries cannot be exchanged; holders apply through a driving institute and pass the tests.","لا تُستبدل الرخص الصادرة من دول غير مدرجة، ويتقدم حاملوها عبر معهد قيادة ويجتازون الاختبارات.",0]],"dp":[["emirate","Dubai: RTA list and fees. Abu Dhabi: TAMM. Other emirates: MOI. Lists and fees can differ.","دبي: قائمة هيئة الطرق ورسومها. أبوظبي: منصة تم. باقي الإمارات: وزارة الداخلية. وقد تختلف القوائم والرسوم."],["visa","Citizens and residents exchange. Visitors cannot, but may drive with an approved licence.","يستبدل المواطنون والمقيمون رخصهم، أما الزوار فلا يستبدلون لكن يمكنهم القيادة برخصة معتمدة."],["other","Visa from another emirate? Exchange there, unless your Dubai employer sponsors your visa. A Dubai tenancy contract is not enough.","إقامتك من إمارة أخرى؟ استبدل رخصتك هناك، إلا إذا كانت جهة عملك في دبي هي كفيلة إقامتك. ولا يكفي عقد إيجار في دبي."]],"c":["RTA shows two country lists that do not fully match, so confirm your country first. If you have two passports and entered on a non-listed one, you need a new licence.","تعرض هيئة الطرق قائمتين غير متطابقتين تماماً، فتأكد من دولتك أولاً. وإذا كان لديك جوازان ودخلت بجواز دولة غير مدرجة فعليك استخراج رخصة جديدة."],"au":"rta","so":[[651,642,652]],"v":1},{"id":"everyday-minor-accident","q":["I had a small car accident and nobody is hurt. What do I do?","تعرضت لحادث مروري بسيط دون إصابات. ماذا أفعل؟"],"k":["minor accident dubai what to do","small accident no injuries uae report app","car accident report dubai police app","saaed app accident report","حادث بسيط ماذا افعل الامارات","صدمت سيارة وش اسوي","تطبيق ساعد حادث","رافد حادث الشارقة"],"a":["If anyone is hurt, call 999 (police) or 998 (ambulance). If no one is hurt, move the cars out of traffic if it is safe, and photograph both cars with the plates showing. Then report it online: the Dubai Police app in Dubai, Rafid in Sharjah, or the MOI UAE, Saaed or Abu Dhabi Police apps elsewhere.","إذا أُصيب أحد فاتصل بالرقم 999 (الشرطة) أو 998 (الإسعاف). وإذا لم يُصب أحد، فأبعد المركبتين عن حركة السير إن كان ذلك آمناً، وصوّرهما مع ظهور اللوحات. ثم أبلغ إلكترونياً: تطبيق شرطة دبي في دبي، وتطبيق رافد في الشارقة، أو تطبيقات وزارة الداخلية وساعد وشرطة أبوظبي في غيرهما."],"st":[["Check for injuries. If anyone is hurt, call 999 or 998 and wait for help.","تأكد من عدم وجود إصابات، وإذا أُصيب أحد فاتصل بالرقم 999 أو 998 وانتظر المساعدة.",653],["If no one is hurt, move the cars aside and photograph both from all sides with the plates showing.","إذا لم يُصب أحد، فأبعد المركبتين جانباً وصوّرهما من جميع الجهات مع ظهور اللوحات.",609],["Report it: Dubai Police app in Dubai; Rafid in Sharjah; MOI UAE, Saaed or Abu Dhabi Police app elsewhere.","أبلغ عن الحادث: تطبيق شرطة دبي في دبي، وتطبيق رافد في الشارقة، وتطبيقات وزارة الداخلية وساعد وشرطة أبوظبي في غيرهما.",654],["If the drivers disagree about fault, or the other driver leaves, go to the nearest police station.","إذا اختلف السائقون على المتسبب أو غادر السائق الآخر، فتوجّه إلى أقرب مركز شرطة.",655]],"d":[["Photos of both cars showing the plates","صور المركبتين تظهر فيها اللوحات"],["Driving licence and vehicle registration card","رخصة القيادة وبطاقة ملكية المركبة"]],"f":[["u.ae lists apps for reporting minor accidents online: MOI UAE, Saaed, Abu Dhabi Police, Dubai Police and Rafid (Sharjah).","تذكر بوابة u.ae تطبيقات للإبلاغ عن الحوادث البسيطة إلكترونياً: وزارة الداخلية وساعد وشرطة أبوظبي وشرطة دبي ورافد (الشارقة).",0],["Emergency numbers: police 999, ambulance 998, civil defence 997.","أرقام الطوارئ: الشرطة 999، والإسعاف 998، والدفاع المدني 997.",0]],"dp":[["emirate","Dubai uses the Dubai Police app and Sharjah uses Rafid. Other emirates use the MOI UAE, Saaed or Abu Dhabi Police apps.","تعتمد دبي تطبيق شرطة دبي، والشارقة تطبيق رافد، وتعتمد الإمارات الأخرى تطبيقات وزارة الداخلية وساعد وشرطة أبوظبي."],["other","Injuries, a dispute over fault, or a driver who drove off need the police, not just the app.","الإصابات أو الخلاف على المتسبب أو فرار السائق الآخر تستدعي الشرطة وليس التطبيق فقط."]],"c":["Keep the report; your insurer or garage will ask for it. Each app shows what it needs, such as photos, before you submit. General information, not legal advice.","احتفظ بالتقرير، فستطلبه شركة التأمين أو الورشة. ويوضح كل تطبيق ما يحتاجه، مثل الصور، قبل الإرسال. معلومات عامة وليست استشارة قانونية."],"au":"moi","so":[[656,245,657]],"v":1},{"id":"everyday-bank-insurance-complaint","q":["My bank or insurance company won't fix my problem. Where can I complain?","لم يحل البنك أو شركة التأمين مشكلتي. أين أشتكي؟"],"k":["complaint against bank uae","sanadak complaint how to file","insurance claim rejected where to complain uae","bank charged me wrongly complain","شكوى على بنك في الامارات","سندك تقديم شكوى","شركة التامين رفضت المطالبة وين اشتكي","البنك ما رد على شكواي"],"a":["First file an official complaint with the bank, finance company or insurer, and keep the reference number. If it is not solved after 15 calendar days, take it to Sanadak, the free complaints body for firms licensed by the Central Bank. Sanadak will not take cases already in court or already settled.","قدّم أولاً شكوى رسمية إلى البنك أو شركة التمويل أو شركة التأمين، واحتفظ برقم الشكوى. وإذا لم تُحل خلال 15 يوماً تقويمياً، فارفعها إلى «سندك»، الجهة المجانية لتسوية شكاوى عملاء المؤسسات المرخصة من المصرف المركزي. ولا يقبل «سندك» القضايا المنظورة أمام المحاكم أو التي سبقت تسويتها."],"st":[["Complain to the bank or insurer in writing and keep the reference number.","قدّم شكواك إلى البنك أو شركة التأمين كتابياً واحتفظ برقم المرجع.",658],["If there is no fix after 15 calendar days, file with Sanadak and attach your evidence.","إذا لم تُحل خلال 15 يوماً تقويمياً، فقدّم الشكوى إلى «سندك» وأرفق أدلتك.",659]],"d":[["The complaint reference number from the bank or insurer","رقم مرجع الشكوى لدى البنك أو شركة التأمين"],["Statements, contracts, policy or claim papers, and messages","كشوف الحساب والعقود ووثيقة التأمين أو أوراق المطالبة والمراسلات"]],"f":[["You must first complain to the institution and wait 15 calendar days; Sanadak may reject complaints filed earlier.","يجب أن تشتكي أولاً لدى المؤسسة وتنتظر 15 يوماً تقويمياً، وقد يرفض «سندك» الشكاوى المقدمة قبل ذلك.",0],["Sanadak resolves complaints from consumers and SMEs free of charge.","يسوّي «سندك» شكاوى المستهلكين والمنشآت الصغيرة والمتوسطة مجاناً.",0],["Sanadak may reject complaints already in court, already settled, repeated, or outside the Central Bank's mandate.","قد يرفض «سندك» الشكاوى المنظورة أمام المحاكم أو التي سُويت أو المكررة أو الخارجة عن نطاق رقابة المصرف المركزي.",0],["Complaints can cover losses from misleading, fraudulent or unfair conduct by a licensed bank or insurer.","يمكن أن تشمل الشكاوى الخسائر الناتجة عن سلوك مضلل أو احتيالي أو غير عادل من بنك أو شركة تأمين مرخصة.",0]],"dp":[["other","Sanadak only covers banks, finance companies and insurers licensed by the Central Bank.","يختص «سندك» فقط بالبنوك وشركات التمويل والتأمين المرخصة من المصرف المركزي."],["status","Individuals and small and medium businesses can use it.","يحق للأفراد والمنشآت الصغيرة والمتوسطة استخدامه."]],"c":["Some older pages mention a longer wait; u.ae now says 15 calendar days. If you go to court first, Sanadak cannot take the case.","تذكر بعض الصفحات القديمة مدة انتظار أطول، وتنص بوابة u.ae حالياً على 15 يوماً تقويمياً. وإذا لجأت إلى المحكمة أولاً فلن يقبل «سندك» الشكوى."],"au":"sanadak","so":[[660,245,661],[662,663,664]],"v":1},{"id":"everyday-report-scam-fraud","q":["I was scammed online or by phone. How do I report it and try to get my money back?","تعرضت لاحتيال عبر الإنترنت أو الهاتف. كيف أبلغ وأحاول استرداد أموالي؟"],"k":["how to report scam uae","scammed online dubai police report","lost money to fraud call bank uae","fake job offer scam report uae","الابلاغ عن احتيال الكتروني الامارات","نصبوا علي اونلاين وين ابلغ","احتيال اتصال باسم البنك سحبوا فلوسي"],"a":["Act fast: call your bank at once to block your card and dispute the payments. Then report it: eCrime (Dubai Police) in Dubai, Aman (Abu Dhabi Police) in Abu Dhabi, or the MOI UAE app or a police station elsewhere. Keep all messages, numbers and receipts. If your bank or insurer treated you unfairly, you can later go to Sanadak.","تصرّف بسرعة: اتصل ببنكك فوراً لإيقاف البطاقة والاعتراض على العمليات. ثم أبلغ: منصة eCrime (شرطة دبي) في دبي، وخدمة أمان (شرطة أبوظبي) في أبوظبي، أو تطبيق وزارة الداخلية أو مركز شرطة في غيرهما. واحتفظ بكل الرسائل والأرقام والإيصالات. وإذا تعامل معك البنك أو شركة التأمين بشكل غير عادل، يمكنك اللجوء لاحقاً إلى «سندك»."],"st":[["Call your bank now to block cards and dispute the payments.","اتصل ببنكك الآن لإيقاف البطاقات والاعتراض على العمليات.",665],["Report it online with screenshots, the scammer's number or account, and payment receipts.","قدّم البلاغ إلكترونياً مع لقطات الشاشة ورقم المحتال أو حسابه وإيصالات الدفع.",666],["If someone threatens or blackmails you, do not pay. Call 999.","إذا هددك أحد أو ابتزك فلا تدفع، واتصل بالرقم 999.",571],["If your bank does not help, complain to it in writing, then to Sanadak after 15 calendar days.","إذا لم يساعدك البنك، فاشتكِ إليه كتابياً ثم إلى «سندك» بعد 15 يوماً تقويمياً.",667]],"f":[["Dubai Police's eCrime platform (ecrimehub.gov.ae) handles cyber-enabled financial crimes and scams.","تختص منصة eCrime لشرطة دبي (ecrimehub.gov.ae) بالجرائم المالية الإلكترونية والاحتيال.",0],["u.ae also lists Abu Dhabi Police's Aman, the MOI UAE app's eCrimes service and the Public Prosecution's My Safe Society app.","تذكر بوابة u.ae أيضاً خدمة أمان لشرطة أبوظبي، وخدمة الجرائم الإلكترونية في تطبيق وزارة الداخلية، وتطبيق «مجتمعي آمن» للنيابة العامة.",1],["Police emergency number: 999.","رقم الشرطة للطوارئ: 999.",0],["Sanadak handles losses from fraudulent or unfair conduct by licensed banks and insurers, after a 15-calendar-day wait.","يختص «سندك» بالخسائر الناتجة عن سلوك احتيالي أو غير عادل من البنوك وشركات التأمين المرخصة، بعد انتظار 15 يوماً تقويمياً.",2]],"dp":[["emirate","Dubai uses eCrime, Abu Dhabi uses Aman, and the MOI UAE app covers the rest.","تعتمد دبي منصة eCrime، وأبوظبي خدمة أمان، ويغطي تطبيق وزارة الداخلية بقية الإمارات."],["other","Police pursue the criminal. If your bank or insurer failed you, Sanadak may help.","تلاحق الشرطة المجرم، وإذا قصّر البنك أو شركة التأمين فقد يساعدك «سندك»."]],"c":["Recovery is not guaranteed, so report within hours. Real banks and police never ask for card details or codes by message or call.","استرداد المال غير مضمون، فبادر بالإبلاغ خلال ساعات. ولا تطلب البنوك أو الشرطة الحقيقية أبداً بيانات البطاقة أو الرموز عبر الرسائل أو الاتصالات."],"au":"moi","so":[[668,245,669],[618,245,619],[670,245,661]],"v":1,"h":"scamshield"},{"id":"everyday-consumer-refund-complaint","q":["A shop won't refund or fix a faulty product. What are my rights, and where do I complain?","رفض المتجر رد ثمن منتج معيب أو إصلاحه. ما حقوقي؟ وأين أشتكي؟"],"k":["shop refuse refund uae","consumer complaint dubai","no refund no exchange policy legal uae","شكوى حماية المستهلك","المحل رفض يرجع فلوسي","البضاعة المباعة لا ترد ولا تستبدل قانون"],"a":["If a product fails for reasons the seller is responsible for, you choose a refund, a free repair or a replacement. A 'goods sold are not returnable' sign is void except in set cases, such as defects you accepted on the invoice, perishables or custom-made items. Ask the seller first, then complain to your emirate's economic department or the Ministry of Economy and Tourism (800 1222).","إذا تعطل المنتج لأسباب يتحمل البائع مسؤوليتها، فلك أن تختار استرداد الثمن أو الإصلاح أو الاستبدال مجاناً. وعبارة «البضاعة المباعة لا ترد ولا تستبدل» باطلة إلا في حالات محددة، مثل العيب الذي قبلته وذُكر في الفاتورة، أو السلع القابلة للتلف أو المصنوعة حسب الطلب. راجع البائع أولاً، ثم اشتكِ إلى الدائرة الاقتصادية في إمارتك أو إلى وزارة الاقتصاد والسياحة (800 1222)."],"st":[["Ask the seller in writing for a refund, repair or replacement. Keep the invoice.","اطلب من البائع كتابياً استرداد الثمن أو الإصلاح أو الاستبدال، واحتفظ بالفاتورة.",671],["If refused, complain to the economic department where you bought it, or call the Ministry on 800 1222.","إذا رُفض طلبك، فاشتكِ إلى الدائرة الاقتصادية في الإمارة التي اشتريت منها، أو اتصل بالوزارة على 800 1222.",672]],"f":[["Art. 27: if a fault comes from causes the supplier is responsible for, the consumer chooses a refund, or a free replacement or repair.","المادة 27: إذا نتج العيب عن أسباب يتحمل المورد مسؤوليتها، يختار المستهلك استرداد الثمن أو الاستبدال أو الإصلاح مجاناً.",0],["Art. 17: if a warranty repair takes more than 7 days, the supplier lends a similar product or agrees other compensation.","المادة 17: إذا استغرق إصلاح السلعة المضمونة أكثر من 7 أيام، يوفر المورد سلعة مماثلة أو يتفق مع المستهلك على تعويض آخر.",0],["Art. 34: 'goods sold are not returnable' is void except for accepted defects on the invoice, perishables, custom-made goods, books and goods that cannot be resold.","المادة 34: شرط «البضاعة المباعة لا ترد ولا تستبدل» باطل إلا للعيب المقبول في الفاتورة والسلع القابلة للتلف والمصنوعة حسب الطلب والكتب والسلع غير القابلة لإعادة البيع.",0],["Complaints: Ministry of Economy and Tourism 800 1222; Dubai DET (consumerrights.ae); ADDED, SEDD and other emirates' economic departments.","الشكاوى: وزارة الاقتصاد والسياحة 800 1222، ودائرة الاقتصاد والسياحة في دبي (consumerrights.ae)، ودوائر التنمية الاقتصادية في أبوظبي والشارقة وباقي الإمارات.",1]],"dp":[["emirate","Complain in the emirate where you bought the item.","اشتكِ في الإمارة التي اشتريت منها."],["other","u.ae says the law does not cover online purchases from businesses registered outside the UAE.","تذكر بوابة u.ae أن القانون لا يشمل الشراء الإلكتروني من شركات مسجلة خارج الدولة."]],"c":["The law covers faulty or wrongly described goods. For change-of-mind returns, check the shop's policy first.","يحميك القانون عند العيب أو مخالفة الوصف. أما الإرجاع لتغيير الرأي فراجع سياسة المتجر أولاً."],"au":"economy","l":[673,674,675],"so":[[676,240,675],[677,245,678],[679,207,680]],"v":1},{"id":"everyday-police-clearance-certificate","q":["How do I get a police clearance (good conduct) certificate, even after leaving the UAE?","كيف أحصل على شهادة حسن السيرة والسلوك من الشرطة، حتى بعد مغادرة الإمارات؟"],"k":["police clearance certificate dubai","good conduct certificate uae online","pcc uae from outside country","شهادة حسن سيرة وسلوك دبي","شهادة خلو سوابق الامارات","شهادة حسن السيرة من خارج الدولة","كم رسوم شهادة حسن السيرة والسلوك"],"a":["Dubai Police and the federal Ministry of Interior (MOI) both issue it online. Dubai Police charges AED 100 for citizens, AED 200 for residents and AED 300 from abroad, plus AED 20; MOI charges AED 50 for use in the UAE and AED 100 for use abroad. Without an Emirates ID you must give fingerprints. Certificates for use abroad need Foreign Affairs attestation.","تصدر الشهادة إلكترونياً جهتان: شرطة دبي ووزارة الداخلية الاتحادية. ورسوم شرطة دبي 100 درهم للمواطن و200 للمقيم و300 لمن يطلبها من الخارج، تضاف إليها 20 درهماً، ورسوم وزارة الداخلية 50 درهماً للاستخدام داخل الدولة و100 درهم لخارجها. ومن لا يحمل هوية إماراتية يقدّم بصماته. وتحتاج الشهادة المستخدمة في الخارج إلى تصديق وزارة الخارجية."],"st":[["Pick the issuer: Dubai Police if you lived in Dubai, otherwise MOI. Ask the requesting body if unsure.","اختر الجهة: شرطة دبي إن كنت أقمت في دبي، وإلا فوزارة الداخلية. واسأل الجهة الطالبة عند الشك.",681],["Apply online with UAE PASS. You can apply from abroad if you entered the UAE before.","قدّم الطلب إلكترونياً عبر UAE PASS. ويمكنك التقديم من الخارج إذا سبق لك دخول الدولة.",682],["No Emirates ID? Give fingerprints at a service centre, or send a fingerprint card attested by a UAE embassy.","إذا لم تكن لديك هوية إماراتية، فقدّم بصماتك في مركز خدمة، أو أرسل بطاقة بصمات مصدقة من سفارة الدولة.",683],["For use abroad, get Ministry of Foreign Affairs attestation.","للاستخدام في الخارج، احصل على تصديق وزارة الخارجية.",684]],"f":[["Dubai Police fees: citizen AED 100, resident AED 200, from abroad AED 300, plus AED 20; AED 100 more at a service centre.","رسوم شرطة دبي: المواطن 100 درهم، والمقيم 200، ومن الخارج 300، إضافة إلى 20 درهماً، و100 درهم إضافية في مراكز الخدمة.",0],["Dubai Police: applicants abroad must have entered the UAE before; without prints on file, they send an embassy-attested fingerprint card.","شرطة دبي: يجب أن يكون المتقدم من الخارج قد دخل الدولة من قبل، ومن ليست له بصمات مسجلة يرسل بطاقة بصمات مصدقة من السفارة.",0],["MOI fees: AED 50 for use in the UAE, AED 100 for use abroad, AED 50 fingerprinting for visitors and GCC citizens.","رسوم وزارة الداخلية: 50 درهماً للاستخدام داخل الدولة، و100 درهم للاستخدام خارجها، و50 درهماً لبصمات الزوار ومواطني دول الخليج.",1],["MOI: certificates are not accepted abroad without Ministry of Foreign Affairs attestation, which has its own fee.","وزارة الداخلية: لا تُعتمد الشهادة خارج الدولة دون تصديق وزارة الخارجية، وله رسم مستقل.",1]],"dp":[["emirate","Dubai Police usually serves people who lived in Dubai; MOI serves the other emirates.","تخدم شرطة دبي عادةً من أقاموا في دبي، وتخدم وزارة الداخلية باقي الإمارات."],["status","Fees differ for citizens, residents and applicants abroad.","تختلف الرسوم بين المواطن والمقيم والمتقدم من الخارج."]],"c":["We could not re-check these fees in this review; check with Dubai Police or the MOI before you pay. Validity rules vary, so ask the requesting body.","لم نتمكن من إعادة التحقق من هذه الرسوم في هذه المراجعة، فتحقق منها لدى شرطة دبي أو وزارة الداخلية قبل الدفع. وتختلف شروط الصلاحية، فاسأل الجهة الطالبة."],"au":"moi","so":[[685,686,687],[688,689,690]]},{"id":"everyday-medicines-travel","q":["Can I bring my medicines into the UAE? Do I need a permit?","هل يمكنني إدخال أدويتي إلى الإمارات؟ وهل أحتاج إلى تصريح؟"],"k":["bring medicine to uae","controlled medicine uae permit","can i bring adhd medication to dubai","travel with prescription drugs uae","ادخال ادوية للامارات","تصريح ادوية مراقبة الامارات","ابي اجيب دواي معاي دبي","الادوية الممنوعة في الامارات"],"a":["Ordinary medicines need no prior approval. Travellers may bring narcotic, psychotropic and other controlled medicines for their stay, up to 3 months' supply, with a recent prescription and medical report. A free e-permit from the Emirates Drug Establishment (EDE) is optional for travellers; residents use it to import such medicines by shipping. Some substances are banned, so check EDE's list first.","الأدوية العادية لا تحتاج إلى موافقة مسبقة. ويجوز للمسافر إدخال الأدوية المخدرة والمؤثرة عقلياً وغيرها من الأدوية المراقبة لمدة إقامته وبما لا يتجاوز حاجة 3 أشهر، مع وصفة طبية وتقرير طبي حديثين. والتصريح الإلكتروني المجاني من مؤسسة الإمارات للدواء اختياري للمسافرين، ويستخدمه المقيمون لاستيراد هذه الأدوية عبر الشحن. وبعض المواد محظورة، فراجع قائمة المؤسسة أولاً."],"st":[["Check your medicine on EDE's controlled-medicines list; some items are prohibited.","ابحث عن دوائك في قائمة الأدوية المراقبة لدى المؤسسة، فبعض المواد محظورة.",691],["Get a prescription from the last 3 months and a medical report from the last year, both stamped by your clinic.","احصل على وصفة طبية صادرة خلال آخر 3 أشهر وتقرير طبي صادر خلال آخر سنة، مختومين من جهة العلاج.",692],["Optional for travellers: apply for the free e-permit with UAE PASS (one working day). Carry your prescription and report.","اختياري للمسافرين: قدّم طلب التصريح الإلكتروني المجاني عبر UAE PASS (يوم عمل واحد)، واحمل الوصفة والتقرير معك.",693]],"f":[["Prescription issued within the last 3 months; medical report within the last year; both stamped by the treating facility.","الوصفة الطبية صادرة خلال آخر 3 أشهر، والتقرير الطبي خلال آخر سنة، وكلاهما مختوم من جهة العلاج.",0],["The e-permit is optional for travellers; residents use it to import such medicines by shipping. Free; one working day; call 800 33784.","التصريح اختياري للمسافرين، ويستخدمه المقيمون لاستيراد هذه الأدوية عبر الشحن. مجاني، يوم عمل واحد، الاتصال 800 33784.",0],["Non-narcotic, non-psychotropic medicines need no prior submission; transit passengers who stay in the airport need no approval.","الأدوية غير المخدرة وغير المؤثرة عقلياً لا تحتاج إلى طلب مسبق، ولا يحتاج مسافرو الترانزيت الذين لا يغادرون المطار إلى موافقة.",0],["EDE's list allows travellers the quantity for their stay or up to 3 months' use, whichever is less, and marks some substances as prohibited.","تسمح قائمة المؤسسة للمسافر بكمية تكفي مدة إقامته أو حاجة 3 أشهر كحد أقصى أيهما أقل، وتصنّف بعض المواد محظورة.",1]],"dp":[["status","Travellers may skip the permit. Residents importing controlled medicines by shipping must apply.","يمكن للمسافر الاستغناء عن التصريح، أما المقيم الذي يستورد أدوية مراقبة عبر الشحن فعليه التقدم بطلبه."],["other","The rules depend on the medicine's class: ordinary, controlled or prohibited.","تعتمد القواعد على تصنيف الدواء: عادي أو مراقب أو محظور."]],"c":["EDE's page does not say whether residents carrying controlled medicines in luggage need the permit; if unsure, apply or ask EDE. Not medical or legal advice.","لا توضح صفحة المؤسسة إن كان المقيم الذي يحمل أدوية مراقبة في أمتعته يحتاج إلى التصريح؛ وعند الشك اطلبه أو اسأل المؤسسة. ليست استشارة طبية أو قانونية."],"au":"ede","so":[[694,695,696],[697,695,698]],"v":1},{"id":"everyday-drone-flying","q":["Can I fly my drone in the UAE right now? What are the rules?","هل يمكنني تطيير طائرتي المسيّرة (الدرون) في الإمارات الآن؟ وما القواعد؟"],"k":["can i fly drone in dubai","drone ban uae 2026","drone registration uae gcaa","تطيير الدرون في الامارات","هل الدرون ممنوع في دبي","تسجيل طائرة بدون طيار","حظر الطائرات المسيرة الامارات 2026"],"a":["Not without written GCAA permission, as far as we can confirm. GCAA Safety Decision 2026-03 (Issue 03, 27 April 2026) suspends drone approvals, except approved specialised (Part SPO) work, and we found no notice lifting it. Once hobby flying resumes, you must be 18 or older, a UAE resident, trained, registered on UAE Drones and approved for each flight.","لا يجوز ذلك دون إذن مكتوب من الهيئة العامة للطيران المدني بحسب ما تأكدنا منه. فقرار السلامة 2026-03 (الإصدار 03، 27 أبريل 2026) يعلّق موافقات الطائرات المسيّرة، عدا العمليات المتخصصة المعتمدة (Part SPO)، ولم نجد إعلاناً برفعه. وعند استئناف الطيران الترفيهي، يجب أن تكون بعمر 18 سنة فأكثر، ومقيماً، ومدرَّباً، ومسجلاً في منصة UAE Drones، وحاصلاً على موافقة لكل رحلة."],"st":[["Check the GCAA's latest safety decisions before any flight.","راجع أحدث قرارات السلامة الصادرة عن الهيئة قبل أي طيران.",699],["When flying resumes, sign up on UAE Drones with UAE PASS, train at an approved school, register the drone and get approval for each flight.","عند استئناف الطيران، سجّل في UAE Drones عبر UAE PASS، وتدرّب لدى جهة معتمدة، وسجّل الطائرة، واحصل على موافقة لكل رحلة.",700]],"f":[["Safety Decision 2026-03, Issue 03 (27 April 2026): approvals suspended, no flying without a written GCAA exemption; Part SPO (specialised) operations excluded.","قرار السلامة 2026-03، الإصدار 03 (27 أبريل 2026): تعليق الموافقات ومنع الطيران دون استثناء مكتوب من الهيئة، مع استثناء عمليات Part SPO المتخصصة.",0],["CAR-UAR Issue 04 (3 September 2025): hobby pilots must be 18 or older, UAE residents, registered on UAE Drones and trained at a GCAA-approved school.","لائحة الطيران الترفيهي CAR-UAR، الإصدار 04 (3 سبتمبر 2025): يجب أن يكون الطيار الهاوي بعمر 18 سنة فأكثر، ومقيماً، ومسجلاً في UAE Drones، ومدرَّباً لدى جهة معتمدة من الهيئة.",1],["Hobby drones: up to 5 kg, max 400 feet (120 m), daylight, in sight, remote ID, approval first, away from airports, and no cameras or recording devices.","الطائرات الترفيهية: حتى 5 كغ، وارتفاع أقصاه 400 قدم (120 م)، نهاراً وضمن مدى البصر، مع تعريف عن بُعد وموافقة مسبقة، بعيداً عن المطارات، ودون كاميرات أو أجهزة تسجيل.",1]],"dp":[["status","Hobby flying is only for UAE residents aged 18 or older, so visitors cannot get approval.","الطيران الترفيهي متاح فقط للمقيمين في الدولة بعمر 18 سنة فأكثر، فلا يحصل الزوار على موافقة."],["emirate","Dubai and Sharjah have their own civil aviation bodies, which may add their own approvals.","لدبي والشارقة جهات طيران مدني خاصة بهما، وقد تشترط موافقات إضافية."]],"c":["We could not confirm whether the suspension was lifted after April 2026; check with the GCAA before flying. Breaking it can bring legal action.","لم نتمكن من التأكد من رفع التعليق بعد أبريل 2026، فتحقق لدى الهيئة قبل الطيران. ومخالفته قد تعرّضك للإجراءات القانونية."],"au":"gcaa","so":[[701,702,703],[704,702,705]],"ch":["2026-04","Issue 03 (27 April 2026) keeps drone approvals suspended but frees Part SPO operations.","يُبقي الإصدار 03 (27 أبريل 2026) تعليق موافقات الطائرات المسيّرة، لكنه يستثني عمليات Part SPO.",0]},{"id":"everyday-traffic-law-2025","q":["What changed in the UAE traffic law in 2025? Can I get a driving licence at 17?","ما الذي تغيّر في قانون السير الإماراتي عام 2025؟ وهل يمكنني الحصول على رخصة قيادة في سن 17؟"],"k":["new uae traffic law 2025","driving licence age 17 uae","can 17 year old get license dubai","jaywalking fine uae new law","قانون السير الجديد الامارات 2025","رخصة القيادة من عمر 17","عقوبة القيادة تحت تاثير الكحول الامارات"],"a":["A new federal traffic law took effect on 29 March 2025. You can now apply for a driving licence at 17. Pedestrians may not cross roads with speed limits over 80 km/h, and city horns are for emergencies only. Drink or drug driving, fleeing an accident and driving on a suspended licence are serious offences.","دخل قانون السير الاتحادي الجديد حيز التنفيذ في 29 مارس 2025. ويمكنك الآن التقدم لرخصة القيادة في سن 17. ويُمنع المشاة من عبور الطرق التي تزيد السرعة فيها على 80 كم/ساعة، ويقتصر المنبه داخل المدن على الطوارئ. والقيادة تحت تأثير الكحول أو المخدرات، والفرار من موقع الحادث، والقيادة برخصة موقوفة مخالفات جسيمة."],"st":[["At 17, open a traffic file and train with a licensed driving institute.","في سن 17، افتح ملفاً مرورياً وتدرّب لدى معهد قيادة مرخص.",706],["Cross only at marked crossings, bridges or tunnels, especially on fast roads.","اعبر فقط من الممرات المخصصة أو الجسور أو الأنفاق، خاصة على الطرق السريعة.",707],["Check the official list of violations, fines and black points.","راجع القائمة الرسمية للمخالفات والغرامات والنقاط السوداء.",708]],"f":[["Federal Decree-Law No. 14 of 2024 on traffic took effect on 29 March 2025.","دخل المرسوم بقانون اتحادي رقم 14 لسنة 2024 بشأن السير حيز التنفيذ في 29 مارس 2025.",0],["The minimum age for a driving licence is now 17.","أصبح الحد الأدنى لسن الحصول على رخصة القيادة 17 سنة.",0],["Pedestrians may not cross roads with a speed limit over 80 km/h; horns in cities are for emergencies only.","يُمنع المشاة من عبور الطرق التي تزيد السرعة فيها على 80 كم/ساعة، ويقتصر استخدام المنبه داخل المدن على الطوارئ.",0],["u.ae lists as serious: drink or drug driving, fleeing an accident, driving on a suspended licence, and causing an accident by jaywalking.","تعدّ بوابة u.ae من المخالفات الجسيمة: القيادة تحت تأثير الكحول أو المخدرات، والفرار من موقع الحادث، والقيادة برخصة موقوفة، والتسبب في حادث بالعبور من غير الأماكن المخصصة.",0],["Violations list: drink driving means a court-set fine, 23 black points and 60 days' impoundment (light vehicles).","قائمة المخالفات: القيادة تحت تأثير الكحول عقوبتها غرامة تحددها المحكمة و23 نقطة سوداء وحجز المركبة الخفيفة 60 يوماً.",1]],"dp":[["emirate","The law is federal, but licences are issued locally: RTA in Dubai, TAMM in Abu Dhabi and MOI services elsewhere.","القانون اتحادي، لكن الرخص تصدر محلياً: هيئة الطرق في دبي، ومنصة تم في أبوظبي، وخدمات وزارة الداخلية في غيرهما."]],"c":["News reports cite fixed fines under the new law that we could not match to the official text; check with the MOI. Not legal advice.","تذكر تقارير إخبارية غرامات محددة بموجب القانون الجديد لم نتمكن من مطابقتها مع النص الرسمي، فتحقق لدى وزارة الداخلية. ليست استشارة قانونية."],"au":"moi","l":[709,161,710],"so":[[711,245,657],[712,713,714]],"v":1,"ch":["2025-03","Decree-Law No. 14 of 2024 took effect: licences from 17, new pedestrian and horn rules.","دخل المرسوم بقانون رقم 14 لسنة 2024 حيز التنفيذ: الرخصة من سن 17، وقواعد جديدة للمشاة والمنبه.",0]},{"id":"everyday-phone-seatbelt-black-points","q":["What is the fine for using my phone while driving, and how many black points before I lose my licence?","ما غرامة استخدام الهاتف أثناء القيادة؟ وكم نقطة سوداء تؤدي إلى سحب رخصتي؟"],"k":["fine for using phone while driving uae","how many black points before licence suspension","24 black points what happens","seat belt fine back seat passenger uae","مخالفة الهاتف اثناء السواقة كم","كم نقطة سودا وتنسحب الليسن","مخالفة حزام الامان للراكب الخلفي"],"a":["Using a phone, or being distracted by anything, while driving costs AED 800 and 4 black points. If the driver or any passenger has no seat belt on, it is AED 400 and 4 points. At 24 black points your licence is withdrawn for a time: Abu Dhabi Police lists 3 months the first time, and longer if it happens again.","استخدام الهاتف أو الانشغال بأي شيء أثناء القيادة غرامته 800 درهم و4 نقاط سوداء. وإذا لم يربط السائق أو أحد الركاب حزام الأمان فالغرامة 400 درهم و4 نقاط. وعند بلوغ 24 نقطة سوداء تُسحب رخصتك مدةً محددة، وتذكر شرطة أبوظبي أنها 3 أشهر في المرة الأولى، وأطول عند التكرار."],"st":[["Check your fines and black points.","استعلم عن مخالفاتك ونقاطك السوداء.",715],["If you reach the limit, hand in your licence when told. Refusing adds a fine of AED 1,000, rising to 3,000 for repeats.","إذا بلغت الحد الأقصى فسلّم رخصتك عند طلبها، فالامتناع يضيف غرامة 1,000 درهم ترتفع إلى 3,000 عند التكرار.",716]],"f":[["Using a mobile phone, or being distracted by anything, while driving: AED 800 and 4 black points.","استخدام الهاتف المتحرك أو الانشغال بأي شيء أثناء القيادة: 800 درهم و4 نقاط سوداء.",0],["Driver or passengers without seat belts: AED 400 and 4 points. No child seat for a child under 4, or a child under 10 or under 145 cm in front: AED 400.","عدم ربط حزام الأمان للسائق أو الركاب: 400 درهم و4 نقاط. وعدم تثبيت مقعد لطفل دون 4 سنوات، أو جلوس طفل دون 10 سنوات أو أقصر من 145 سم في الأمام: 400 درهم.",0],["Not handing in your licence after reaching the black points limit: AED 1,000 the first time, 2,000 the second and 3,000 the third.","عدم تسليم الرخصة بعد بلوغ الحد الأقصى للنقاط السوداء: 1,000 درهم في المرة الأولى، و2,000 في الثانية، و3,000 في الثالثة.",0],["Abu Dhabi Police: at 24 points the licence is withdrawn for 3 months, then 6 months, then 1 year plus a driving course. Probationary licences: 6 months and a course.","شرطة أبوظبي: عند 24 نقطة تُسحب الرخصة 3 أشهر، ثم 6 أشهر، ثم سنة مع دورة قيادة. وللرخصة تحت الاختبار: 6 أشهر مع دورة تأهيل.",1]],"dp":[["emirate","The fines and points are federal, but each emirate's police issues them and runs its own discounts and impound rules.","الغرامات والنقاط اتحادية، لكن شرطة كل إمارة تحررها ولها خصوماتها وقواعد حجز المركبات الخاصة بها."],["status","New drivers on a probationary licence face a stricter rule when they reach the limit.","يخضع السائقون الجدد بالرخصة تحت الاختبار لقاعدة أشد عند بلوغ الحد."]],"c":["Fines are from the federal list linked on u.ae. Withdrawal periods are from an older Abu Dhabi Police notice and may have changed since; check with your emirate's police.","الغرامات من القائمة الاتحادية المنشورة على u.ae، ومدد سحب الرخصة من إعلان قديم لشرطة أبوظبي وقد تكون تغيرت، فتحقق لدى شرطة إمارتك."],"au":"moi","l":[717,718,714],"so":[[712,713,714],[719,645,720]]}]},{"topic":"health-edu","title":{"en":"Health, schools and support","ar":"الصحة والتعليم والدعم الاجتماعي"},"checked":"2026-11-08","entries":[{"id":"health-edu-insurance-who-pays","q":["Is health insurance mandatory in the UAE, and who has to pay for it?","هل التأمين الصحي إلزامي في الإمارات، ومن يتحمل تكلفته؟"],"k":["is health insurance mandatory in uae","who pays health insurance employer or employee","health insurence compulsory sharjah","company deducting insurance from salary dubai","هل التأمين الصحي إلزامي في الإمارات","مين يدفع التأمين الصحي الشركة ولا الموظف","تأمين صحي اجباري الشارقة عجمان"],"a":["Yes. Employers must insure private-sector staff and domestic workers, and pay for it. Dubai and Abu Dhabi already required this; since 1 January 2025 the other five emirates do too. In Dubai, the cost must never come out of salary. In Abu Dhabi, the employer must also insure one wife and up to three children under 18 on Abu Dhabi visas.","نعم. يجب على صاحب العمل تأمين موظفي القطاع الخاص والعمالة المساعدة ودفع التكلفة. وكان ذلك مطلوباً في دبي وأبوظبي، ومنذ 1 يناير 2025 أصبح مطلوباً في الإمارات الخمس الأخرى أيضاً. وفي دبي لا يجوز خصم التكلفة من الراتب أبداً. وفي أبوظبي يجب على صاحب العمل أيضاً تأمين زوجة واحدة وحتى ثلاثة أبناء دون 18 عاماً يحملون إقامة أبوظبي."],"w":["resident","business"],"s":["private","domestic"],"st":[["Northern emirates: your employer buys at least the basic plan when issuing or renewing your visa.","الإمارات الشمالية: يشتري صاحب العمل الخطة الأساسية على الأقل عند إصدار إقامتك أو تجديدها.",721],["Dubai: if your employer does not insure your family, you must, as their sponsor.","دبي: إن لم يؤمّن صاحب العمل على أسرتك، فعليك تأمينهم بصفتك كفيلهم.",722],["If your employer will not insure you or takes the cost from your pay, complain.","إذا رفض صاحب العمل تأمينك أو خصم التكلفة من راتبك، فاشتكِ.",723]],"f":[["From 1 January 2025, employers in the five northern emirates must insure private staff and domestic workers to issue or renew permits.","منذ 1 يناير 2025 يجب على أصحاب العمل في الإمارات الشمالية الخمس تأمين موظفي القطاع الخاص والعمالة المساعدة لإصدار الإقامات أو تجديدها.",0],["The federal basic plan costs AED 320 a year and is valid for two years; permits from before 2025 need it at the next renewal.","تكلفة الخطة الاتحادية الأساسية 320 درهماً سنوياً وصلاحيتها سنتان، وتحتاجها التصاريح الصادرة قبل 2025 عند التجديد التالي.",0],["Dubai: the employer pays the full premium, never from salary; if it does not insure spouses and dependants, the sponsor must.","دبي: يدفع صاحب العمل القسط كاملاً دون خصمه من الراتب، وإن لم يؤمّن على الزوجة والمُعالين فعلى الكفيل تأمينهم.",1],["Abu Dhabi: the employer must insure one wife and up to three children under 18 who hold Abu Dhabi visas.","أبوظبي: يلتزم صاحب العمل بتأمين زوجة واحدة وحتى ثلاثة أبناء دون 18 عاماً يحملون إقامة أبوظبي.",2]],"dp":[["emirate","Dubai (DHA) and Abu Dhabi (DoH) have their own laws; the 2025 rule covers the other five emirates.","لدبي (هيئة الصحة) وأبوظبي (دائرة الصحة) قانونان خاصان، وتشمل قاعدة 2025 الإمارات الخمس الأخرى."],["sector","For domestic workers, the household that employs them must pay.","في حالة العمالة المساعدة، تدفع الأسرة التي تشغّلهم."]],"c":["This is the legal minimum. In Abu Dhabi, ask DoH if any family-cover cost may be shared with you.","هذا هو الحد الأدنى القانوني. وفي أبوظبي اسأل دائرة الصحة هل يجوز تحميلك جزءاً من تكلفة تأمين الأسرة."],"au":"mohre","so":[[724,0,725],[726,727,728],[729,730,731]],"v":1,"ch":["2025-01","Employer-paid insurance became mandatory in the northern emirates.","أصبح التأمين على نفقة صاحب العمل إلزامياً في الإمارات الشمالية.",0],"h":"wage-guard"},{"id":"health-edu-basic-plan-cover","q":["What does the basic health insurance plan actually cover?","ماذا تغطي خطة التأمين الصحي الأساسية فعلياً؟"],"k":["what does basic health insurance cover","essential benefits plan dubai","EBP copay 20 percent","basic insurence cover dental","ماذا يغطي التأمين الصحي الأساسي","نسبة التحمل التأمين الاساسي دبي","التأمين الاساسي يغطي الاسنان"],"a":["In Dubai, the minimum plan (Essential Benefits Plan) pays up to AED 150,000 a year. You usually pay 20% of each clinic visit, and medicines are covered up to AED 2,500 a year. The federal basic plan in the northern emirates has its own co-pays and does not cover pregnancy, childbirth or dental care.","في دبي تدفع الخطة الدنيا (خطة المنافع الأساسية) حتى 150,000 درهم سنوياً. وتدفع أنت عادة 20% من كل زيارة للعيادة، وتُغطى الأدوية حتى 2,500 درهم سنوياً. أما الخطة الاتحادية الأساسية في الإمارات الشمالية فلها نسب تحمل خاصة بها، ولا تغطي الحمل والولادة وعلاج الأسنان."],"w":["resident"],"m":["dubai","sharjah","ajman","umm-al-quwain","ras-al-khaimah","fujairah"],"st":[["See a general doctor (GP) first; on the Dubai plan, specialists need a GP referral.","راجع طبيباً عاماً أولاً، فالأخصائي في خطة دبي يحتاج إلى تحويل منه.",732],["Get the insurer's approval before a planned hospital stay, an MRI or CT scan, or physiotherapy.","احصل على موافقة شركة التأمين قبل التنويم المخطط له، أو أشعة الرنين أو المقطعية، أو العلاج الطبيعي.",733],["If a valid claim is refused, complain to the insurer first, then escalate.","إذا رُفضت مطالبة صحيحة، فاشتكِ لشركة التأمين أولاً ثم صعّد الشكوى.",734]],"f":[["Dubai plan from 1 January 2025: annual limit AED 150,000; price band AED 550-750 a person a year plus VAT.","خطة دبي منذ 1 يناير 2025: حد سنوي 150,000 درهم، ونطاق سعر 550-750 درهماً للفرد سنوياً إضافة إلى ضريبة القيمة المضافة.",0],["Dubai: 20% co-pay per clinic visit, none for a follow-up within 7 days; hospital stays 20%, capped at AED 500 a stay and AED 1,000 a year.","دبي: تحمل 20% لكل زيارة عيادة، ولا شيء للمراجعة خلال 7 أيام؛ والتنويم 20% بحد أقصى 500 درهم للمرة و1,000 درهم سنوياً.",0],["Dubai: medicines up to AED 2,500 a year (30% co-pay), dental up to AED 500, counselling up to AED 800, physiotherapy 6 sessions a year.","دبي: الأدوية حتى 2,500 درهم سنوياً (تحمل 30%)، والأسنان حتى 500 درهم، والإرشاد النفسي حتى 800 درهم، والعلاج الطبيعي 6 جلسات سنوياً.",0],["Dubai: chronic and pre-existing conditions may be excluded for 6 months on your first UAE plan, except emergencies.","دبي: يجوز استثناء الأمراض المزمنة والسابقة 6 أشهر في أول خطة لك بالدولة، عدا الطوارئ.",0],["Federal plan: clinic visits 25% co-pay up to AED 100; medicines 30% capped at AED 1,500 a year; no pregnancy, childbirth or dental cover.","الخطة الاتحادية: تحمل 25% لزيارة العيادة بحد 100 درهم، والأدوية 30% بسقف 1,500 درهم سنوياً، ولا تغطي الحمل والولادة والأسنان.",1]],"dp":[["emirate","Dubai has its own minimum plan; the northern emirates use the federal plan; Abu Dhabi follows DoH rules.","لدبي خطتها الدنيا الخاصة، وتعتمد الإمارات الشمالية الخطة الاتحادية، وتتبع أبوظبي قواعد دائرة الصحة."]],"c":["These are minimums; your own table of benefits decides. Abu Dhabi plans are not covered here.","هذه منافع الحد الأدنى، وجدول المنافع في وثيقتك هو الحَكَم. ولا تشمل هذه الإجابة خطط أبوظبي."],"au":"dha","l":[735,736,737],"so":[[738,739,737],[724,0,725]],"v":1,"ch":["2025-01","Dubai's updated basic-plan table of benefits took effect.","بدأ العمل بجدول المنافع المحدّث لخطة دبي الأساسية.",0]},{"id":"health-edu-maternity-newborn","q":["Will my health insurance pay for pregnancy and delivery, and how do I insure my newborn?","هل يغطي تأميني الصحي الحمل والولادة، وكيف أؤمّن على مولودي الجديد؟"],"k":["does insurance cover pregnancy","maternity waiting period uae","newborn insurance 30 days","التأمين يغطي الولادة دبي","تغطية الحمل التأمين الأساسي","تأمين المولود كم يوم"],"a":["In Dubai, every policy must cover maternity for married women of childbearing age. The basic plan pays for 8 antenatal visits and up to AED 10,000 per delivery, with a 10% co-pay. A newborn is covered on the mother's policy for 30 days, then needs its own plan. The federal basic plan does not cover pregnancy or childbirth.","في دبي يجب أن تغطي كل وثيقة تأمين الأمومةَ للمتزوجات في سن الإنجاب. وتغطي الخطة الأساسية 8 زيارات لمتابعة الحمل وحتى 10,000 درهم للولادة، مع تحمل 10%. ويُغطى المولود على وثيقة أمه 30 يوماً، ثم يحتاج إلى خطة خاصة به. أما الخطة الاتحادية الأساسية فلا تغطي الحمل والولادة."],"w":["resident"],"m":["dubai","sharjah","ajman","umm-al-quwain","ras-al-khaimah","fujairah"],"st":[["Declare a known pregnancy when you enrol. If you did not, you later choose a higher premium or no cover for it.","أفصحي عن الحمل المعروف عند التسجيل، وإلا فستختارين لاحقاً بين قسط أعلى أو استثناء هذا الحمل.",733],["Get the insurer's approval before antenatal care and the delivery.","احصلي على موافقة شركة التأمين قبل متابعة الحمل والولادة.",733],["Enrol your baby in its own plan by day 30 after birth.","سجّلي المولود في خطة خاصة به بحلول اليوم 30 من ولادته.",740]],"f":[["Dubai: married women of childbearing age must have maternity cover at least up to basic-plan limits.","دبي: يجب أن تحصل المتزوجات في سن الإنجاب على تغطية أمومة لا تقل عن حدود الخطة الأساسية.",1],["Dubai basic plan: 8 antenatal visits, 3 scans, and up to AED 10,000 per delivery or needed C-section, with a 10% co-pay.","خطة دبي الأساسية: 8 زيارات متابعة و3 فحوص بالموجات الصوتية، وحتى 10,000 درهم للولادة أو القيصرية اللازمة، مع تحمل 10%.",0],["A newborn is covered on the mother's policy for 30 days and must have its own plan from day 30.","يُغطى المولود على وثيقة أمه 30 يوماً، ويجب أن تكون له خطة مستقلة من اليوم الثلاثين.",0],["Insurers may set a 9-month maternity wait for non-working wives, but no wait for newborns; newborn cover may be backdated up to 7 days.","يجوز لشركات التأمين فرض انتظار 9 أشهر للأمومة على الزوجات غير العاملات، ولا انتظار للمولود، ويجوز تغطيته بأثر رجعي حتى 7 أيام.",1],["The federal basic plan does not cover pregnancy or childbirth.","الخطة الاتحادية الأساسية لا تغطي الحمل والولادة.",2]],"dp":[["emirate","Dubai rules apply to Dubai visas. For Abu Dhabi, ask DoH.","تنطبق قواعد دبي على إقامات دبي، وفي أبوظبي اسألي دائرة الصحة."],["status","A wife who does not work may have to wait 9 months for maternity cover.","قد تنتظر الزوجة غير العاملة 9 أشهر لتغطية الأمومة."]],"c":["Above the delivery limit you pay, unless the mother's or baby's life is at risk; then cover runs to the annual limit.","ما زاد على حد الولادة تتحملينه، إلا إذا تعرضت حياة الأم أو المولود للخطر، فتمتد التغطية حتى الحد السنوي."],"au":"dha","l":[741,742,743],"so":[[738,739,737],[744,739,743],[724,0,725]],"v":1,"ch":["2025-01","Dubai's new basic-plan table took effect.","بدأ العمل بجدول دبي الجديد للخطة الأساسية.",0]},{"id":"health-edu-school-fee-increase","q":["Can my child's private school raise its fees this year?","هل يحق لمدرسة ابني الخاصة رفع الرسوم هذا العام؟"],"k":["school fee increase dubai 2026","khda fee freeze 2026-27","can school increase fees abu dhabi adek","school fees hike this year uae","زيادة الرسوم المدرسية دبي 2026","تجميد رسوم المدارس الخاصة دبي","هل يحق للمدرسة زيادة الرسوم"],"a":["In Dubai, no. KHDA confirmed on 22 May 2026 that private school fees will not rise in the 2026-27 school year. In Abu Dhabi, ADEK's Fees Policy sets the rules, so ask the school for its 2026-27 fees and check any rise with ADEK. Other emirates have their own regulators.","في دبي لا. فقد أكدت هيئة المعرفة والتنمية البشرية في 22 مايو 2026 عدم زيادة رسوم المدارس الخاصة في العام الدراسي 2026-27. وفي أبوظبي تحدد سياسة الرسوم لدى دائرة التعليم والمعرفة القواعد، فاطلب من المدرسة رسومها لعام 2026-27 وتحقق من أي زيادة لدى الدائرة. ولبقية الإمارات جهات تنظيمية خاصة بها."],"w":["resident","emirati"],"m":["dubai","abu-dhabi"],"s":["private"],"st":[["Compare what you are asked to pay with the school's approved fees for 2026-27.","قارن ما يُطلب منك دفعه بالرسوم المعتمدة للمدرسة لعام 2026-27.",745],["Raise any difference with the school in writing first.","اعترض على أي فرق لدى المدرسة كتابياً أولاً.",746],["If it is not solved, complain to the regulator.","إن لم تُحل المشكلة، فاشتكِ إلى الجهة المنظِّمة.",747]],"d":[["Fee invoice, receipts and the signed school contract","فاتورة الرسوم والإيصالات وعقد المدرسة الموقّع"]],"f":[["KHDA confirmed on 22 May 2026: no fee increase for Dubai private schools in the 2026-27 academic year.","أكدت هيئة المعرفة في 22 مايو 2026 عدم زيادة رسوم المدارس الخاصة في دبي للعام الدراسي 2026-27.",0],["For 2025-26, KHDA set the Education Cost Index at 2.35%; eligible for-profit schools could raise fees by up to that, but not schools open under 3 years.","في 2025-26 حددت هيئة المعرفة مؤشر تكلفة التعليم عند 2.35%، ويحق للمدارس الربحية المؤهلة زيادة لا تتجاوزه، دون المدارس العاملة منذ أقل من 3 سنوات.",1],["Abu Dhabi: ADEK's Fees Policy sets how schools fix fees and payment schedules; schools must comply from 2025-26.","أبوظبي: تحدد سياسة الرسوم لدى دائرة التعليم والمعرفة كيفية وضع الرسوم وجداول دفعها، والالتزام بها مطلوب منذ 2025-26.",2]],"dp":[["emirate","Dubai: KHDA. Abu Dhabi: ADEK. Sharjah: SPEA. Elsewhere, ask the Ministry of Education.","دبي: هيئة المعرفة. أبوظبي: دائرة التعليم والمعرفة. الشارقة: هيئة الشارقة للتعليم الخاص. غيرها: وزارة التربية والتعليم."],["other","A Dubai school may not change its fees without KHDA approval, in any year.","لا يجوز لمدرسة في دبي تغيير رسومها دون موافقة هيئة المعرفة، في أي عام."]],"c":["A freeze is not a refund: fees already due stay payable. Each year's decision is separate, so check again before re-enrolling.","التجميد لا يعني استرداد الرسوم، فالمستحق منها يبقى واجب الدفع. ويصدر قرار مستقل كل عام، فتحقق مجدداً قبل إعادة التسجيل."],"au":"khda","l":[748,749,750],"so":[[751,219,752],[753,754,755],[756,757,758]],"v":1,"ch":["2026-05","Dubai froze private school fees for the 2026-27 school year.","جمّدت دبي رسوم المدارس الخاصة للعام الدراسي 2026-27.",0]},{"id":"health-edu-school-age-cutoff","q":["How old must my child be to start KG1 or Grade 1?","كم يجب أن يكون عمر طفلي ليلتحق بالروضة الأولى (KG1) أو الصف الأول؟"],"k":["age cut off kg1 uae 2026","school admission age dubai","child born in november kg1 or kg2","grade 1 age requirment uae","العمر المطلوب للتسجيل في الروضة","سن القبول في الصف الأول الإمارات","احتساب العمر 31 ديسمبر المدارس","ولدي مواليد اكتوبر يدخل كي جي ون"],"a":["For new admissions from the 2026-27 school year, age is counted on 31 December of the admission year, not 31 August. Your child must be 4 by then for KG1, 5 for KG2 and 6 for Grade 1. This covers schools and kindergartens whose year starts in August or September.","للقبول الجديد بدءاً من العام الدراسي 2026-27 يُحسب العمر في 31 ديسمبر من سنة القبول بدلاً من 31 أغسطس. ويجب أن يبلغ الطفل بحلول ذلك التاريخ 4 سنوات للروضة الأولى (KG1)، و5 سنوات للروضة الثانية (KG2)، و6 سنوات للصف الأول. ويشمل ذلك المدارس ورياض الأطفال التي يبدأ عامها الدراسي في أغسطس أو سبتمبر."],"st":[["Work out your child's age on 31 December of the year you apply.","احسب عمر طفلك في 31 ديسمبر من سنة التقديم.",759],["Pick the grade: Pre-KG (FS1) at 3, KG1 at 4, KG2 at 5, Grade 1 at 6.","اختر المرحلة: ما قبل الروضة (FS1) عند 3 سنوات، وKG1 عند 4، وKG2 عند 5، والصف الأول عند 6.",760],["If the school year starts in April, use 31 March instead.","إن كان العام الدراسي في المدرسة يبدأ في أبريل، فاعتمد 31 مارس بدلاً من ذلك.",761],["Moving from another school or country? Placement follows the last grade your child completed.","عند الانتقال من مدرسة أو دولة أخرى، يُحدد الصف بحسب آخر صف أنهاه الطالب.",762]],"d":[["Child's birth certificate and passport; last school report for transfers","شهادة ميلاد الطفل وجواز سفره، وآخر شهادة مدرسية عند الانتقال"]],"f":[["From the 2026-27 year, the age cut-off moved from 31 August to 31 December of the admission year.","منذ العام الدراسي 2026-27 انتقل موعد احتساب العمر من 31 أغسطس إلى 31 ديسمبر من سنة القبول.",0],["Ages needed by 31 December: Pre-KG/FS1 3, KG1 4, KG2 5, Grade 1 6.","الأعمار المطلوبة في 31 ديسمبر: ما قبل الروضة/FS1: 3، KG1: 4، KG2: 5، الصف الأول: 6.",0],["It applies to schools and kindergartens whose year starts in August or September; April-start schools keep 31 March.","يشمل القرار المدارس ورياض الأطفال التي يبدأ عامها في أغسطس أو سبتمبر، وتبقى المدارس التي تبدأ في أبريل على 31 مارس.",0],["Students already enrolled keep their original rules; transfers are placed by the last grade completed.","يبقى الطلاب المسجلون على قواعد تسجيلهم الأصلية، ويُحدد صف المنتقلين بحسب آخر صف أنهوه.",0]],"dp":[["other","Other curricula use matching grades: KG1 is FS2, KG2 is Year 1, and Grade 1 is Year 2 in British schools.","تعتمد المناهج الأخرى صفوفاً مقابلة: KG1 يقابل FS2، وKG2 يقابل Year 1، والصف الأول يقابل Year 2 في المدارس البريطانية."],["status","Children already in school are not moved by this change.","لا يتأثر الأطفال المسجلون حالياً بهذا التغيير."]],"c":["No exception is listed for a child who misses the date by a few days. Meeting the age does not by itself guarantee a school place.","لا يوجد استثناء معلن للطفل الذي يفوته الموعد ولو بأيام. وبلوغ العمر المطلوب لا يضمن وحده الحصول على مقعد."],"au":"moe-edu","so":[[763,584,764]],"v":1,"ch":["2025-12","The cut-off moved from 31 August to 31 December, for new admissions from 2026-27.","انتقل موعد احتساب العمر من 31 أغسطس إلى 31 ديسمبر للقبول الجديد بدءاً من 2026-27.",0]},{"id":"health-edu-school-complaint","q":["How do I complain about my child's private school?","كيف أقدم شكوى على مدرسة ابني الخاصة؟"],"k":["complaint against school khda","how to complain about private school dubai","adek complaint school abu dhabi","spea complaint sharjah school","شكوى على مدرسة خاصة دبي","كيف اشتكي على المدرسة هيئة المعرفة","شكوى مدرسة خاصة الشارقة"],"a":["First use the school's own complaint process, in writing, and keep copies. If that fails, complain to your emirate's regulator: KHDA in Dubai, ADEK in Abu Dhabi, or SPEA in Sharjah. KHDA aims to resolve regular complaints within 10 working days.","ابدأ بإجراءات الشكاوى في المدرسة نفسها كتابياً، واحتفظ بنسخ من كل شيء. فإن لم تُحل المشكلة، فاشتكِ إلى الجهة المنظِّمة في إمارتك: هيئة المعرفة والتنمية البشرية في دبي، أو دائرة التعليم والمعرفة في أبوظبي، أو هيئة الشارقة للتعليم الخاص. وتسعى هيئة المعرفة لحل الشكاوى العادية خلال 10 أيام عمل."],"w":["resident","emirati"],"m":["dubai","abu-dhabi","sharjah"],"s":["private"],"st":[["Write to the school, follow its complaint policy, and keep every reply.","راسل المدرسة واتبع سياسة الشكاوى لديها، واحتفظ بكل رد.",746],["Dubai: use KHDA's online complaint form, and attach your contract and emails.","دبي: استخدم نموذج الشكوى الإلكتروني لدى هيئة المعرفة، وأرفق العقد والمراسلات.",765],["Abu Dhabi: use 'Talk To Us' on ADEK's website (it asks you to sign in to TAMM), or call 800 555.","أبوظبي: استخدم خدمة «تحدث إلينا» في موقع دائرة التعليم والمعرفة (تطلب تسجيل الدخول إلى «تم»)، أو اتصل على 800 555.",766],["Sharjah: use SPEA's online complaint form, or call +971 6 804 1444.","الشارقة: استخدم نموذج الشكاوى الإلكتروني لدى هيئة الشارقة للتعليم الخاص، أو اتصل على +971 6 804 1444.",767]],"d":[["Letters and emails with the school, the signed contract and fee receipts","المراسلات مع المدرسة، والعقد الموقّع، وإيصالات الرسوم"]],"f":[["KHDA's online form takes complaints about Dubai schools, early childhood centres and universities; regular cases take up to 10 working days.","يستقبل نموذج هيئة المعرفة الإلكتروني الشكاوى على المدارس ومراكز الطفولة المبكرة والجامعات في دبي، وتستغرق الحالات العادية حتى 10 أيام عمل.",0],["ADEK's Contact Us page offers 'Talk To Us' for questions, feedback or incidents, and lists 800 555 and contact@tamm.abudhabi.","تتيح صفحة «اتصل بنا» لدى دائرة التعليم والمعرفة خدمة «تحدث إلينا» للأسئلة والملاحظات والبلاغات، وتذكر الرقم 800 555 والبريد contact@tamm.abudhabi.",1],["SPEA takes complaints through an online form, on +971 6 804 1444, or at info@spea.shj.ae.","تستقبل هيئة الشارقة للتعليم الخاص الشكاوى عبر نموذج إلكتروني، أو على الهاتف +971 6 804 1444، أو البريد info@spea.shj.ae.",2]],"dp":[["emirate","Each emirate has its own regulator. Elsewhere, ask the Ministry of Education where to complain.","لكل إمارة جهتها المنظِّمة. وفي غير ذلك، اسأل وزارة التربية والتعليم عن جهة تقديم الشكوى."],["other","For fee or refund disputes in Dubai, KHDA expects the school's internal complaint steps to be finished and documented first.","في نزاعات الرسوم والاسترداد في دبي، تشترط هيئة المعرفة استكمال خطوات الشكوى الداخلية في المدرسة وتوثيقها أولاً."]],"c":["Keep everything in writing. The regulator checks the school against the rules and your contract; it cannot always order what you ask for.","احتفظ بكل شيء مكتوباً. تتحقق الجهة المنظِّمة من التزام المدرسة بالقواعد وبعقدك، ولا يمكنها دائماً إلزامها بكل ما تطلبه."],"au":"khda","so":[[768,754,769],[770,757,771],[772,773,774]],"v":1},{"id":"health-edu-pod-card","q":["How do I get a People of Determination card, and what does it give me?","كيف أحصل على بطاقة أصحاب الهمم، وما الذي تمنحني إياه؟"],"k":["people of determination card apply","disability card uae","sanad card dubai apply","بطاقة أصحاب الهمم كيف اطلعها","استخراج بطاقة اصحاب الهمم","بطاقة سند دبي"],"a":["Apply online to the Ministry of Family for the People of Determination Card. It is free, for Emiratis and UAE residents, and delivered in 7 working days. You need an accredited medical or psychological report and a photo. In Abu Dhabi, apply through the Zayed Authority for People of Determination; in Dubai, CDA's Sanad card adds local benefits.","قدّم إلكترونياً إلى وزارة الأسرة للحصول على بطاقة أصحاب الهمم، وهي مجانية للمواطنين والمقيمين في الدولة، وتُسلَّم خلال 7 أيام عمل. وتحتاج إلى تقرير طبي أو نفسي من جهة معتمدة وصورة شخصية. وفي أبوظبي قدّم عبر هيئة زايد لأصحاب الهمم، وفي دبي تضيف بطاقة سند من هيئة تنمية المجتمع مزايا محلية."],"w":["emirati","resident","visitor"],"st":[["Get a medical or psychological report from an accredited body, then apply online with it and a photo.","احصل على تقرير طبي أو نفسي من جهة معتمدة، ثم قدّم إلكترونياً مع التقرير والصورة.",433],["Abu Dhabi residents: apply through the Zayed Authority (formerly ZHO).","المقيمون في أبوظبي: قدّموا عبر هيئة زايد لأصحاب الهمم (مؤسسة زايد العليا سابقاً).",775],["In Dubai, also apply to CDA for the Sanad card; tourists can apply too.","في دبي قدّم أيضاً إلى هيئة تنمية المجتمع على بطاقة سند، ويحق للسياح التقديم كذلك.",776]],"d":[["Accredited medical or psychological report (e.g. for autism or ADHD)","تقرير طبي أو نفسي معتمد (مثلاً للتوحد أو فرط الحركة)"],["Passport-size photo with a white background","صورة شخصية بحجم صورة الجواز بخلفية بيضاء"]],"f":[["Ministry of Family card: free, delivered in 7 working days, for Emiratis and legal UAE residents. Phone 800 114.","بطاقة وزارة الأسرة: مجانية، وتُسلَّم خلال 7 أيام عمل، للمواطنين والمقيمين إقامة نظامية. الهاتف 800 114.",0],["The card confirms disability status, to help secure rights under Federal Law No. 29 of 2006.","تثبت البطاقة صفة الإعاقة، بما يساعد على ضمان الحقوق المقررة في القانون الاتحادي رقم 29 لسنة 2006.",0],["Dubai: CDA's Sanad card, for citizens, residents and tourists, opens public and private services and benefits. CDA: 800 2121.","دبي: بطاقة سند من هيئة تنمية المجتمع للمواطنين والمقيمين والسياح، وتتيح خدمات ومزايا حكومية وخاصة. هاتف الهيئة: 800 2121.",1],["Abu Dhabi residents apply through ZHO; a single card recognised federally and locally was planned for January 2026.","يقدّم المقيمون في أبوظبي عبر مؤسسة زايد العليا، وكان مخططاً إصدار بطاقة موحدة معتمدة اتحادياً ومحلياً بحلول يناير 2026.",2]],"dp":[["emirate","Abu Dhabi: the Zayed Authority. Dubai: the Sanad card too. Elsewhere: the Ministry of Family.","أبوظبي: هيئة زايد لأصحاب الهمم. دبي: بطاقة سند أيضاً. غيرهما: وزارة الأسرة."]],"c":["Benefits differ by emirate and provider. A single card was due by January 2026; ask the Ministry of Family which card you need now.","تختلف المزايا حسب الإمارة والجهة. وكان مقرراً إصدار بطاقة موحدة بحلول يناير 2026، فاسأل وزارة الأسرة عن البطاقة المطلوبة حالياً."],"au":"ministry-of-family","so":[[777,432,778],[779,780,781],[782,269,783]],"v":1,"ch":["2025-06","The Ministry of Family and ZHO announced a single federal-local card, due by January 2026.","أعلنت وزارة الأسرة ومؤسسة زايد العليا بطاقة موحدة اتحادية ومحلية بحلول يناير 2026.",2]},{"id":"health-edu-social-support","q":["I am an Emirati on a low income. What support can my family get, and where do I apply?","أنا مواطن دخلي محدود. ما الدعم الذي يمكن أن تحصل عليه أسرتي، وأين أقدّم؟"],"k":["social welfare uae emirati low income","social support programme apply","ssa abu dhabi social calculator","مساعدات اجتماعية للمواطنين","طلب مساعدة اجتماعية وزارة تمكين المجتمع","علاوة الغلاء للمواطنين"],"a":["Apply to the federal Social Welfare Programme of the Ministry of Community Empowerment, to your emirate's programme, or to both. If you qualify for both, federal support is paid first and the local body may top it up. Family income and assets must be below limits set by federal law.","قدّم إلى برنامج الرعاية الاجتماعية الاتحادي لدى وزارة تمكين المجتمع، أو إلى برنامج إمارتك، أو إليهما معاً. وإذا استحققت الاثنين يُصرف الدعم الاتحادي أولاً، وقد تكمّله الجهة المحلية. ويجب أن يقل دخل الأسرة وأصولها عن حدود يحددها القانون الاتحادي."],"w":["emirati"],"st":[["Federal: apply online with UAE PASS.","الاتحادي: قدّم إلكترونياً بالهوية الرقمية.",784],["Abu Dhabi: try the Social Calculator, then apply.","أبوظبي: جرّب الحاسبة الاجتماعية، ثم قدّم.",785],["Dubai: apply for periodic social assistance.","دبي: قدّم على المساعدة الاجتماعية الدورية.",786],["Sharjah: apply to the Social Services Department.","الشارقة: قدّم إلى دائرة الخدمات الاجتماعية.",7
