87]],"d":[["Emirates ID, detailed salary certificates, lease or property papers, and proof of any trade-licence income","الهوية الإماراتية، وشهادات راتب مفصلة، وعقود الإيجار أو مستندات العقارات، وإثبات أي دخل من رخص تجارية"]],"f":[["Federal support: basic allowances for the main beneficiary, spouse and children, plus housing, seasonal and inflation allowances.","الدعم الاتحادي: علاوات أساسية للمستفيد الرئيسي والزوج أو الزوجة والأبناء، إضافة إلى علاوات السكن والمواسم والتضخم.",0],["Federal: free, decided within 21 working days; the applicant must be a citizen living in the UAE, aged 21 or over.","الاتحادي: مجاني ويُبت فيه خلال 21 يوم عمل، ويجب أن يكون المتقدم مواطناً مقيماً في الدولة عمره 21 عاماً فأكثر.",1],["Federal: if able to work and under 55, the main beneficiary must be employed and registered with a pension fund, or retired.","الاتحادي: إذا كان المستفيد الرئيسي قادراً على العمل ودون 55 عاماً، فيجب أن يكون موظفاً مسجلاً في صندوق للمعاشات أو متقاعداً.",1],["Abu Dhabi: citizens with an Abu Dhabi family book living there; income below the support line; wealth up to 6 times the entitlement line.","أبوظبي: المواطنون المقيمون فيها وخلاصة قيدهم منها، بدخل أقل من خط الدعم، وثروة لا تتجاوز 6 أضعاف خط الاستحقاق.",2]],"dp":[["emirate","Abu Dhabi, Dubai and Sharjah run their own programmes, with their own rules.","لأبوظبي ودبي والشارقة برامج خاصة بقواعدها."],["status","Orphans, some widows and divorcees, and people with a certified illness or disability are exempt from the federal age and work rules.","يُستثنى الأيتام وبعض الأرامل والمطلقات وأصحاب الحالات المرضية أو الإعاقات المثبتة من شرطي العمر والعمل في البرنامج الاتحادي."]],"c":["Amounts depend on family size, income and assets. Confirm the document list for your case when you apply.","تعتمد المبالغ على حجم الأسرة ودخلها وأصولها. وتأكد من قائمة المستندات الخاصة بحالتك عند التقديم."],"au":"community","l":[788,789,474],"so":[[790,10,474],[791,477,478],[792,108,793]],"v":1,"h":"career-compass"},{"id":"health-edu-mental-health-line","q":["Where can I talk to someone about stress, anxiety or depression for free?","أين يمكنني التحدث مع مختص عن التوتر أو القلق أو الاكتئاب مجاناً؟"],"k":["free mental health helpline uae","talk to counsellor free dubai","anxiety helpline abu dhabi","800hope number","خط الدعم النفسي الإمارات","رقم الدعم النفسي المجاني دبي","استشارة نفسية مجانية ابوظبي","خط اطمئن 800506"],"a":["These confidential lines answer in Arabic and English. In Dubai, call Itma'en free on 800506, daily from 9 am to midnight. In Abu Dhabi, call 800-SAKINA (800 725462) at any hour. The national Mental Support Line is 800HOPE (800 4673). If a life is in danger, call emergency services now.","تجيب هذه الخطوط السرية بالعربية والإنجليزية. في دبي اتصل مجاناً بخدمة اطمئن على 800506 يومياً من 9 صباحاً حتى منتصف الليل. وفي أبوظبي اتصل على 800-SAKINA (800 725462) في أي وقت. والخط الوطني للدعم النفسي هو 800HOPE (800 4673). وإذا كانت هناك حياة في خطر، فاتصل بالطوارئ فوراً."],"st":[["Dubai: call Itma'en on 800506 to speak with a counsellor in confidence.","دبي: اتصل بخدمة اطمئن على 800506 للتحدث بسرية مع مستشار مختص.",794],["Abu Dhabi: call 800-SAKINA (800 725462) any time for psychological first aid.","أبوظبي: اتصل على 800-SAKINA (800 725462) في أي وقت للإسعافات النفسية الأولية.",794],["Anywhere in the UAE: call or WhatsApp 800HOPE (800 4673), or ask your family doctor for a referral.","في أي مكان بالدولة: اتصل أو راسل عبر واتساب 800HOPE (800 4673)، أو اطلب تحويلاً من طبيب الأسرة.",795],["For ongoing care, see a psychiatrist or psychologist, and check whether your insurance covers counselling.","للعلاج المستمر راجع طبيباً نفسياً أو أخصائياً نفسياً، وتحقق من تغطية تأمينك للإرشاد النفسي.",796]],"f":[["Dubai's Itma'en line, 800506, is free and confidential, runs daily 9 am to midnight in Arabic and English, and serves citizens, residents and visitors.","خط اطمئن في دبي 800506 مجاني وسري، ويعمل يومياً من 9 صباحاً حتى منتصف الليل بالعربية والإنجليزية، ويخدم المواطنين والمقيمين والزوار.",0],["Itma'en refers callers who need medical follow-up to specialist teams.","تحيل خدمة اطمئن المتصلين الذين يحتاجون متابعة طبية إلى فرق متخصصة.",0],["Abu Dhabi's 800-SAKINA (800 725462), activated on 3 March 2026, is a 24/7 bilingual line for psychological first aid, including for children and families.","خط 800-SAKINA (800 725462) في أبوظبي، المفعّل في 3 مارس 2026، يعمل على مدار الساعة بلغتين للإسعافات النفسية الأولية، ويشمل الأطفال والأسر.",1],["The UAE Mental Support Line, 800HOPE (800 4673), gives confidential support by phone and WhatsApp.","يقدم خط الدعم النفسي في الدولة 800HOPE (800 4673) دعماً سرياً عبر الهاتف وواتساب.",2]],"dp":[["emirate","Dubai and Abu Dhabi run their own lines. The national line can be called from anywhere in the UAE.","لدبي وأبوظبي خطوطهما الخاصة، ويمكن الاتصال بالخط الوطني من أي مكان في الدولة."]],"c":["These lines give support and guidance, not emergency care. If someone may harm themselves, call the ambulance or police at once. Hours can change.","تقدم هذه الخطوط الدعم والإرشاد وليست بديلاً عن الطوارئ. وإذا كان أحد قد يؤذي نفسه، فاتصل بالإسعاف أو الشرطة فوراً. وقد تتغير ساعات العمل."],"au":"dha","so":[[797,219,798],[799,730,800],[801,559,802]],"v":1,"ch":["2026-03","Abu Dhabi activated the 24/7 800-SAKINA line on 3 March, and Dubai launched Itma'en on 800506 on 13 March.","فعّلت أبوظبي خط 800-SAKINA على مدار الساعة في 3 مارس، وأطلقت دبي خدمة اطمئن على 800506 في 13 مارس.",1]},{"id":"health-edu-sick-leave-attestation","q":["How do I get my sick leave certificate attested for work?","كيف أصدّق شهادة الإجازة المرضية لجهة عملي؟"],"k":["sick leave attestation uae","how to attest sick leave certificate","mohap sick leave attestation fee","attest medical certificate for work","تصديق الإجازة المرضية","تصديق اجازة مرضية وزارة الصحة","كيف اصدق السك ليف","تصديق التقرير الطبي للدوام"],"a":["You do not apply yourself. The MOHAP-licensed clinic that issued the leave sends it for attestation, free of charge. Leave of 5 days or less is attested at once; longer leave needs a detailed medical report and takes about 5 working days. Leave already attested by DHA, Dubai Health, DoH, SHA or EHS needs no extra MOHAP attestation.","لا تقدّم الطلب بنفسك، فالمنشأة الصحية المرخصة من وزارة الصحة ووقاية المجتمع التي أصدرت الإجازة ترسلها للتصديق مجاناً. وتُصدَّق الإجازة التي لا تزيد على 5 أيام فوراً، أما الأطول فتحتاج تقريراً طبياً مفصلاً وتستغرق نحو 5 أيام عمل. والإجازة التي صدّقتها هيئة الصحة بدبي أو دبي الصحية أو دائرة الصحة أو هيئة الشارقة الصحية أو مؤسسة الإمارات للخدمات الصحية لا تحتاج تصديقاً إضافياً من الوزارة."],"w":["resident","emirati"],"st":[["Ask the clinic to issue your sick leave and send it for attestation. Give it your ID, employer and contact details.","اطلب من العيادة إصدار الإجازة المرضية وإرسالها للتصديق، وزوّدها بهويتك وبيانات جهة عملك وبيانات التواصل.",803],["For leave over 5 days, make sure the doctor adds a medical report with a detailed diagnosis.","للإجازة التي تزيد على 5 أيام، تأكد من إرفاق الطبيب تقريراً طبياً بتشخيص مفصل.",804],["Give the attested leave to your employer and keep a copy.","سلّم الإجازة المصدّقة لجهة عملك واحتفظ بنسخة.",805]],"d":[["Medical report with detailed diagnosis, for leave over 5 days","تقرير طبي بتشخيص مفصل للإجازة التي تزيد على 5 أيام"],["Passport copy, for visitors and companions from abroad","نسخة جواز السفر للزوار والمرافقين القادمين من الخارج"]],"f":[["Only MOHAP-licensed health facilities can request attestation; individuals cannot apply. The service is free.","لا يطلب التصديق إلا المنشآت الصحية المرخصة من الوزارة، ولا يمكن للأفراد التقديم، والخدمة مجانية.",0],["Leave of 5 days or less is attested immediately; longer leave or Medical Committee cases take 5 working days.","تُصدَّق الإجازة التي لا تزيد على 5 أيام فوراً، وتستغرق الأطول أو حالات اللجنة الطبية 5 أيام عمل.",0],["Leave over 5 days needs a medical report with a detailed diagnosis; non-resident visitors need a passport copy.","تحتاج الإجازة التي تزيد على 5 أيام تقريراً طبياً بتشخيص مفصل، ويحتاج الزوار غير المقيمين نسخة من جواز السفر.",0],["No extra MOHAP attestation is needed if DoH, DHA, Dubai Health, SHA or EHS already attested the leave or report.","لا حاجة لتصديق إضافي من الوزارة إذا صدّقت الإجازة أو التقرير دائرة الصحة أو هيئة الصحة بدبي أو دبي الصحية أو هيئة الشارقة الصحية أو مؤسسة الإمارات للخدمات الصحية.",0],["Companion leave is only for a parent, spouse, child or sibling, and must match the patient's leave.","إجازة المرافق للوالدين أو الزوج أو الأبناء أو الإخوة فقط، ويجب أن تطابق مدة إجازة المريض.",0]],"dp":[["emirate","Only MOHAP-licensed clinics use this service. If you were treated in Dubai, Abu Dhabi or Sharjah, ask the clinic how its local regulator attests leave.","لا تستخدم هذه الخدمة إلا العيادات المرخصة من الوزارة. وإن عولجت في دبي أو أبوظبي أو الشارقة، فاسأل العيادة عن طريقة تصديق الإجازة لدى جهتها الصحية المحلية."],["sector","Each employer decides when it needs attested leave, so ask HR first.","تحدد كل جهة عمل متى تطلب إجازة مصدّقة، فاسأل الموارد البشرية أولاً."]],"c":["Older guides mention fees and visits to service centres; MOHAP's current service is free and done by the clinic. Sick pay is a labour matter.","تذكر أدلة قديمة رسوماً ومراجعة مراكز خدمة، لكن خدمة الوزارة الحالية مجانية وتقدّمها العيادة. أما أجر الإجازة المرضية فمسألة عمالية."],"au":"mohap","so":[[806,807,808]],"v":1,"h":"wage-guard"},{"id":"health-edu-school-refund","q":["If I withdraw my child from a Dubai private school, how much of the fees do I get back?","إذا سحبت ابني من مدرسة خاصة في دبي، فكم أسترد من الرسوم؟"],"k":["school fees refund dubai withdrawal","khda refund policy 2026","re-registration deposit refund dubai","withdraw child mid term fees","استرداد الرسوم المدرسية دبي","سياسة الاسترداد هيئة المعرفة","سحب الطالب من المدرسة كم ترجع الرسوم","استرجاع رسوم التسجيل المدرسة"],"a":["Under KHDA's policy from 23 March 2026, refunds are worked out term by term from the date in your written withdrawal request. If your child was enrolled in the term for 2 weeks or less, the school keeps one month's fees; up to 1 month, two months' fees; longer, the whole term. Deposits come back only with notice at least 60 days before the start date.","وفق سياسة هيئة المعرفة والتنمية البشرية المطبقة منذ 23 مارس 2026، تُحسب المبالغ المستردة لكل فصل من التاريخ المذكور في طلب السحب المكتوب. فإن كان ابنك مسجلاً في الفصل أسبوعين أو أقل تحتفظ المدرسة برسوم شهر، وحتى شهر واحد برسوم شهرين، وأكثر من ذلك برسوم الفصل كاملاً. ولا تُسترد مبالغ التسجيل إلا بإشعار قبل 60 يوماً على الأقل من تاريخ البدء."],"w":["resident","emirati"],"m":["dubai"],"s":["private"],"st":[["Send the school a formal written withdrawal request with the exact date. Absence alone does not stop fees.","أرسل إلى المدرسة طلب سحب رسمياً مكتوباً بتاريخ محدد، فالغياب وحده لا يوقف احتساب الرسوم.",809],["To get a deposit back, give formal notice at least 60 calendar days before the start date.","لاسترداد مبلغ التسجيل أو إعادة التسجيل، أبلغ المدرسة رسمياً قبل 60 يوماً تقويمياً على الأقل من تاريخ البدء.",809],["Pay any fees still owed, so the school releases the withdrawal or transfer certificate.","سدّد أي رسوم مستحقة حتى تسلّمك المدرسة شهادة السحب أو النقل.",810],["If the school does not follow the policy, use its complaint process first, then complain to KHDA.","إذا لم تلتزم المدرسة بالسياسة، فاستخدم إجراءات الشكوى فيها أولاً، ثم اشتكِ إلى هيئة المعرفة.",811]],"d":[["Written withdrawal request showing the date","طلب السحب المكتوب متضمناً التاريخ"],["Parent-school contract and fee receipts","عقد ولي الأمر مع المدرسة وإيصالات الرسوم"]],"f":[["From 23 March 2026, refunds are worked out term by term from the withdrawal date in your written request, not your child's last day in class.","منذ 23 مارس 2026 تُحسب المبالغ المستردة لكل فصل من تاريخ السحب في طلبك المكتوب، لا من آخر يوم حضره الطالب.",0],["Enrolled in the term 2 weeks or less: one month's fees kept; 2 weeks to 1 month: two months; over 1 month: the full term.","إذا كان التسجيل في الفصل أسبوعين أو أقل تُخصم رسوم شهر، ومن أسبوعين إلى شهر تُخصم رسوم شهرين، وأكثر من شهر تُخصم رسوم الفصل كاملاً.",0],["Registration and re-registration deposits are refunded with formal notice at least 60 calendar days before the start date.","يُسترد مبلغ التسجيل وإعادة التسجيل بإشعار رسمي قبل 60 يوماً تقويمياً على الأقل من تاريخ البدء.",0],["Application fee: up to AED 500, refunded if no place is offered. Registration deposit: up to 10% of tuition. Re-registration: up to 5% or AED 500, whichever is higher.","رسوم الطلب: حتى 500 درهم وتُسترد إن لم يُعرض مقعد. مبلغ التسجيل: حتى 10% من الرسوم. إعادة التسجيل: حتى 5% أو 500 درهم، أيهما أعلى.",0],["A school may withhold the withdrawal or transfer certificate until fees are paid, and another school needs it to enrol your child.","يجوز للمدرسة حجز شهادة السحب أو النقل حتى سداد الرسوم، وتحتاجها أي مدرسة أخرى لتسجيل ابنك.",1]],"dp":[["emirate","This is Dubai's KHDA policy. Abu Dhabi (ADEK) and Sharjah (SPEA) set their own rules.","هذه سياسة هيئة المعرفة في دبي، ولأبوظبي (دائرة التعليم والمعرفة) والشارقة (هيئة الشارقة للتعليم الخاص) قواعدهما الخاصة."],["other","Fees paid before the school year starts are refundable, minus the deposit if notice is under 60 days.","الرسوم المدفوعة قبل بدء العام الدراسي قابلة للاسترداد، مع خصم مبلغ التسجيل إذا كان الإشعار أقل من 60 يوماً."]],"c":["Older KHDA rules on deposits differ, so check the date of the policy your contract cites. If you skipped the re-registration deposit and your child leaves, the school cannot claim it later.","تختلف قواعد الهيئة الأقدم بشأن المبالغ المقدمة، فتحقق من تاريخ السياسة التي يشير إليها عقدك. وإذا لم تدفع مبلغ إعادة التسجيل وغادر ابنك، فلا يحق للمدرسة المطالبة به لاحقاً."],"au":"khda","l":[812,161,813],"so":[[814,815,816],[817,815,813]],"v":1,"ch":["2026-03","KHDA's updated Registration and Refund Policy took effect on 23 March 2026.","بدأ العمل بسياسة التسجيل والاسترداد المحدثة لدى هيئة المعرفة في 23 مارس 2026.",0]},{"id":"health-edu-domestic-worker-insurance","q":["Do I have to buy health insurance for my housemaid or nanny, and how much does it cost?","هل يجب أن أشتري تأميناً صحياً للعاملة المنزلية أو المربية، وكم يكلف؟"],"k":["health insurance for maid uae","domestic worker insurance cost","nanny health insurance dubai mandatory","maid insurance 320 aed","تأمين صحي للخادمة","تأمين العمالة المنزلية الإلزامي","كم سعر تأمين الشغالة","تأمين صحي للمربية دبي"],"a":["Yes. Since 1 January 2025, the household employer must buy health insurance for a domestic worker before the visa is issued or renewed, and must pay for it. In the northern emirates, the federal basic plan costs AED 320 a year and runs for two years. In Dubai, the minimum plan is priced in a band of AED 550-750 a year plus VAT.","نعم. منذ 1 يناير 2025 يجب على صاحب العمل (الأسرة) شراء تأمين صحي للعامل المنزلي قبل إصدار الإقامة أو تجديدها، وعليه دفع تكلفته. وفي الإمارات الشمالية تكلف الخطة الاتحادية الأساسية 320 درهماً سنوياً لمدة سنتين. وفي دبي يتراوح سعر الخطة الدنيا بين 550 و750 درهماً سنوياً إضافة إلى ضريبة القيمة المضافة."],"w":["resident","emirati"],"s":["domestic"],"st":[["Northern emirates: buy the policy before applying for the worker's visa or renewal.","الإمارات الشمالية: اشترِ الوثيقة قبل التقديم على إقامة العامل أو تجديدها.",818],["Dubai: buy at least the Essential Benefits Plan from a DHA-approved insurer.","دبي: اشترِ على الأقل خطة المنافع الأساسية من شركة تأمين معتمدة من هيئة الصحة بدبي.",819],["Abu Dhabi: buy a plan that meets Department of Health rules.","أبوظبي: اشترِ خطة تستوفي اشتراطات دائرة الصحة.",820],["Pay the premium yourself; do not take it from the worker's salary.","ادفع القسط بنفسك، ولا تخصمه من راتب العامل.",821],["If you cancel the visa early on the federal plan, ask for the second-year premium back.","إذا ألغيت الإقامة مبكراً وكانت الخطة اتحادية، فاطلب استرداد قسط السنة الثانية.",822]],"d":[["Worker's passport and entry permit or visa; employer's Emirates ID","جواز سفر العامل وتصريح الدخول أو الإقامة، والهوية الإماراتية لصاحب العمل"]],"f":[["From 1 January 2025, employers of domestic workers must buy health insurance to issue or renew their residence permits.","منذ 1 يناير 2025 يجب على أصحاب عمل العمالة المساعدة شراء تأمين صحي لإصدار إقاماتهم أو تجديدها.",0],["Federal basic plan: AED 320 a year, valid for two years; the second-year premium is refunded if the visa is cancelled.","الخطة الاتحادية الأساسية: 320 درهماً سنوياً، صالحة لسنتين، ويُسترد قسط السنة الثانية عند إلغاء الإقامة.",0],["Federal plan: covers chronic and pre-existing conditions with no waiting period, but not pregnancy, childbirth or dental care.","الخطة الاتحادية: تغطي الأمراض المزمنة والسابقة دون فترة انتظار، ولا تغطي الحمل والولادة والأسنان.",0],["Dubai: the minimum plan's premium band is AED 550-750 per person a year plus VAT, from 1 January 2025.","دبي: نطاق قسط الخطة الدنيا 550-750 درهماً للفرد سنوياً إضافة إلى ضريبة القيمة المضافة، منذ 1 يناير 2025.",1],["Dubai: insurance costs must not be deducted from salaries under any circumstances.","دبي: لا يجوز خصم تكلفة التأمين من الرواتب بأي حال.",2]],"dp":[["emirate","Dubai and Abu Dhabi apply their own plans. The AED 320 federal plan targets Sharjah, Ajman, Umm Al Quwain, Ras Al Khaimah and Fujairah.","لدبي وأبوظبي خططهما الخاصة، وتستهدف الخطة الاتحادية (320 درهماً) الشارقة وعجمان وأم القيوين ورأس الخيمة والفجيرة."],["visa","A worker whose permit was issued before 2025 needs the insurance at the next renewal.","العامل الذي صدر تصريحه قبل 2025 يحتاج التأمين عند التجديد التالي."]],"c":["These are minimum prices; fuller cover costs more. The basic plan's network is limited, so check the nearest clinics.","هذه أسعار الحد الأدنى، والتغطية الأوسع أعلى سعراً. وشبكة الخطة الأساسية محدودة، فتحقق من أقرب العيادات."],"au":"mohre","so":[[724,823,725],[824,739,737],[825,727,728]],"v":1,"ch":["2025-01","Employer-paid health insurance for domestic workers became mandatory in all emirates.","أصبح التأمين الصحي للعمالة المساعدة على نفقة صاحب العمل إلزامياً في جميع الإمارات.",0]},{"id":"health-edu-emirati-health-cover","q":["I am an Emirati. Which government health cover do I have, and where can I use it?","أنا مواطن إماراتي. ما التغطية الصحية الحكومية التي أحصل عليها، وأين أستخدمها؟"],"k":["thiqa eligibility","thiqa for nationals from other emirates","emirati health insurance dubai enaya","thiqa card renewal","تأمين ثقة للمواطنين","هل يحق لي ثقة وانا من دبي","برنامج عناية دبي للمواطنين","تجديد بطاقة ثقة"],"a":["Emiratis from Abu Dhabi get Thiqa: full cover in Abu Dhabi's public and private Thiqa network, emergency care in the UAE and abroad, and no annual limit. Emiratis from other emirates who do not live in Abu Dhabi get full cover in Abu Dhabi's public Thiqa network. In Dubai, citizens with no other government scheme are covered by Dubai's government programme (Enaya).","يحصل مواطنو أبوظبي على برنامج ثقة: تغطية كاملة في شبكة ثقة الحكومية والخاصة في أبوظبي، وعلاج الطوارئ داخل الدولة وخارجها، ودون حد سنوي. ويحصل مواطنو الإمارات الأخرى غير المقيمين في أبوظبي على تغطية كاملة في شبكة ثقة الحكومية في أبوظبي. وفي دبي يغطي برنامج دبي الحكومي (عناية) المواطنين غير المشمولين ببرنامج حكومي آخر."],"w":["emirati"],"st":[["Enrol in Thiqa or renew online.","سجّل في ثقة أو جدّد اشتراكك إلكترونياً.",826],["Thiqa members aged 18 to 75: book the free IFHAS health screening to keep full benefits.","أعضاء ثقة من عمر 18 إلى 75 عاماً: احجزوا فحص IFHAS الصحي المجاني للحفاظ على المزايا كاملة.",827],["Dubai citizens: ask the Enaya programme about your cover.","مواطنو دبي: استفسروا من برنامج عناية عن تغطيتكم.",828],["A non-Emirati family member sponsored by an Emirati can get Thiqa; the Emirati sponsor applies through SEHA.","يمكن لفرد الأسرة غير المواطن الذي يكفله مواطن الحصول على ثقة، ويقدّم الكفيل المواطن الطلب عبر صحة.",460]],"f":[["Abu Dhabi nationals: full cover in the public and private Thiqa network, emergency care in the UAE and worldwide, and no annual limit.","مواطنو أبوظبي: تغطية كاملة في شبكة ثقة الحكومية والخاصة، وعلاج الطوارئ في الدولة والعالم، ودون حد سنوي.",0],["Nationals of other emirates not living in Abu Dhabi: full cover in Abu Dhabi's public Thiqa network, emergencies in the UAE and worldwide, no annual limit.","مواطنو الإمارات الأخرى غير المقيمين في أبوظبي: تغطية كاملة في شبكة ثقة الحكومية في أبوظبي، والطوارئ في الدولة والعالم، ودون حد سنوي.",0],["Non-UAE family sponsored by an Emirati: cover in Abu Dhabi's public network and UAE emergencies; requests go through SEHA.","أفراد الأسرة غير المواطنين الذين يكفلهم مواطن: تغطية في الشبكة الحكومية بأبوظبي وطوارئ الدولة، والطلب عبر صحة.",0],["The free IFHAS screening is a main condition for Thiqa cardholders aged 18 to 75 to keep full benefits.","فحص IFHAS المجاني شرط أساسي لحاملي بطاقة ثقة من عمر 18 إلى 75 عاماً للحفاظ على المزايا كاملة.",1],["Dubai's Enaya programme (800 ENAYA) covers Dubai citizens with no other government scheme, and Dubai government staff and eligible family.","يغطي برنامج عناية في دبي (800 ENAYA) مواطني دبي غير المشمولين ببرنامج حكومي آخر، وموظفي حكومة دبي وأسرهم المؤهلين.",2]],"dp":[["emirate","Cover depends on your family book's emirate and where you live. In the northern emirates, ask Emirates Health Services about services for citizens.","تعتمد التغطية على إمارة خلاصة القيد ومكان سكنك. وفي الإمارات الشمالية اسأل مؤسسة الإمارات للخدمات الصحية عن خدمات المواطنين."],["sector","Government employees may be covered by their employer's scheme instead.","قد يغطي برنامج جهة العمل الحكومية موظفيها بدلاً من ذلك."]],"c":["Your category decides which hospitals you can use. Check the network before planned treatment, and keep your enrolment up to date.","تحدد فئتك المستشفيات التي يمكنك استخدامها، فتحقق من الشبكة قبل العلاج المخطط له، وحدّث اشتراكك باستمرار."],"au":"doh-ad","l":[829,161,830],"so":[[463,831,465],[832,730,833],[825,727,728]],"v":1},{"id":"health-edu-certificate-equivalency","q":["My child studied abroad. How do I get the school certificates equalised in the UAE?","درس ابني في الخارج. كيف أعادل شهاداته المدرسية في الإمارات؟"],"k":["school certificate equivalency uae","equalization grade 12 certificate moe","equivalency certificate for school admission","attest school certificate khda","معادلة الشهادة المدرسية","معادلة شهادة الثانوية وزارة التربية","معادلة شهادات الطلاب القادمين من الخارج","تصديق الشهادة المدرسية دبي"],"a":["The Ministry of Education equalises high school certificates for UAE residents. Apply online or at an MOE office in Dubai or Abu Dhabi, with Emirates ID, a passport copy and the original grade 10-12 certificates, which are returned. Certificates must be attested, and those not in Arabic or English legally translated. The papers needed depend on the curriculum.","تعادل وزارة التربية والتعليم شهادات المرحلة الثانوية للمقيمين في الدولة. قدّم إلكترونياً أو في أحد مكاتب الوزارة في دبي أو أبوظبي، مع الهوية الإماراتية ونسخة جواز السفر وأصول شهادات الصفوف 10-12، وتُعاد إليك. ويجب تصديق الشهادات، وترجمة غير العربية أو الإنجليزية منها ترجمة قانونية. وتختلف المستندات المطلوبة حسب المنهج."],"w":["resident","emirati"],"st":[["Get the certificates attested by the education authority in the country that issued them.","صدّق الشهادات لدى جهة التعليم في الدولة التي أصدرتها.",834],["Have any certificate not in Arabic or English legally translated and attested.","ترجم أي شهادة بغير العربية أو الإنجليزية ترجمة قانونية مصدّقة.",835],["Apply online, or visit an MOE office, with ID and the original grade 10-12 certificates.","قدّم إلكترونياً أو راجع مكتب الوزارة مع الهوية وأصول شهادات الصفوف 10-12.",836],["Check the document list for your child's curriculum, and the fee, before paying.","راجع قائمة المستندات الخاصة بمنهج ابنك والرسوم قبل الدفع.",837],["Need a Dubai private school certificate attested? Apply to KHDA with UAE PASS (AED 120, 3 working days).","إن احتجت تصديق شهادة مدرسة خاصة في دبي، فقدّم إلى هيئة المعرفة بالهوية الرقمية (120 درهماً، 3 أيام عمل).",838]],"d":[["Emirates ID and passport copy","الهوية الإماراتية ونسخة جواز السفر"],["Original grade 10, 11 and 12 certificates, attested","أصول شهادات الصفوف 10 و11 و12 مصدّقة"],["Legal translation if not in Arabic or English","ترجمة قانونية إن لم تكن بالعربية أو الإنجليزية"]],"f":[["The Ministry of Education equalises high school certificates; applicants must be UAE residents.","تعادل وزارة التربية والتعليم شهادات الثانوية، ويجب أن يكون مقدم الطلب مقيماً في الدولة.",0],["Applicants show Emirates ID and a passport copy and submit original grade 10-12 certificates, returned after checking.","يقدّم الطالب الهوية ونسخة الجواز وأصول شهادات الصفوف 10-12، وتُعاد بعد التحقق.",0],["Certificates must be attested by MOE and/or the issuing country's education authority; those not in Arabic or English must be legally translated.","يجب تصديق الشهادات من الوزارة و/أو جهة التعليم في بلد الإصدار، وترجمة غير العربية والإنجليزية منها ترجمة قانونية.",0],["Apply online with MOE or at its offices in Dubai or Abu Dhabi; the papers needed depend on the curriculum.","يُقدَّم الطلب إلكترونياً لدى الوزارة أو في مكاتبها بدبي وأبوظبي، وتختلف المستندات حسب المنهج.",0],["KHDA attests Dubai private school certificates for AED 120 (AED 100 plus AED 20) within 3 working days.","تصدّق هيئة المعرفة شهادات المدارس الخاصة في دبي مقابل 120 درهماً (100 درهم و20 درهماً) خلال 3 أيام عمل.",1]],"dp":[["emirate","Equalisation is federal (MOE). Attesting a certificate from a local school goes to KHDA in Dubai or TAMM in Abu Dhabi.","المعادلة اتحادية لدى الوزارة، أما تصديق شهادة من مدرسة محلية فلدى هيئة المعرفة في دبي أو منصة تم في أبوظبي."],["other","University degrees are handled by the Ministry of Higher Education and Scientific Research, not by school equalisation.","الشهادات الجامعية من اختصاص وزارة التعليم العالي والبحث العلمي، وليست ضمن معادلة الشهادات المدرسية."]],"c":["We could not confirm the current MOE fee for school equalisation; check MOE's website before paying. Ask the new school early which grades need it.","لم نتمكن من تأكيد رسوم الوزارة الحالية لمعادلة الشهادات المدرسية، فتحقق منها في موقع الوزارة قبل الدفع. واسأل المدرسة الجديدة مبكراً عن الصفوف التي تتطلبها."],"au":"moe-edu","so":[[839,840,841],[842,815,843]],"v":1}]}],"auth (function buildSyn(){

for(const ph of g){const seq=rawWords(ph).map(stem);if(!seq.length)continue;
if(seq.length===1){if(!SYN_ONE.has(seq[0]))SYN_ONE.set(seq[0],key)}
else{const L=SYN_SEQ.get(seq[0])||[];L.push([seq,key]);SYN_SEQ.set(seq[0],L)}}});
for(const L of SYN_SEQ.values())L.sort((a,b)=>b[0].length-a[0].length);
for(const em of EMIRATES){const i=SYN.findIndex(g=>g[0]===EMI_GROUP[em]);EMI_KEY[em]='~'+i;EMI_KEYS.add('~'+i)}})();
function terms(text){const st=rawWords(text).map(stem);const out=[];
for(let i=0;i<st.length;i++){const w=st[i];const cand=SYN_SEQ.get(w);let hit=null;
if(cand)for(const [seq,key] of cand){if(seq.every((x,j)=>st[i+j]===x)){hit=[seq.length,key];break}}
if(hit){out.push(hit[1]);i+=hit[0]-1;continue}

add(both(e.q),FW.q);for(const a of arr(e.ask))add(a,FW.ask);add(both(e.a),FW.a);for(const f of arr(e.facts))add(both(f),FW.facts);

function luhn(d){let s=0,alt=false;for(let i=d.length-1;i>=0;i--){let n=+d[i];if(alt){n*=2;if(n>9)n-=9}s+=n;alt=!alt}return s%10===0}

for(const em of EMIRATES)if(tk.has(EMI_KEY[em])){h.emirate=em;break}
if(/\bemiratis?\b|\buae national|مواطن|اماراتي|\b(?:i am|i'm|im|as) an? local\b/.test(n))h.status='emirati';
else if(/\b(?:i am|i'm|im) (?:a |on a )?(?:visitor|tourist)|\bmy (?:visit|tourist) visa|\bon a (?:visit|tourist) visa|\bon (?:a )?visit\b|\bvisiting (?:dubai|the uae|abu dhabi)|انا (?:زاير|سايح)|زيارتي|(?:انا|جيت|دخلت) (?:علي |ب)(?:تاشيره|فيزا) (?:ال)?زياره|فيزتي السياحيه|تاشيرتي السياحيه|فيزا الزياره حقتي/.test(n))h.status='visitor';
else if(/trade licen[cs]e|business licen[cs]e|business owner|\bmy (?:own )?(?:business|shop|startup|establishment)\b|\bi own a\b|my company(?:'?s)? (?:licen|registration|vat|tax)|رخصه تجاريه|رخصتي التجاريه|صاحب (?:شركه|موسسه|مشروع)|موسستي/.test(n))h.status='business';
else if(/\bresident\b|\bexpat|\bexpatriate|مقيم|وافد/.test(n))h.status='resident';
if(/\bmaids?\b|housemaid|nanny|domestic (?:worker|helper)|خادمه|خدامه|شغاله|عامله منزليه|عامل منزلي|العماله المنزليه|مربيه|دريول/.test(n))h.sector='domestic';
else if(/free ?zone|\bdmcc\b|\bjafza\b|\bdifc\b|\badgm\b|\brakez\b|منطقه حره|المنطقه الحره|فري زون/.test(n))h.sector='free-zone';
else if(/\b(?:government|public sector|federal) (?:job|employee|sector|entity|work)|\bwork (?:for|in) (?:the |a )?government|حكومي|القطاع الحكومي|جهه حكوميه/.test(n))h.sector='government';
else if(/private (?:company|sector|job)|القطاع الخاص|شركه خاصه/.test(n))h.sector='private';
else if(/not working|unemployed|\bno job\b|عاطل|بدون عمل|ما اشتغل|بلا عمل/.test(n))h.sector='none';
return h}

/* == Route */
const emList=list=>({list:list.map(x=>({k:keyName('em',x)}))});
function routeOf(e,sit){sit=sit||{};const base=e.authority,A=AUTH[base];let id=base,over=false;const em=EMIRATES.includes(sit.emirate)?sit.emirate:'';
const ov=A&&A.overrides||{};if(em&&hasOwn(ov,em)&&isStr(ov[em])){id=ov[em];over=true}
const federal=e.emirates.includes('all');const others=Object.keys(ov).filter(k=>EMIRATES.includes(k)&&isStr(ov[k]));
const lines=[federal?{k:'federal'}:{k:'localRule',v:{list:emList(e.emirates)}}];
if(over)lines.push({k:'handledOver',v:{em:{k:keyName('em',em)},auth:{a:id},base:{a:base}}});
else if(!em&&others.length)lines.push({k:'handledExcept',v:{auth:{a:base},em:emList(others),other:{a:ov[others[0]]}}});
else lines.push({k:'handledBy',v:{auth:{a:id}}});
return {federal,authority:id,base,over,lines}}

/* == Clarify (max 3) */
function clarifyKeys(list,sit){const need=[];
const emM=list.some(e=>!e.emirates.includes('all')||e.depends.some(d=>d.key==='emirate')||Object.keys((AUTH[e.authority]||{}).overrides||{}).length>0);
const stM=list.some(e=>(!e.who.includes('any')&&STATUSES.some(s=>!e.who.includes(s)))||e.depends.some(d=>d.key==='status'));
const scM=list.some(e=>!e.sector.includes('any')||e.depends.some(d=>d.key==='sector'));
if(emM&&!sit.emirate)need.push('emirate');if(stM&&!sit.status)need.push('status');if(scM&&!sit.sector)need.push('sector');return need.slice(0,3)}
function whyFor(key,list){for(const e of list){const d=e.depends.find(x=>x.key===key);if(d)return {en:d.en,ar:d.ar};if(clarifyKeys([e],{}).includes(key))break}
if(key==='emirate'){for(const e of list){const ov=(AUTH[e.authority]||{}).overrides||{};const k=Object.keys(ov).find(x=>EMIRATES.includes(x));if(k)return {k:'why_emirate_over',v:{em:{k:keyName('em',k)},auth:{a:ov[k]},base:{a:e.authority}}}}return {k:'why_emirate'}}
return {k:key==='status'?'why_status':'why_sector'}}
const OPTS={emirate:[...EMIRATES,'unsure'],status:STATUSES,sector:SECTORS};
const optName=(key,v)=>key==='emirate'?emName(v):key==='status'?stName(v):scName(v);

/* == Check fit */
function fitIssues(e,sit){sit=sit||{};const out=[];const auth={a:routeOf(e,sit).authority};
if(sit.emirate&&sit.emirate!=='unsure'&&!e.emirates.includes('all')&&!e.emirates.includes(sit.emirate))out.push({k:'fit_emirate',v:{list:emList(e.emirates),em:{k:keyName('em',sit.emirate)},auth}});
if(sit.status&&!e.who.includes('any')&&!e.who.includes(sit.status))out.push({k:'fit_status',v:{list:{list:e.who.map(x=>({k:keyName('st',x)}))},st:{k:keyName('st',sit.status)},auth}});
if(sit.sector&&sit.sector!=='none'&&!e.sector.includes('any')&&!e.sector.includes(sit.sector))out.push({k:'fit_sector',v:{list:{list:e.sector.map(x=>({k:keyName('sc',x)}))},sc:{k:keyName('sc',sit.sector)},auth}});
return out}
const sitOf=(prof,hints)=>{const s={emirate:prof.emirate||'',status:prof.status||'',sector:prof.sector||''};for(const k in s)if(hints&&hints[k])s[k]=hints[k];return s};
function sitText(sit){const p=[];if(sit.emirate)p.push(emName(sit.emirate));if(sit.status)p.push(stName(sit.status));if(sit.sector)p.push(scName(sit.sector));return p.length?p.join(' · '):t('notSet')}

>>>

function vUnderstand(o){if(!o||typeof o!=='object')throw {code:'invalid_json'};const pick=(v,list)=>isStr(v)&&list.includes(v)?v:'';

function vPick(o,cands){if(!o||typeof o!=='object')throw {code:'invalid_json'};const ok=new Set(cands.map(c=>c.id));const ids=[];let dropped=0;
for(const x of arr(o.ids||o.entries)){if(isStr(x)&&ok.has(x)){if(!ids.includes(x))ids.push(x)}else dropped++}return {ids:ids.slice(0,3),dropped}}
function vRoute(o){if(!o||typeof o!=='object')throw {code:'invalid_json'};const a=isStr(o.authority)?o.authority.trim():'';return hasOwn(AUTH,a)?a:''}
function vDraft(o,e,authId){if(!o||typeof o!=='object')throw {code:'invalid_json'};const A=AUTH[authId]||{};
const allowed=numSetOf([e]);for(const n of numsIn([A.phone,A.whatsapp].join(' ')))allowed.add(n);const backing=backingOf([e])+' '+String(A.web||'').toLowerCase();let removed=0;
const clean=s=>{const nc=numberCheck(String(s||'').slice(0,2000),allowed);removed+=nc.removed;return splitSentences(nc.text).filter(x=>{if(unbackedLink(x,backing)){removed++;return false}return true}).join('').trim()};

const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(l){const out=[];let s='',n=0;for(const ch of l){const c=ch.codePointAt(0),b=c<128?1:c<2048?2:c<65536?3:4;if(n+b>74){out.push(s);s=' ';n=1}s+=ch;n+=b}out.push(s);return out.join('\r\n')}
function makeICS(title,desc,date,url){const d=date.replace(/-/g,''),d2=addDays(date,1).replace(/-/g,''),stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wadeh//UAE answers//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT','UID:'+uid()+'@wadeh.local','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+d2,'SUMMARY:'+icsEsc(title),'DESCRIPTION:'+icsEsc(desc),...(url?['URL:'+url]:[]),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'TRIGGER:-P1D','END:VALARM','END:VEVENT','END:VCALENDAR'].map(icsFold).join('\r\n')+'\r\n'}
function toCSV(rows){const q=v=>{let s=String(v??'');if(/^[=+\-@\t]/.test(s))s="'"+s;return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};return '\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n')+'\r\n'}

/* == calculators */
function calcDays(c){return arr(Array.isArray(c.days)?c.days:[c.days]).map(Number).filter(n=>Number.isFinite(n)&&n!==0)}
function calcDeadline(start,days){const s=validISO(start);return s&&Number.isFinite(days)?addDays(s,days):''}
function calcPerDay(n,rate){n=Number(n);return Number.isFinite(n)&&n>=0&&n<=100000?Math.round(n*Number(rate||0)*100)/100:null}

/* == self-test, gaps and saved plans */
function runSelfTest(){const out={n:0,h1:0,h3:0,miss:[]};
for(const x of KB.evalset){const exp=x.expect.filter(id=>hasOwn(BY_ID,id));if(!exp.length)continue;out.n++;const got=search(x.q).slice(0,3).map(r=>r.id);
const in3=got.some(id=>exp.includes(id));if(got[0]&&exp.includes(got[0]))out.h1++;else out.miss.push({q:x.q,lang:x.lang,expect:exp,got,in3});if(in3)out.h3++}
return out}
const pct=(a,b)=>b?Math.round(a/b*100):0;

function useAI(id,model,opts){opts=opts||{};

async function probe(base,headers){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),2500);

const models=(j.data||j.models||[]).map(m=>String(m.id||m.name||m.model||'').replace(/^models\//,'')).filter(Boolean);return {ok:true,models}}
catch(e){return {ok:false}}finally{clearTimeout(tm)}}
async function running(base){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),2000);try{await fetch(base+'/models',{mode:'no-cors',signal:ctl.signal});return true}catch(e){return false}finally{clearTimeout(tm)}}

scan.local[Lc.id]=r.ok&&r.models.length?{status:'found',models:r.models}:(!inClaude&&await running(Lc.base))?{status:'blocked',models:[]}:{status:'missing',models:[]};renderAIPanel()}))}
function cloudHeaders(kind,key){return kind==='anthropic'?{'x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{Authorization:'Bearer '+key}}
async function connectCloud(id,key,remember){const C=CLOUD_AIS.find(x=>x.id===id);if(!C)return t('cc_pick');key=String(key||'').trim();if(key.length<8)return t('cc_full');
const prev=scan.cloud[id];scan.cloud[id]={status:'checking',models:[]};renderAIPanel();const r=await probe(C.base,cloudHeaders(C.kind,key));
if(!r.ok||!r.models.length){if(prev&&keys[id])scan.cloud[id]=prev;else delete scan.cloud[id];renderAIPanel();

function renderLibrary(){const v=$('libView');if(!v)return;const e=BY_ID[LIB.open];
if(e){v.innerHTML=`<div class="actions"><button type="button" class="btn ghost sm" data-libback>${T('back')}</button></div><article class="card plan"><h2 dir="auto" tabindex="-1" id="libEntryH">${esc(L(e.q))}</h2>${entryFullHTML(e,PROFILE,'lib')}${actHTML(e.id,'lib')}</article>`;return}
v.innerHTML=`<div class="card"><div class="chips" role="group" aria-label="${T('topicsH')}"><button type="button" class="chip" data-libtopic="" aria-pressed="${!LIB.topic}">${T('libAll')} · ${ENTRIES.length}</button>${TOPICS.map(x=>`<button type="button" class="chip" data-libtopic="${esc(x.key)}" aria-pressed="${LIB.topic===x.key}">${esc(L(x.title))} · ${x.count}</button>`).join('')}</div><label for="libQ" class="sr">${T('libSearch')}</label><input type="search" id="libQ" dir="auto" placeholder="${T('libSearch')}" value="${esc(LIB.q)}"><p class="tip" id="libCount" aria-live="polite"></p></div><ul class="elist" id="libList"></ul>`;renderLibList()}
function openEntry(id){if(!BY_ID[id])return;LIB.open=id;renderLibrary();showTab('library');focusEl($('libEntryH'))}
function renderLife(){const v=$('lifeView');if(!v)return;if(!KB.journeys.length){v.innerHTML=`<p class="tip">${T('noJourneys')}</p>`;return}
const j=KB.journeys.find(x=>x.id===LIFE.open);if(!j){v.innerHTML=`<div class="jlist">${KB.journeys.map(jHTML).join('')}</div>`;return}
const tk=(store.get(K.ticks,{})||{})[j.id]||{},all=j.entries.map(id=>BY_ID[id]).filter(Boolean),fits=all.filter(e=>!fitIssues(e,PROFILE).length),show=LIFE.all?all:fits,hidden=all.length-fits.length,missing=j.entries.length-all.length;
const asks=j.ask.map(k=>`<fieldset><legend>${T('q_'+k)}</legend><div class="chips">${OPTS[k].map(x=>`<button type="button" class="chip" data-setprof="${k}:${x}" data-where="life" aria-pressed="${PROFILE[k]===x}">${esc(optName(k,x))}</button>`).join('')}</div></fieldset>`).join('');
v.innerHTML=`<div class="actions"><button type="button" class="btn ghost sm" data-lifeback>${T('back')}</button></div><article class="card"><h2 dir="auto" tabindex="-1" id="lifeH2"><span aria-hidden="true">${esc(j.icon)}</span> ${esc(L(j.title))}</h2>${asks?`<div class="clar"><h3>${T('lifeAsk')}</h3>${asks}</div>`:''}
<h3>${T('lifeChecklist')} <span class="pill">${T('lifeDone',{d:show.filter(e=>tk[e.id]).length,n:show.length})}</span></h3><ol class="elist">${show.map(e=>`<li class="card"><label class="check${tk[e.id]?' done':''}"><input type="checkbox" data-tick="${esc(j.id)}:${esc(e.id)}" ${tk[e.id]?'checked':''}><span><b dir="auto">${esc(L(e.q))}</b><br><span class="tip" dir="auto">${esc(firstSentence(L(e.a)))}</span></span></label>${fitIssues(e,PROFILE).map(i=>`<p class="warn">${esc(t(i.k,i.v))}</p>`).join('')}<div class="actions"><button type="button" class="btn ghost sm" data-open="${esc(e.id)}">${T('lifeOpen')}</button></div></li>`).join('')}</ol>
${hidden?`<p class="tip">${T('lifeHidden',{n:hidden})} <button type="button" class="btn ghost sm" data-lifeall>${LIFE.all?T('lifeHide'):T('lifeShow')}</button></p>`:''}${missing?`<p class="tip">${T('lifeMissing')} (${missing})</p>`:''}</article>`}
function renderChanges(){const v=$('chgView');if(!v)return;const list=ENTRIES.filter(e=>e.changed).sort((a,b)=>b.changed.date.localeCompare(a.changed.date));
v.innerHTML=list.length?`<ul class="elist">${list.map(e=>`<li class="card"><span class="badges"><span class="pill chg">${T('changedB',{m:fmtMonth(e.changed.date)})}</span><span class="pill">${esc(topicTitle(e.topic))}</span><span class="pill">${esc(scopeText(e))}</span></span><b dir="auto">${esc(L(e.q))}</b><p dir="auto">${esc(L(e.changed))}</p><div>${srcChip(e,e.changed.src)}</div><div class="actions"><button type="button" class="btn ghost sm" data-open="${esc(e.id)}">${T('chgOpen')}</button></div></li>`).join('')}</ul>`:`<p class="tip">${T('chgNone')}</p>`}
const changedSince=x=>arr(x.ids).some(id=>{const e=BY_ID[id];return e&&e.changed&&e.changed.date>String(x.date||'').slice(0,7)});
function renderSaved(){const v=$('savedView');if(!v)return;const list=getList(K.saved);if(!list.length){v.innerHTML=`<p class="tip">${T('savedNone')}</p>`;return}
const o=list.find(x=>x.id===SAVEDV);
if(o){const e=BY_ID[arr(o.ids)[0]];v.innerHTML=`<div class="actions"><button type="button" class="btn ghost sm" data-savedback>${T('back')}</button></div><article class="card plan"><p class="tip">${T('savedOn',{date:fmtDate(o.date)})}</p>${o.q?`<p class="asked" dir="auto">${esc(o.q)}</p>`:''}${changedSince(o)?`<p class="warn">${T('savedChanged')}</p>`:''}${e?`<h2 dir="auto" tabindex="-1" id="savedH">${esc(L(e.q))}</h2>${o.answer&&isStr(o.answer.text)?`<div class="answer"><span class="who">${T('ansAI',{name:o.answer.by||''})}</span><p dir="auto">${esc(o.answer.text)}</p></div>`:''}${entryFullHTML(e,o.sit||PROFILE,'sav')}${actHTML(e.id,'sav')}`:`<p class="warn">${T('savedGone')}</p>`}</article>`;return}
v.innerHTML=`<ul class="elist">${list.map(x=>{const e=BY_ID[arr(x.ids)[0]];return `<li class="card"><span class="badges"><span class="pill">${T('savedOn',{date:fmtDate(x.date)})}</span>${changedSince(x)?`<span class="pill chg">${T('savedChanged')}</span>`:''}${e?'':`<span class="pill bad">${T('savedGone')}</span>`}</span><b dir="auto">${esc(e?L(e.q):x.q)}</b>${x.q?`<span class="tip" dir="auto">${esc(clip(x.q,140))}</span>`:''}<div class="actions"><button type="button" class="btn teal sm" data-savedopen="${esc(x.id)}">${T('savedOpen')}</button><button type="button" class="btn ghost sm" data-saveddel="${esc(x.id)}">${T('del')}</button></div></li>`}).join('')}</ul>`}
function renderGaps(){const v=$('gapView');if(!v)return;const list=getList(K.gaps);gapArmed=null;
const cnt=f=>{const m={};for(const g of list){const k=f(g)||'';m[k]=(m[k]||0)+1}return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(rows,name)=>{const max=Math.max(1,...rows.map(r=>r[1]));return `<ul class="bars">${rows.map(([k,n])=>`<li><span dir="auto">${esc(name(k))}</span><i style="width:${Math.max(4,Math.round(n/max*100))}%"></i><b>${n}</b></li>`).join('')}</ul>`};
v.innerHTML=`<p class="tip">${T('gapsP2')}</p>`+(list.length?`<div class="row"><div class="card"><h3>${T('byTopic')}</h3>${bars(cnt(g=>g.topic),k=>k?topicTitle(k):t('noTopic'))}</div><div class="card"><h3>${T('byEmirate')}</h3>${bars(cnt(g=>g.emirate),k=>k?emName(k):t('noEmirate'))}</div></div>
<div class="card"><h3>${T('gapsList')} (${list.length})</h3><ul class="elist">${list.slice(0,60).map(g=>`<li class="card"><b dir="auto">${esc(g.q)}</b><span class="badges"><span class="pill">${esc(fmtDate(g.date))}</span><span class="pill">${esc(g.topic?topicTitle(g.topic):t('noTopic'))}</span><span class="pill">${esc(g.emirate?emName(g.emirate):t('noEmirate'))}</span><span class="pill bad">${T('rs_'+g.reason)}</span></span></li>`).join('')}</ul>
<div class="actions"><button type="button" class="btn ghost sm" data-gapx="csv">${T('expCSV')}</button><button type="button" class="btn ghost sm" data-gapx="json">${T('expJSON')}</button><button type="button" class="btn warn sm" data-gapx="clear">${T('clear')}</button></div></div>`:`<p class="tip">${T('gapsNone')}</p>`)}
async function gapAction(a,btn){const list=getList(K.gaps);
if(a==='csv')dlToast(await download('wadeh-gaps-'+todayISO()+'.csv',toCSV([['date','topic','emirate','reason','question'],...list.map(g=>[g.date,g.topic,g.emirate,g.reason,g.q])]),'text/csv'),'savedOk');
else if(a==='json')dlToast(await download('wadeh-gaps-'+todayISO()+'.json',JSON.stringify({exported:todayISO(),gaps:list},null,1),'application/json'),'savedOk');
else if(a==='clear'){if(gapArmed!==btn){gapArmed=btn;btn.textContent=t('clearConfirm');setTimeout(()=>{if(gapArmed===btn){gapArmed=null;btn.textContent=t('clear')}},4000);return}store.del(K.gaps);renderGaps();renderCounts()}}
function renderCounts(){const s=getList(K.saved).length,g=getList(K.gaps).length;const a=$('savedCnt'),b=$('gapCnt');if(a){a.hidden=!s;a.textContent=s}if(b){b.hidden=!g;b.textContent=g}}
function renderHow(){const v=$('howView');if(!v)return;$('posText').textContent=L(BRAND.positioning);const ver=ENTRIES.filter(e=>e.confidence==='verified').length;
v.innerHTML=`<div class="card"><ul class="trust">${[1,2,3,4,5,6].map(i=>`<li><b>${T('tr'+i+'b')}</b> ${T('tr'+i)}</li>`).join('')}</ul><div class="actions" id="rulesRow"></div><p class="tip aihint"></p></div>
<div class="card"><h3>${T('statsH')}</h3><div class="stats">${[[ENTRIES.length,'stEntries'],[ver,'stVerified'],[ENTRIES.length-ver,'stPartial'],[Object.keys(AUTH).length,'stAuth'],[TOPICS.length,'stTopics'],[LIB_CHECKED?fmtDate(LIB_CHECKED):'—','stChecked']].map(([n,k])=>`<div class="stat"><b>${esc(n)}</b><span>${T(k)}</span></div>`).join('')}</div></div>
<div class="card"><h3>${T('selfH')}</h3><p class="tip">${KB.evalset.length?T('selfP',{n:KB.evalset.length}):T('selfNone')}</p>${KB.evalset.length?`<div class="actions"><button type="button" class="btn teal" data-selftest>${T('selfBtn')}</button></div>`:''}<div id="selfOut" aria-live="polite"></div></div>`;renderHowLive()}
function renderHowLive(){const r=$('rulesRow');if(r)r.innerHTML=aiReady()?`<button type="button" class="btn ghost sm" data-rulesonly>${T('rulesBtn')}</button>`:`<span class="pill ok">${T('rulesOn')}</span>`;document.querySelectorAll('.aihint').forEach(h=>{h.textContent=aiReady()?t('hintAI',{name:shortLabel()}):t('hintRules')})}
function showSelfTest(){const r=runSelfTest(),o=$('selfOut');if(!o)return;
o.innerHTML=`<p><b>${T('selfRes',{a:pct(r.h1,r.n),b:pct(r.h3,r.n),n:r.n})}</b></p>${r.miss.length?`<h3>${T('selfMiss')}</h3><ul class="elist">${r.miss.map(m=>`<li class="card"><b dir="auto">${esc(m.q)}</b><span class="tip">${T('selfGot',{e:m.expect.join(', '),g:m.got.join(', ')||'—'})}${m.in3?' · '+T('selfIn3'):''}</span></li>`).join('')}</ul>`:`<p class="tip">${T('selfAll')}</p>`}`}
let tourStep=0;
function renderTour(){const b=$('tourBox');if(!b)return;if(store.get(K.tour,'')==='done'){b.innerHTML='';return}const i=tourStep;
b.innerHTML=`<div class="card tour" role="region" aria-labelledby="tourH"><div class="panel-head"><h2 id="tourH">${T('tourH')}</h2><span class="pill">${T('tourStep',{i:i+1})}</span></div><p>${T('tour'+(i+1))}</p><div class="actions">${i<2?`<button type="button" class="btn teal sm" data-tour="next">${T('tourNext')}</button><button type="button" class="btn ghost sm" data-tour="skip">${T('tourSkip')}</button>`:`<button type="button" class="btn teal sm" data-tour="done">${T('tourDone')}</button>`}</div></div>`}

/* == language, theme, tabs */
function applyStatic(){document.querySelectorAll('[data-i]').forEach(el=>{if(el.id==='askBtn'&&el.disabled)return;el.textContent=t(el.dataset.i)});
document.querySelectorAll('[data-ip]').forEach(el=>{el.placeholder=t(el.dataset.ip)});document.querySelectorAll('[data-ia]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ia))});
$('langEn').setAttribute('aria-pressed',String(LANG==='en'));$('langAr').setAttribute('aria-pressed',String(LANG==='ar'));
const n=BRAND.name||'Wadeh',na=BRAND.name_ar||'واضح';$('brandName').textContent=LANG==='ar'?na+' · '+n:n+' · '+na;$('tagline').textContent=L(BRAND.tagline);document.title=$('brandName').textContent;
$('footText').textContent=t('foot',{date:LIB_CHECKED?fmtDate(LIB_CHECKED):'—'});applyTheme()}
function renderAll(){applyStatic();renderHome();renderLibrary();renderLife();renderChanges();renderSaved();renderGaps();renderHow();renderTour();renderCounts();renderStatus();renderAIPanel();if(RUN){renderRunTrace();renderRunBody()}}
function setLang(l,user){const next=l==='ar'?'ar':'en',changed=next!==LANG;LANG=next;document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';if(user)store.set(K.lang,LANG);if(changed)renderAll()}
let theme='auto';
const darkMQ=()=>{try{return matchMedia('(prefers-color-scheme: dark)')}catch(e){return {matches:false}}};
const shownTheme=()=>theme==='auto'?(darkMQ().matches?'dark':'light'):theme;
const ICON_MOON='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const ICON_SUN='<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
function applyTheme(){const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);const dark=shownTheme()==='dark',b=$('themeBtn');if(!b)return;b.setAttribute('aria-pressed',String(dark));b.title=dark?t('themeOn'):t('themeOff');b.innerHTML=dark?ICON_SUN:ICON_MOON}
const TABS=['ask','library','life','changes','saved','gaps','how'];let curTab='ask';
function showTab(tb,focusTab){if(!TABS.includes(tb))return;curTab=tb;for(const k of TABS){const b=$('tab-'+k),p=$('p-'+k),on=k===tb;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;p.hidden=!on}if(focusTab)$('tab-'+tb).focus()}
function goTab(tb){showTab(tb);focusEl($('p-'+tb))}

/* == events and start */
function twoTap(btn,k,armedK,run){let armed=false,tm=null;btn.addEventListener('click',()=>{if(!armed){armed=true;btn.textContent=t(armedK);btn.classList.add('warn');tm=setTimeout(()=>{armed=false;btn.textContent=t(k);btn.classList.remove('warn')},4000);return}clearTimeout(tm);armed=false;btn.classList.remove('warn');btn.textContent=t(k);run()})}
function setupVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,b=$('micBtn');if(!SR||!b)return;b.hidden=false;let rec=null;
b.addEventListener('click',()=>{if(rec){try{rec.stop()}catch(e){}return}try{rec=new SR();rec.lang=LANG==='ar'?'ar-AE':'en-US';rec.interimResults=false;rec.maxAlternatives=1;
rec.onresult=ev=>{const r=ev.results&&ev.results[0]&&ev.results[0][0];if(r&&r.transcript)$('q').value=r.transcript};rec.onerror=()=>{$('micMsg').textContent=t('micFail')};
rec.onend=()=>{rec=null;b.setAttribute('aria-pressed','false');if($('micMsg').textContent===t('micOn'))$('micMsg').textContent=''};rec.start();b.setAttribute('aria-pressed','true');$('micMsg').textContent=t('micOn')}catch(e){rec=null;$('micMsg').textContent=t('micFail')}})}
async function onClick(e){const tg=e.target;if(!tg||!tg.closest)return;if(tg.closest('#aiStatus')){toggleAIPanel();return}if(tg.closest('#aiPanel')){await aiPanelClick(e);return}
const c=s=>tg.closest(s);let x;
if((x=c('[data-chip]'))){const ch=chipList()[+x.dataset.chip];if(ch){$('q').value=L(ch);ask(L(ch))}return}
if((x=c('[data-topic]'))){LIB={topic:x.dataset.topic,q:'',open:''};renderLibrary();goTab('library');return}
if((x=c('[data-libtopic]'))){LIB.topic=x.dataset.libtopic;renderLibrary();return}
if((x=c('[data-open]'))){openEntry(x.dataset.open);return}
if(c('[data-libback]')){LIB.open='';renderLibrary();return}
if((x=c('[data-journey]'))){LIFE={open:x.dataset.journey,all:false};renderLife();showTab('life');focusEl($('lifeH2'));return}
if(c('[data-lifeback]')){LIFE.open='';renderLife();return}
if(c('[data-lifeall]')){LIFE.all=!LIFE.all;renderLife();return}
if((x=c('[data-clar]'))){const [k,v]=x.dataset.clar.split(':');answerClarify(k,v);return}
if(c('[data-skipq]')){if(RUN&&RUN.stage==='clarify')finish(RUN,++GEN);return}
if((x=c('[data-prof]'))){const k=x.dataset.prof,w=x.dataset.where;chooser=chooser&&chooser.key===k&&chooser.where===w?null:{key:k,where:w};renderProfiles();return}
if((x=c('[data-setprof]'))){const [k,v]=x.dataset.setprof.split(':');setProfile(k,v,x.dataset.where);return}
if(c('[data-profclear]')){PROFILE={emirate:'',status:'',sector:''};saveProfile();chooser=null;renderProfiles();renderLife();return}
if((x=c('[data-act]'))){doAct(x.dataset.act,x.dataset.eid,x.dataset.ctx||'lib');return}
if((x=c('[data-remgo]'))){remGo(x.dataset.remgo,x.dataset.remin);return}
if((x=c('[data-draftgo]'))){draftGo(x.dataset.draftgo,x.dataset.draftid,x.dataset.ctx,x);return}
if((x=c('[data-copyfrom]'))){const el=$(x.dataset.copyfrom);if(el){const ok=await copyText(el.value);toast(ok?t('copied'):t('copyFail'));if(!ok){el.focus();el.select()}}return}
if((x=c('[data-savedopen]'))){SAVEDV=x.dataset.savedopen;renderSaved();focusEl($('savedH'));return}
if(c('[data-savedback]')){SAVEDV='';renderSaved();return}
if((x=c('[data-saveddel]'))){store.set(K.saved,getList(K.saved).filter(s=>s.id!==x.dataset.saveddel));renderSaved();renderCounts();return}
if((x=c('[data-gapx]'))){gapAction(x.dataset.gapx,x);return}
if(c('[data-selftest]')){showSelfTest();return}
if(c('[data-rulesonly]')){useAI('none');renderHowLive();return}
if((x=c('[data-tour]'))){if(x.dataset.tour==='next'){tourStep=Math.min(2,tourStep+1);renderTour();const b=$('tourBox').querySelector('button');if(b)b.focus()}else{store.set(K.tour,'done');renderTour();$('q').focus()}return}}
function boot(){loadKB(($('kb')||{}).textContent||'');
const sl=store.get(K.lang,'');LANG=sl==='ar'||sl==='en'?sl:(/^ar/i.test((navigator&&navigator.language)||'')?'ar':'en');document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
theme=store.get(K.theme,'auto');if(!['auto','light','dark'].includes(theme))theme='auto';loadProfile();loadKeys();
document.addEventListener('click',onClick);
document.addEventListener('input',e=>{const x=e.target;if(x.id==='libQ'){LIB.q=x.value;clearTimeout(libTimer);libTimer=setTimeout(renderLibList,140);return}if(x.dataset&&x.dataset.cin){const [cx,id]=x.dataset.cin.split('|');updateCalc(cx,id)}});
document.addEventListener('change',e=>{const x=e.target;if(x.dataset&&x.dataset.cin){const [cx,id]=x.dataset.cin.split('|');updateCalc(cx,id);return}
if(x.dataset&&x.dataset.tick){const [jid,eid]=x.dataset.tick.split(':');const tk=store.get(K.ticks,{})||{};tk[jid]=tk[jid]||{};if(x.checked)tk[jid][eid]=true;else delete tk[jid][eid];store.set(K.ticks,tk);renderLife();const n=document.querySelector(`[data-tick="${CSS.escape(x.dataset.tick)}"]`);if(n)n.focus();return}
if(x.id==='cloudSel'){const C=CLOUD_AIS.find(z=>z.id===x.value);if($('cloudKey'))$('cloudKey').placeholder=C?C.hint:''}
const ms=x.closest&&x.closest('[data-model]');if(ms&&AI.id===ms.dataset.model)useAI(AI.id,ms.value)});
$('askForm').addEventListener('submit',e=>{e.preventDefault();ask($('q').value)});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ask($('q').value)}});
$('langEn').addEventListener('click',()=>setLang('en',true));$('langAr').addEventListener('click',()=>setLang('ar',true));
$('themeBtn').addEventListener('click',()=>{theme=shownTheme()==='dark'?'light':'dark';store.set(K.theme,theme);applyTheme()});
try{darkMQ().addEventListener('change',()=>{if(theme==='auto')applyTheme()})}catch(e){}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[role="tab"]');if(b)showTab(b.id.slice(4))});
$('tabs').addEventListener('keydown',e=>{const i=TABS.indexOf(curTab),rtl=LANG==='ar';let n=null;if(e.key==='ArrowRight')n=rtl?i-1:i+1;else if(e.key==='ArrowLeft')n=rtl?i+1:i-1;else if(e.key==='Home')n=0;else if(e.key==='End')n=TABS.length-1;if(n!=null){e.preventDefault();showTab(TABS[(n+TABS.length)%TABS.length],true)}});
twoTap($('reset'),'reset','resetConfirm',()=>{for(const k of [K.profile,K.saved,K.gaps,K.ticks,K.tour])store.del(k);GEN++;RUN=null;CALC={};chooser=null;tourStep=0;LIB={topic:'',q:'',open:''};LIFE={open:'',all:false};SAVEDV='';loadProfile();$('result').hidden=true;$('q').value='';$('askErr').textContent='';renderAll();showTab('ask');toast(t('resetDone'))});
renderAll();showTab('ask');setupVoice();if(!/\.github\.io$/.test(location.hostname))rescan()}
if(!(typeof window!=='undefined'&&window.WADEH_TEST))boot();
</script>
