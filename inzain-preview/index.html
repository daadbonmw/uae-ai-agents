<style>
/* Inzain, "super-app" style A (tools/calm-design.md, government colours of 12 Nov). White page, green for what you press, gold identity, near-black ink.
   Rubik for English and Arabic. Three sizes only: 15px notes, 17px body and controls, 28px title (34px on desktop). Weights 400 and 600. */
:root,:root[data-theme="light"]{
--bg:#FFFFFF;--ink:#232528;--muted:#5F646D;--tile:#F7F7F7;--tile-hi:#EDEEF0;--line:#E1E3E5;
--brand:#21633E;--on-brand:#FFFFFF;--link:#21633E;--spot:#B68A35;--tint:#F9F7ED;--focus:#21633E;
--gold:#B68A35;--gold-ink:#92722A;--gold-line:#D7BC6D;--band-a:#FFFFFF;--band-b:#FAF3E3;
--field:#FFFFFF;--field-ink:#232528;--hint:#66686E;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0E0F12;--ink:#F7F7F7;--muted:#9EA2A9;--tile:#1B1D21;--tile-hi:#232528;--line:#3E4046;
--brand:#2F663C;--link:#6FB97F;--spot:#CBA344;--tint:#2A2417;--focus:#A0D5AB;
--gold:#CBA344;--gold-ink:#D7BC6D;--gold-line:#7C5E24;--band-a:#1B1D21;--band-b:#19160E;
--field:#0E0F12;--field-ink:#F7F7F7;--hint:#9EA2A9;color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0E0F12;--ink:#F7F7F7;--muted:#9EA2A9;--tile:#1B1D21;--tile-hi:#232528;--line:#3E4046;
--brand:#2F663C;--link:#6FB97F;--spot:#CBA344;--tint:#2A2417;--focus:#A0D5AB;
--gold:#CBA344;--gold-ink:#D7BC6D;--gold-line:#7C5E24;--band-a:#1B1D21;--band-b:#19160E;
--field:#0E0F12;--field-ink:#F7F7F7;--hint:#9EA2A9;color-scheme:dark}
:root{--paper:var(--bg);--card:var(--tile);--teal:var(--brand);--alert:var(--ink);--teal-soft:var(--tint);--alert-soft:var(--tint);--gold-soft:var(--tint)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg);scroll-padding-top:16px}
html.locked{overflow:hidden}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 17px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:break-word}
[dir="rtl"] body{line-height:1.65}
b,strong{font-weight:600}
h1,h2,h3,h4,p{margin:0}
h1{font-size:28px;line-height:1.15;font-weight:600}
:root[lang=en] h1{letter-spacing:-.01em}
[dir="rtl"] h1{line-height:1.4}
h2,h3,h4{font-size:17px;line-height:1.35;font-weight:600;text-wrap:balance}
a{color:var(--link);text-underline-offset:3px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* something the page itself moves focus to (a heading, the main area) shows no outline; buttons, links and fields keep theirs */
:is(h1,h2,h3,h4,main,section,article,div,p)[tabindex="-1"]:is(:focus,:focus-visible){outline:none}
.wrap{max-width:1000px;margin-inline:auto}
.vh,.sr,.hero h2{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.skip{min-height:44px;display:inline-flex;align-items:center;position:absolute;inset-inline-start:12px;top:-90px;z-index:60;padding:10px 16px;border-radius:22px;background:var(--ink);color:var(--bg);font-size:15px;text-decoration:none}
.skip:focus{top:12px}

/* top band */
.top{background:linear-gradient(180deg,var(--band-a),var(--band-b));color:var(--ink);box-shadow:inset 0 4px 0 var(--gold);border-end-start-radius:28px;border-end-end-radius:28px}
.top .wrap{padding:6px 16px 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.mark{width:22px;height:22px;flex:none;fill:currentColor}
[dir=rtl] .mark{transform:scaleX(-1)}
.bar-start{display:flex;align-items:center;gap:6px;min-width:0}
.bar-end{margin-inline-start:auto;display:flex;align-items:center;gap:6px;min-width:0}
.lang{flex:none;min-width:44px;min-height:44px;padding:0 16px;border:1.5px solid var(--line);border-radius:22px;background:transparent;color:inherit;font-size:15px;font-weight:600;line-height:1;cursor:pointer}
.ibtn{flex:none;display:grid;place-items:center;width:44px;height:44px;min-height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;cursor:pointer}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] #backBtn svg{transform:scaleX(-1)}
#pageTitle{margin:16px 0 16px;color:var(--gold-ink)}
.ask{display:block}
.field{display:flex;align-items:flex-end;gap:2px;min-height:56px;padding:6px;padding-inline-start:20px;border-radius:28px;background:var(--field);color:var(--field-ink);box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.field textarea{flex:1;min-width:0;width:auto;height:44px;min-height:44px;max-height:148px;margin:0;padding:10px 0;border:0;border-radius:0;background:transparent;font-size:17px;line-height:24px;resize:none;overflow-y:auto}
.field textarea::placeholder{color:var(--hint);opacity:1}
.field textarea:focus-visible{outline:none}
@supports selector(a:has(b)){.field:has(textarea:focus-visible){outline:3px solid var(--focus);outline-offset:2px}}
.field .ibtn{color:var(--hint)}
.go{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:var(--brand);color:#FFFFFF;cursor:pointer}
.go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .go svg{transform:scaleX(-1)}
.go:disabled{opacity:.7;cursor:wait}
.routeline{margin:10px 4px 0;min-height:22px;font-size:15px;line-height:22px;color:var(--muted)}
.top .err{color:var(--ink);font-weight:600;margin:6px 4px 0}
.top .tip{color:var(--muted);margin:4px 4px 0}
body:not([data-tab="ask"]) .ask{display:none}
body[data-tab="ask"] #backBtn{display:none}
#pageTitle:focus{outline:none}

main{max-width:1000px;margin:0 auto;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px;outline:none}
.panel{display:flex;flex-direction:column;gap:16px;outline:none;min-width:0}
.banner{font-size:15px;color:var(--muted)}
.card{background:var(--tile);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hero{display:flex;flex-direction:column;gap:6px}
.lead,.tip,.note,.why,.src,.cite,.where,.legal,.aidisc,.foot,.asked{font-size:15px;line-height:1.45;color:var(--muted)}
.lead{max-width:62ch}
.tip:empty,.err:empty,.note:empty{display:none}
.err{font-size:15px;font-weight:600}
.note{padding-top:6px}

/* controls */
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],input[type=url],select,.card textarea{width:100%;border:1.5px solid var(--line);background:var(--field);color:var(--field-ink);border-radius:14px;padding:10px 14px;font-size:17px;min-height:48px}
.card textarea{min-height:88px;resize:vertical}
label{font-weight:600;font-size:17px;display:flex;flex-direction:column;gap:6px}
label small{font-weight:400;color:var(--muted);font-size:15px}
.btn{border:0;border-radius:24px;padding:0 20px;min-height:48px;font-weight:600;font-size:17px;cursor:pointer;background:var(--tile-hi);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;text-decoration:none;line-height:1.2}
.card .btn{background:var(--bg)}
.btn.teal,.card .btn.teal{background:var(--brand);color:var(--on-brand)}
.btn.ghost,.card .btn.ghost{background:transparent;color:var(--link);padding:0 6px;border-radius:12px}
.btn.warn,.card .btn.warn{background:var(--ink);color:var(--bg)}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px}
.btn.ghost.sm{padding:0 6px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.6;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* example questions are for the start page: once an answer or "I don't know" is shown they are unrelated to it */
#result:not([hidden])~#chips{display:none}
.chip{font-size:15px;border:0;background:var(--tile);border-radius:22px;padding:8px 16px;cursor:pointer;min-height:44px;color:var(--ink);text-align:start}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}
.chip .tag{font-size:15px;color:var(--muted);margin-inline-start:6px}
.chip[aria-pressed="true"] .tag{color:inherit}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.pill{font-size:15px;font-weight:400;padding:2px 12px;border-radius:14px;background:var(--bg);color:var(--ink);display:inline-block;max-width:100%}
.pill.bad::before,.pill.chg::before{content:"!\00a0"}
.pill.ok,.pill.bad,.pill.chg,.pill.live,.pill.done{background:var(--tint);color:var(--ink);font-weight:600}
.pill.smp{font-style:normal}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile,.jcard,.eitem,.authcard,.calc,.bri{border:0;border-radius:18px;padding:14px;background:var(--tile);color:var(--ink);display:flex;flex-direction:column;gap:4px;min-width:0}
.card .tile,.card .jcard,.card .eitem,.card .authcard,.card .calc,.card .bri,.answer .authcard,.person .authcard{background:var(--bg)}
.tile,.jcard,.eitem{cursor:pointer;text-align:start;-webkit-tap-highlight-color:transparent}
.tile{min-height:84px;justify-content:space-between}
.tile b{font-size:17px}.tile span{font-size:15px;color:var(--muted)}
.jlist{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.jcard{flex-direction:row;gap:12px;align-items:center;min-height:60px}
.jicon{width:40px;height:40px;display:grid;place-items:center;flex:none}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .s{fill:var(--spot);stroke:none}
.jicon .ico{width:40px;height:40px}
.profile{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:15px}
.profile .chip{background:var(--bg);min-height:44px}
.chooser{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--tint)}
.trace{list-style:none;margin:0;padding:8px 0 0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.trace li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline}
.trace .sn{font-weight:600}
details>summary{cursor:pointer}
details.tracebox>summary,details.more>summary{font-weight:600;color:var(--link);min-height:44px;display:flex;align-items:center}
.scpop a,.src a,.plan p>a{display:inline-flex;align-items:center;min-height:44px}
.k{font-size:15px;font-weight:600;border-radius:12px;padding:0 8px;background:var(--bg);color:var(--ink);white-space:nowrap;display:inline-block}
.asked{background:var(--tint);border-radius:14px;padding:8px 12px}
.refine{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.refrow{display:flex;flex-direction:column;gap:6px}
.answer{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.answer .who{font-size:15px;color:var(--muted)}
.answer ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.route{display:flex;flex-direction:column;gap:6px;border-radius:14px;padding:10px 12px;background:var(--bg)}
:is(p,div).warn,.stale,.disagree{border-radius:14px;padding:10px 12px;font-size:15px;background:var(--tint);color:var(--ink)}
:is(p,div).warn::before{content:"!\00a0";font-weight:600}
.stale::before,.disagree::before{content:"!\00a0";font-weight:600}
.disagree{display:flex;flex-direction:column;gap:6px}
.plan{display:flex;flex-direction:column;gap:14px}
.plan h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan ol,.plan ul{margin:0;padding-inline-start:24px;display:flex;flex-direction:column;gap:8px}
.where{display:block}
.facts{list-style:none;padding:0!important;display:grid;gap:8px}
.facts li{background:var(--bg);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
details.sc{display:inline-block;max-width:100%}
details.sc>summary{list-style:none;cursor:pointer;font-size:15px;font-weight:600;color:var(--link);min-height:44px;display:inline-flex;align-items:center;gap:4px}
details.sc>summary::-webkit-details-marker{display:none}
.scpop{margin-top:6px;border-radius:14px;padding:8px 12px;background:var(--bg);display:flex;flex-direction:column;gap:2px;font-size:15px;overflow-wrap:anywhere}
.src{overflow-wrap:anywhere}
.chans{display:flex;flex-wrap:wrap;gap:8px}
.chan{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border-radius:22px;text-decoration:none;background:var(--tint);color:var(--ink);font-weight:600;font-size:15px;max-width:100%;overflow-wrap:anywhere}
span.chan{font-weight:400}
.handoff,.legal{background:var(--tint);border-radius:14px;padding:8px 12px}
.handoff{font-size:15px}
.calc{gap:8px}
.calc .res{font-size:17px;font-weight:600}
.row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.actbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.actbar .btn{width:100%;font-size:15px}
.box,.next{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.outtext{font-size:15px;line-height:1.5;min-height:200px;white-space:pre-wrap}
.gapcard,.person{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.person h4{color:var(--muted);font-weight:400;font-size:15px}
.elist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.atitle{margin:0}
.notmean{display:flex;flex-direction:column;gap:8px}
.notmean h3{margin:0;font-size:17px;font-weight:600}
.partsbox{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}.partsbox h3{margin:0;font-size:17px;font-weight:600}
.part{background:var(--tile);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}.part b{font-size:17px}.part .one{font-size:15px;color:var(--muted)}.part .pill{align-self:flex-start}
.eitem{width:100%}
.eitem b{font-size:17px}.eitem .one{font-size:15px;color:var(--muted)}
.check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;cursor:pointer;min-height:44px;padding:10px 14px;border-radius:14px;background:var(--bg)}
.check input{width:22px;height:22px;accent-color:var(--brand);flex:none;margin:2px 0 0}
.check.done{opacity:.75}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--bg);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}.stat span{font-size:15px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.bars li{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) auto;gap:8px;align-items:center}
.bars i{display:block;height:10px;border-radius:99px;background:var(--spot)}
.trust{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px}
.tour{background:var(--tint)}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;max-width:1000px;margin:0 auto;padding:0 20px 32px}
.toast{position:fixed;inset-inline:16px;bottom:16px;margin:0 auto;max-width:520px;background:var(--ink);color:var(--bg);border-radius:22px;padding:12px 18px;font-size:15px;z-index:80}
.msel{max-width:100%;flex:1 1 220px;font-size:15px;padding:8px 10px;min-height:44px}
.aidisc{padding-top:6px}
.brk{display:flex;flex-direction:column;gap:8px}
.brl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.bri{font-size:15px}
.bri>a,.bri>span>a{display:inline-flex;align-items:center;min-height:44px}
.secs{display:flex;flex-wrap:wrap;gap:8px}
.tblwrap{overflow-x:auto;border-radius:14px;margin:8px 0;background:var(--bg)}
.tbl{border-collapse:collapse;width:100%;font-size:15px;min-width:420px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.tbl th{font-weight:600}
.dir{display:flex;flex-direction:column;gap:4px}
.dir .actions{margin-top:4px}
.tblans .tblline{font-size:17px;margin:2px 0}.tblans .tblline:first-of-type{font-size:28px;line-height:1.25}
.cancant h4{margin:8px 0 4px}.cancant ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:5px}
.cc2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.cc2{grid-template-columns:1fr}}
.dosi{display:flex;flex-direction:column;gap:5px}.dosh{margin:14px 0 6px}.live{display:flex;flex-direction:column;gap:6px}
.plcask .row{display:flex;gap:8px;align-items:center}.plcask input{flex:1;min-width:0}
.plcsec{margin-top:14px}
.plcsec h3{margin:0 0 6px}

/* sheets: the menu */
.sheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;height:auto;max-height:calc(100vh - 10px);max-height:calc(100dvh - 10px);margin:0;padding:0;border:0;border-radius:22px 22px 0 0;overflow:hidden;background:var(--bg);color:var(--ink)}
.sheet[open]{display:flex;flex-direction:column}
.sheet::backdrop{background:rgba(14,15,18,.5)}
.sheet-bar{flex:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px;padding-inline-start:18px;border-bottom:1px solid var(--line)}
.sheet-bar h2{flex:1;min-width:0}
.sheet-body{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.mlist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.mbtn{width:100%;min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border:0;border-radius:18px;background:var(--tile);color:var(--ink);text-align:start;cursor:pointer}
.mbtn .cnt{min-width:24px;padding:0 8px;border-radius:12px;background:var(--tint);font-size:15px;font-weight:600;text-align:center}

@media (hover:hover){
 .tile:hover,.jcard:hover,.eitem:hover,.mbtn:hover,.chip:hover{background:var(--tile-hi)}

function loadExtra(x){if(!x||typeof x!=='object')return false;PHRASE={};KG=Array.isArray(x.kg)?x.kg.filter(g=>g&&Array.isArray(g.all)).map(g=>({id:String(g.id||''),all:g.all.map(a=>(Array.isArray(a)?a:[]).map(w=>stem(norm(String(w)).trim())).filter(Boolean)),closest:Array.isArray(g.closest)?g.closest.filter(isStr):[]})).filter(g=>g.all.length&&g.all.every(a=>a.length)):[];OWN_T.clear();if(x.ph&&typeof x.ph==='object')for(const k of Object.keys(x.ph))if(isStr(x.ph[k]))PHRASE[k]=x.ph[k];loadXL(x.xl);MO=Array.isArray(x.mo)?new Set(x.mo.filter(isStr)):null;DT=Array.isArray(x.dt)?new Set(x.dt.filter(isStr)):null;if(x.ak&&typeof x.ak==='object')for(const id of Object.keys(x.ak)){const e=BY_ID[id],more=Array.isArray(x.ak[id])?x.ak[id].filter(isStr):[];if(e&&e._stub&&more.length){if(e._n0==null)e._n0=e.ask.length;e.ask=e.ask.slice(0,e._n0).concat(more)}}
if(ENTRIES.length)IDX=buildEntries(ENTRIES);return true}
function ensureExtra(){if(!LAZY)return Promise.resolve();if(!EXTRA_P)EXTRA_P=fetchData('search-extra.json').then(loadExtra).catch(()=>{DATA_CACHE.delete('search-extra.json')});return EXTRA_P}
function loadLazy(){EXTRA_P=null;if(LAZY)LAZY.err=false;return Promise.all([fetchData('index.json'),fetchData('authorities.json').catch(()=>null),fetchData('aliases.json').catch(()=>null)]).then(([ix,au,al])=>{DATA_CACHE.delete('index.json');if(al&&typeof al==='object'&&!Array.isArray(al))ALIAS=al;loadIndex(ix,au);try{renderAll()}catch(e){console.error(e)}setTimeout(ensureExtra,0)},()=>{if(LAZY)LAZY.err=true;renderHome()}).catch(e=>{console.error(e)})}

/* == Link to the project's own server. Optional, and only here: with no window.INZAIN_CONFIG.api the page makes no request at all.
   The server is the page's own address (a path such as /api/v1). It gives the page: approved corrections, a place for "I don't know" and
   "helpful" notes, a reading of hard questions, and a choice and wording step. Every one of them falls back to rules at once. */
const CFG=(()=>{try{const c=window.INZAIN_CONFIG;return c&&typeof c==='object'?c:{}}catch(e){return {}}})();
const API=isStr(CFG.api)&&/^\/(?!\/)/.test(CFG.api)?CFG.api.replace(/\/+$/,''):'';
const AI_ON=!!API&&!!CFG.ai&&CFG.ai.mode==='server';

const AI_MS={understand:4000,pick:3000,route:3000,write:12000,draft:12000};
const AI_OFF={};  /* a step the server answered "fallback" to is not asked again for a minute */

const withTimeout=(p,ms)=>new Promise((res,rej)=>{const tm=setTimeout(()=>res(null),ms);Promise.resolve(p).then(v=>{clearTimeout(tm);res(v)},e=>{clearTimeout(tm);rej(e)})});
async function serverCall(path,body,ms){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),ms);
try{const r=await fetch(API+path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'omit',signal:ctl.signal});if(!r.ok)throw {code:'http'};return await r.json()}
catch(e){throw e&&e.code?e:{code:e&&e.name==='AbortError'?'timeout':'network'}}finally{clearTimeout(tm)}}

function whereNameAr(n){n=n.trim();const k=n.toLowerCase();if(WHERE_AR[k]&&k!==n)return WHERE_AR[k];

/* == language, theme, tabs */
function applyStatic(){document.querySelectorAll('[data-i]').forEach(el=>{if(el.id==='askBtn'&&el.disabled)return;el.textContent=t(el.dataset.i)});
document.querySelectorAll('[data-ip]').forEach(el=>{el.placeholder=t(el.dataset.ip)});document.querySelectorAll('[data-ia]').forEach(el=>{el.setAttribute('aria-label',t(el.dataset.ia))});
const lb=$('langBtn');lb.textContent=LANG==='ar'?'English':'عربي';lb.lang=LANG==='ar'?'en':'ar';
$('brandName').textContent=brandName();$('tagline').textContent=t('tagline');document.title=brandText('name')||(LANG==='ar'?'انزين · Inzain':'Inzain · انزين');paintTitle();
$('footText').textContent=t('foot')+(brandText('org')?' · '+brandText('org'):'');applyTheme()}
function renderAll(){applyStatic();renderHome();renderLibrary();renderLife();renderChanges();renderSaved();renderGaps();renderHow();renderTour();renderCounts();if(RUN){renderRunTrace();renderRunBody()}}
function setLang(l,user){const next=l==='ar'?'ar':'en',changed=next!==LANG;LANG=next;document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';if(user)store.set(K.lang,LANG);if(changed)renderAll()}
let theme='auto';
const darkMQ=()=>{try{return matchMedia('(prefers-color-scheme: dark)')}catch(e){return {matches:false}}};
const shownTheme=()=>theme==='auto'?(darkMQ().matches?'dark':'light'):theme;
function applyTheme(){const r=document.documentElement;if(theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',theme);const dark=shownTheme()==='dark',b=$('themeBtn');if(!b)return;b.setAttribute('aria-pressed',String(dark));b.textContent=t(dark?'themeOn':'themeOff')}
const TABS=['ask','library','life','changes','saved','gaps','how'];let curTab='ask';
const TAB_KEY={library:'tLib',life:'tLife',changes:'tChg',saved:'tSaved',gaps:'tGaps',how:'tHow'};
function paintTitle(){const h=$('pageTitle');if(h)h.textContent=curTab==='ask'?t('h1'):t(TAB_KEY[curTab])}
function showTab(tb,focusTab){if(!TABS.includes(tb))return;curTab=tb;document.body.dataset.tab=tb;paintTitle();for(const k of TABS){const b=$('tab-'+k),p=$('p-'+k),on=k===tb;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;p.hidden=!on}if(focusTab)$('tab-'+tb).focus()}
function goTab(tb){showTab(tb);focusEl($('p-'+tb))}

/* == events and start */
function twoTap(btn,k,armedK,run){let armed=false,tm=null;btn.addEventListener('click',()=>{if(!armed){armed=true;btn.textContent=t(armedK);btn.classList.add('warn');tm=setTimeout(()=>{armed=false;btn.textContent=t(k);btn.classList.remove('warn')},4000);return}clearTimeout(tm);armed=false;btn.classList.remove('warn');btn.textContent=t(k);run()})}
async function onClick(e){const tg=e.target;if(!tg||!tg.closest)return;
if(tg.closest('#menuBtn')){openSheet('sheetMenu');return}
let gm;if((gm=tg.closest('[data-go]'))){closeSheets();goTab(gm.dataset.go);window.scrollTo(0,0);return}
if(tg.closest('[data-close]')){closeSheets();return}
if(tg.closest('#backBtn')){goTab('ask');window.scrollTo(0,0);return}
const c=s=>tg.closest(s);let x;
if(c('[data-homeplaces]')){LIB={topic:'',q:'',open:'',sec:'places'};OTV.open='';OTV.plc='';renderLibrary();goTab('library');return}
if(c('[data-retrylazy]')){loadLazy();renderHome();return}
if((x=c('[data-chip]'))){const ch=chipList()[+x.dataset.chip];if(ch){$('q').value=L(ch);ask(L(ch))}return}
if((x=c('[data-topic]'))){LIB={topic:x.dataset.topic,q:'',open:''};renderLibrary();goTab('library');return}
if((x=c('[data-libtopic]'))){LIB.topic=x.dataset.libtopic;renderLibrary();return}
if((x=c('[data-alt]'))){swapAnswer(x.dataset.alt);return}
if((x=c('[data-open]'))){openEntry(x.dataset.open);return}
const refocus=(attr,v)=>{const b=document.querySelector(`[${attr}="${CSS.escape(v)}"]`);if(b)b.focus()};
if((x=c('[data-otback]'))){OTV.open='';OTV.plc='';renderLibrary();return}
if((x=c('[data-tbl]'))){openTable(x.dataset.tbl);return}
if((x=c('[data-plc]'))){openPlace(x.dataset.plc);return}
if((x=c('[data-other]'))){openOther(x.dataset.other);return}
if((x=c('[data-dirkind]'))){openDirectory(x.dataset.dirkind);return}
if(c('[data-dirback]')){DIRV=newDirv();renderLibrary();return}
if((x=c('[data-diremt]'))){DIRV.em=x.dataset.diremt;DIRV.area='';DIRV.more=60;renderLibrary();return}
if(c('[data-dirnear]')){dirNear();return}
if(c('[data-plcask]')){plcAskGo();return}
if(c('[data-dirmore]')){DIRV.more+=100;renderDirList();return}
if(c('[data-libmore]')){LIB.max=(LIB.max||200)+400;renderLibList();return}
if((x=c('[data-libsec]'))){const v=x.dataset.libsec;LIB.sec=v;LIB.open='';OTV.open='';OTV.plc='';if(v==='directory')DIRV=newDirv();renderLibrary();refocus('data-libsec',v);return}
if((x=c('[data-fzem]'))){const v=x.dataset.fzem;LIB.fzEm=v;renderLibrary();refocus('data-fzem',v);return}
if((x=c('[data-fzfocus]'))){const v=x.dataset.fzfocus;LIB.fzFocus=v;renderLibrary();refocus('data-fzfocus',v);return}
if((x=c('[data-repgo]'))){repGo(x.dataset.repgo,x.dataset.repin,x);return}
if((x=c('[data-repx]'))){repAction(x.dataset.repx,x);return}
if(c('[data-libback]')){LIB.open='';renderLibrary();return}
if((x=c('[data-journey]'))){LIFE={open:x.dataset.journey,all:false};renderLife();showTab('life');focusEl($('lifeH2'));return}
if(c('[data-lifeback]')){LIFE.open='';renderLife();return}
if(c('[data-lifeall]')){LIFE.all=!LIFE.all;renderLife();return}
if((x=c('[data-refine]'))){const [k,v]=x.dataset.refine.split(':');if(RUN&&RUN.stage==='done')setProfile(k,v,'run');return}
if((x=c('[data-prof]'))){const k=x.dataset.prof,w=x.dataset.where;chooser=chooser&&chooser.key===k&&chooser.where===w?null:{key:k,where:w};renderProfiles();return}
if((x=c('[data-setprof]'))){const [k,v]=x.dataset.setprof.split(':');setProfile(k,v,x.dataset.where);return}
if(c('[data-profclear]')){PROFILE={emirate:'',status:'',sector:''};saveProfile();chooser=null;renderProfiles();renderLife();return}
if((x=c('[data-act]'))){doAct(x.dataset.act,x.dataset.eid,x.dataset.ctx||'lib');return}
if((x=c('[data-remgo]'))){remGo(x.dataset.remgo,x.dataset.remin);return}
if((x=c('[data-draftgo]'))){draftGo(x.dataset.draftgo,x.dataset.draftid,x.dataset.ctx,x);return}
if((x=c('[data-copyfrom]'))){const el=$(x.dataset.copyfrom);if(el){const ok=await copyText(el.value);toast(ok?t('copied'):t('copyFail'));if(!ok){el.focus();el.select()}}return}
if((x=c('[data-savedopen]'))){SAVEDV=x.dataset.savedopen;renderSaved();focusEl($('savedH'));return}
if(c('[data-savedback]')){SAVEDV='';renderSaved();return}
if((x=c('[data-saveddel]'))){store.set(K.saved,getList(K.saved).filter(s=>s.id!==x.dataset.saveddel));renderSaved();renderCounts();return}
if((x=c('[data-gapx]'))){gapAction(x.dataset.gapx,x);return}
if(c('[data-selftest]')){showSelfTest();return}
if(c('[data-tour]')){store.set(K.tour,'done');renderTour();$('q').focus();return}}
function boot(){loadKB(($('kb')||{}).textContent||'');
const sl=QS.get('lang')==='ar'||QS.get('lang')==='en'?QS.get('lang'):store.get(K.lang,'');LANG=sl==='ar'||sl==='en'?sl:(/^ar/i.test((navigator&&navigator.language)||'')?'ar':'en');document.documentElement.lang=LANG;document.documentElement.dir=LANG==='ar'?'rtl':'ltr';
theme=store.get(K.theme,'auto');if(!['auto','light','dark'].includes(theme))theme='auto';loadProfile();paintBrand();
document.addEventListener('click',onClick);
document.addEventListener('input',e=>{const x=e.target;if(x.id==='libQ'){LIB.q=x.value;clearTimeout(libTimer);libTimer=setTimeout(renderLibList,140);return}
if(x.id==='otQ'){OTV.q[libSec()]=x.value;clearTimeout(libTimer);libTimer=setTimeout(renderOtList,140);return}
if(x.id==='dirQ'){DIRV.q=x.value;DIRV.more=60;clearTimeout(libTimer);libTimer=setTimeout(renderDirList,140);return}
if(x.id==='plcQ'){OTV.pq=x.value;clearTimeout(libTimer);libTimer=setTimeout(renderPlcDir,140);return}
if(x.id==='brQ'){LIB.bq=LIB.bq||{};LIB.bq[libSec()]=x.value;clearTimeout(libTimer);libTimer=setTimeout(renderBrList,140);return}
if(x.dataset&&x.dataset.cin){const [cx,id]=x.dataset.cin.split('|');updateCalc(cx,id)}});
document.addEventListener('change',e=>{const x=e.target;
if(x.dataset&&x.dataset.cin){const [cx,id]=x.dataset.cin.split('|');updateCalc(cx,id);return}
if(x.dataset&&x.dataset.tick){const [jid,eid]=x.dataset.tick.split(':');const tk=store.get(K.ticks,{})||{};tk[jid]=tk[jid]||{};if(x.checked)tk[jid][eid]=true;else delete tk[jid][eid];store.set(K.ticks,tk);renderLife();const n=document.querySelector(`[data-tick="${CSS.escape(x.dataset.tick)}"]`);if(n)n.focus();return}
if(x.id==='dirArea'){DIRV.area=x.value;DIRV.more=60;renderDirList()}});
$('askForm').addEventListener('submit',e=>{e.preventDefault();ask($('q').value)});
const growQ=()=>{const q=$('q');if(!q.value){q.style.height='';return}q.style.height='auto';q.style.height=Math.min(q.scrollHeight,148)+'px'};
$('q').addEventListener('input',growQ);window.addEventListener('resize',growQ);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='plcAskQ'&&!e.isComposing){e.preventDefault();plcAskGo()}});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask($('q').value)}});
document.querySelectorAll('dialog.sheet').forEach(d=>{d.addEventListener('close',()=>{document.documentElement.classList.remove('locked')});d.addEventListener('click',ev=>{if(ev.target===d)d.close()})});
$('langBtn').addEventListener('click',()=>setLang(LANG==='ar'?'en':'ar',true));
$('themeBtn').addEventListener('click',()=>{theme=shownTheme()==='dark'?'light':'dark';store.set(K.theme,theme);applyTheme()});
try{darkMQ().addEventListener('change',()=>{if(theme==='auto')applyTheme()})}catch(e){}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[role="tab"]');if(b)showTab(b.id.slice(4))});
$('tabs').addEventListener('keydown',e=>{const i=TABS.indexOf(curTab),rtl=LANG==='ar';let n=null;if(e.key==='ArrowRight')n=rtl?i-1:i+1;else if(e.key==='ArrowLeft')n=rtl?i+1:i-1;else if(e.key==='Home')n=0;else if(e.key==='End')n=TABS.length-1;if(n!=null){e.preventDefault();showTab(TABS[(n+TABS.length)%TABS.length],true)}});
twoTap($('reset'),'reset','resetConfirm',()=>{for(const k of [K.profile,K.saved,K.gaps,K.ticks,K.tour,K.reports])store.del(k);GEN++;RUN=null;CALC={};chooser=null;LIB={topic:'',q:'',open:''};LIFE={open:'',all:false};SAVEDV='';loadProfile();$('result').hidden=true;$('q').value='';$('askErr').textContent='';renderAll();showTab('ask');closeSheets();toast(t('resetDone'))});
if(EMBED)document.documentElement.classList.add('embed');
const q0=QS.get('q');if(q0){$('q').value=String(q0).slice(0,2500);growQ()}
renderAll();showTab('ask');
const autoAsk=()=>{if(EMBED&&q0)ask(String(q0).slice(0,2500))};
/* the server's approved corrections arrive after the library, never before first paint */
if(LAZY&&!LAZY.ready)loadLazy().then(()=>{autoAsk();if(PENDQ&&ENTRIES.length){const p=PENDQ;PENDQ='';ask(p)}loadOverrides()});else{autoAsk();loadOverrides()}}
if(!(typeof window!=='undefined'&&window.INZAIN_TEST))boot();
</script>
</body>
</html>
