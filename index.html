<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1D21" media="(prefers-color-scheme: dark)">
<title>UAE Agents · وكلاء الإمارات</title>
<meta name="description" content="One place for life in the UAE: rules, scam messages, late salary, rent, city repairs and interviews.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2392722A' d='M12 2a10 10 0 1 1 0 20H2V12A10 10 0 0 1 12 2z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="fonts/rubik.css">
<style>
/* Super-app in the colours of UAE government websites (tools/calm-design.md): white and cream, gold for identity,
   green for actions, near-black ink. Rubik for English and Arabic.
   Three sizes only: 15px notes, 17px body and names, 28px title (34px on desktop). Weights 400 and 600. */
:root{
 --bg:#FFFFFF;--ink:#232528;--muted:#5F646D;--tile:#F7F7F7;--tile-hi:#EDEEF0;--line:#E1E3E5;
 --brand:#21633E;--on-brand:#FFFFFF;--link:#21633E;--spot:#B68A35;--tint:#F9F7ED;--focus:#21633E;
 --gold:#B68A35;--gold-ink:#92722A;--gold-line:#D7BC6D;--band-a:#FFFFFF;--band-b:#FAF3E3;
 --field:#FFFFFF;--field-ink:#232528;--hint:#66686E;
}
@media (prefers-color-scheme:dark){:root{
 --bg:#0E0F12;--ink:#F7F7F7;--muted:#9EA2A9;--tile:#1B1D21;--tile-hi:#232528;--line:#3E4046;
 --brand:#2F663C;--link:#6FB97F;--spot:#CBA344;--tint:#2A2417;--focus:#A0D5AB;
 --gold:#CBA344;--gold-ink:#D7BC6D;--gold-line:#7C5E24;--band-a:#1B1D21;--band-b:#19160E;
 --field:#0E0F12;--field-ink:#F7F7F7;--hint:#9EA2A9;
}}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.locked{overflow:hidden}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 17px/1.5 Rubik,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:break-word}
button,textarea{font:inherit;color:inherit}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:1000px;margin-inline:auto}

/* Light top with a thin gold line: brand, one question, the ask bar */
.top{background:linear-gradient(180deg,var(--band-a),var(--band-b));color:var(--ink);box-shadow:inset 0 4px 0 var(--gold);border-end-start-radius:28px;border-end-end-radius:28px}
.top .wrap{padding:6px 16px 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600}
.mark{width:22px;height:22px;flex:none;fill:currentColor}
[dir=rtl] .mark{transform:scaleX(-1)}
.lang{min-width:44px;min-height:44px;padding:0 16px;border:1.5px solid var(--muted);border-radius:22px;background:transparent;font-size:15px;font-weight:600;line-height:1;cursor:pointer}
h1{margin:16px 0 16px;font-size:28px;line-height:1.15;font-weight:600;color:var(--gold-ink)}
:root[lang=en] h1{letter-spacing:-.01em}
.field{display:flex;align-items:flex-end;gap:6px;min-height:56px;padding:6px;padding-inline-start:20px;border-radius:28px;background:var(--field);color:var(--field-ink);box-shadow:inset 0 0 0 1.5px var(--gold-line)}
.field textarea{flex:1;min-width:0;height:44px;max-height:148px;margin:0;padding:10px 0;border:0;background:transparent;font-size:17px;line-height:24px;resize:none;overflow-y:auto}
.field textarea::placeholder{color:var(--hint);opacity:1}
.go{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:var(--brand);color:#FFFFFF;cursor:pointer;-webkit-tap-highlight-color:transparent}
.go svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] .go svg{transform:scaleX(-1)}
@supports selector(a:has(b)){
 .field textarea:focus{outline:none}
 .field:has(textarea:focus){outline:3px solid var(--focus);outline-offset:2px}
}
.route{margin:10px 4px 0;min-height:22px;font-size:15px;line-height:22px}
.route b{font-weight:600}
.route .soft{color:var(--muted)}
.route [hidden]{display:none}

/* The six agents */
main.wrap{padding:16px 16px 24px}
.agents{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:10px}
.agents li{display:flex;min-width:0}
.agent{flex:1;min-width:0;min-height:150px;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto 1fr auto auto;grid-template-areas:"ico other" ". ." "name name" "line line";column-gap:8px;padding:14px 14px 15px;border-radius:22px;background:var(--tile);color:var(--ink);text-decoration:none;-webkit-tap-highlight-color:transparent}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ico .s{fill:var(--spot);stroke:none}
.agent .ico{grid-area:ico;width:48px;height:48px;margin:-4px;margin-inline-end:0}
.agent [lang]{font-size:17px;line-height:22px}
.agent [lang=en]{grid-area:name;margin-top:12px;font-weight:600}
.agent [lang=ar]{grid-area:other;justify-self:end;text-align:end;color:var(--muted)}
:root[lang=ar] .agent [lang=ar]{grid-area:name;justify-self:stretch;text-align:start;margin-top:12px;font-weight:600;color:var(--ink)}
:root[lang=ar] .agent [lang=en]{grid-area:other;justify-self:end;text-align:end;margin-top:0;font-weight:400;color:var(--muted)}
.agent .line{grid-area:line;margin-top:2px;font-size:15px;line-height:21px;color:var(--muted)}
.agent.match{background:var(--tint);box-shadow:inset 0 0 0 2px var(--spot)}
.agent:focus-visible{outline-offset:3px}
.foot{margin:18px 4px 0;font-size:15px;line-height:22px;color:var(--muted)}

/* The agent opens in place: a sheet over the page, never a new page */
#view{position:fixed;inset:auto 0 0 0;width:100%;max-width:none;height:calc(100vh - 10px);height:calc(100dvh - 10px);max-height:none;margin:0;padding:0;border:0;border-radius:22px 22px 0 0;overflow:hidden;background:var(--bg);color:var(--ink)}
#view[open]{display:flex;flex-direction:column}
#view::backdrop{background:rgba(8,10,20,.5)}
.sheet-bar{flex:none;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px;padding-inline-start:16px;border-bottom:1px solid var(--line)}
#viewIco{display:flex;flex:none}
#viewIco .ico{width:32px;height:32px}
.sheet-name{flex:1;min-width:0;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;font-size:17px;line-height:22px;font-weight:600}
.sheet-name .o{font-weight:400;color:var(--muted)}
.ibtn{flex:none;display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer}
.ibtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[dir=rtl] #viewFull svg,[dir=rtl] #viewBack svg{transform:scaleX(-1)}
#viewBack[hidden]{display:none}
.sheet-body{position:relative;flex:1;min-height:0;background:var(--bg)}
.sheet-body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
.sheet-body.loading iframe{opacity:0}
.loader{position:absolute;inset:0;display:grid;place-items:center}
.loader .ico{width:84px;height:84px}

@media (hover:hover){
 .agent:hover{background:var(--tile-hi)}
 .agent.match:hover{background:var(--tint)}
 .ibtn:hover{background:var(--tile)}
 .lang:hover{background:var(--tile)}
}
@media (prefers-reduced-motion:no-preference){
 .agent{transition:transform .18s cubic-bezier(.3,.7,.4,1),background-color .18s,box-shadow .18s}
 .agent:active{transform:scale(.965)}
 .agent .s{transition:transform .32s cubic-bezier(.3,.7,.4,1)}
 .agent.match .s{transform:translate(2px,-2px)}
 .go,.lang,.ibtn{transition:transform .15s,background-color .15s}
 .go:active,.lang:active,.ibtn:active{transform:scale(.92)}
 #view[open]{animation:sheet .34s cubic-bezier(.2,.85,.25,1)}
 #view[open]::backdrop{animation:fade .24s ease-out}
 .sheet-body iframe{transition:opacity .2s}
 .loading .loader .s{animation:breathe .9s ease-in-out infinite alternate}
 @keyframes sheet{from{transform:translateY(48px);opacity:.3}to{transform:none;opacity:1}}
 @keyframes fade{from{opacity:0}to{opacity:1}}
 @keyframes breathe{from{opacity:.35}to{opacity:1}}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
 .agent:hover .s{transform:translate(2px,-2px)}
}

/* Test mode only (?test=1): the question bar, the send button and the send sheet. Nothing here shows without it. */
.tbar{position:fixed;inset-inline:0;bottom:0;z-index:5;background:var(--tint);box-shadow:inset 0 1.5px 0 var(--gold-line);border-start-start-radius:22px;border-start-end-radius:22px}
.tbar .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.tq-t{flex:1;min-width:0;margin:0}
.tbtn{min-width:64px;min-height:44px;padding:0 20px;border:1.5px solid var(--muted);border-radius:22px;background:transparent;font-weight:600;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tbtn.main{border-color:transparent;background:var(--brand);color:var(--on-brand)}
.tbtn.link{border-color:transparent;color:var(--link)}
.tpill{position:fixed;z-index:5;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom))}
.tbar[hidden],.tpill[hidden]{display:none}
body.tpad{padding-bottom:88px}
#tsheet{position:fixed;inset:auto 0 0 0;width:100%;max-width:520px;max-height:calc(100vh - 10px);max-height:calc(100dvh - 10px);margin:0 auto;padding:0;border:0;border-radius:22px 22px 0 0;overflow:auto;background:var(--bg);color:var(--ink)}
#tsheet::backdrop{background:rgba(8,10,20,.5)}
.tbody{padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.tsum{margin:0 0 14px}
.tl{display:block;margin:0 0 6px;font-size:15px;line-height:22px;color:var(--muted)}
#tsNote{display:block;width:100%;height:68px;padding:10px 14px;border:0;border-radius:16px;background:var(--field);color:var(--field-ink);box-shadow:inset 0 0 0 1.5px var(--gold-line);font-size:17px;line-height:24px;resize:none}
#tsNote:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tmsg{margin:14px 0;padding:12px 14px;border-radius:16px;background:var(--tile);font-size:15px;line-height:22px;overflow-wrap:anywhere}
.tmsg .code{direction:ltr;text-align:start}
.tact{display:grid;gap:6px}
.tnote{margin:8px 4px 0;font-size:15px;line-height:22px;color:var(--muted)}
.tnote[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){
 #tsheet[open]{animation:sheet .34s cubic-bezier(.2,.85,.25,1)}
 #tsheet[open]::backdrop{animation:fade .24s ease-out}
 .tbtn:active{transform:scale(.96)}
}

/* Desktop */
@media (min-width:760px){
 .top{border-end-start-radius:40px;border-end-end-radius:40px}
 .top .wrap{padding:12px 32px 26px}
 h1{margin:40px 0 22px;font-size:34px}
 .ask{max-width:640px}
 main.wrap{padding:32px 32px 48px}
 .agents{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
 .agent{min-height:184px;padding:20px;border-radius:26px}
 .agent .ico{width:56px;height:56px}
 .foot{margin-top:24px}
 #view{inset-block:0;inset-inline-start:auto;inset-inline-end:0;width:min(680px,100vw);height:100vh;height:100dvh;border-radius:0;border-start-start-radius:24px;border-end-start-radius:24px}
}
@media (min-width:760px) and (prefers-reduced-motion:no-preference){
 #view[open]{animation-name:side}
 [dir=rtl] #view[open]{animation-name:side-rtl}
 @keyframes side{from{transform:translateX(48px);opacity:.3}to{transform:none;opacity:1}}
 @keyframes side-rtl{from{transform:translateX(-48px);opacity:.3}to{transform:none;opacity:1}}
}
@media (max-width:359px){
 .agent{padding:12px}
 .agent .ico{width:42px;height:42px}
}
</style>
</head>
<body>
<header class="top">
 <div class="wrap">
  <div class="bar">
   <span class="brand"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2a10 10 0 1 1 0 20H2V12A10 10 0 0 1 12 2z"/></svg><span data-t="brand">UAE Agents</span></span>
   <button class="lang" id="lang" type="button" lang="ar">عربي</button>
  </div>
  <h1 data-t="h1">What do you need?</h1>
  <form class="ask" id="ask" action="answers/" method="get">
   <label for="q" class="vh" data-t="label">Your question</label>
   <div class="field">
    <textarea id="q" name="q" rows="1" dir="auto" maxlength="800" enterkeyhint="go" placeholder="Ask anything"></textarea>
    <button class="go" type="submit" data-ta="send" aria-label="Go"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg></button>
   </div>
   <p class="route"><span class="soft" id="hint" data-t="hint">Or pick one.</span><span id="route" aria-live="polite"></span></p>
  </form>
 </div>
</header>

<main class="wrap">
 <ul class="agents">
  <li><a class="agent" href="answers/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="s" d="M30 7h8v18l-4-3-4 3z"/><path d="M24 15C19.5 12.3 13.5 11 6 11v25c7.5 0 13.5 1.3 18 4 4.5-2.7 10.5-4 18-4V11c-7.5 0-13.5 1.3-18 4zM24 15v25M11 19.5c2.6.2 5 .7 7 1.4M11 25.5c2.6.2 5 .7 7 1.4"/></svg>
   <span lang="en">Inzain</span><span lang="ar">انزين</span>
   <span class="line" data-t="w1">Ask UAE rules</span></a></li>
  <li><a class="agent" href="message-check/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M11 8h16a6 6 0 0 1 6 6v10a6 6 0 0 1-6 6H17l-6 6v-6a6 6 0 0 1-6-6V14a6 6 0 0 1 6-6zM12 15.5h13M12 21.5h7"/><circle class="s" cx="33" cy="29" r="7.5"/><circle cx="33" cy="29" r="7.5"/><path d="M38.5 34.5 43 39"/></svg>
   <span lang="en">Mazboot</span><span lang="ar">مضبوط</span>
   <span class="line" data-t="w2">Check a message</span></a></li>
  <li><a class="agent" href="wages/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect x="5" y="10" width="30" height="28" rx="5"/><path d="M13 6v8M27 6v8M5 18h30M11 25h4M19 25h4M11 31h4"/><path class="s" d="M27 31c0-1.9 3.6-3.5 8-3.5s8 1.6 8 3.5v6c0 1.9-3.6 3.5-8 3.5s-8-1.6-8-3.5z"/><ellipse cx="35" cy="31" rx="8" ry="3.5"/><path d="M27 31v6c0 1.9 3.6 3.5 8 3.5s8-1.6 8-3.5v-6M27 34c0 1.9 3.6 3.5 8 3.5s8-1.6 8-3.5"/></svg>
   <span lang="en">Bil Tareekh</span><span lang="ar">بالتاريخ</span>
   <span class="line" data-t="w3">Prove late pay</span></a></li>
  <li><a class="agent" href="rent/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path d="M5 24 21 11l16 13M10 20v18h22V20M17.5 38v-9h7v9"/><circle class="s" cx="37" cy="12" r="7"/><path d="M37 15.5v-7M33.8 11.7 37 8.5l3.2 3.2"/></svg>
   <span lang="en">Masmooh</span><span lang="ar">مسموح</span>
   <span class="line" data-t="w4">Check your rent</span></a></li>
  <li><a class="agent" href="city-repairs/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="s" d="M27 12h8l9 26c-3.4 1.3-8.2 2-13 2s-9.6-.7-13-2z"/><path d="M14 42V14a7 7 0 0 1 7-7h4M25 7h12l-2 5h-8zM9 42h10"/></svg>
   <span lang="en">Wareeni</span><span lang="ar">ورّيني</span>
   <span class="line" data-t="w5">Report a problem</span></a></li>
  <li><a class="agent" href="careers/">
   <svg class="ico" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="s" d="M27.2 17.6c1.5 4.8 2.4 9.6 2.4 14.2a2.4 2.4 0 0 1-4.8 0c0-4.6.9-9.4 2.4-14.2z"/><path d="M6 43V21.5c0-3 1.8-5.6 4.6-6.6L18 12M42 43V21.5c0-3-1.8-5.6-4.6-6.6L30 12M18 12c0 3.3 2.7 6 6 6s6-2.7 6-6c-1.7-1.3-3.8-2-6-2s-4.3.7-6 2zM24 18v12"/></svg>
   <span lang="en">Zaheb</span><span lang="ar">زاهب</span>
   <span class="line" data-t="w6">Interview practice</span></a></li>
 </ul>
 <p class="foot" data-t="foot">Not legal advice. Not a government service.</p>
</main>

<dialog id="view" aria-labelledby="viewName">
 <div class="sheet-bar">
  <button class="ibtn" id="viewBack" type="button" data-ta="back" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19 12H6M11.5 6l-6 6 6 6"/></svg></button>
  <span id="viewIco" aria-hidden="true"></span>
  <h2 class="sheet-name" id="viewName"></h2>
  <a class="ibtn" id="viewFull" href="answers/" target="_blank" rel="noopener" data-ta="full" aria-label="Full page"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4h6v6M20 4l-8.5 8.5M18 14v4.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10"/></svg></a>
  <button class="ibtn" id="viewClose" type="button" data-ta="close" aria-label="Close" autofocus><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
 </div>
 <div class="sheet-body" id="viewBody"><div class="loader" id="loadIco" aria-hidden="true"></div></div>
</dialog>

<script>
(function(){
'use strict';
const root=document.documentElement;
const AR={back:'رجوع',brand:'وكلاء الإمارات',h1:'شو تحتاج؟',label:'سؤالك',send:'انطلق',hint:'أو اختر واحدًا.',w1:'اسأل عن الأنظمة',w2:'افحص رسالة مشبوهة',w3:'أثبت تأخر الراتب',w4:'افحص زيادة الإيجار',w5:'بلّغ عن عطل',w6:'استعد لمقابلة العمل',full:'صفحة كاملة',close:'إغلاق',foot:'ليست استشارة قانونية ولا خدمة حكومية.',ph:'اسأل أي شيء'};
const EN={};
document.querySelectorAll('[data-t]').forEach(e=>{EN[e.dataset.t]=e.textContent});
document.querySelectorAll('[data-ta]').forEach(e=>{EN[e.dataset.ta]=e.getAttribute('aria-label')});
const Q=document.getElementById('q');EN.ph=Q.placeholder;
const AGENTS={answers:{path:'answers/',en:'Inzain',ar:'انزين'},message:{path:'message-check/',en:'Mazboot',ar:'مضبوط'},wages:{path:'wages/',en:'Bil Tareekh',ar:'بالتاريخ'},rent:{path:'rent/',en:'Masmooh',ar:'مسموح'},repairs:{path:'city-repairs/',en:'Wareeni',ar:'ورّيني'},careers:{path:'careers/',en:'Zaheb',ar:'زاهب'}};
/*ROUTER-START*/
// Router: whole words and phrases only (Arabic prefixes allowed). Mazboot needs scam context, Masmooh covers rent and eviction.
// A message that looks like a scam goes to Mazboot; one other clear match goes to that agent; anything unsure or mixed goes to Inzain.
const norm=s=>String(s||'').toLowerCase()
 .replace(/[ً-ٰٟـ]/g,'')
 .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه')
 .replace(/ڤ/g,'ف').replace(/پ/g,'ب').replace(/[چگ]/g,'ك')
 .replace(/['’`ʼ]/g,'')
 .replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const mk=ph=>{
 const n=norm(ph),ar=/[؀-ۿ]/.test(n);
 const esc=x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
 if(!ar)return new RegExp(' '+esc(n)+'(?:s|es|d|ed|ing)? ');
 const stem=n.endsWith('ه')?esc(n.slice(0,-1))+'(?:ه|ت)':esc(n);
 return new RegExp(' (?:[وفبلك]{0,2}(?:ال)?|لل|ولل)'+stem+'(?:ه|ها|ي|ك|كم|هم|نا|ات|ين|ون)? ');
};
const L=s=>s.split('|').map(mk);

function pasted(raw){   // 2 = strong sign, 1 = soft sign, 0 = none

const NOTE_RE=/^\s*(?:Note|ملاحظة)\s*[:：]\s*(.+?)\s*$/i;
// Finds every valid code in any pasted text. Gives [{counts:{agent:[tries,helped]},lang:'en'|'ar',device:'phone'|'computer',note:''}].
function readCodes(text){
 const s=String(text||'').replace(/[‐-―−]/g,'-'),out=[];let m;
 CODE_RE.lastIndex=0;
 while((m=CODE_RE.exec(s))){
  const code=m[2].toUpperCase(),f=code.split('-'),counts={};let ok=chk(code.slice(0,-5))===f[8];
  AG.forEach((k,i)=>{const [t,h]=f[i+1].split('.').map(Number);if(h>t)ok=false;counts[k]=[t,h]});
  if(!ok)continue;

 }

}

function recWatch(box,st){
 let before=box.value.length;st.pasted=before>0;
 const mark=()=>{st.pasted=true};
 const input=e=>{
  const n=box.value.length,ty=e&&typeof e.inputType==='string'?e.inputType:'',add=e&&typeof e.data==='string'?e.data.length:0;
  if(!n)st.pasted=false;
  else if(n-before>=16||add>=16||/^(?:insertFrom(?:Paste|PasteAsQuotation|Drop|Yank)|history(?:Undo|Redo))$/.test(ty))st.pasted=true;
  before=n;
 };
 box.addEventListener('paste',mark);box.addEventListener('drop',mark);box.addEventListener('input',input);
 return ()=>{box.removeEventListener('paste',mark);box.removeEventListener('drop',mark);box.removeEventListener('input',input)};
}
const recBox={pasted:false};   // the mark for the landing box
function recText(raw,agent,st){
 const s=String(raw||'').trim();
 if(agent==='message'||(st||recBox).pasted||pasted(s))return {kind:'message',len:s.length};
 return {kind:'question',text:recScrub(s).slice(0,300)};
}
// What Inzain shows first in its result area, read from the screen; null while it is still working. Titles, ids and
// marks are library text, never the tester's: a part with no entry (its title is the tester's own sentence) is only counted.
const REC_CLOSEST=['Closest answer we have','أقرب جواب لدينا'];
const recTxt=el=>el?String(el.textContent||'').replace(/\s+/g,' ').trim():'';
function recShown(body){
 if(!body||body.querySelector('.spin'))return null;
 const el=body.querySelector('h3.atitle,.partsbox,.gapcard,.answer.tblans,p.warn');if(!el)return null;
 const has=(x,c)=>!!x&&!!x.classList&&x.classList.contains(c);
 const pills=b=>has(b,'badges')?Array.prototype.slice.call(b.querySelectorAll('.pill')):[];
 const o={a:'answers'};
 if(has(el,'atitle')){
  const ps=pills(el.nextElementSibling),btn=body.querySelector('[data-act][data-eid]');
  o.form='entry';o.title=recTxt(el);o.id=btn?String(btn.getAttribute('data-eid')||''):'';o.shown=ps.map(recTxt).join(' · ');
  o.mark=ps.some(p=>REC_CLOSEST.indexOf(recTxt(p))>=0)?'closest':ps.some(p=>has(p,'ok'))?'tick':ps.some(p=>has(p,'bad'))?'partly':'other';
 }else if(has(el,'partsbox')){
  const li=el.querySelectorAll('li.part');let none=0;
  for(let i=0;i<li.length;i++)if(Array.prototype.some.call(li[i].children,c=>has(c,'pill')))none++;
  o.form='parts';o.mark='parts';o.title=recTxt(el.querySelector('h3'));o.parts=li.length;o.none=none;
 }else if(has(el,'gapcard')){o.form='gap';o.mark='none';o.title=recTxt(el.querySelector('h3'))}
 else if(has(el,'tblans')){
  const ps=pills(el.querySelector('.badges'));
  o.form='table';o.title=recTxt(el.querySelector('.tblline'));o.shown=ps.map(recTxt).join(' · ');o.mark=ps.some(p=>has(p,'ok'))?'tick':'partly';
 }else{o.form='other';o.mark='other';o.title=recTxt(el)}
 o.title=String(o.title||'').slice(0,200);if(o.shown!==undefined)o.shown=o.shown.slice(0,160);if(o.id!==undefined)o.id=o.id.slice(0,80);
 return o;
}
// Mazboot's result level, read from the result area only (never the message, its links, numbers or reasons):
// "strong" when it offers to report (very likely a scam), "calm" for the tick (no warning signs found), else "middle".
function recLevel(res){
 const h=res&&res.querySelector('h2.status');if(!h)return '';
 if(res.querySelector('#reportBtn'))return 'strong';
 const p=h.querySelector('.sym path'),d=p?String(p.getAttribute('d')||''):'';
 return d.indexOf('M6.5 12.5')===0?'calm':'middle';
}
function recB64(u8){let s='';for(let i=0;i<u8.length;i+=4096)s+=String.fromCharCode.apply(null,Array.prototype.slice.call(u8,i,i+4096));return btoa(s)}
function recUnb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function recSeal(obj,keyB64){
 const C=crypto.subtle,raw=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));
 const data=new TextEncoder().encode(JSON.stringify(obj));
 return Promise.all([
  C.importKey('spki',recUnb64(keyB64),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']).then(pub=>C.encrypt({name:'RSA-OAEP'},pub,raw)),
  C.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt']).then(k=>C.encrypt({name:'AES-GCM',iv:iv},k,data))
 ]).then(r=>{
  const w=new Uint8Array(r[0]),c=new Uint8Array(r[1]),out=new Uint8Array(w.length+iv.length+c.length);
  out.set(w,0);out.set(iv,w.length);out.set(c,w.length+iv.length);return recB64(out);
 });
}
/*REC-END*/
const REC=(function(){
 if(!TEST)return null;
 try{
  // Only the tester link itself records: a tab that once had ?test=1 and now shows the plain link sends nothing.
  if(new URLSearchParams(location.search).get('test')!=='1')return null;
  if(!window.crypto||!crypto.subtle||!crypto.getRandomValues||!window.fetch||!window.TextEncoder||!window.Promise||!window.btoa)return null;
  const rnd=()=>{const a='abcdefghijklmnopqrstuvwxyz0123456789',b=crypto.getRandomValues(new Uint8Array(12));let s='';for(let i=0;i<b.length;i++)s+=a[b[i]%36];return s};
  let sid='',seq=0;
  try{sid=sessionStorage.getItem('uaeagents-sid')||'';seq=parseInt(sessionStorage.getItem('uaeagents-seq'),10)||0}catch(e){}
  if(!/^[a-z0-9-]{8,40}$/.test(sid)){sid=rnd();seq=0;try{sessionStorage.setItem('uaeagents-sid',sid)}catch(e){}}
  return {sid:sid,seq:seq,chain:Promise.resolve(),last:''};
 }catch(e){return null}
})();
// Pasted text is never sent, whichever agent it goes to: the landing box is watched with the rule above (recWatch).
if(REC)try{recWatch(Q,recBox)}catch(e){recBox.pasted=true}
// Records go out one after another, so they reach the relay in the order they happened. A failed send is dropped quietly.
function rec(ev,data){
 if(!REC)return;
 try{
  const r={v:1,s:REC.sid,n:++REC.seq,t:Date.now(),e:ev,l:isAr()?'ar':'en',d:tDevice()};
  Object.keys(data||{}).forEach(k=>{r[k]=data[k]});
  try{sessionStorage.setItem('uaeagents-seq',String(REC.seq))}catch(e){}
  const post=body=>new Promise(done=>{
   const tm=setTimeout(done,10000);
   const opt={method:'POST',body:body,credentials:'omit',referrerPolicy:'no-referrer',cache:'no-store'};
   if(body.length<60000)opt.keepalive=true;
   let p;try{p=fetch(REC_URL,opt)}catch(e){clearTimeout(tm);done();return}
   p.then(()=>{clearTimeout(tm);done()},()=>{clearTimeout(tm);done()});
  });
  REC.chain=REC.chain.then(()=>recSeal(r,REC_KEY)).then(post).catch(()=>{});
 }catch(e){}
}
function recAsk(t,k,via){if(REC)try{const x=recText(t,k);x.a=k;x.via=via;rec('ask',x)}catch(e){}}
// The result is recorded when it is shared, copied, or the sheet is closed; the same note and code are never sent twice.
function recResult(how){
 if(!REC)return;
 try{
  const c=tCount(),note=recScrub(tNote.value.replace(/UA1/gi,'')).slice(0,200),code=makeCode(store.c,root.lang,tDevice()),sig=note+'|'+code;
  if(sig===REC.last)return;REC.last=sig;
  rec('result',{note:note,code:code,tried:c.a,helped:c.h,how:how});
 }catch(e){}
}
// Inside the agent (tester link only; without REC nothing is attached to any agent). The agent's iframe is on this same
// origin, so this page watches it from outside and the agent page itself is never changed.
//  - Inzain: each question run inside it is an "ask" (its text only when typed by hand, by the rule above), then what it
//    showed first is an "answer" (entry id, title and mark, as on the screen). The question this page passed in was
//    already recorded here, so it is not recorded again; its answer is.
//  - Mazboot: a message checked inside it is a "check": its length and the result level, nothing more.
//  - The four helpers: nothing.
// Everything is wrapped, so a failure here does nothing visible; all listeners and observers go when the sheet closes.
let recOff=null;
function recDetach(){const f=recOff;recOff=null;if(f)try{f()}catch(e){}}
function recHook(f,key,passed,typed){
 recDetach();
 if(!REC||(key!=='answers'&&key!=='message'))return;
 const offs=[];let live=true;
 const off=()=>{live=false;for(let i=offs.length-1;i>=0;i--)try{offs[i]()}catch(e){}offs.length=0};
 const safe=fn=>function(e){if(live)try{fn(e)}catch(x){}};
 const on=(t,ev,fn)=>{const g=safe(fn);t.addEventListener(ev,g,true);offs.push(()=>t.removeEventListener(ev,g,true))};
 const timers=[],later=(fn,ms)=>{const id=setTimeout(safe(fn),ms);timers.push(id);return id};
 offs.push(()=>{timers.forEach(clearTimeout)});
 try{
  const w=f.contentWindow,doc=f.contentDocument,path=AGENTS[key].path;
  if(!w||!doc||!w.MutationObserver||String(w.location.pathname).slice(-path.length)!==path)return;
  const watch=(node,fn,opt)=>{const mo=new w.MutationObserver(safe(fn));mo.observe(node,opt);offs.push(()=>mo.disconnect())};
  if(key==='answers'){
   const q=doc.getElementById('q'),body=doc.getElementById('runBody');if(!q||!body)return;
   const st={pasted:true},p0=String(passed||'').trim();
   offs.push(recWatch(q,st));
   if(p0)st.pasted=!(typed&&q.value.trim()===p0);   // the passed-in text keeps the landing box's verdict while it is unchanged
   let last=p0,waiting=false,changed=false,quiet=0,giveUp=0;
   const settle=()=>{if(!waiting||!changed)return;const o=recShown(body);if(!o)return;waiting=false;rec('answer',o)};
   const expect=()=>{waiting=true;changed=false;clearTimeout(giveUp);giveUp=later(()=>{waiting=false},60000)};
   watch(body,()=>{if(!waiting)return;changed=true;clearTimeout(quiet);quiet=later(settle,400)},{childList:true,subtree:true,characterData:true});
   const asked=(raw,via,lib)=>{
    const s=String(raw||'').trim();if(!s||s===last)return;last=s;
    const x=lib?{kind:'question',text:recScrub(s).slice(0,300)}:recText(s,'answers',st);x.a='answers';x.via=via;
    rec('ask',x);
    // what Inzain shows for pasted or message-like text is not sent: its title can tell what the message was about
    if(x.kind==='question')expect();else{waiting=false;clearTimeout(giveUp)}
   };
   on(doc,'keydown',e=>{if(e.target===q&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing)asked(q.value,'inside')});
   on(doc,'submit',e=>{if(e.target&&e.target.id==='askForm')asked(q.value,'inside')});
   // a suggested question (library text) fills the box and runs: read after Inzain has put it there
   on(doc,'click',e=>{const c=e.target&&e.target.closest?e.target.closest('[data-chip]'):null;if(c)later(()=>{asked(q.value,'chip',true)},0)});
   if(p0&&typed){expect();if(recShown(body)){changed=true;settle()}}   // the passed-in question (typed by hand only) may be answered already
  }else{
   const box=doc.getElementById('msg'),res=doc.getElementById('result');if(!box||!res)return;
   let want=-1,until=0;
   const trig=()=>{want=box.value.trim().length;until=Date.now()+3000};   // the box is read for its length only
   on(doc,'click',e=>{if(e.target&&e.target.closest&&e.target.closest('#checkBtn'))trig()});
   on(doc,'keydown',e=>{const id=e.target&&e.target.id;if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&(id==='msg'||id==='sender'))trig()});
   watch(res,()=>{if(want<0)return;if(Date.now()>until){want=-1;return}const lv=recLevel(res);if(!lv)return;const n=want;want=-1;rec('check',{a:'message',len:n,level:lv})},{childList:true});
  }
  recOff=off;
 }catch(e){}
 finally{if(recOff!==off)off()}   // set up in full, or not at all
}
function tVisit(key){if(TEST){visit={key,at:Date.now()};pending=null;tPaint()}}
function tEnd(){const v=visit;visit=null;if(TEST&&v&&Date.now()-v.at>=15000){pending=v.key;tPaint()}}
function tAnswer(yes){
 const k=pending;if(!k)return;
 const c=store.c[k]=store.c[k]||[0,0];c[0]=Math.min(99,c[0]+1);if(yes)c[1]=Math.min(c[0],c[1]+1);
 rec('help',{a:k,yes:!!yes});
 tSave();pending=null;tPaint();tPill.focus();
}
function tMessage(){
 const {a,h}=tCount(),n=tNote.value.replace(/UA1/gi,'').replace(/\s+/g,' ').trim().slice(0,200),D=tx();
 const lines=[D.line.replace('{a}',a).replace('{h}',h)];
 if(n)lines.push(D.tag+n);
 lines.push(makeCode(store.c,root.lang,tDevice()));
 return lines;
}
const sumText=n=>isAr()?(n===1?'جرّبت وكيلًا واحدًا':n===2?'جرّبت وكيلين':'جرّبت '+n+(n<=10?' وكلاء':' وكيلًا')):'You tried '+n+(n===1?' agent':' agents');
function tPaint(){
 if(!TEST||!tBar)return;
 const D=tx(),n=tCount().a;
 if(tel('tNotice'))tel('tNotice').textContent=D.rec;
 tel('tqText').textContent=pending?D.q.replace('{n}',nameOf(AGENTS[pending])):'';
 tel('tqYes').textContent=D.yes;tel('tqNo').textContent=D.no;
 tBar.hidden=!pending;tPill.hidden=!!pending||!n;tPill.textContent=D.send;
 document.body.classList.toggle('tpad',!!pending||!!n);
 tel('tsTitle').textContent=D.send;tel('tsClose').setAttribute('aria-label',D.close);
 tel('tsSum').textContent=sumText(n);tel('tsNoteL').textContent=D.note;
 tel('tsWa').textContent=D.wa;tel('tsCopy').textContent=D.copy;
 const box=tel('tsMsg'),ls=tMessage();box.replaceChildren();
 ls.forEach((t,i)=>{const d=document.createElement('div');d.textContent=t;if(i===ls.length-1){d.className='code';d.dir='ltr'}else d.dir='auto';box.append(d)});
}
async function tCopy(text){
 try{await navigator.clipboard.writeText(text);return true}catch(e){}
 try{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.cssText='position:fixed;opacity:0';tSheet.append(t);t.select();const ok=document.execCommand('copy');t.remove();return ok}catch(e){return false}
}
if(TEST){
 try{const o=JSON.parse(localStorage.getItem('uaeagents-test'));if(o&&o.c&&typeof o.c==='object')store=o}catch(e){}
 const x='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg>';
 tBar=document.createElement('div');tBar.className='tbar';tBar.hidden=true;tBar.setAttribute('role','group');tBar.setAttribute('aria-labelledby','tqText');
 tBar.innerHTML='<div class="wrap"><p class="tq-t" id="tqText"></p><button class="tbtn main" type="button" id="tqYes"></button><button class="tbtn" type="button" id="tqNo"></button></div>';
 tPill=document.createElement('button');tPill.className='tbtn main tpill';tPill.type='button';tPill.hidden=true;
 tSheet=document.createElement('dialog');tSheet.id='tsheet';tSheet.setAttribute('aria-labelledby','tsTitle');
 tSheet.innerHTML='<div class="sheet-bar"><h2 class="sheet-name" id="tsTitle"></h2><button class="ibtn" id="tsClose" type="button" autofocus>'+x+'</button></div>'
  +'<div class="tbody"><p class="tsum" id="tsSum"></p><label class="tl" id="tsNoteL" for="tsNote"></label><textarea id="tsNote" maxlength="200" rows="2" dir="auto"></textarea>'
  +'<div class="tmsg" id="tsMsg"></div><div class="tact"><button class="tbtn main" type="button" id="tsWa"></button><button class="tbtn link" type="button" id="tsCopy" aria-live="polite"></button></div></div>';
 document.body.append(tBar,tPill,tSheet);
 if(REC){const p=document.createElement('p');p.className='tnote';p.id='tNotice';p.setAttribute('role','note');form.append(p)}   // said openly, before anything is sent
 tNote=tel('tsNote');
 tel('tqYes').addEventListener('click',()=>tAnswer(true));
 tel('tqNo').addEventListener('click',()=>tAnswer(false));
 tPill.addEventListener('click',()=>{tPaint();tSheet.showModal();root.classList.add('locked')});
 tNote.addEventListener('input',tPaint);
 const shut=()=>{if(tSheet.open)tSheet.close()};
 tel('tsClose').addEventListener('click',shut);
 tSheet.addEventListener('click',e=>{if(e.target===tSheet)shut()});
 tSheet.addEventListener('close',()=>{root.classList.remove('locked');recResult('closed')});
 tel('tsWa').addEventListener('click',async()=>{
  recResult('shared');
  const text=tMessage().join('\n');
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener');
 });
 let t0=0;
 tel('tsCopy').addEventListener('click',async()=>{
  recResult('copied');
  const ok=await tCopy(tMessage().join('\n')),b=tel('tsCopy');if(!ok)return;
  b.textContent=tx().copied;clearTimeout(t0);t0=setTimeout(()=>{b.textContent=tx().copy},1800);
 });
 tPaint();
}

// English / Arabic with full RTL.

 root.lang=ar?'ar':'en';root.dir=ar?'rtl':'ltr';
 document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=D[e.dataset.t]});
 document.querySelectorAll('[data-ta]').forEach(e=>{e.setAttribute('aria-label',D[e.dataset.ta])});

 try{localStorage.setItem('uaeagents-lang',l)}catch(e){}
 said='';showRoute();paintName();tPaint();
}

set(saved||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en'));
rec('open',{});   // the tester page was opened (the notice above is already on screen)

window.addEventListener('pageshow',()=>{grow();said='';showRoute()});
const k0=keyFromHash();if(k0)show(k0,'',true);
